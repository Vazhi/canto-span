name: multi-analysis diagnostics

on:
  push:
    branches:
      - agent/multi-analysis-lexicon

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Capture failing verification output
        shell: bash
        run: |
          mkdir -p .diagnostics/multi-analysis
          set +e
          node tools/lexical-coverage/verify-multi-analysis-runtime.mjs > .diagnostics/multi-analysis/multi-analysis-runtime.log 2>&1
          echo $? > .diagnostics/multi-analysis/multi-analysis-runtime.exit
          node tools/verify-current-state.js --profile runtime > .diagnostics/multi-analysis/runtime-profile.log 2>&1
          echo $? > .diagnostics/multi-analysis/runtime-profile.exit
          node tools/verify-current-state.js --profile core > .diagnostics/multi-analysis/core-profile.log 2>&1
          echo $? > .diagnostics/multi-analysis/core-profile.exit
          node tests/run-all.js > .diagnostics/multi-analysis/run-all.log 2>&1
          echo $? > .diagnostics/multi-analysis/run-all.exit
          node tools/build-runtime.js --check > .diagnostics/multi-analysis/runtime-build.log 2>&1
          echo $? > .diagnostics/multi-analysis/runtime-build.exit
          git status --short > .diagnostics/multi-analysis/git-status.log
          set -e
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/multi-analysis
          git commit -m "Capture multi-analysis validation diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
