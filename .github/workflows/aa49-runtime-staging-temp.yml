name: AA49 one-shot claimed branch finalizer

on:
  pull_request:
    types: [synchronize]
    paths:
      - "**"

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 722 &&
      github.event.pull_request.head.ref == 'agent/aa49-independent-motion-runtime' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: aa49-runtime-finalizer-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact claimed PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Enforce branch and event preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "722"
          test "${{ github.event.pull_request.head.ref }}" = "agent/aa49-independent-motion-runtime"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "b22cd0d051d7002eee73c5224bad9b68227fe41d"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Stage already validated AA49 candidate
        run: node .github/tmp-aa49-finalize.js
      - name: Regenerate canonical derived outputs
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-construction-tests.js
          node tools/sync-construction-test-metadata.js
          node <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('tests/construction-test-index.json', 'utf8'));
          const total = index.files.reduce((sum, row) => sum + Number(row.executable_case_count || 0), 0);
          let state = fs.readFileSync('docs/current/PROJECT-STATE.md', 'utf8');
          state = state.replace(/per-construction assertions: \*\*[0-9,]+\*\* across \*\*134\*\* files;/, `per-construction assertions: **${total.toLocaleString('en-US')}** across **134** files;`);
          state = state.replace(/\| Per-construction assertions \| [0-9,]+ \|/, `| Per-construction assertions | ${total.toLocaleString('en-US')} |`);
          fs.writeFileSync('docs/current/PROJECT-STATE.md', state);
          console.log(JSON.stringify({ per_construction_assertions: total }));
          NODE
          npm run discovery:generate
          npm run build:runtime
      - name: Focused AA49 contract
        run: node --test tests/tooling/runtime/aa49-independent-motion-boundary.test.js
      - name: Regression and construction suites
        run: |
          npm run test:regression
          npm run test:constructions
      - name: Permanent parser architecture gate
        run: |
          npm run test:parser-architecture
          npm run audit:parser-architecture
      - name: Runtime, core, research, and discovery verification
        run: |
          npm run verify:runtime
          npm run verify
          npm run verify:research
          npm run verify:discovery
      - name: Remove optional verifier reports and all temporary automation
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            validation/current/construction-tests.json \
            validation/current/regression-suite.json \
            validation/current/glossika-week16-runtime-lexicon.json; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              git restore --source=HEAD -- "$p"
            else
              rm -f "$p"
            fi
          done
          rm -rf .github/aa49-finalize
          rm -f .github/tmp-aa49-finalize.js .github/tmp-aa49-second-pass.js
          rm -f .github/workflows/aa49-runtime-staging-temp.yml
      - name: Enforce exact final change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --porcelain
          cat > /tmp/aa49-allowed.txt <<'EOF'
          .github/aa49-finalize/part01.patch
          .github/aa49-finalize/part02.patch
          .github/aa49-finalize/part03.patch
          .github/aa49-finalize/part04.patch
          .github/tmp-aa49-finalize.js
          .github/tmp-aa49-second-pass.js
          .github/workflows/aa49-runtime-staging-temp.yml
          data/construction-candidate-readiness.json
          docs/current/PROJECT-STATE.md
          grammar/parser_heuristic/ClauseSpan.md
          grammar/research_pending/DirectedMannerMotionVP.md
          grammar/research_pending/DirectionalMotionVP.md
          grammar/research_pending/PostThemeParticipantRelation.md
          main.js
          manifest.json
          package-lock.json
          package.json
          src/parser/detectors/environmental/clauses.js
          src/parser/detectors/manner/adjustment.js
          src/parser/detectors/motion/directional.js
          src/parser/detectors/motion/path-goal-source.js
          src/parser/orchestration/wrap-core.js
          src/plugin-entry.js
          src/runtime-resources/diagnostics/trace-metadata.js
          src/runtime-resources/grammar/templates/category-span-templates.js
          src/runtime-resources/lexicon/token-lexicon/places-and-times.js
          tests/construction-test-index.json
          tests/constructions/ClauseSpan.json
          tests/constructions/DirectedMannerMotionVP.json
          tests/constructions/DirectionalMotionVP.json
          tests/constructions/PostThemeParticipantRelation.json
          tests/fixtures/regression-snapshots.json
          tests/run-all.js
          tests/tooling/runtime/aa49-independent-motion-boundary.test.js
          EOF
          sed -i 's/^          //' /tmp/aa49-allowed.txt
          sort -u /tmp/aa49-allowed.txt -o /tmp/aa49-allowed.txt
          { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u > /tmp/aa49-actual.txt
          echo '--- actual finalization paths ---'
          cat /tmp/aa49-actual.txt
          if comm -23 /tmp/aa49-actual.txt /tmp/aa49-allowed.txt | grep .; then
            echo 'Unexpected path(s) outside AA49 claim' >&2
            exit 1
          fi
          for required in \
            src/parser/detectors/motion/directional.js \
            tests/constructions/DirectionalMotionVP.json \
            tests/fixtures/regression-snapshots.json \
            tests/tooling/runtime/aa49-independent-motion-boundary.test.js \
            main.js; do
            grep -Fxq "$required" /tmp/aa49-actual.txt || { echo "Missing required final path: $required" >&2; exit 1; }
          done
      - name: Commit exactly the verified claimed state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Canto Span ChatGPT Integrator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align AA49 runtime to independent motion predicate"
          test "$(git branch --show-current)" = "agent/aa49-independent-motion-runtime" || true
          git push origin HEAD:agent/aa49-independent-motion-runtime
