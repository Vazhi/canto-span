name: Create pedagogical source lock

on:
  pull_request:
    paths:
      - ".github/workflows/create-pedagogical-source-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week14-ingress-review
          fetch-depth: 0
      - name: Create external Week 14 source lock
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          package_rel = Path('data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621')
          integrity = json.loads((package_rel / 'package-integrity-r1.json').read_text(encoding='utf-8'))
          target = Path('config/pedagogical-corpus-source-locks.json')
          if target.exists():
              locks = json.loads(target.read_text(encoding='utf-8'))
          else:
              locks = {
                  'schema': 'canto-span-pedagogical-corpus-source-locks-v1',
                  'records': [],
              }
          record = {
              'package': str(package_rel),
              'source_id': integrity['source_id'],
              'source_payload_hash': integrity['source_payload_hash'],
              'immutable_files': integrity['immutable_files'],
              'accepted_on': '2026-08-02',
              'origin_issue': 131,
              'origin_pull_request': 472,
              'policy': 'source-preserving archive; changes require a new reviewed source revision rather than in-place mutation',
          }
          locks['records'] = [row for row in locks.get('records', []) if row.get('package') != str(package_rel)]
          locks['records'].append(record)
          locks['records'].sort(key=lambda row: row['package'])
          target.write_text(json.dumps(locks, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/create-pedagogical-source-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/pedagogical-corpus-source-locks.json
          git commit -m "Lock the immutable Week 14 pedagogical source"
          git push origin HEAD:agent/week14-ingress-review
