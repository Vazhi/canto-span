name: AB35 R3 bootstrap runner

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.pull_request.number == 776
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab35-zo-gungfo-final-r3
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Run content-bound R3 bootstrap
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ab35-final-r3-bootstrap.py 2>&1 | tee /tmp/ab35-r3-finalizer.log
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo 'R3 finalizer FAILED.'; echo; echo '```text'; tail -n 160 /tmp/ab35-r3-finalizer.log 2>/dev/null || true; echo '```'; } > /tmp/r3-comment.md
          gh issue comment 772 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r3-comment.md
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin agent/ab35-zo-gungfo-final-r3
          sha="$(git rev-parse origin/agent/ab35-zo-gungfo-final-r3)"
          gh issue comment 772 --repo "$GITHUB_REPOSITORY" --body "R3 finalizer PASS. Permanent verified branch head: \`$sha\`. Temporary transport was removed by the permanent commit."
