name: AB35 R3 registration probe

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  issues: write

jobs:
  ping:
    if: github.event.pull_request.number == 776
    runs-on: ubuntu-24.04
    steps:
      - name: Report registered execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 772 --repo "$GITHUB_REPOSITORY" --body "R3 workflow registration probe PASS on ${GITHUB_SHA}."
