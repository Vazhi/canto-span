name: CS-WORK-0278 Week 18 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week18-corpus-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check generation inputs
        id: inputs
        run: |
          if test -f tools/tmp/cs-work-0278-week18-source-meta.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Generation inputs already removed."
          fi
      - name: Install dependencies
        if: steps.inputs.outputs.present == 'true'
        run: npm ci
      - name: Generate source package and modular crosswalk
        if: steps.inputs.outputs.present == 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const {execFileSync} = require('child_process');

          const sourceId = 'GLOSSIKA-YUEHK-A1-W18-20260719';
          const root = `data/pedagogical-corpus/glossika/${sourceId}`;
          const meta = JSON.parse(fs.readFileSync('tools/tmp/cs-work-0278-week18-source-meta.json','utf8'));
          const records = [0,1,2,3].flatMap(index => JSON.parse(fs.readFileSync(`tools/tmp/cs-work-0278-week18-records-part0${index}.json`,'utf8')));
          if(records.length !== 99) throw new Error(`Expected 99 source records, found ${records.length}`);

          function stable(value){
            if(Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if(value && typeof value === 'object') return `{${Object.keys(value).sort().map(key=>`${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            return JSON.stringify(value);
          }
          function sha(value){ return crypto.createHash('sha256').update(value,'utf8').digest('hex'); }
          function countBy(values){ return Object.fromEntries([...values.reduce((map,value)=>map.set(value,(map.get(value)||0)+1),new Map())].sort(([a],[b])=>a.localeCompare(b))); }
          function normalize(value){ return String(value||'').normalize('NFC').replace(/[\p{P}\p{S}\p{Z}\s]/gu,''); }
          function normalizeJyutping(value){ return String(value||'').toLowerCase().replace(/[.,!?;:()'’“”"/\-]/g,' ').replace(/\s+/g,' ').trim(); }
          function display(record){ return record.itemType === 'phonics_pair' ? `${record.source.wordA}|${record.source.wordB}` : record.source.traditional; }
          function unique(values){ return [...new Set(values.filter(Boolean))].sort(); }
          function tsv(value){ return String(value ?? '').replace(/\t/g,' ').replace(/\r?\n/g,' '); }
          function escapeRegExp(value){ return value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

          const expectedTypes={dialog_turn:4,grammar_entry:11,lexical_entry:63,phonics_pair:6,sentence:15};
          const itemTypeCounts=countBy(records.map(record=>record.itemType));
          if(stable(itemTypeCounts)!==stable(expectedTypes)) throw new Error(`Unexpected item types ${JSON.stringify(itemTypeCounts)}`);
          const sectionCounts=countBy(records.map(record=>record.section));
          const payloadHash=`sha256:${sha(stable(records.map(record=>record.source)))}`;
          const items=records.map((record,index)=>({
            id:`${sourceId}-I${String(index+1).padStart(3,'0')}`,
            ordinal:index+1,
            section:record.section,
            subsection:record.subsection,
            itemType:record.itemType,
            ...(record.register?{register:record.register}:{}),
            ...(record.dialogTurn?{dialogTurn:record.dialogTurn}:{}),
            source:record.source,
            sourceHash:`sha256:${sha(stable(record.source))}`
          }));

          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const excludedPrefixes=[root+'/', 'tools/tmp/cs-work-0278-week18-', '.github/workflows/cs-work-0278-week18-inventory.yml', 'main.js'];
          const searchable=[];
          for(const file of tracked){
            if(excludedPrefixes.some(prefix=>file.startsWith(prefix))) continue;
            if(!/^(src|tests|test-data|data|docs|grammar|config)\//.test(file)) continue;
            let stat; try{stat=fs.statSync(file);}catch{continue;}
            if(!stat.isFile()||stat.size>5_000_000) continue;
            let text; try{text=fs.readFileSync(file,'utf8');}catch{continue;}
            searchable.push({file,text,normalized:normalize(text)});
          }
          const lexicalFiles=searchable.filter(entry=>entry.file.startsWith('src/runtime-resources/lexicon/'));
          const pronunciationFiles=searchable.filter(entry=>entry.file.startsWith('src/runtime-resources/pronunciation/'));
          const parserFiles=searchable.filter(entry=>entry.file.startsWith('src/parser/'));

          function structuredOwners(form,entries){
            if(!form || form==='—') return [];
            const escaped=escapeRegExp(form);
            const pattern=new RegExp(`(?:^|[\\[\\{,\\n]\\s*)["']${escaped}["']\\s*(?:,|:)`,'m');
            return entries.filter(entry=>pattern.test(entry.text)).map(entry=>entry.file);
          }
          function fullStringMatches(text){
            if(!text || text==='—') return {exact:[],normalized:[]};
            const exact=searchable.filter(entry=>entry.text.includes(text)).map(entry=>entry.file);
            const folded=normalize(text);
            const normalized=folded.length>=4 ? searchable.filter(entry=>entry.normalized.includes(folded)).map(entry=>entry.file) : [];
            return {exact:unique(exact),normalized:unique(normalized)};
          }
          function parserCandidates(item){
            const forms=[];
            const s=item.source;
            const text=s.traditional||'';
            if(item.subsection==='request_clarification_and_repetition') forms.push('/questions/','discourse/','boundaries/','clause-relations/');
            if(item.subsection==='interrupt_and_manage_turns') forms.push('discourse/','imperative','complements/','clause-relations/');
            if(item.subsection==='sentence_final_particles'||item.subsection==='particle_examples') forms.push('terminal/particles','questions/','discourse/');
            if(/[咗未]/u.test(text)) forms.push('aspect/','questions/');
            if(/[去返嚟]/u.test(text)) forms.push('motion/','coverbs/','clause-relations/');
            if(text.includes('幫')) forms.push('coverbs/','transfer/');
            if(text.includes('喺')) forms.push('coverbs/','existential/','predicates/basic');
            if(text.includes('想')||text.includes('要')) forms.push('modality/','intention-preference');
            return unique(parserFiles.filter(entry=>forms.some(term=>entry.file.includes(term))).map(entry=>entry.file));
          }

          const formalTemporal=new Set(['黎明','黃昏','午夜','正午','世紀','季度','時代','刹那','日程','截止日期']);
          const naturalnessSensitive=new Set(['咩話？再講多次。','我插句嘴。','唔好意思，打斷一下。','唔該等我講完先好唔好？']);
          const lexicalReview=new Set(['畀','攞','嚟','返','住','著','開']);
          function discrepancies(item){
            const out=[];
            const d=display(item);
            if(formalTemporal.has(d)) out.push({type:'register_or_a1_appropriateness',status:'requires_external_review',note:'Source form may be formal, written, literary, or unusually advanced for ordinary A1 conversation.'});
            if(naturalnessSensitive.has(d)) out.push({type:'naturalness_or_translation_influence',status:'requires_native_and_corpus_review',note:'Preserve exactly; do not accept formula or register without independent Cantonese evidence.'});
            if(d==='你講嘅係邊個？') out.push({type:'ellipsis_and_nominalization',status:'route_to_issue_128',note:'The omitted material after 嘅 and the identity-question analysis require direct research.'});
            if(d==='咩話？再講多次。') out.push({type:'repair_formula_scope',status:'route_to_issue_128',note:'Separate conventional repair initiator 咩話 from productive interrogative analysis and review 多次 versus 一次.'});
            if(d==='午夜'||d==='半夜') out.push({type:'translation_collision',status:'source_only',note:'Both source entries are glossed midnight; lexical and register distinctions require review.'});
            if(d==='正午'||d==='中午') out.push({type:'translation_collision',status:'source_only',note:'Both source entries are glossed noon; lexical and register distinctions require review.'});
            if(lexicalReview.has(d)) out.push({type:'multifunctional_lexeme',status:'existing_runtime_coverage_requires_boundary_review',note:'Single source gloss does not exhaust readings, valency, coverb, directional, aspectual, or collision behavior.'});
            if(item.itemType==='grammar_entry') out.push({type:'particle_function_simplification',status:'route_to_issue_128',note:'The source assigns one short function to a multifunctional particle; tone, clause type, discourse force, and cluster behavior remain separate.'});
            if(d==='嘅') out.push({type:'source_category_simplification',status:'requires_external_review',note:'The source places 嘅 in the sentence-final-particle table while glossing nominalizer; syntactic uses must remain distinguished.'});
            if(d==='咩') out.push({type:'question_force_simplification',status:'requires_external_review',note:'Rhetorical question is not a complete account of me1 uses.'});
            if(item.itemType==='phonics_pair') out.push({type:'pronunciation_material',status:'requires_independent_verification',note:'IPA, Jyutping, tones, lexical choices, glosses, and contrast membership remain provisional.'});
            if(d==='香|—') out.push({type:'incomplete_phonics_pair',status:'source_incomplete',note:'The B-side word, Jyutping, gloss, and IPA are absent in the source.'});
            if(item.section==='phonics_drill' && !String(item.source.ipa).includes('/ɵ')) out.push({type:'phonics_heading_scope',status:'requires_independent_verification',note:'This row does not transparently instantiate the stated /œː/ versus /ɵ/ contrast.'});
            return out;
          }

          const crosswalkRecords=items.map(item=>{
            const d=display(item);
            const forms=item.itemType==='phonics_pair'?[item.source.wordA,item.source.wordB]:[item.source.traditional];
            const canonicalLexiconOwners=unique(forms.flatMap(form=>structuredOwners(form,lexicalFiles)));
            const canonicalPronunciationOwners=unique(forms.flatMap(form=>structuredOwners(form,pronunciationFiles)));
            const full=item.itemType==='sentence'||item.itemType==='dialog_turn'?fullStringMatches(item.source.traditional):{exact:[],normalized:[]};
            const projectMatches=unique([...full.exact,...full.normalized].filter(file=>!file.startsWith('src/')));
            const compositionalNumeral=item.subsection==='numbers' && /^[一二三四五六七八九十]+億$/u.test(item.source.traditional);
            let classification='new_attestation';
            if(item.itemType==='lexical_entry'){
              if(canonicalLexiconOwners.length) classification='existing_runtime_entry';
              else if(compositionalNumeral) classification='compositional_numeral';
              else if(projectMatches.length) classification='partial_match';
            }else if(item.itemType==='grammar_entry'){
              classification=(canonicalLexiconOwners.length||projectMatches.length)?'partial_match':'new_attestation';
            }else if(item.itemType==='phonics_pair'){
              classification=d==='香|—'?'source_incomplete':(canonicalLexiconOwners.length||canonicalPronunciationOwners.length)?'partial_match':'new_attestation';
            }else{
              if(full.exact.length) classification='exact_duplicate';
              else if(full.normalized.length) classification='normalized_duplicate';
            }
            const flags=discrepancies(item);
            const sourceJyutping=item.itemType==='phonics_pair'?`${item.source.jyutpingA}|${item.source.jyutpingB}`:item.source.jyutping;
            const projectJyutpingValues=[];
            for(const owner of [...canonicalLexiconOwners,...canonicalPronunciationOwners]){
              const text=fs.readFileSync(owner,'utf8');
              for(const form of forms){
                if(form&&form!=='—'&&text.includes(form)) projectJyutpingValues.push(owner);
              }
            }
            return {
              sourceItemId:item.id,
              sourceHash:item.sourceHash,
              sourceDisplay:d,
              classification,
              compositionalNumeral,
              canonicalLexiconOwners,
              canonicalPronunciationOwners,
              canonicalParserOwnerCandidates:parserCandidates(item),
              exactProjectMatchPaths:projectMatches,
              sourceJyutping,
              sourceDiscrepancies:flags,
              evidenceBoundary:'Source attestation, repository occurrence, tests, and runtime coverage do not establish productivity, construction identity, preferred register, or linguistic status.'
            };
          });

          const classificationCounts=countBy(crosswalkRecords.map(record=>record.classification));
          const discrepancyCounts=countBy(crosswalkRecords.flatMap(record=>record.sourceDiscrepancies.map(flag=>flag.type)));
          const commonVerbRecords=crosswalkRecords.slice(8,33);
          const commonVerbCoverage={
            sourceCount:commonVerbRecords.length,
            withCanonicalLexiconOwner:commonVerbRecords.filter(record=>record.canonicalLexiconOwners.length).length,
            uncovered:commonVerbRecords.filter(record=>!record.canonicalLexiconOwners.length).map(record=>record.sourceDisplay)
          };
          const temporalRecords=crosswalkRecords.slice(33,61);
          const temporalCoverage={
            sourceCount:temporalRecords.length,
            withCanonicalLexiconOwner:temporalRecords.filter(record=>record.canonicalLexiconOwners.length).length,
            uncovered:temporalRecords.filter(record=>!record.canonicalLexiconOwners.length).map(record=>record.sourceDisplay)
          };

          const source={
            schema:'canto-span-pedagogical-corpus-source-v1',
            source:meta.source,
            ingress:{...meta.ingress,recordCount:items.length,itemTypeCounts,sectionCounts,sourcePayloadHash:payloadHash,sourcePayloadHashPolicy:'SHA-256 of canonical key-sorted JSON for the ordered source-field array.'},
            sourceClaims:meta.sourceClaims,
            items
          };
          const crosswalk={
            schema:'canto-span-pedagogical-corpus-crosswalk-v1',
            sourceId,
            sourcePayloadHash:payloadHash,
            architecture:{canonicalRuntimeInputs:['src/**','src/runtime-resources/**'],generatedBundle:'main.js',generatedBundleExcludedFromOwnership:true,buildEntrypoint:'src/plugin-entry.js',buildContract:'tools/build-runtime.js'},
            summary:{recordCount:items.length,classificationCounts,discrepancyCounts,commonVerbCoverage,temporalCoverage,compositionalNumeralCount:crosswalkRecords.filter(record=>record.compositionalNumeral).length},
            records:crosswalkRecords
          };
          const review={
            schema:'canto-span-pedagogical-corpus-review-v1',
            sourceId,
            sourcePayloadHash:payloadHash,
            policy:{
              sourceLayer:'source.json is immutable.',
              modularRuntimeLayer:'Only src/** and src/runtime-resources/** are canonical runtime owners; main.js is generated and excluded.',
              deduplication:'Existing runtime or project matches prevent duplicate ingress but do not overwrite source fields.',
              evidenceBoundary:'Pedagogical attestation does not establish frequency, productivity, construction identity, naturalness, register, or status.'
            },
            summary:{recordCount:items.length,reviewedCount:0,unreviewedCount:items.length,classificationCounts,discrepancyCounts,commonVerbCoverage,temporalCoverage,knownSourceAlerts:[
              {scope:'functional_language',type:'naturalness_and_translation_influence',status:'route_to_issue_128',note:'Several repair and interruption expressions require independent Cantonese and native-speaker review.'},
              {scope:'temporal_lexicon',type:'register_and_lexical_class',status:'route_to_issue_128',note:'Formal vocabulary and bare temporal-modifier behavior require a lexical-class map.'},
              {scope:'sentence_final_particles',type:'function_simplification',status:'route_to_issue_128',note:'The source gives one short function per particle and does not establish a complete grammar.'},
              {scope:'phonics_drill',type:'phonics_scope_and_incomplete_row',status:'requires_independent_verification',note:'One row is incomplete and several rows do not transparently match the heading contrast.'}
            ]},
            records:crosswalkRecords.map(record=>({id:record.sourceItemId,sourceHash:record.sourceHash,normalizedCantonese:normalize(record.sourceDisplay),ingressClassification:record.classification,canonicalLexiconOwners:record.canonicalLexiconOwners,canonicalPronunciationOwners:record.canonicalPronunciationOwners,canonicalParserOwnerCandidates:record.canonicalParserOwnerCandidates,exactProjectMatchPaths:record.exactProjectMatchPaths,sourceDiscrepancies:record.sourceDiscrepancies,reviewedValues:{},reviewerNote:'',evidenceUse:'not_authorized'}))
          };

          fs.mkdirSync(root,{recursive:true});
          fs.mkdirSync('docs/research',{recursive:true});
          fs.writeFileSync(`${root}/source.json`,JSON.stringify(source,null,2)+'\n');
          fs.writeFileSync(`${root}/crosswalk.json`,JSON.stringify(crosswalk,null,2)+'\n');
          fs.writeFileSync(`${root}/review.json`,JSON.stringify(review,null,2)+'\n');
          const header=['id','ordinal','section','subsection','item_type','register','source_display','source_jyutping','source_english','source_morpheme_gloss','source_hash','classification','canonical_lexicon_owners','canonical_pronunciation_owners','canonical_parser_owner_candidates','exact_project_match_paths','source_discrepancies_json','review_state'];
          const lines=items.map((item,index)=>{
            const record=crosswalkRecords[index], s=item.source;
            return [item.id,item.ordinal,item.section,item.subsection,item.itemType,item.register||'',display(item),s.jyutping||`${s.jyutpingA||''}|${s.jyutpingB||''}`,s.english||`${s.glossA||''}|${s.glossB||''}`,s.morphemeGloss||'',item.sourceHash,record.classification,record.canonicalLexiconOwners.join('|'),record.canonicalPronunciationOwners.join('|'),record.canonicalParserOwnerCandidates.join('|'),record.exactProjectMatchPaths.join('|'),JSON.stringify(record.sourceDiscrepancies),meta.ingress.reviewState].map(tsv).join('\t');
          });
          fs.writeFileSync(`${root}/items.tsv`,[header.join('\t'),...lines].join('\n')+'\n');
          fs.writeFileSync(`${root}/README.md`,`# Glossika Cantonese (HK) A1 Week 18 corpus package\n\n- Source ID: \`${sourceId}\`\n- Lesson: Common Verbs\n- Source date: 2026-07-19\n- Gmail message: \`19f7923023e862d2\`\n- Intake issue: #135\n- Work claim: #278\n- Pull request: #280\n- Source records: 99\n- Source payload hash: \`${payloadHash}\`\n\n## Source structure\n\n- 8 clarification and turn-management sentences\n- 25 common verbs\n- 28 temporal entries\n- 10 large numerals\n- 4 situation sentences\n- 4 dialog turns\n- 11 particle-table entries\n- 3 particle example sentences\n- 6 phonics pairs\n\n## Architecture boundary\n\nCanonical runtime ownership resolves only to \`src/**\` and \`src/runtime-resources/**\`. Generated \`main.js\` is excluded and unchanged. No runtime lexical entry, parser rule, construction status, survey, version, or release state is modified.\n`);
          fs.writeFileSync('docs/research/GLOSSIKA-YUEHK-A1-W18-20260719-CORPUS-INGRESS.md',`# Glossika Week 18 corpus ingress\n\n- Source ID: \`${sourceId}\`\n- Intake: #135\n- Work claim: #278\n- Related research: #128\n- PR: #280\n- Status: source-preserving ingress complete; expert research remains in #128\n\n## Result\n\n- 99 source records preserved in lesson order.\n- Classification counts: \`${JSON.stringify(classificationCounts)}\`.\n- Common verbs with exact modular lexicon owners: ${commonVerbCoverage.withCanonicalLexiconOwner} / 25.\n- Temporal entries with exact modular lexicon owners: ${temporalCoverage.withCanonicalLexiconOwner} / 28.\n- Compositional 億 numeral rows: ${crosswalkRecords.filter(record=>record.compositionalNumeral).length}.\n- Discrepancy flags: \`${JSON.stringify(discrepancyCounts)}\`.\n\n## Source-review routing\n\n- Repair and turn-management formulae, ellipsis, completion, and request force: #128.\n- Common-verb valency, readings, and collision information: #128.\n- Temporal lexical classes and formal/register boundaries: #128.\n- Aspect, motion, purpose, locative, benefactive, and directional chains: #128.\n- Particle functions and phonics material remain provisional source claims.\n\n## Stop boundary\n\nNo parser behavior, runtime lexicon, generated bundle, construction identity/status, evidence classification, survey deployment, native-panel decision, version, release, or deployment state changed.\n`);
          console.log({payloadHash,itemTypeCounts,sectionCounts,classificationCounts,discrepancyCounts,commonVerbCoverage,temporalCoverage});
          NODE
      - name: Validate generated package
        if: steps.inputs.outputs.present == 'true'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          const expected={dialog_turn:4,grammar_entry:11,lexical_entry:63,phonics_pair:6,sentence:15};
          if(source.items.length!==99) throw new Error('Expected 99 source records');
          if(JSON.stringify(source.ingress.itemTypeCounts)!==JSON.stringify(expected)) throw new Error('Unexpected item type counts');
          if(crosswalk.records.length!==99||review.records.length!==99) throw new Error('Crosswalk/review count failed');
          if(!crosswalk.records.every((record,index)=>record.sourceItemId===source.items[index].id&&record.sourceHash===source.items[index].sourceHash)) throw new Error('Source/crosswalk alignment failed');
          if(!review.records.every((record,index)=>record.id===source.items[index].id&&record.sourceHash===source.items[index].sourceHash)) throw new Error('Source/review alignment failed');
          const mainLeaks=crosswalk.records.flatMap(record=>[...record.canonicalLexiconOwners,...record.canonicalPronunciationOwners,...record.canonicalParserOwnerCandidates]).filter(file=>file==='main.js'||file.endsWith('/main.js'));
          if(mainLeaks.length) throw new Error('Generated main.js leaked into canonical ownership');
          if(crosswalk.summary.commonVerbCoverage.sourceCount!==25) throw new Error('Expected 25 common verbs');
          if(crosswalk.summary.temporalCoverage.sourceCount!==28) throw new Error('Expected 28 temporal entries');
          if(crosswalk.summary.compositionalNumeralCount!==10) throw new Error('Expected 10 compositional numeral rows');
          const incomplete=crosswalk.records.find(record=>record.sourceDisplay==='香|—');
          if(!incomplete||incomplete.classification!=='source_incomplete') throw new Error('Incomplete phonics row not preserved');
          const tsv=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(tsv.length!==100) throw new Error(`Expected TSV header plus 99 rows, found ${tsv.length}`);
          const note=fs.readFileSync('docs/research/GLOSSIKA-YUEHK-A1-W18-20260719-CORPUS-INGRESS.md','utf8').toLowerCase();
          for(const phrase of ['99 source records','generated bundle','related research: #128']) if(!note.includes(phrase.toLowerCase())) throw new Error(`Research note missing ${phrase}`);
          console.log(crosswalk.summary);
          NODE
          git diff --check
      - name: Run repository verification
        if: steps.inputs.outputs.present == 'true'
        run: |
          npm run verify:research
          npm run verify
      - name: Commit final package
        if: steps.inputs.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719 docs/research/GLOSSIKA-YUEHK-A1-W18-20260719-CORPUS-INGRESS.md
          git rm tools/tmp/cs-work-0278-week18-source-meta.json tools/tmp/cs-work-0278-week18-records-part00.json tools/tmp/cs-work-0278-week18-records-part01.json tools/tmp/cs-work-0278-week18-records-part02.json tools/tmp/cs-work-0278-week18-records-part03.json tools/tmp/cs-work-0278-week18-inventory.json
          git commit -m "Add Glossika Week 18 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
