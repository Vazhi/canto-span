# Temporary branch-scoped build helper for #923 / #926 / PR #927.
# This file must be deleted before the feature PR is merged.
name: Temporary learner inspector runtime build

on:
  push:
    branches:
      - agent/learner-tap-inspector
    paths:
      - ".github/workflows/temporary-learner-inspector-build.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'Vazhi/canto-span' && github.ref == 'refs/heads/agent/learner-tap-inspector'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: agent/learner-tap-inspector
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Generate canonical runtime bundle
        run: npm run build:runtime
      - name: Verify deterministic runtime and focused UX tests
        run: |
          npm run verify:runtime
          node --test tests/tooling/runtime/learner-inspector.test.js
      - name: Upload reproducible generated bundle
        uses: actions/upload-artifact@v4
        with:
          name: learner-inspector-built-main-js
          path: main.js
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated bundle to feature branch only
        run: |
          set -euo pipefail
          git add -- main.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged; no commit needed."
            exit 0
          fi
          git -c user.name="canto-span-build" \
              -c user.email="canto-span-build@users.noreply.github.com" \
              commit -m "Regenerate Obsidian runtime from canonical source (#923)"
          git push origin HEAD:refs/heads/agent/learner-tap-inspector
