name: AB15 one-shot alignment generator

on:
  pull_request:
    types: [synchronize]
    paths:
      - "**"

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 732 &&
      github.event.pull_request.head.ref == 'agent/ab15-current-runtime-alignment' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: ab15-alignment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact claimed PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Enforce claim and staging preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "732"
          test "${{ github.event.pull_request.head.ref }}" = "agent/ab15-current-runtime-alignment"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "f9700e00c1ede04a6586965a68400a222c1e204b"
          git diff --name-only origin/main...HEAD | sort > /tmp/ab15-stage.txt
          cat > /tmp/ab15-expected.txt <<'EOF'
          .github/workflows/ab15-alignment-finalizer-temp.yml
          grammar/research_pending/OvertHeadDemonstrativeClassifierNP.md
          tests/run-all.js
          tests/tooling/runtime/ab15-current-alignment.test.js
          EOF
          sed -i 's/^          //' /tmp/ab15-expected.txt
          sort -u /tmp/ab15-expected.txt -o /tmp/ab15-expected.txt
          diff -u /tmp/ab15-expected.txt /tmp/ab15-stage.txt
          node -e 'const p=require("./package.json"); if(p.version!=="0.5.222") process.exit(1)'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Generate current readiness/discovery projections
        run: npm run discovery:generate
      - name: Assert AB15 alignment gate changed for the documented reason only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/construction-candidate-readiness.json', 'utf8'));
          const records = Array.isArray(data) ? data : (data.records || []);
          const row = records.find((record) => record.construction_code === 'AB15');
          if (!row) throw new Error('AB15 readiness record missing');
          if (row.linguistic_status !== 'research_pending') throw new Error(`AB15 status changed: ${row.linguistic_status}`);
          if (!row.gates || !row.gates.runtime_research_alignment || row.gates.runtime_research_alignment.status !== 'pass') {
            throw new Error(`AB15 runtime_research_alignment not pass: ${JSON.stringify(row.gates && row.gates.runtime_research_alignment)}`);
          }
          if (row.supported_gate_eligible) throw new Error('AB15 must not become supported-gate eligible from code metadata');
          if ((row.supported_gate_blockers || []).includes('requirement_failed:current_code_review_metadata')) {
            throw new Error('stale current-code-review blocker remains');
          }
          console.log(JSON.stringify({
            construction_code: row.construction_code,
            linguistic_status: row.linguistic_status,
            runtime_research_alignment: row.gates.runtime_research_alignment,
            candidate_state: row.candidate_state,
            nearest_missing_gate: row.nearest_missing_gate,
            supported_gate_eligible: row.supported_gate_eligible,
            supported_gate_blockers: row.supported_gate_blockers,
          }, null, 2));
          NODE
      - name: Focused and standard parser checks
        run: |
          node --test tests/tooling/runtime/ab15-current-alignment.test.js
          npm run test:np
          npm run test:constructions
          npm run test:parser-architecture
          npm run audit:parser-architecture
      - name: Runtime and governance verification
        run: |
          npm run verify:runtime
          npm run verify
          npm run verify:research
          npm run verify:discovery
          npm run verify:identities
          npm run test:coordination
      - name: Remove routine reports and temporary generator
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree --staged -- validation/current 2>/dev/null || true
          git clean -fd -- validation/current 2>/dev/null || true
          rm -f .github/workflows/ab15-alignment-finalizer-temp.yml
      - name: Enforce final permanent scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u > /tmp/ab15-final.txt
          echo '--- final AB15 alignment paths ---'
          cat /tmp/ab15-final.txt
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/ab15-alignment-finalizer-temp.yml|grammar/research_pending/OvertHeadDemonstrativeClassifierNP.md|tests/run-all.js|tests/tooling/runtime/ab15-current-alignment.test.js|data/construction-candidate-readiness.json|docs/research/SUPPORTED-PRODUCTIVE-CANDIDATES.md|docs/research/FULL-REPO-SUPPORTED-PRODUCTIVE-SWEEP-R1.md|docs/current/PROJECT-STATE.md) ;;
              *) echo "Unexpected AB15 alignment path: $p" >&2; exit 1 ;;
            esac
          done < /tmp/ab15-final.txt
          grep -Fxq 'grammar/research_pending/OvertHeadDemonstrativeClassifierNP.md' /tmp/ab15-final.txt
          grep -Fxq 'tests/tooling/runtime/ab15-current-alignment.test.js' /tmp/ab15-final.txt
          grep -Fxq 'data/construction-candidate-readiness.json' /tmp/ab15-final.txt
          test ! -e .github/workflows/ab15-alignment-finalizer-temp.yml
          test "$(node -p 'require("./package.json").version')" = "0.5.222"
          git diff --quiet HEAD -- main.js
      - name: Commit verified metadata/test state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Canto Span ChatGPT Integrator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close AB15 current runtime alignment metadata"
          git push origin HEAD:agent/ab15-current-runtime-alignment
