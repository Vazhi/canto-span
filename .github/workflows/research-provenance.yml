name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: read

jobs:
  export-week18-schema-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage reviewed Week 18 packet schemas
        run: |
          mkdir -p /tmp/week18-schema-reference
          cp -a data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719 /tmp/week18-schema-reference/package
          cp tools/verify-pedagogical-corpus-review.py /tmp/week18-schema-reference/
          cp tests/tooling/research/pedagogical-corpus-review.test.py /tmp/week18-schema-reference/
          find /tmp/week18-schema-reference -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/week18-schema-reference/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: week18-schema-reference
          path: /tmp/week18-schema-reference
          if-no-files-found: error
          retention-days: 1
