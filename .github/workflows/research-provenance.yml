name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: read

jobs:
  inspect-week18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory source, retained crosswalk, and later research routes
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          package = Path('data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719')
          source = json.loads((package / 'source.json').read_text(encoding='utf-8'))
          review = json.loads((package / 'review.json').read_text(encoding='utf-8'))
          ledgers = {
              'claims': json.loads(Path('data/research-ledgers/glossika-week18-claim-source.json').read_text(encoding='utf-8')),
              'verbs': json.loads(Path('data/research-ledgers/glossika-week18-common-verb-audit.json').read_text(encoding='utf-8')),
              'temporal': json.loads(Path('data/research-ledgers/glossika-week18-temporal-lexicon.json').read_text(encoding='utf-8')),
              'followups': json.loads(Path('data/research-ledgers/glossika-week18-followup-candidates.json').read_text(encoding='utf-8')),
          }
          source_by_id = {row['id']: row for row in source['items']}
          output_rows = []
          for row in review['records']:
              item = source_by_id[row['id']]
              values = item.get('source') or {}
              surface = values.get('traditional') or f"{values.get('wordA', values.get('traditionalA', '—'))}|{values.get('wordB', values.get('traditionalB', '—'))}"
              output_rows.append({
                  'id': row['id'],
                  'ordinal': item.get('ordinal'),
                  'item_type': item.get('itemType'),
                  'section': item.get('section'),
                  'surface': surface,
                  'jyutping': values.get('jyutping') or f"{values.get('jyutpingA', '—')}|{values.get('jyutpingB', '—')}",
                  'legacy_class': row.get('ingressClassification'),
                  'lexicon_owners': row.get('canonicalLexiconOwners', []),
                  'pronunciation_owners': row.get('canonicalPronunciationOwners', []),
                  'exact_paths': row.get('exactProjectMatchPaths', []),
                  'parser_hint_count': len(row.get('canonicalParserOwnerCandidates', [])),
                  'discrepancies': row.get('sourceDiscrepancies', []),
              })
          print(json.dumps({
              'source_summary': {
                  'record_count': len(source['items']),
                  'item_types': dict(Counter(row['itemType'] for row in source['items'])),
                  'sections': dict(Counter(row.get('section') for row in source['items'])),
              },
              'review_summary': review['summary'],
              'rows': output_rows,
              'ledgers': ledgers,
          }, ensure_ascii=False, indent=2))
          PY
