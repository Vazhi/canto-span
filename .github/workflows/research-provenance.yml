name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: write

jobs:
  finalize-week16-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week16-ingress-review
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate final Week 16 state
        run: python3 tools/finalize-week16-review-temporary.py
      - name: Validate final Week 16 state
        run: |
          python3 -m py_compile tools/build-pedagogical-corpus-review-candidates.py tools/verify-pedagogical-corpus-review.py tests/tooling/research/pedagogical-corpus-review.test.py
          python3 tests/tooling/research/pedagogical-corpus-review.test.py
          npm run verify:pedagogical-corpus-review
          npm run verify:research
          npm run verify
          git diff --check
      - name: Push non-workflow review changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/research-provenance.yml
          git rm -f tools/finalize-week16-review-temporary.py
          git add config/verification-profiles.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/runtime-crosswalk-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/mechanical-cross-reference-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/review.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/expert-review-r1.tsv \
            docs/research/GLOSSIKA-YUEHK-A1-W16-20260705-CORPUS-INGRESS.md \
            package.json \
            tests/tooling/research/pedagogical-corpus-review.test.py \
            tools/verify-pedagogical-corpus-review.py
          git commit -m "Register and verify completed Week 16 review"
          git push origin HEAD:agent/week16-ingress-review
