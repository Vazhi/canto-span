name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: read

jobs:
  export-dialog004-review-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dialog005-ingress-review
      - name: Stage completed Dialog 004 review schema
        run: |
          mkdir -p /tmp/dialog004-review-schema/package /tmp/dialog004-review-schema/docs
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-004-20251221/*.json /tmp/dialog004-review-schema/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-004-20251221/*.tsv /tmp/dialog004-review-schema/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-004-20251221/*.md /tmp/dialog004-review-schema/package/
          cp docs/research/GLOSSIKA-YUEHK-A1-DLG-004-20251221-CORPUS-INGRESS.md /tmp/dialog004-review-schema/docs/
          find /tmp/dialog004-review-schema -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dialog004-review-schema/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dialog004-review-schema
          path: /tmp/dialog004-review-schema
          if-no-files-found: error
          retention-days: 1
