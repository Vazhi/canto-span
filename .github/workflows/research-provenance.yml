name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: read

jobs:
  export-week18-review-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage exact Week 18 review inputs
        run: |
          mkdir -p /tmp/week18-review-inputs/package /tmp/week18-review-inputs/ledgers
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719/source.json /tmp/week18-review-inputs/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719/items.tsv /tmp/week18-review-inputs/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719/review.json /tmp/week18-review-inputs/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719/crosswalk.json /tmp/week18-review-inputs/package/
          cp data/research-ledgers/glossika-week18-claim-source.json /tmp/week18-review-inputs/ledgers/
          cp data/research-ledgers/glossika-week18-common-verb-audit.json /tmp/week18-review-inputs/ledgers/
          cp data/research-ledgers/glossika-week18-temporal-lexicon.json /tmp/week18-review-inputs/ledgers/
          cp data/research-ledgers/glossika-week18-followup-candidates.json /tmp/week18-review-inputs/ledgers/
          find /tmp/week18-review-inputs -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/week18-review-inputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: week18-review-inputs
          path: /tmp/week18-review-inputs
          if-no-files-found: error
          retention-days: 1
