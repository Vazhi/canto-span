name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: write

jobs:
  finalize-dialog003-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dialog003-ingress-review
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Reconstruct reviewed finalizer
        run: |
          set -euxo pipefail
          test "$(sha256sum tools/.dialog003-finalizer.part00 | cut -d' ' -f1)" = "cc3802651fe5d36aa168ac163e058ec7b884c4cd57db7a17f1a0cfb1b17bd7db"
          test "$(sha256sum tools/.dialog003-finalizer.part01 | cut -d' ' -f1)" = "5b8bcebb9462ffd5849bcd100c1477a2920580a3b213f75baacbb51a2ae33322"
          test "$(sha256sum tools/.dialog003-finalizer.part01b | cut -d' ' -f1)" = "e06e73b42f87420d3a0eab416b054d4826bfd97c320995c32236ecd635153d48"
          test "$(sha256sum tools/.dialog003-finalizer.part01c | cut -d' ' -f1)" = "0ac2ad84e5cb23c832f3fea273bebabb18d17531275dfab253acb048e8735cb1"
          test "$(sha256sum tools/.dialog003-finalizer.part01d | cut -d' ' -f1)" = "94290541657dd4e59553169c777a9461b44b0ce6e694c92e2d76ecab26729f43"
          test "$(sha256sum tools/.dialog003-finalizer.part01e | cut -d' ' -f1)" = "cd5d215a7e37fb3918b5e6ad6b6c750b308f353c84f3e2732f3360a3cf148ea3"
          test "$(sha256sum tools/.dialog003-finalizer.part02 | cut -d' ' -f1)" = "bbca21120e3395745a34dac54c723feb01c4d9a9d75f3b6fcfe92f26544cae39"
          cat tools/.dialog003-finalizer.part00 \
              tools/.dialog003-finalizer.part01 \
              tools/.dialog003-finalizer.part01b \
              tools/.dialog003-finalizer.part01c \
              tools/.dialog003-finalizer.part01d \
              tools/.dialog003-finalizer.part01e \
              tools/.dialog003-finalizer.part02 > /tmp/finalize-dialog003.py.gz.b64
          test "$(sha256sum /tmp/finalize-dialog003.py.gz.b64 | cut -d' ' -f1)" = "13af5ff84ebdfe9449b6ff322749b7018418a43de309ffb015f8810b38bdc308"
          base64 --decode /tmp/finalize-dialog003.py.gz.b64 | gzip --decompress > tools/finalize-dialog003-review-temporary.py
          test "$(sha256sum tools/finalize-dialog003-review-temporary.py | cut -d' ' -f1)" = "fd98ec31c5863b3d1081821b687be2a630337e21b41807f08db30fb5e2dc57d5"
          python3 -m py_compile tools/finalize-dialog003-review-temporary.py

      - name: Generate and patch dialog 003 review state
        run: |
          python3 tools/finalize-dialog003-review-temporary.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/verify-pedagogical-corpus-review.py")
          text = path.read_text(encoding="utf-8")
          old = '        if item.get("itemType") == "dialog_turn":\n'
          new = '        if "-DLG-" in source_id and item.get("itemType") == "dialog_turn":\n'
          if text.count(old) != 1:
              raise SystemExit("expected one dialog-turn availability guard")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate final dialog 003 state
        run: |
          python3 -m py_compile \
            tools/build-pedagogical-corpus-review-candidates.py \
            tools/verify-pedagogical-corpus-review.py \
            tests/tooling/research/pedagogical-corpus-review.test.py
          python3 tests/tooling/research/pedagogical-corpus-review.test.py
          npm run verify:pedagogical-corpus-review
          npm run verify:research
          npm run verify
          git diff --check

      - name: Commit and push reviewed non-workflow state
        run: |
          rm -f tools/finalize-dialog003-review-temporary.py
          find tools tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm -f \
            tools/.dialog003-finalizer.part00 \
            tools/.dialog003-finalizer.part01 \
            tools/.dialog003-finalizer.part01b \
            tools/.dialog003-finalizer.part01c \
            tools/.dialog003-finalizer.part01d \
            tools/.dialog003-finalizer.part01e \
            tools/.dialog003-finalizer.part02 \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/.review-claim
          git add \
            config/pedagogical-corpus-source-locks.json \
            config/verification-profiles.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/README.md \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/dialog-context-routing-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/expert-review-r1.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/mechanical-cross-reference-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/package-integrity-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/research-summary.md \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/review.json \
            docs/research/GLOSSIKA-YUEHK-A1-DLG-003-20251214-CORPUS-INGRESS.md \
            package.json \
            tests/tooling/research/pedagogical-corpus-review.test.py \
            tools/build-pedagogical-corpus-review-candidates.py \
            tools/verify-pedagogical-corpus-review.py
          git diff --quiet -- \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/source.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/items.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-003-20251214/crosswalk.json \
            data/corpus-reviews/GLOSSIKA-YUEHK-A1-DLG-001-020-DECISION-MAP-R1.json \
            docs/research/GLOSSIKA-YUEHK-A1-DLG-001-020-DECISION-MAP-R1.md \
            src main.js data/construction-identities.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete dialog 003 expert ingress review"
          git push origin HEAD:agent/dialog003-ingress-review
