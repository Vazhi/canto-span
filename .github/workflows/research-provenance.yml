name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: read

jobs:
  diagnose-dialog004-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dialog004-ingress-review
          fetch-depth: 0
      - name: Diagnose payload and patch preconditions
        run: |
          set -euxo pipefail
          sha256sum tools/.dialog004-executor-payload
          test "$(sha256sum tools/.dialog004-executor-payload | cut -d' ' -f1)" = "de4fe83a1212024c63075a564c2ff635f2c647f868ab96791c7d5bd46699d4f5"
          base64 --decode tools/.dialog004-executor-payload > /tmp/d4-executor.tar.gz
          sha256sum /tmp/d4-executor.tar.gz
          test "$(sha256sum /tmp/d4-executor.tar.gz | cut -d' ' -f1)" = "26cfd962d69a5782c4088506637bef0dede3f761a4e3c9e2c3b6e679c845cd19"
          mkdir -p /tmp/d4-executor
          tar -xzf /tmp/d4-executor.tar.gz -C /tmp/d4-executor
          sha256sum /tmp/d4-executor/generate_d4.py /tmp/d4-executor/d4-tooling.patch
          test "$(sha256sum /tmp/d4-executor/generate_d4.py | cut -d' ' -f1)" = "b238522a27adea13be69a64e735f11f4875ade239090d8aa90eb201f8a5c5680"
          test "$(sha256sum /tmp/d4-executor/d4-tooling.patch | cut -d' ' -f1)" = "55709d1e1b52bc05af84636b898f79c1f55be3efa64ecb12be82a7cfbc495f0c"
          python3 -m py_compile /tmp/d4-executor/generate_d4.py
          git apply --verbose --check /tmp/d4-executor/d4-tooling.patch
