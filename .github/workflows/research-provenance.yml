name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: read

jobs:
  export-week19-review-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage exact Week 19 review inputs
        run: |
          mkdir -p /tmp/week19-review-inputs/package \
            /tmp/week19-review-inputs/research-ledgers \
            /tmp/week19-review-inputs/unit-words/docs \
            /tmp/week19-review-inputs/unit-words/review-packet \
            /tmp/week19-review-inputs/tooling/.github/workflows \
            /tmp/week19-review-inputs/tooling/tools \
            /tmp/week19-review-inputs/tooling/tests/tooling/research \
            /tmp/week19-review-inputs/tooling/config
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W19-20260726/source.json /tmp/week19-review-inputs/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W19-20260726/items.tsv /tmp/week19-review-inputs/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W19-20260726/review.json /tmp/week19-review-inputs/package/
          cp data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W19-20260726/crosswalk.json /tmp/week19-review-inputs/package/
          cp data/research-ledgers/glossika-week19-*.json /tmp/week19-review-inputs/research-ledgers/
          cp docs/research/GLOSSIKA-YUEHK-A1-W19-20260726-RESEARCH.md /tmp/week19-review-inputs/research-ledgers/
          cp docs/research/OBSERVED-UNIT-WORD-NOUN-MISMATCH-MATRIX-R1.md /tmp/week19-review-inputs/unit-words/docs/
          cp docs/research/UNIT-WORD-NOUN-PRIMARY-SOURCE-LEDGER-R1.tsv /tmp/week19-review-inputs/unit-words/docs/
          cp review-packets/corpus-review/UNIT-WORDS/observed-unit-word-noun-matrix-r1.tsv /tmp/week19-review-inputs/unit-words/review-packet/
          cp review-packets/corpus-review/UNIT-WORDS/verify-observed-unit-word-noun-matrix-r1.py /tmp/week19-review-inputs/unit-words/review-packet/
          cp .github/workflows/research-provenance.yml /tmp/week19-review-inputs/tooling/.github/workflows/
          cp tools/build-pedagogical-corpus-review-candidates.py /tmp/week19-review-inputs/tooling/tools/
          cp tools/verify-pedagogical-corpus-review.py /tmp/week19-review-inputs/tooling/tools/
          cp tests/tooling/research/pedagogical-corpus-review.test.py /tmp/week19-review-inputs/tooling/tests/tooling/research/
          cp config/verification-profiles.json /tmp/week19-review-inputs/tooling/config/
          cp config/pedagogical-corpus-source-locks.json /tmp/week19-review-inputs/tooling/config/
          cp package.json /tmp/week19-review-inputs/tooling/
          find /tmp/week19-review-inputs -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/week19-review-inputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: week19-review-inputs
          path: /tmp/week19-review-inputs
          if-no-files-found: error
          retention-days: 1
