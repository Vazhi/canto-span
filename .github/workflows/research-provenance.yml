name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: read

jobs:
  inspect-dialog005-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dialog005-ingress-review
      - name: Record payload hashes
        run: |
          sha256sum tools/.dialog005-reviewed-state.part00 tools/.dialog005-reviewed-state.part01 > /tmp/dialog005-payload-sha256.txt
          wc -c tools/.dialog005-reviewed-state.part00 tools/.dialog005-reviewed-state.part01 > /tmp/dialog005-payload-bytes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dialog005-staged-payload
          path: |
            tools/.dialog005-reviewed-state.part00
            tools/.dialog005-reviewed-state.part01
            /tmp/dialog005-payload-sha256.txt
            /tmp/dialog005-payload-bytes.txt
          if-no-files-found: error
          retention-days: 1
