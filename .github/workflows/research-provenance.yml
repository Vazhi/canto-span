name: Research provenance

on:
  push:
    paths:
      - "data/construction-identities.json"
      - "data/construction-identity-lock.json"
      - "data/construction-adjudications.json"
      - "data/construction-adjudication-batches/**"
      - "data/construction-candidate-readiness.json"
      - "docs/current/**"
      - "docs/research/**"
      - "external-evidence/**"
      - "grammar/**"
      - "main.js"
      - "package.json"
      - "review-packets/**"
      - "tests/constructions/**"
      - "tests/tooling/corpus-review/**"
      - "tests/tooling/native-panel/**"
      - "tools/audit-native-conflict-burden.js"
      - "tools/corpus-review/**"
      - "tools/native-review-lib.js"
      - "tools/test-native-review-lib.js"
      - "tools/*research-provenance*"
      - "tools/verify-active-panel-snapshot-links.js"
      - "tools/verify-active-review-workflow.js"
      - "tools/verify-native-followup-draft.js"
      - "tools/verify-native-panel-snapshot.js"
      - "tools/verify-pfv-panel-snapshot.js"
      - "tools/verify-rul-survey-readiness.js"
      - "config/research-provenance-baseline.json"
      - "config/research-evidence-grades.json"
      - "config/verification-profiles.json"
      - ".github/workflows/research-provenance.yml"
  pull_request:
    paths:
      - "data/construction-identities.json"
      - "data/construction-identity-lock.json"
      - "data/construction-adjudications.json"
      - "data/construction-adjudication-batches/**"
      - "data/construction-candidate-readiness.json"
      - "docs/current/**"
      - "docs/research/**"
      - "external-evidence/**"
      - "grammar/**"
      - "main.js"
      - "package.json"
      - "review-packets/**"
      - "tests/constructions/**"
      - "tests/tooling/corpus-review/**"
      - "tests/tooling/native-panel/**"
      - "tools/audit-native-conflict-burden.js"
      - "tools/corpus-review/**"
      - "tools/native-review-lib.js"
      - "tools/test-native-review-lib.js"
      - "tools/*research-provenance*"
      - "tools/verify-active-panel-snapshot-links.js"
      - "tools/verify-active-review-workflow.js"
      - "tools/verify-native-followup-draft.js"
      - "tools/verify-native-panel-snapshot.js"
      - "tools/verify-pfv-panel-snapshot.js"
      - "tools/verify-rul-survey-readiness.js"
      - "config/research-provenance-baseline.json"
      - "config/research-evidence-grades.json"
      - "config/verification-profiles.json"
      - ".github/workflows/research-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - id: verify
        continue-on-error: true
        run: npm run verify:research
      - name: Upload provenance reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: research-provenance-reports
          path: |
            validation/current/research-provenance.json
            validation/current/research-verification-summary.json
          if-no-files-found: warn
      - name: Enforce verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
