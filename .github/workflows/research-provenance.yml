name: Research provenance

on:
  pull_request:
    paths:
      - ".github/workflows/research-provenance.yml"

permissions:
  contents: write

jobs:
  finalize-dialog005-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dialog005-ingress-review
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reconstruct reviewed state
        run: |
          set -euxo pipefail
          files=(
            tools/.dialog005-reviewed-state.chunk00
            tools/.dialog005-reviewed-state.chunk01
            tools/.dialog005-reviewed-state.chunk02
            tools/.dialog005-reviewed-state.chunk03
            tools/.dialog005-reviewed-state.chunk04
            tools/.dialog005-reviewed-state.chunk05a
            tools/.dialog005-reviewed-state.chunk05b
            tools/.dialog005-reviewed-state.chunk06
            tools/.dialog005-reviewed-state.chunk07
          )
          for file in "${files[@]}"; do test -s "$file"; done
          cat "${files[@]}" > /tmp/dialog005-reviewed-state.b64
          base64 --decode /tmp/dialog005-reviewed-state.b64 > /tmp/dialog005-reviewed-state.tar.gz
          gzip -t /tmp/dialog005-reviewed-state.tar.gz
          test -z "$(tar -tzf /tmp/dialog005-reviewed-state.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))' || true)"
          tar -xzf /tmp/dialog005-reviewed-state.tar.gz -C .
      - name: Validate final Dialog 005 state
        run: |
          set -euxo pipefail
          python3 -m py_compile tools/verify-pedagogical-corpus-review.py tests/tooling/research/pedagogical-corpus-review.test.py
          python3 tests/tooling/research/pedagogical-corpus-review.test.py
          npm run verify:pedagogical-corpus-review
          npm run verify:research
          npm run verify
          git diff --check
      - name: Commit reviewed state
        run: |
          set -euxo pipefail
          find tools tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git rm -f tools/.dialog005-* data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/.review-claim
          git add \
            config/pedagogical-corpus-source-locks.json \
            config/verification-profiles.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/README.md \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/dialog-context-routing-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/expert-review-r1.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/mechanical-cross-reference-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/package-integrity-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/research-summary.md \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/review.json \
            docs/research/GLOSSIKA-YUEHK-A1-DLG-005-20251228-CORPUS-INGRESS.md \
            package.json \
            tests/tooling/research/pedagogical-corpus-review.test.py
          git diff --quiet HEAD -- \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/source.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/items.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-005-20251228/crosswalk.json \
            data/corpus-reviews/GLOSSIKA-YUEHK-A1-DLG-001-020-DECISION-MAP-R1.json \
            src main.js
          test -z "$(git ls-files --others --exclude-standard)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Dialog 005 expert ingress review"
          git push origin HEAD:agent/dialog005-ingress-review
