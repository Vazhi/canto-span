name: CS-WORK-0263 Week 15 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week15-corpus-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source-preserving Week 15 corpus package
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const {execFileSync} = require('child_process');

          const sourceId = 'GLOSSIKA-YUEHK-A1-W15-20260628';
          const root = `data/pedagogical-corpus/glossika/${sourceId}`;
          const parts = [0,1,2,3,4].map(n => `tools/tmp/cs-work-0263-week15-seed.part${String(n).padStart(2,'0')}`);
          const seedText = parts.map(file => fs.readFileSync(file, 'utf8')).join('');
          const seed = JSON.parse(seedText);
          if (seed.records.length !== 65) throw new Error(`Expected 65 source records, found ${seed.records.length}`);

          function stable(value) {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') {
              return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            }
            return JSON.stringify(value);
          }
          function sha(value) {
            return crypto.createHash('sha256').update(value, 'utf8').digest('hex');
          }
          function countBy(values) {
            return Object.fromEntries([...values.reduce((map, value) => map.set(value, (map.get(value) || 0) + 1), new Map())].sort(([a],[b]) => a.localeCompare(b)));
          }
          function normalize(text) {
            return String(text || '').normalize('NFC').replace(/[\p{P}\p{S}\p{Z}\s]/gu, '');
          }
          function sourceDisplay(record) {
            return record.itemType === 'phonics_pair'
              ? `${record.source.wordA}|${record.source.wordB}`
              : record.source.traditional;
          }
          function tsvEscape(value) {
            return String(value ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
          }

          const itemTypeCounts = countBy(seed.records.map(record => record.itemType));
          const sectionCounts = countBy(seed.records.map(record => record.section));
          const expectedTypes = {dialog_turn:4, lexical_entry:39, phonics_pair:6, sentence:16};
          if (stable(itemTypeCounts) !== stable(expectedTypes)) throw new Error(`Unexpected item types: ${JSON.stringify(itemTypeCounts)}`);

          const payloadHash = `sha256:${sha(stable(seed.records.map(record => record.source)))}`;
          const items = seed.records.map((record, index) => ({
            id: `${sourceId}-I${String(index + 1).padStart(3,'0')}`,
            ordinal: index + 1,
            section: record.section,
            subsection: record.subsection,
            itemType: record.itemType,
            ...(record.register ? {register: record.register} : {}),
            ...(record.dialogTurn ? {dialogTurn: record.dialogTurn} : {}),
            source: record.source,
            sourceHash: `sha256:${sha(stable(record.source))}`
          }));
          const source = {
            schema: 'canto-span-pedagogical-corpus-source-v1',
            source: seed.source,
            ingress: {
              ...seed.ingress,
              recordCount: items.length,
              itemTypeCounts,
              sectionCounts,
              sourcePayloadHash: payloadHash,
              sourcePayloadHashPolicy: 'SHA-256 of canonical key-sorted JSON for the ordered source-field array.'
            },
            sourceClaims: {
              yesNoQuestionStatement: 'Yes/no questions are formed by adding the question particle 咩 (me1) or 呀 (aa4) at the end of a statement, or by using the A-not-A pattern.',
              whQuestionStatement: 'Wh-questions use question words like 咩 (me1) “what”, 邊個 (bin1 go3) “who”, 點 (dim2) “how”.',
              status: 'immutable_source_claim_requires_external_verification'
            },
            items
          };

          const tracked = execFileSync('git', ['ls-files','-z'], {encoding:'utf8'}).split('\0').filter(Boolean);
          const excludedPrefixes = [root + '/', 'tools/tmp/cs-work-0263-week15-seed', '.github/workflows/cs-work-0263-week15-ingress.yml'];
          const searchable = [];
          for (const file of tracked) {
            if (excludedPrefixes.some(prefix => file.startsWith(prefix))) continue;
            let stat;
            try { stat = fs.statSync(file); } catch { continue; }
            if (!stat.isFile() || stat.size > 5_000_000) continue;
            let text;
            try { text = fs.readFileSync(file, 'utf8'); } catch { continue; }
            searchable.push({file, text, normalized: normalize(text)});
          }

          const naturalnessForms = new Set(['唔使唔該。','點行呀？','你食飯咩？']);
          const discrepancyByForm = {
            '你食飯咩？': [{type:'translation_pragmatics',status:'requires_external_verification',note:'The neutral English yes/no gloss may not preserve final 咩 pragmatic force.'}],
            '唔使唔該。': [{type:'naturalness_register',status:'requires_native_and_corpus_review',note:'Preserved exactly; do not accept the Polite label or formula without independent review.'}],
            '—|平': [{type:'incomplete_phonics_pair',status:'source_incomplete',note:'The source supplies no Word A, Jyutping A, or Gloss A.'}],
            '錫|識': [{type:'lexical_gloss_polysemy',status:'requires_independent_verification',note:'The source gloss “tin; to kiss” conflates lexical readings and must remain source-only.'}],
            '靚|令': [{type:'phonetic_pair_quality',status:'requires_independent_verification',note:'The IPA/Jyutping pairing and lexical gloss relation require phonological review.'}]
          };
          const records = items.map(item => {
            const display = sourceDisplay(item);
            const normalized = normalize(display);
            const exactMatches = display && display !== '—|平'
              ? searchable.filter(entry => entry.text.includes(display)).map(entry => entry.file)
              : [];
            const normalizedMatches = normalized.length >= 2
              ? searchable.filter(entry => entry.normalized.includes(normalized)).map(entry => entry.file)
              : [];
            const sourceDiscrepancies = discrepancyByForm[display] || [];
            let ingressClassification;
            if (item.itemType === 'phonics_pair') {
              ingressClassification = sourceDiscrepancies.length
                ? 'pronunciation_translation_discrepancy'
                : 'pronunciation_review_candidate';
            } else if (naturalnessForms.has(display)) {
              ingressClassification = 'naturalness_review_candidate';
            } else if (exactMatches.length || normalizedMatches.length) {
              ingressClassification = 'duplicate_candidate';
            } else if (item.itemType === 'lexical_entry') {
              ingressClassification = 'lexical_only_attestation';
            } else {
              ingressClassification = 'new_attestation';
            }
            return {
              id: item.id,
              sourceHash: item.sourceHash,
              normalizedCantonese: normalized,
              duplicateStatus: exactMatches.length ? 'mechanical_exact_candidate' : normalizedMatches.length ? 'mechanical_normalized_candidate' : 'no_mechanical_match',
              duplicateOf: [...new Set([...exactMatches, ...normalizedMatches])].sort(),
              ingressClassification,
              sourceDiscrepancies,
              reviewedValues: {},
              reviewerNote: '',
              evidenceUse: 'not_authorized'
            };
          });
          const classificationCounts = countBy(records.map(record => record.ingressClassification));
          const review = {
            schema: 'canto-span-pedagogical-corpus-review-v1',
            sourceId,
            sourcePayloadHash: payloadHash,
            policy: {
              sourceLayer: 'source.json is immutable.',
              normalization: 'normalizedCantonese is mechanical and must not replace source orthography.',
              duplicateBoundary: 'Mechanical path matches are candidates only; expert review is required before accepting duplicate identity.',
              evidenceBoundary: 'Pedagogical attestation does not establish productivity, frequency, construction identity, dialect-wide naturalness, preferred Jyutping, parser correctness, or status.'
            },
            summary: {
              recordCount: items.length,
              reviewedCount: 0,
              unreviewedCount: items.length,
              classificationCounts,
              knownSourceAlerts: [
                {scope:'lesson-wide',type:'pedagogical_register_labels',status:'requires_external_verification',note:'Casual, polite, and standard labels are preserved from the source and are not accepted as sociolinguistic conclusions.'},
                {scope:'grammar_patterns',type:'generic_question_rule',status:'requires_direct_cantonese_evidence',note:'The source claim that final 咩 or 呀 forms yes/no questions is preserved but not accepted as a neutral productive rule.'},
                {scope:'phonics_drill',type:'pronunciation_material',status:'requires_independent_verification',note:'IPA, lexical choices, glosses, and claimed pair status are preserved but not adopted as reviewed pronunciation evidence.'},
                {scope:`${sourceId}-I065`,type:'incomplete_phonics_pair',status:'source_incomplete',note:'The final phonics row contains only 平 / ping4 / cheap; flat on the B side.'}
              ]
            },
            records
          };

          fs.mkdirSync(root, {recursive:true});
          fs.mkdirSync('docs/research', {recursive:true});
          fs.writeFileSync(`${root}/source.json`, JSON.stringify(source, null, 2) + '\n');
          fs.writeFileSync(`${root}/review.json`, JSON.stringify(review, null, 2) + '\n');

          const header = ['id','ordinal','section','subsection','item_type','register','source_display','source_jyutping','source_english','source_morpheme_gloss','source_hash','normalized_cantonese','duplicate_status','ingress_classification','duplicate_candidate_paths','source_discrepancies_json','review_state'];
          const rows = items.map((item,index) => {
            const record = records[index];
            const s = item.source;
            return [item.id,item.ordinal,item.section,item.subsection,item.itemType,item.register || '',sourceDisplay(item),s.jyutping || `${s.jyutpingA || ''}|${s.jyutpingB || ''}`,s.english || `${s.glossA || ''}|${s.glossB || ''}`,s.morphemeGloss || '',item.sourceHash,record.normalizedCantonese,record.duplicateStatus,record.ingressClassification,record.duplicateOf.join('|'),JSON.stringify(record.sourceDiscrepancies),seed.ingress.reviewState].map(tsvEscape).join('\t');
          });
          fs.writeFileSync(`${root}/items.tsv`, [header.join('\t'), ...rows].join('\n') + '\n');

          const readme = `# Glossika Cantonese (HK) A1 Week 15 corpus package\n\n- Source ID: \`${sourceId}\`\n- Lesson: Directions & Places\n- Source date: 2026-06-28\n- Gmail message: \`19f0cf457d1b8ac3\`\n- Intake issue: #132\n- Work claim: #270\n- Related research: #127\n- Record count: 65\n- Types: 16 sentences, 4 dialog turns, 39 lexical entries, 6 phonics pairs\n- Source payload hash: \`${payloadHash}\`\n\n## Files\n\n- \`source.json\`: immutable source fields, order, and source hashes.\n- \`items.tsv\`: review-oriented flat rendering.\n- \`review.json\`: mechanical duplicate candidates, ingress classifications, discrepancy flags, and empty reviewed-value fields.\n\n## Evidence boundary\n\nThis package preserves authorized pedagogical data. It does not promote any route, localizer, question, result, particle, numeral, lexical, or phonological claim. Mechanical duplicate paths are candidates, not accepted identity decisions.\n\n## Known source alerts\n\n- Casual/Polite/Standard labels require independent register analysis.\n- The generic final 咩/呀 yes-no-question claim requires direct Cantonese evidence and controlled contrasts.\n- The final phonics row is incomplete on the A side and is preserved exactly.\n- Phonics IPA, glosses, and pair status require independent verification.\n`;
          fs.writeFileSync(`${root}/README.md`, readme);

          const report = `# Glossika Week 15 corpus ingress\n\n- Source ID: \`${sourceId}\`\n- Intake: #132\n- Work claim: #270\n- Related research: #127\n- Status: source-preserving ingress complete; expert review required\n\n## Coverage\n\n- 65 total records\n- 16 sentences\n- 4 dialog turns\n- 39 lexical entries, including 十萬 through 一百萬\n- 6 phonics pairs\n- Classification counts: \`${JSON.stringify(classificationCounts)}\`\n\n## Source fidelity\n\nSource Cantonese, punctuation, capitalization, Jyutping, morpheme glosses, English glosses, register labels, IPA, and order are preserved. The incomplete final phonics row remains incomplete. Corrections are not written into \`source.json\`.\n\n## Deduplication\n\nThe generator scanned tracked UTF-8 repository files outside this package for exact and mechanically normalized source forms. Matches are recorded as duplicate candidates only. Short forms and contextual strings still require expert identity review.\n\n## Review routing\n\n- Route, localizer, result, question, and fragment analysis: #127.\n- Source-specific discrepancies remain in \`review.json\`.\n- No item is authorized for evidence counting, runtime lexicon ingress, parser behavior, survey deployment, construction promotion, versioning, or release.\n`;
          fs.writeFileSync('docs/research/GLOSSIKA-YUEHK-A1-W15-20260628-CORPUS-INGRESS.md', report);

          console.log({payloadHash,itemTypeCounts,sectionCounts,classificationCounts});
          NODE
      - name: Validate corpus package
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628';
          const source = require(`./${root}/source.json`);
          const review = require(`./${root}/review.json`);
          if (source.items.length !== 65) throw new Error('Expected 65 source items');
          const expected = {dialog_turn:4,lexical_entry:39,phonics_pair:6,sentence:16};
          if (JSON.stringify(source.ingress.itemTypeCounts) !== JSON.stringify(expected)) throw new Error('Unexpected item type counts');
          if (review.records.length !== 65) throw new Error('Expected 65 review records');
          if (!review.records.every((record,index) => record.id === source.items[index].id && record.sourceHash === source.items[index].sourceHash)) throw new Error('Review/source alignment failed');
          const tsv = fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if (tsv.length !== 66) throw new Error(`Expected TSV header plus 65 rows, found ${tsv.length}`);
          if (source.items[64].source.wordA !== '—' || source.items[64].source.wordB !== '平') throw new Error('Incomplete phonics row not preserved');
          NODE
          git diff --check
      - name: Run repository verification
        run: |
          npm run verify:research
          npm run verify
      - name: Commit generated corpus package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628 \
            docs/research/GLOSSIKA-YUEHK-A1-W15-20260628-CORPUS-INGRESS.md
          git rm tools/tmp/cs-work-0263-week15-seed.part00 \
            tools/tmp/cs-work-0263-week15-seed.part01 \
            tools/tmp/cs-work-0263-week15-seed.part02 \
            tools/tmp/cs-work-0263-week15-seed.part03 \
            tools/tmp/cs-work-0263-week15-seed.part04
          git commit -m "Add Glossika Week 15 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
