name: CS-WORK-0286 Week 19 research validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week19-research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Validate Week 19 research structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = require('./data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W19-20260726/source.json');
          const claims = require('./data/research-ledgers/glossika-week19-claim-source.json');
          const classifiers = require('./data/research-ledgers/glossika-week19-classifier-compatibility.json');
          const functions = require('./data/research-ledgers/glossika-week19-function-word-profiles.json');
          const particles = require('./data/research-ledgers/glossika-week19-particle-boundaries.json');
          const dative = require('./data/research-ledgers/glossika-week19-dative-audit.json');
          const spatial = require('./data/research-ledgers/glossika-week19-spatial-lexical-classes.json');
          const lexical = require('./data/research-ledgers/glossika-week19-lexical-numeral-candidates.json');
          const followup = require('./data/research-ledgers/glossika-week19-followup-candidates.json');
          if (source.items.length !== 76) throw new Error('Expected 76 source records');
          if (source.ingress.sourcePayloadHash !== 'sha256:ec055012fbf34af2e99577b681c15bcd14e0a4f8e72f7f14e00c66bc8df04cdc') throw new Error('Unexpected source hash');
          if (claims.claims.length !== 16) throw new Error('Expected 16 bounded claims');
          if (claims.sources.length < 17) throw new Error('Expected direct and repository source coverage');
          if (classifiers.entries.length !== 14 || classifiers.summary.exactModularRuleCoverage !== 10) throw new Error('Classifier audit mismatch');
          if (classifiers.summary.missingExactModularRules.join(',') !== '枝,對,把,條') throw new Error('Unexpected missing classifier rules');
          if (classifiers.summary.sourceReadingDiscrepancies.join(',') !== '架') throw new Error('架 discrepancy missing');
          if (functions.entries.length !== 6) throw new Error('Expected six function-word profiles');
          if (particles.entries.length !== 5) throw new Error('Expected five particle profiles');
          if (dative.analysis.giveClause.order !== 'V_THEME_RECIPIENT') throw new Error('Dative order mismatch');
          if (spatial.entries.length !== 23 || spatial.summary.withModularOwner !== 6) throw new Error('Spatial audit mismatch');
          if (lexical.summary.reviewCandidates.length !== 22 || lexical.summary.compositionalNumerals.length !== 10) throw new Error('Lexical/numeral audit mismatch');
          if (followup.candidates.length !== 12 || followup.nonCandidates.length !== 1) throw new Error('Follow-up count mismatch');
          for (const entry of classifiers.entries) {
            if (entry.acceptedNounPairs.length) throw new Error(`Classifier promotion leaked for ${entry.traditional}`);
          }
          for (const path of [
            'data/research-ledgers/glossika-week19-classifier-compatibility.json',
            'data/research-ledgers/glossika-week19-function-word-profiles.json',
            'data/research-ledgers/glossika-week19-particle-boundaries.json',
            'data/research-ledgers/glossika-week19-spatial-lexical-classes.json',
            'data/research-ledgers/glossika-week19-lexical-numeral-candidates.json'
          ]) {
            const text = fs.readFileSync(path, 'utf8');
            if (/"(?:canonicalOwners|canonicalRuntimeResourceOwners|canonicalParserOwnerCandidates)"\s*:\s*\[[^\]]*"main\.js"/s.test(text)) throw new Error(`Generated bundle leaked into ${path}`);
          }
          const note = fs.readFileSync('docs/research/GLOSSIKA-YUEHK-A1-W19-20260726-RESEARCH.md', 'utf8').toLowerCase();
          const required = [
            'classifier glosses are useful semantic hints',
            'source reading `架 gaa2` is a genuine discrepancy',
            'theme precedes recipient',
            '23 spatial forms',
            'twenty-two lexical/resource items',
            'five `saam-` cells',
            'no parser'
          ];
          for (const phrase of required) if (!note.includes(phrase.toLowerCase())) throw new Error(`Research note missing ${phrase}`);
          for (const claim of claims.claims) {
            if (!claim.id || !claim.claim || !claim.status || !claim.sourceIds?.length || !claim.boundary) throw new Error(`Malformed claim ${claim.id || 'unknown'}`);
          }
          console.log({sourceRecords:76,claims:16,classifiers:classifiers.summary,spatial:spatial.summary,lexical:lexical.summary,followups:12});
          NODE
          git diff --check
      - name: Run repository verification
        run: |
          npm run verify:research
          npm run verify
