name: Temporary Cifu ranks 1-250 corrected runtime materializer

# Retry after assigning the independently reviewed seng4 productive whole/all default for 成.
on:
  push:
    branches:
      - agent/cifu-r1-250-runtime-reconcile-v2
    paths:
      - .github/workflows/temporary-cifu-r1-250-materialize.yml

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r1-250-runtime-reconcile-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install candidate dependencies
        run: npm ci

      - name: Verify focused lexical invariants
        run: |
          node --test tests/tooling/lexicon/cifu-r1-250-reviewed-runtime.test.js
          node --test tests/tooling/lexicon/cifu-r251-500-reviewed-runtime.test.js

      - name: Verify parser architecture
        run: node tools/parser-architecture-audit.js

      - name: Verify regression debt ratchet against main
        shell: bash
        run: |
          set -euo pipefail
          node tests/run-regression.js > /tmp/candidate-run.log || true
          cp validation/current/regression-suite.json /tmp/candidate-regression.json

          git worktree add --detach /tmp/canto-span-base origin/main
          cd /tmp/canto-span-base
          npm ci >/dev/null
          node tests/run-regression.js > /tmp/baseline-run.log || true
          cp validation/current/regression-suite.json /tmp/baseline-regression.json

          cd "$GITHUB_WORKSPACE"
          node tools/verify-regression-ratchet.js \
            --suite regression \
            --baseline-result /tmp/baseline-regression.json \
            --candidate-result /tmp/candidate-regression.json \
            --baseline-universe /tmp/canto-span-base/tests/fixtures/regression-snapshots.json \
            --candidate-universe tests/fixtures/regression-snapshots.json

          git restore validation/current 2>/dev/null || true
          git clean -fd validation/current

      - name: Rebuild runtime from canonical source
        run: |
          npm run build:runtime
          node tools/build-runtime.js --check

      - name: Commit generated runtime and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-cifu-r1-250-materialize.yml
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
              'main.js',
              '.github/workflows/temporary-cifu-r1-250-materialize.yml',
          }
          changed = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in changed}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'unexpected materializer changes: {unexpected}')
          required = {'main.js', '.github/workflows/temporary-cifu-r1-250-materialize.yml'}
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'missing expected materializer changes: {missing}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild v0.5.230 after lexical default fixes'
          git push origin HEAD:agent/cifu-r1-250-runtime-reconcile-v2
