name: Temporary Cifu ranks 1-250 runtime materializer

on:
  push:
    branches:
      - agent/cifu-r1-250-runtime-reconcile-v2
    paths:
      - .github/workflows/temporary-cifu-r1-250-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r1-250-runtime-reconcile-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Report reviewed inventory
        run: |
          node <<'NODE'
          const reviewed = require('./src/runtime-resources/lexicon/token-lexicon/cifu-r1-250-reviewed');
          const candidate = require('./src/runtime-resources/lexicon/token-lexicon/cifu-r1-250-candidate-defaults');
          const native = require('./src/runtime-resources/lexicon/token-lexicon/native-review-corrections');
          const rawSurfaces = Object.keys(reviewed.EXPLICIT_ANALYSES);
          const rawRows = Object.values(reviewed.EXPLICIT_ANALYSES).reduce((sum, rows) => sum + rows.length, 0);
          const singletonSurfaces = Object.entries(reviewed.EXPLICIT_ANALYSES).filter(([, rows]) => rows.length === 1).map(([surface]) => surface);
          console.log(JSON.stringify({
            raw_reviewed_surfaces: rawSurfaces.length,
            raw_reviewed_rows: rawRows,
            singleton_surfaces: singletonSurfaces,
            candidate_override_surfaces: Object.keys(candidate.EXPLICIT_ANALYSES),
            native_override_surfaces: Object.keys(native.EXPLICIT_ANALYSES),
          }, null, 2));
          NODE

      - name: Materialize v0.5.230 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.5.230 --no-git-tag-version
          node <<'NODE'
          const fs = require('node:fs');

          const manifestPath = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.version = '0.5.230';
          manifest.description = 'v0.5.230 reconciles reviewed Cifu ranks 1–250 lexical analyses with neutral/compositional safeguards, stable alternatives, and native-reviewed 喀 pronunciation handling.';
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const pluginPath = 'src/plugin-entry.js';
          let plugin = fs.readFileSync(pluginPath, 'utf8');
          const oldVersion = 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.229";';
          const newVersion = 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.230";';
          if (!plugin.includes(oldVersion)) throw new Error('expected v0.5.229 runtime version marker not found');
          plugin = plugin.replace(oldVersion, newVersion);
          const priorNote = '// v0.5.229: reconciles finalized Cifu ranks 251–500 lexical adjudications with neutral/compositional safeguards and stable multi-analysis IDs.';
          const newNote = '// v0.5.230: reconciles reviewed Cifu ranks 1–250 lexical analyses with neutral/compositional safeguards, stable alternatives, and native-reviewed 喀 pronunciation handling.';
          if (!plugin.includes(priorNote)) throw new Error('expected v0.5.229 release note anchor not found');
          plugin = plugin.replace(priorNote, `${newNote}\n${priorNote}`);
          fs.writeFileSync(pluginPath, plugin);
          NODE

      - name: Build runtime from source
        run: npm run build:runtime

      - name: Verify focused reviewed lexical invariants
        run: node --test tests/tooling/lexicon/cifu-r1-250-reviewed-runtime.test.js

      - name: Verify generated bundle is current
        run: node tools/build-runtime.js --check

      - name: Remove temporary materializer and commit outputs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-cifu-r1-250-materialize.yml
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
              'package.json',
              'package-lock.json',
              'manifest.json',
              'src/plugin-entry.js',
              'main.js',
              '.github/workflows/temporary-cifu-r1-250-materialize.yml',
          }
          changed = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'unexpected materializer changes: {unexpected}')
          required = {'package.json', 'package-lock.json', 'manifest.json', 'src/plugin-entry.js', 'main.js', '.github/workflows/temporary-cifu-r1-250-materialize.yml'}
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'missing expected materializer changes: {missing}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize v0.5.230 ranked lexical runtime'
          git push origin HEAD:agent/cifu-r1-250-runtime-reconcile-v2
