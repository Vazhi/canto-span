name: Agent runtime build artifact

on:
  push:
    branches:
      - agent/cifu-r1501-1750-runtime-reconcile

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Synchronize v0.5.236 metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const VERSION = '0.5.236';

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          function writeJson(path, value) {
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          }

          const pkg = readJson('package.json');
          pkg.version = VERSION;
          writeJson('package.json', pkg);

          const lock = readJson('package-lock.json');
          lock.version = VERSION;
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package missing');
          lock.packages[''].version = VERSION;
          writeJson('package-lock.json', lock);

          const manifest = readJson('manifest.json');
          manifest.version = VERSION;
          manifest.description = 'v0.5.236 implements reviewed Cifu ranks 1501–1750 under the scalable lexical-ingestion audit, with independently verified component coverage and preserved contamination safeguards.';
          writeJson('manifest.json', manifest);

          const pluginPath = 'src/plugin-entry.js';
          let plugin = fs.readFileSync(pluginPath, 'utf8');
          const oldVersion = 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.235";';
          if (!plugin.includes(oldVersion)) throw new Error('expected v0.5.235 runtime version marker missing');
          plugin = plugin.replace(oldVersion, `const CANTO_SPAN_RUNTIME_VERSION = "${VERSION}";`);
          const previousComment = '// v0.5.235: adds a scalable lexical-ingestion contamination/tokenization architecture gate, force-composes only neutral multi-character promotion-blocked fallbacks, and completes generated modal-clause trace-family metadata.';
          const newComment = '// v0.5.236: implements reviewed Cifu ranks 1501–1750 with 139 conservative broad selections, 42 polyfunctional surfaces, 16 reading/category splits, 45 blocked-atomic rows, 8 research-required holds, independently verified 刻/遇 component coverage, and reviewed Cantonese 響 analyses under the scalable ingestion gate.';
          if (!plugin.includes(previousComment)) throw new Error('expected v0.5.235 history marker missing');
          plugin = plugin.replace(previousComment, `${newComment}\n${previousComment}`);
          fs.writeFileSync(pluginPath, plugin);

          const statePath = 'docs/current/PROJECT-STATE.md';
          let state = fs.readFileSync(statePath, 'utf8');
          const oldRow = '| Runtime | v0.5.235 |';
          if (!state.includes(oldRow)) throw new Error('expected v0.5.235 PROJECT-STATE row missing');
          state = state.replace(oldRow, `| Runtime | v${VERSION} |`);
          const anchor = '- v0.5.235 adds a reusable lexical-ingestion contamination/tokenization gate:';
          const bullet = '- v0.5.236 implements the consolidated Cifu ranks 1501–1750 lexical authority through the reusable ingestion architecture: 139 broad reviewed selections are applied conservatively, 42 polyfunctional surfaces and 16 reading/category splits retain stable alternative analyses, 45 `blocked_atomic` rows receive no band-specific whole-surface promotion, and eight `research_required` rows remain unpromoted; executable ingestion testing exposed genuine missing component coverage for `刻` and `遇`, which is filled independently rather than weakening decomposition checks, while rank 1729 `響` moves from neutral fallback to reviewed Cantonese verb, locative-coverb, and locative-existential analyses without importing contaminated Mandarin metadata; ranks 1–1500, the `多少` exclusion, construction identity/status, survey/native-panel state, corpus classifications, release-publication state, deployment state, and unrelated parser behavior remain protected;\n\n';
          if (!state.includes(anchor)) throw new Error('expected v0.5.235 PROJECT-STATE anchor missing');
          if (!state.includes('- v0.5.236 implements the consolidated Cifu ranks 1501–1750 lexical authority')) {
            state = state.replace(anchor, `${bullet}${anchor}`);
          }
          fs.writeFileSync(statePath, state);
          NODE
      - name: Build deterministic runtime
        run: npm run build:runtime
      - name: Run ranks 1501-1750 focused invariants
        run: node --test tests/tooling/lexicon/cifu-r1501-1750-reviewed-runtime.test.js
      - name: Run scalable lexical-ingestion gate
        run: npm run test:lexical-ingestions
      - name: Emit lexical-ingestion audit summary
        run: npm run audit:lexical-ingestions
      - name: Run runtime verification
        run: npm run verify:runtime
      - name: Run research verification
        run: npm run verify:research
      - name: Run core verification
        run: npm run verify
      - name: Enforce regression-debt ratchet against v0.5.235 main
        run: |
          set -euo pipefail
          BASE_SHA="3678bdee3193c81f46374c1b64801a60fd8c6b77"
          BASE_DIR="$RUNNER_TEMP/canto-span-ratchet-base"
          rm -rf "$BASE_DIR"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true' EXIT

          rm -f \
            "$BASE_DIR/validation/current/regression-suite.json" \
            "$BASE_DIR/validation/current/np-subsystem-results.json" \
            "$BASE_DIR/validation/current/construction-tests.json" \
            "validation/current/regression-suite.json" \
            "validation/current/np-subsystem-results.json" \
            "validation/current/construction-tests.json"

          (cd "$BASE_DIR" && node tests/run-regression.js) || true
          (cd "$BASE_DIR" && node tests/run-np-subsystem.js) || true
          (cd "$BASE_DIR" && node tests/run-constructions.js) || true
          node tests/run-regression.js || true
          node tests/run-np-subsystem.js || true
          node tests/run-constructions.js || true

          for report in \
            "$BASE_DIR/validation/current/regression-suite.json" \
            "$BASE_DIR/validation/current/np-subsystem-results.json" \
            "$BASE_DIR/validation/current/construction-tests.json" \
            "validation/current/regression-suite.json" \
            "validation/current/np-subsystem-results.json" \
            "validation/current/construction-tests.json"; do
            test -f "$report" || { echo "Missing ratchet report: $report" >&2; exit 1; }
          done

          node tools/verify-regression-ratchet.js \
            --suite regression \
            --baseline-result "$BASE_DIR/validation/current/regression-suite.json" \
            --candidate-result "validation/current/regression-suite.json" \
            --baseline-universe "$BASE_DIR/tests/fixtures/regression-snapshots.json" \
            --candidate-universe "tests/fixtures/regression-snapshots.json"
          node tools/verify-regression-ratchet.js \
            --suite np_subsystem \
            --baseline-result "$BASE_DIR/validation/current/np-subsystem-results.json" \
            --candidate-result "validation/current/np-subsystem-results.json" \
            --baseline-universe "$BASE_DIR/tests/fixtures/np-subsystem.json" \
            --candidate-universe "tests/fixtures/np-subsystem.json"
          node tools/verify-regression-ratchet.js \
            --suite construction_files \
            --baseline-result "$BASE_DIR/validation/current/construction-tests.json" \
            --candidate-result "validation/current/construction-tests.json" \
            --baseline-universe "$BASE_DIR/tests/constructions" \
            --candidate-universe "tests/constructions"
      - name: Clean verifier byproducts and enforce write allowlist
        run: |
          set -euo pipefail
          git restore --worktree --staged validation/current 2>/dev/null || true
          git clean -fd validation/current >/dev/null 2>&1 || true
          mapfile -t CHANGED < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf 'Generated changes:\n'
          printf '  %s\n' "${CHANGED[@]}"
          for path in "${CHANGED[@]}"; do
            case "$path" in
              package.json|package-lock.json|manifest.json|src/plugin-entry.js|docs/current/PROJECT-STATE.md|main.js) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done
          test "${#CHANGED[@]}" -gt 0 || { echo 'Expected synchronized changes but workspace is clean' >&2; exit 1; }
      - name: Commit synchronized v0.5.236 runtime state to claimed branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json manifest.json src/plugin-entry.js docs/current/PROJECT-STATE.md main.js
          git commit -m 'Synchronize v0.5.236 ranks 1501-1750 runtime state [runtime-build]'
          git push origin HEAD:agent/cifu-r1501-1750-runtime-reconcile
