name: Behavior-first temporary core verification

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  verify-core:
    if: github.event.pull_request.head.ref == 'agent/behavior-first-construction-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
