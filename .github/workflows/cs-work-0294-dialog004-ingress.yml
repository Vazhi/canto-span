name: CS-WORK-0294 Dialog 004 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialog-004-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source-preserving dialog package
        run: node tools/tmp/cs-work-0294-generate-dialog004.js
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-004-20251221';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          if(source.items.length!==88||source.ingress.dialogEventCount!==44||source.ingress.turnCount!==41||source.ingress.stageDirectionCount!==3||source.ingress.vocabularyCount!==44) throw new Error('Unexpected source counts');
          const events=source.items.filter(item=>item.itemType!=='lexical_entry');
          const turns=source.items.filter(item=>item.itemType==='dialog_turn');
          const stages=source.items.filter(item=>item.itemType==='stage_direction');
          const vocab=source.items.filter(item=>item.itemType==='lexical_entry');
          if(events.some((item,index)=>item.eventOrdinal!==index+1||item.source.english!==null)) throw new Error('Event sequence or missing-English preservation failed');
          if(turns.some((item,index)=>item.turn!==index+1||!item.speaker||item.source.english!==null)) throw new Error('Turn sequence, speaker, or missing-English preservation failed');
          if(stages.some((item,index)=>item.stageDirectionOrdinal!==index+1||item.source.english!==null)) throw new Error('Stage-direction sequence failed');
          if(vocab.some((item,index)=>item.vocabularyOrdinal!==index+1)) throw new Error('Vocabulary order failed');
          if(crosswalk.items.length!==88||review.records.length!==88) throw new Error('Crosswalk/review alignment failed');
          if(crosswalk.architecture.generatedExcluded[0]!=='main.js') throw new Error('main.js exclusion missing');
          if(crosswalk.items.some(item=>[...item.canonicalExactOwners,...item.canonicalNormalizedOwners,...item.supportingExactOwners,...item.supportingNormalizedOwners].includes('main.js'))) throw new Error('main.js leaked into ownership');
          const eventWalk=crosswalk.items.filter(item=>item.itemType!=='lexical_entry');
          if(eventWalk.some((item,index)=>item.adjacency.previousEventId!==(index===0?null:`GLOSSIKA-YUEHK-A1-DLG-004-20251221-I${String(index).padStart(3,'0')}`)||item.adjacency.nextEventId!==(index===43?null:`GLOSSIKA-YUEHK-A1-DLG-004-20251221-I${String(index+2).padStart(3,'0')}`))) throw new Error('Event adjacency failed');
          const turnWalk=eventWalk.filter(item=>item.itemType==='dialog_turn');
          if(turnWalk.some((item,index)=>item.adjacency.previousTurnId!==(index===0?null:turnWalk[index-1].sourceItemId)||item.adjacency.nextTurnId!==(index===40?null:turnWalk[index+1].sourceItemId))) throw new Error('Spoken-turn adjacency failed');
          const rows=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(rows.length!==89) throw new Error(`Expected TSV header plus 88 rows, found ${rows.length}`);
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='narrative_context_preserved')) throw new Error('Stage-direction alert absent');
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='source_grammar_and_confidence_claims')) throw new Error('Source-claim alert absent');
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-004-20251221 docs/research/GLOSSIKA-YUEHK-A1-DLG-004-20251221-CORPUS-INGRESS.md
          git rm tools/tmp/cs-work-0294-dialog004-meta.json tools/tmp/cs-work-0294-dialog004-events.part00.tsv tools/tmp/cs-work-0294-dialog004-events.part01.tsv tools/tmp/cs-work-0294-dialog004-events.part02.tsv tools/tmp/cs-work-0294-dialog004-events.part03.tsv tools/tmp/cs-work-0294-dialog004-vocab.part00.tsv tools/tmp/cs-work-0294-dialog004-vocab.part01.tsv tools/tmp/cs-work-0294-generate-dialog004.js
          git commit -m "Add Glossika dialog 004 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
