name: Temporary v0.5.234 ranks 1251-1500 state materializer

on:
  push:
    branches:
      - agent/cifu-r1251-1500-runtime-reconcile
    paths:
      - .github/workflows/materialize-r1251-1500-runtime.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'Vazhi/canto-span' && github.ref == 'refs/heads/agent/cifu-r1251-1500-runtime-reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r1251-1500-runtime-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact triggering head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Materialize v0.5.234 metadata and current state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one precondition match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/plugin-entry.js",
              'const CANTO_SPAN_RUNTIME_VERSION = "0.5.233";\n// v0.5.233:',
              'const CANTO_SPAN_RUNTIME_VERSION = "0.5.234";\n// v0.5.234: reconciles reviewed Cifu ranks 1251–1500 with 126 evidence-supported broad defaults, 72 stable alternative surfaces, pending/blocked safeguards, and positive non-Cantonese 多少 removal while preserving ranks 1–1250 behavior.\n// v0.5.233:'
          )

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("version") != "0.5.233":
              raise SystemExit("manifest.json: expected v0.5.233 precondition")
          manifest["version"] = "0.5.234"
          manifest["description"] = "v0.5.234 reconciles reviewed Cifu ranks 1251–1500 with stable lexical alternatives, evidence-strength safeguards, and positive non-Cantonese 多少 removal."
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != "0.5.233":
              raise SystemExit("package.json: expected v0.5.233 precondition")
          package["version"] = "0.5.234"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != "0.5.233" or lock.get("packages", {}).get("", {}).get("version") != "0.5.233":
              raise SystemExit("package-lock.json: expected v0.5.233 precondition")
          lock["version"] = "0.5.234"
          lock["packages"][""]["version"] = "0.5.234"
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + "\n")

          state_path = Path("docs/current/PROJECT-STATE.md")
          state = state_path.read_text()
          if state.count("| Runtime | v0.5.233 |") != 1:
              raise SystemExit("PROJECT-STATE.md: expected one v0.5.233 baseline row")
          state = state.replace("| Runtime | v0.5.233 |", "| Runtime | v0.5.234 |", 1)
          anchor = "Current consequences include:\n\n- v0.5.233 implements"
          if state.count(anchor) != 1:
              raise SystemExit("PROJECT-STATE.md: expected v0.5.233 consequence anchor")
          bullet = (
              "Current consequences include:\n\n"
              "- v0.5.234 implements the consolidated #884/#886 Cifu ranks 1251–1500 lexical authority: 126 independently supportable broad rows receive reviewed typed defaults when their prior runtime entry is neutral, 72 surfaces expose stable reviewed alternatives (43 polyfunctional and 29 reading-specific), the three source-only pending rows `平排`, `打直`, and `打斜` receive no band-specific typed promotion, and all 49 `blocked_atomic` rows receive no new typed whole-surface analysis; rank 1404 `多少 do1 siu2` is the first positively established whole-surface non-Cantonese contamination under the current policy and is removed from the effective Cantonese runtime while the generated Cifu source remains provenance and existing Cantonese `幾多` coverage remains intact, so Cifu exact-surface runtime coverage is truthfully 1,999/2,000 while the independent common-spoken-Cantonese priority inventory remains 2,000 items; ranks 1–1250 stable analyses/defaults remain protected, and no construction identity or status, survey, corpus, release-publication, or deployment state is changed;\n\n"
              "- v0.5.233 implements"
          )
          state = state.replace(anchor, bullet, 1)
          state_path.write_text(state)
          PY
      - name: Install build dependencies
        run: npm ci
      - name: Build canonical runtime bundle
        run: npm run build:runtime
      - name: Run focused ranks 1251-1500 lexical invariants
        run: node tests/tooling/lexicon/cifu-r1251-1500-reviewed-runtime.test.js
      - name: Verify generated bundle is source-synchronized
        run: node tools/build-runtime.js --check
      - name: Verify bounded state diff
        run: |
          set -euo pipefail
          actual="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' 'docs/current/PROJECT-STATE.md' 'main.js' 'manifest.json' 'package-lock.json' 'package.json' 'src/plugin-entry.js' | sort)"
          test "$actual" = "$expected"
      - name: Commit synchronized v0.5.234 state and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-r1251-1500-runtime.yml
          actual="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/materialize-r1251-1500-runtime.yml' 'docs/current/PROJECT-STATE.md' 'main.js' 'manifest.json' 'package-lock.json' 'package.json' 'src/plugin-entry.js' | sort)"
          test "$actual" = "$expected"
          git config user.name 'canto-span-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/materialize-r1251-1500-runtime.yml docs/current/PROJECT-STATE.md main.js manifest.json package-lock.json package.json src/plugin-entry.js
          git commit -m 'Materialize v0.5.234 ranks 1251-1500 runtime state'
          git push origin HEAD:agent/cifu-r1251-1500-runtime-reconcile
