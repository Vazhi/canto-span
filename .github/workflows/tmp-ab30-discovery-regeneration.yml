name: Temporary AB30 discovery regeneration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.head_ref == 'agent/ab30-aggregate-corpus-manifest'
    runs-on: ubuntu-latest
    steps:
      - name: Check out claimed branch
        uses: actions/checkout@v4
        with:
          ref: agent/ab30-aggregate-corpus-manifest
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Normalize verifier scalar expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('review-packets/corpus-review/AB30/verify-aggregate-corpus-evidence-manifest-r1.py')
          text = path.read_text(encoding='utf-8')
          old = '        "status": "research_pending",\n'
          new = '        "status": \'"research_pending"\',\n'
          if old not in text:
              raise SystemExit('expected verifier line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify aggregate manifest before generation
        run: python3 review-packets/corpus-review/AB30/verify-aggregate-corpus-evidence-manifest-r1.py

      - name: Regenerate deterministic discovery outputs
        run: npm run discovery:generate

      - name: Run task-scoped checks
        run: |
          python3 review-packets/corpus-review/AB30/verify-aggregate-corpus-evidence-manifest-r1.py
          npm run verify:research
          npm run verify:discovery
          npm run verify

      - name: Remove temporary workflow and commit generated outputs
        run: |
          rm .github/workflows/tmp-ab30-discovery-regeneration.yml
          git config user.name 'canto-span-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'Regenerate AB30 discovery outputs'
          git push origin HEAD:agent/ab30-aggregate-corpus-manifest
