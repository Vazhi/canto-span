name: Finalize v0.5.237 under inherited release debt

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Use canonical v0.5.237 verification profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: python tools/tmp-v05237-lexical-finalize.py
      - name: Build and run blocking lexical and canonical profiles
        run: |
          set -euo pipefail
          npm run build:runtime
          node --test tests/tooling/lexicon/vernacular-component-coverage.test.js
          npm run test:lexical-ingestions
          npm run verify
          npm run verify:research
          npm run verify:runtime
      - name: Require exact inherited release-handoff debt
        run: |
          set +e
          node tools/verify-release-handoff.js > /tmp/release-handoff.json
          status=$?
          set -e
          cat /tmp/release-handoff.json
          test "$status" -eq 1
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const result = JSON.parse(fs.readFileSync('/tmp/release-handoff.json', 'utf8'));
          const expected = [
            'status_changes_mismatch:[]!=[{"construction":"JauDakMouDakAvailabilityPredicate","old_status":null,"new_status":"research_pending"}]',
            'missing_changed_construction_audit:JauDakMouDakAvailabilityPredicate',
            'changed_construction_audit_has_extra_or_missing_records',
          ];
          assert.equal(result.status, 'FAIL');
          assert.equal(result.failed, 3);
          assert.deepEqual(result.failures, expected);
          assert.deepEqual(result.actual_status_changes, [{
            construction: 'JauDakMouDakAvailabilityPredicate',
            old_status: null,
            new_status: 'research_pending',
          }]);
          console.log('Inherited release-handoff debt matched current main exactly.');
          NODE
      - name: Publish only from unchanged branch head
        run: |
          set -euo pipefail
          git fetch origin agent/cifu-r1751-2000-runtime-reconcile
          test "$(git rev-parse origin/agent/cifu-r1751-2000-runtime-reconcile)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-finalize-v05237-lexical.yml
          git rm tools/tmp-v05237-lexical-finalize.py
          git add package.json package-lock.json manifest.json src/plugin-entry.js docs/current/PROJECT-STATE.md docs/research/LEXICAL-COVERAGE-TOP-2000.md main.js
          git commit -m 'Finalize v0.5.237 lexical reconciliation'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
