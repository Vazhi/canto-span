name: AA61 implementation gate

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/aa61-gwo-final-mei-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa61-gwo-final-mei-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Reassemble and verify reviewed AA61 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/aa61.patch.b64
          for sha in \
            ae166b9d39ef047af1725a268bba749ebb934aa2 \
            0e871041aa4bf2f0f65bf5982d71958a6257feb7 \
            55faaf30a945b0aa3425a4b4d14a45c26eede64f \
            ba9c010e251958b49f457b160dcbacd3e17e169a
          do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Vazhi/canto-span/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d >> /tmp/aa61.patch.b64
          done
          test "$(wc -c < /tmp/aa61.patch.b64)" -eq 9104
          base64 -d /tmp/aa61.patch.b64 > /tmp/aa61.patch.gz
          test "$(wc -c < /tmp/aa61.patch.gz)" -eq 6828
          echo 'b28f16150c460216978a3862929b739a1388326e63cbb67cbe9936fbfc81727b  /tmp/aa61.patch.gz' | sha256sum -c -
          gzip -t /tmp/aa61.patch.gz
          gzip -dc /tmp/aa61.patch.gz > /tmp/aa61.patch
          echo 'ea8c9b72681b9c6137059da924430c309e9a3c41fb4453215928f2a7c3e53a08  /tmp/aa61.patch' | sha256sum -c -
          git apply --check /tmp/aa61.patch
          git apply /tmp/aa61.patch
          cat > /tmp/aa61-supp.patch <<'PATCH'
          --- a/src/plugin-entry.js
          +++ b/src/plugin-entry.js
          @@ -2917,6 +2917,7 @@
             contextualPositiveExistentialAcknowledgementRepetition,
             licensedContextHaveOrNotEventQuestion,
             licensedContextEllipticalExistentialQuestion,
          +  licensedContextShortExperientialQuestion,
             typedContextDependentFragmentBoundary,
             saturatedCompletionBoundary,
             licensedContextOpinionStanceFrame,
          PATCH
          echo '78929c068fca1535bf9f845d6530a69ec040e37d77aec109b1ad7e31b48e88b3  /tmp/aa61-supp.patch' | sha256sum -c -
          git apply --check /tmp/aa61-supp.patch
          git apply /tmp/aa61-supp.patch
          cat > /tmp/aa61-testfix.patch <<'PATCH'
          --- a/tests/constructions/ExperientialQuestion.json
          +++ b/tests/constructions/ExperientialQuestion.json
          @@ -35,15 +35,17 @@
               },
               {
                 "case_id": "AA61-R1-01",
          -      "source": "你食過醉雞未呀？",
          -      "class": "source_linked_overt_object_and_particle_positive",
          -      "expected_profile": "ExperientialQuestion present for overt typed experiential object + final 未 + 呀",
          +      "source": "你飲過茶未呀？",
          +      "class": "controlled_source_backed_object_plus_particle_positive",
          +      "expected_profile": "ExperientialQuestion present for an overt typed experiential object + final 未 + optional 呀; the object frame and particle position are independently source-backed in the AA61 inventory.",
                 "assertion": "construction_present",
                 "provenance": "docs/research/ISSUE-617-GWO-FINAL-MEI-SOURCE-INVENTORY-R1.md#full-overt-object-experiential-question",
                 "source_ids": [
          -        "SRC-MATTHEWS-YIP-2011-ASPECT-MULTIMEDIA"
          +        "SRC-ZHANG-1970-PREDICATIVE-SUFFIXES",
          +        "SRC-MATTHEWS-YIP-2011-ASPECT-MULTIMEDIA",
          +        "SRC-CUHK-ILC-EXP-FINAL-MEI"
                 ],
          -      "source_locator": "Chapter 11, section 11.2.5"
          +      "source_locator": "controlled contrast combining source-backed 飲過茶未 with independently attested optional final 呀 position"
               },
               {
                 "case_id": "AA61-R1-02",
          PATCH
          echo '8d4832ecc1aa40b3b33ee7783d3fe1857cac16ed85ced32a4a6c4d3688700220  /tmp/aa61-testfix.patch' | sha256sum -c -
          git apply --check /tmp/aa61-testfix.patch
          git apply /tmp/aa61-testfix.patch
      - name: Regenerate controlled metadata and runtime
        run: |
          node tools/build-construction-tests.js
          node tools/sync-construction-test-metadata.js
          npm run discovery:generate
          npm run build:runtime
      - name: Focused AA61 verification
        run: |
          node tests/run-constructions.js
          node --test tests/tooling/runtime/aa61-experiential-question-boundary.test.js
          npm run test:parser-architecture
          npm run verify:runtime
      - name: Full repository verification
        run: npm test
      - name: Stage bounded AA61 outputs
        run: |
          git add \
            docs/current/PROJECT-STATE.md \
            package.json package-lock.json \
            src/runtime-resources/grammar/templates/construction-templates.js \
            src/parser/templates/template-matcher.js \
            src/parser/detectors/questions/completion-experiential.js \
            src/parser/context/licensed-fragments.js \
            src/parser/context/apply-context-contract.js \
            src/plugin-entry.js \
            tests/constructions/ExperientialQuestion.json \
            tests/tooling/runtime/aa61-experiential-question-boundary.test.js \
            tests/run-all.js \
            tests/construction-test-index.json \
            grammar/research_pending/ExperientialQuestion.md \
            data/construction-candidate-readiness.json \
            main.js
          git rm .github/workflows/aa61-probe-temp.yml
          git diff --cached --check
          git diff --cached > /tmp/aa61-final.patch
          git status --short > /tmp/aa61-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aa61-final-verification
          path: |
            /tmp/aa61-final.patch
            /tmp/aa61-status.txt
            validation/current/construction-tests.json
          retention-days: 7
      - name: Commit verified AA61 implementation
        run: |
          git config user.name "Canto Span ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Implement AA61 typed V過未 boundaries"
          git push origin HEAD:agent/aa61-gwo-final-mei-boundaries
