name: AB35 adjudication apply temporary

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 758 && github.event.pull_request.head.ref == 'agent/ab35-identity-narrowing' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab35-identity-narrowing
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Apply accepted note consequence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "20e9822d511bb7ad5c48edadd525acfc6ab9fc35"
          python3 <<'PY'
          from pathlib import Path
          p=Path('grammar/research_pending/ProductiveVO.md')
          text=p.read_text()
          assert text.count('source_scope_matches_claim: false') == 1
          text=text.replace('source_scope_matches_claim: false','source_scope_matches_claim: true',1)
          old='''# ProductiveVO\n\n## Plain-language claim\n\nThe legacy `ProductiveVO` runtime family is **not currently supported as one Cantonese construction**. Source-backed ordinary transitive V–NP syntax must be distinguished from lexical/separable verb–object compounds, and developmental GACS “productivity” must not be treated as parser ontology.\n\nCantonese does independently have both ordinary transitive VPs and a lexical V–O-compound domain. The current runtime whitelist mixes those domains with unresolved conventionalized activity expressions. Exact item membership and compound diagnostics are lexical/pattern-specific rather than licensed by a generic productive V+noun rule.\n'''
          new='''# ProductiveVO\n\n## Canonical identity and runtime compatibility\n\n- Permanent identity: **AB35 `VerbObjectCompound`**.\n- Permanent UUID: `1dcefdcf-a978-5cf5-8045-26db1d6f5c1a`.\n- Legacy runtime label and note path: `ProductiveVO`.\n- Accepted profile: `LexicallyRestrictedVerbObjectCompoundPredicate`.\n- Runtime migration: **pending**; the current 43-entry legacy whitelist remains broader than the canonical linguistic identity.\n- Ordinary transparent V–NP behavior belongs to the separately adjudicated AB78 domain where independently justified.\n\n## Plain-language claim\n\nAB35 represents the independently supported Cantonese lexical verb–object-compound domain. Membership is lexical and item-specific: V–O surface order alone does not establish compound identity, unrestricted productivity, separability, or an ordinary semantic object relation between the visible components.\n\nThe current `ProductiveVO` runtime compatibility list is broader than this canonical claim and still mixes source-backed compounds with ordinary V–NP and unresolved activity expressions. Runtime behavior therefore remains intentionally unreconciled pending the separately specified migration.\n'''
          assert old in text
          text=text.replace(old,new,1)
          text=text.replace('- Current action: `mixed_legacy_family_requires_rehoming_before_any_retained_runtime_identity`','- Current action: `canonical_identity_narrowed_runtime_migration_pending`',1)
          text=text.replace('- Behavior/source disposition: `MIXED_LEGACY_FAMILY_REQUIRES_REHOMING`','- Behavior/source disposition: `NARROW_VERB_OBJECT_COMPOUND_IDENTITY_ACCEPTED_RUNTIME_BROADER`',1)
          start=text.index('## Open questions and blockers\n')
          end=text.index('\n## Related constructions\n', start)
          replacement='''## Open questions and blockers\n\n- Migrate the broad legacy `ProductiveVO` whitelist without turning all 43 historical entries into `VerbObjectCompound` positives.\n- Implement the initial source-linked current-whitelist compound seed only for `飲茶`, `游水`, and `沖涼`; `讀書` remains a source-backed research example until runtime lexicon expansion is separately authorized.\n- Preserve visible compound components without deriving an ordinary semantic `object` role merely from their V–O order.\n- Rehome directly supported ordinary V–NP material such as `做功課` through AB78 in a separate runtime task.\n- Resolve `煮嘢食`, `下棋`, and `做運動` independently before removing legacy compatibility behavior that still covers them.\n- Keep `食飯`, `打電話`, `打籃球`, and other conventionalized activity candidates unresolved until item-specific evidence settles their analysis.\n- Complete corpus, role-neutral panel, negative-boundary, and held-out gates before any linguistic promotion.\n'''
          text=text[:start]+replacement+text[end:]
          p.write_text(text)
          PY
      - name: Apply adjudication and regenerate canonical projections
        shell: bash
        run: |
          set -euo pipefail
          CANTO_SPAN_IDENTITY_LOCK_DATE=2026-08-10 npm run adjudication:apply
          CANTO_SPAN_IDENTITY_LOCK_DATE=2026-08-10 npm run identity:generate
          npm run discovery:generate
      - name: Synchronize PROJECT-STATE derived counts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          identities=json.loads(Path('data/construction-identities.json').read_text())
          readiness=json.loads(Path('data/construction-candidate-readiness.json').read_text())
          records=identities['records']
          adjudicated=sum(1 for r in records if r.get('label_review',{}).get('review_state')=='complete')
          pending=len(records)-adjudicated
          batch_files=len(list(Path('data/construction-adjudication-batches').glob('*.json')))
          accepted_batches=batch_files+1
          assert adjudicated==94,(adjudicated,pending)
          assert pending==88,(adjudicated,pending)
          assert accepted_batches==21,accepted_batches
          ab35=[r for r in records if r.get('construction_code')=='AB35']
          assert len(ab35)==1
          row=ab35[0]
          assert row['construction_uuid']=='1dcefdcf-a978-5cf5-8045-26db1d6f5c1a'
          assert row['canonical_name']=='VerbObjectCompound'
          assert row['profile_name']=='LexicallyRestrictedVerbObjectCompoundPredicate'
          assert row['family_name']=='LexicalCompounding'
          assert row['linguistic_status']=='research_pending'
          assert 'ProductiveVO' in row.get('legacy_labels',[])
          assert 'ProductiveVO' in row.get('former_names',[])
          rr=[r for r in readiness['records'] if r.get('construction_code')=='AB35']
          assert len(rr)==1
          assert rr[0]['gates']['source_scope_matches_claim']['status']=='pass',rr[0]['gates']['source_scope_matches_claim']
          assert rr[0]['candidate_state']=='source_supported',rr[0]['candidate_state']
          counts=readiness['state_counts']
          p=Path('docs/current/PROJECT-STATE.md')
          text=p.read_text()
          text=text.replace('| Expert-adjudicated UUIDs | 93 |',f'| Expert-adjudicated UUIDs | {adjudicated} |',1)
          text=text.replace('| Pending UUID adjudications | 89 |',f'| Pending UUID adjudications | {pending} |',1)
          text=text.replace('| Accepted adjudication batches | 20 |',f'| Accepted adjudication batches | {accepted_batches} |',1)
          text=text.replace('Twenty accepted batches have adjudicated 93 records; 89 remain pending.','Twenty-one accepted batches have adjudicated 94 records; 88 remain pending.',1)
          text=text.replace('| `narrowing_candidate` | 31 |',f"| `narrowing_candidate` | {counts['narrowing_candidate']} |",1)
          text=text.replace('| `source_supported` | 59 |',f"| `source_supported` | {counts['source_supported']} |",1)
          anchor='Current consequences include:\n\n'
          bullet='- `AB35 VerbObjectCompound` is canonical for the legacy runtime note `ProductiveVO`; the same UUID/code is retained as a source-bounded lexical V–O-compound narrowing, while the broader 43-entry runtime compatibility whitelist remains unreconciled pending a separate migration;\n'
          assert text.count(anchor)==1
          if bullet not in text:
            text=text.replace(anchor,anchor+bullet,1)
          p.write_text(text)
          print(json.dumps({'adjudicated':adjudicated,'pending':pending,'accepted_batches':accepted_batches,'discovery_counts':counts,'ab35_state':rr[0]['candidate_state']},ensure_ascii=False,indent=2))
          PY
      - name: Verify coherent identity-only state
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:adjudications
          npm run verify:identities
          npm run verify:discovery
          npm run verify
          npm run verify:research
          git diff --exit-code origin/main -- src main.js package.json package-lock.json manifest.json tests
      - name: Commit final state and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- validation/current 2>/dev/null || true
          git clean -fd validation/current || true
          rm -f .github/workflows/ab35-adjudication-inspect-temp.yml
          rm -f .github/workflows/ab35-adjudication-apply-temp.yml
          python3 <<'PY'
          import subprocess
          allowed={
            'data/construction-adjudication-batches/batch-21.json',
            'data/construction-identities.json',
            'data/construction-label-sweep.json',
            'data/construction-identity-lock.json',
            'data/construction-candidate-readiness.json',
            'docs/research/FULL-REPO-LABEL-SWEEP-BASELINE-R1.md',
            'docs/research/SUPPORTED-PRODUCTIVE-CANDIDATES.md',
            'docs/research/ORPHANED-CONSTRUCTION-EVIDENCE.md',
            'docs/research/CONSTRUCTION-FAMILY-GAPS.md',
            'docs/research/FULL-REPO-SUPPORTED-PRODUCTIVE-SWEEP-R1.md',
            'grammar/research_pending/ProductiveVO.md',
            'docs/current/PROJECT-STATE.md',
            '.github/workflows/ab35-adjudication-inspect-temp.yml',
            '.github/workflows/ab35-adjudication-apply-temp.yml',
          }
          rows=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          got={row[3:] for row in rows if len(row)>=4}
          assert got <= allowed,(sorted(got),sorted(allowed))
          required={
            'data/construction-adjudication-batches/batch-21.json',
            'data/construction-identities.json',
            'data/construction-label-sweep.json',
            'grammar/research_pending/ProductiveVO.md',
            'docs/current/PROJECT-STATE.md',
          }
          assert required <= got,(sorted(required),sorted(got))
          PY
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply AB35 VerbObjectCompound adjudication"
          git push origin HEAD:agent/ab35-identity-narrowing
