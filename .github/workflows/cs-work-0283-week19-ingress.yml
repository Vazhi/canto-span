name: CS-WORK-0283 Week 19 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week19-corpus-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source package and modular crosswalk
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const {execFileSync} = require('child_process');
          const sourceId='GLOSSIKA-YUEHK-A1-W19-20260726';
          const root=`data/pedagogical-corpus/glossika/${sourceId}`;
          const meta=JSON.parse(fs.readFileSync('tools/tmp/cs-work-0283-week19-source-meta.json','utf8'));
          const records=[0,1,2].flatMap(i=>JSON.parse(fs.readFileSync(`tools/tmp/cs-work-0283-week19-records-part0${i}.json`,'utf8')));
          if(records.length!==76) throw new Error(`Expected 76 records, found ${records.length}`);
          function stable(v){if(Array.isArray(v))return`[${v.map(stable).join(',')}]`;if(v&&typeof v==='object')return`{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${stable(v[k])}`).join(',')}}`;return JSON.stringify(v)}
          function sha(v){return crypto.createHash('sha256').update(v,'utf8').digest('hex')}
          function countBy(values){return Object.fromEntries([...values.reduce((m,v)=>m.set(v,(m.get(v)||0)+1),new Map())].sort(([a],[b])=>a.localeCompare(b)))}
          function normalize(v){return String(v||'').normalize('NFC').replace(/[\p{P}\p{S}\p{Z}\s]/gu,'')}
          function display(r){return r.itemType==='tone_paradigm_row'?r.source.tone:r.source.traditional}
          function unique(v){return[...new Set(v.filter(Boolean))].sort()}
          function tsv(v){return String(v??'').replace(/\t/g,' ').replace(/\r?\n/g,' ')}
          const expected={dialog_turn:4,grammar_entry:11,lexical_entry:51,sentence:4,tone_paradigm_row:6};
          const typeCounts=countBy(records.map(r=>r.itemType));
          if(stable(typeCounts)!==stable(expected))throw new Error(`Unexpected types ${JSON.stringify(typeCounts)}`);
          const payloadHash=`sha256:${sha(stable(records.map(r=>r.source)))}`;
          const items=records.map((r,i)=>({id:`${sourceId}-I${String(i+1).padStart(3,'0')}`,ordinal:i+1,section:r.section,subsection:r.subsection,itemType:r.itemType,...(r.register?{register:r.register}:{}),...(r.dialogTurn?{dialogTurn:r.dialogTurn}:{}),source:r.source,sourceHash:`sha256:${sha(stable(r.source))}`}));

          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const excluded=[root+'/', 'tools/tmp/cs-work-0283-week19-', '.github/workflows/cs-work-0283-week19-ingress.yml','main.js'];
          const searchable=[];
          for(const file of tracked){
            if(excluded.some(p=>file.startsWith(p))||!/^(src|tests|test-data|data|docs|grammar|config)\//.test(file))continue;
            let stat;try{stat=fs.statSync(file)}catch{continue}if(!stat.isFile()||stat.size>5_000_000)continue;
            let text;try{text=fs.readFileSync(file,'utf8')}catch{continue}searchable.push({file,text,normalized:normalize(text)});
          }
          const runtimeResources=searchable.filter(e=>e.file.startsWith('src/runtime-resources/'));
          const parserFiles=searchable.filter(e=>e.file.startsWith('src/parser/'));
          function structuredOwners(form){
            if(!form||form==='—')return[];
            const q=JSON.stringify(form);
            return runtimeResources.filter(e=>e.text.includes(`[${q},`)||e.text.includes(`${q}:`)||e.text.includes(`${q},`)||e.text.includes(` ${q}`)).map(e=>e.file);
          }
          function projectMatches(text){
            if(!text)return[];const folded=normalize(text);
            return unique(searchable.filter(e=>!e.file.startsWith('src/')&&(e.text.includes(text)||(folded.length>=4&&e.normalized.includes(folded)))).map(e=>e.file));
          }
          function parserCandidates(item){
            const terms=[];const s=item.source;const text=s.traditional||'';
            if(item.subsection==='classifiers'||/[杯碗間]/u.test(text))terms.push('/np/','classifier');
            if(item.subsection==='function_words')terms.push('aspect/','coverbs/','relative-clauses/','complements/','motion/');
            if(item.subsection==='sentence_final_particles')terms.push('terminal/particles','questions/','discourse/');
            if(item.subsection==='spatial_directional')terms.push('motion/','coverbs/','locative','spatial');
            if(item.itemType==='sentence'||item.itemType==='dialog_turn')terms.push('/np/','questions/','aspect/','transfer/','clause-relations/','terminal/particles');
            return unique(parserFiles.filter(e=>terms.some(t=>e.file.includes(t))).map(e=>e.file));
          }
          function discrepancies(item){
            const d=display(item),out=[];
            if(d==='架')out.push({type:'pronunciation_discrepancy_candidate',status:'requires_independent_verification',sourceValue:'gaa2',note:'The intake explicitly flags this reading; preserve it without runtime import or silent correction.'});
            if(item.subsection==='classifiers')out.push({type:'classifier_semantic_class_simplification',status:'route_to_issue_129',note:'The short source class is pedagogical and does not establish full noun compatibility, changed tone, or productivity.'});
            if(item.subsection==='function_words')out.push({type:'function_word_category_simplification',status:'route_to_issue_129',note:'The grouped forms have distinct attributive, locative, aspectual, lexical, directional, result, and extent profiles.'});
            if(item.subsection==='sentence_final_particles')out.push({type:'particle_function_simplification',status:'route_to_issue_129',note:'One short gloss does not establish tone-specific force, clause type, combinations, or discourse distribution.'});
            if(item.subsection==='spatial_directional')out.push({type:'spatial_lexical_class_simplification',status:'route_to_issue_129',note:'Nouns, localizers, directions, route predicates, orientation markers, and adverbials require separate classes.'});
            if(item.subsection==='transport_places')out.push({type:'regional_lexical_review',status:'route_to_issue_129',note:'Reading, register, Hong Kong usage, compositionality, and overlap require independent review.'});
            if(item.subsection==='numbers')out.push({type:'compositional_numeral',status:'no_opaque_ingress',note:'Retain internal numeral composition and verify the source English values.'});
            if(d==='你去過日本未？')out.push({type:'aspect_question_boundary',status:'route_to_issue_129',note:'Experiential 過 plus final 未 must remain distinct from perfective, negative experiential, and A-not-A profiles.'});
            if(d==='我要一杯。佢呢？')out.push({type:'nominal_ellipsis_and_continuation',status:'route_to_issue_129',note:'Classifier phrase ellipsis and 呢-marked continuation require context-sensitive analysis.'});
            if(d==='佢唔飲咖啡嘅，畀碗湯佢啦。')out.push({type:'dative_clause_final_ge3_particle',status:'route_to_issue_129',note:'Theme-recipient order, clause-final 嘅, and final 啦 remain separate research questions.'});
            if(d==='好，一杯咖啡，一碗湯。')out.push({type:'parallel_nominal_fragment',status:'route_to_issue_129',note:'Parallel classifier phrases and fragment licensing require contextual analysis.'});
            if(item.itemType==='tone_paradigm_row'){
              out.push({type:'tone_drill_material',status:'requires_independent_verification',note:'Characters, readings, lexical suitability, register, and tone labels remain provisional pronunciation material.'});
              if(String(item.source.saam).endsWith('—'))out.push({type:'incomplete_tone_paradigm_cell',status:'source_incomplete',note:'The saam- column is blank for this tone.'});
            }
            return out;
          }
          const crosswalkRecords=items.map(item=>{
            const d=display(item);
            const forms=item.itemType==='tone_paradigm_row'?[item.source.si,item.source.saam,item.source.fu,item.source.fan].map(x=>String(x).match(/[\u3400-\u9fff㗎嘅喺咗緊嘞囉]+/u)?.[0]).filter(Boolean):[item.source.traditional];
            const owners=unique(forms.flatMap(structuredOwners));
            const matches=item.itemType==='sentence'||item.itemType==='dialog_turn'?projectMatches(item.source.traditional):[];
            const compositional=item.subsection==='numbers';
            const incomplete=item.itemType==='tone_paradigm_row'&&String(item.source.saam).endsWith('—');
            let classification='new_attestation';
            if(incomplete)classification='source_incomplete';
            else if(compositional)classification='compositional_numeral';
            else if(owners.length)classification='existing_modular_entry';
            else if(matches.length)classification='partial_match';
            return {sourceItemId:item.id,sourceHash:item.sourceHash,sourceDisplay:d,classification,compositionalNumeral:compositional,canonicalRuntimeResourceOwners:owners,canonicalParserOwnerCandidates:parserCandidates(item),exactOrNormalizedProjectMatchPaths:matches,sourceDiscrepancies:discrepancies(item),evidenceBoundary:'Source attestation, repository occurrence, tests, and runtime coverage do not establish classifier productivity, particle force, construction identity, register, or linguistic status.'};
          });
          const classCounts=countBy(crosswalkRecords.map(r=>r.classification));
          const discrepancyCounts=countBy(crosswalkRecords.flatMap(r=>r.sourceDiscrepancies.map(d=>d.type)));
          const source={schema:'canto-span-pedagogical-corpus-source-v1',source:meta.source,ingress:{...meta.ingress,recordCount:items.length,itemTypeCounts:typeCounts,sectionCounts:countBy(records.map(r=>r.section)),sourcePayloadHash:payloadHash,sourcePayloadHashPolicy:'SHA-256 of canonical key-sorted JSON for the ordered source-field array.'},sourceClaims:meta.sourceClaims,items};
          const crosswalk={schema:'canto-span-pedagogical-corpus-crosswalk-v1',sourceId,sourcePayloadHash:payloadHash,architecture:{canonicalRuntimeInputs:['src/**','src/runtime-resources/**'],generatedBundle:'main.js',generatedBundleExcludedFromOwnership:true},summary:{recordCount:76,classificationCounts:classCounts,discrepancyCounts,incompleteToneCells:5,compositionalNumeralCount:10},records:crosswalkRecords};
          const review={schema:'canto-span-pedagogical-corpus-review-v1',sourceId,sourcePayloadHash:payloadHash,policy:{sourceLayer:'source.json is immutable.',modularRuntimeLayer:'Only src/** and src/runtime-resources/** are canonical runtime owners; main.js is generated and excluded.',deduplication:'Existing matches prevent duplicate ingress but do not overwrite source values.',evidenceBoundary:'Pedagogical attestation does not establish classifier classes, particle force, productivity, naturalness, register, or status.'},summary:{recordCount:76,reviewedCount:0,unreviewedCount:76,classificationCounts:classCounts,discrepancyCounts,incompleteToneCells:5,knownSourceAlerts:[{scope:'classifiers',type:'架_reading',status:'requires_independent_verification',note:'Source gives gaa2 and must not be silently imported.'},{scope:'lesson_grouping',type:'category_simplification',status:'route_to_issue_129',note:'Classifiers, aspect, particles, spatial expressions, and lexical items are not one function-word class.'},{scope:'tone_drill',type:'incomplete_paradigm',status:'source_incomplete',note:'Five saam- cells are blank.'}]},records:crosswalkRecords.map(r=>({id:r.sourceItemId,sourceHash:r.sourceHash,normalizedCantonese:normalize(r.sourceDisplay),ingressClassification:r.classification,canonicalRuntimeResourceOwners:r.canonicalRuntimeResourceOwners,canonicalParserOwnerCandidates:r.canonicalParserOwnerCandidates,exactOrNormalizedProjectMatchPaths:r.exactOrNormalizedProjectMatchPaths,sourceDiscrepancies:r.sourceDiscrepancies,reviewedValues:{},reviewerNote:'',evidenceUse:'not_authorized'}))};
          fs.mkdirSync(root,{recursive:true});fs.mkdirSync('docs/research',{recursive:true});
          fs.writeFileSync(`${root}/source.json`,JSON.stringify(source,null,2)+'\n');fs.writeFileSync(`${root}/crosswalk.json`,JSON.stringify(crosswalk,null,2)+'\n');fs.writeFileSync(`${root}/review.json`,JSON.stringify(review,null,2)+'\n');
          const header=['id','ordinal','section','subsection','item_type','register','source_display','source_hash','classification','runtime_resource_owners','parser_owner_candidates','project_match_paths','source_discrepancies_json','review_state'];
          const lines=items.map((item,i)=>{const r=crosswalkRecords[i];return[item.id,item.ordinal,item.section,item.subsection,item.itemType,item.register||'',display(item),item.sourceHash,r.classification,r.canonicalRuntimeResourceOwners.join('|'),r.canonicalParserOwnerCandidates.join('|'),r.exactOrNormalizedProjectMatchPaths.join('|'),JSON.stringify(r.sourceDiscrepancies),meta.ingress.reviewState].map(tsv).join('\t')});
          fs.writeFileSync(`${root}/items.tsv`,[header.join('\t'),...lines].join('\n')+'\n');
          fs.writeFileSync(`${root}/README.md`,`# Glossika Cantonese (HK) A1 Week 19 corpus package\n\n- Source ID: \`${sourceId}\`\n- Lesson: Classifiers / Function Words\n- Source date: 2026-07-26\n- Gmail message: \`19f9d2f815d88e21\`\n- Intake issue: #136\n- Work claim: #283\n- Source records: 76\n- Source payload hash: \`${payloadHash}\`\n\n## Source structure\n\n- 14 classifiers\n- 6 source-labeled function words\n- 5 sentence-final particles\n- 23 spatial/directional entries\n- 4 transport/place entries\n- 10 numerals\n- 4 situation sentences and 4 dialog turns\n- 6 four-column tone-paradigm rows\n\n## Boundary\n\nThe source reading \`架 gaa2\` and five missing \`saam-\` tone cells are preserved. Grammar questions route to #129. Canonical runtime ownership resolves only to modular source files; generated \`main.js\` is excluded and unchanged.\n`);
          fs.writeFileSync('docs/research/GLOSSIKA-YUEHK-A1-W19-20260726-CORPUS-INGRESS.md',`# Glossika Week 19 corpus ingress\n\n- Source ID: \`${sourceId}\`\n- Intake: #136\n- Work claim: #283\n- Related research: #129\n- Status: source-preserving ingress complete; expert research remains open\n\n## Result\n\n- 76 source records preserved in lesson order.\n- Classifications: \`${JSON.stringify(classCounts)}\`.\n- Discrepancies: \`${JSON.stringify(discrepancyCounts)}\`.\n- Ten billion-level rows remain compositional.\n- The source reading \`架 gaa2\` is flagged without correction.\n- Five missing \`saam-\` tone cells remain explicit source gaps.\n\n## Stop boundary\n\nNo parser, runtime lexicon, generated bundle, classifier compatibility, particle force, construction identity/status, corpus classification, survey, version, release, or deployment state changed.\n`);
          console.log({payloadHash,typeCounts,classCounts,discrepancyCounts});
          NODE
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W19-20260726';
          const source=require(`./${root}/source.json`),cross=require(`./${root}/crosswalk.json`),review=require(`./${root}/review.json`);
          const expected={dialog_turn:4,grammar_entry:11,lexical_entry:51,sentence:4,tone_paradigm_row:6};
          if(source.items.length!==76)throw new Error('Expected 76 records');
          if(JSON.stringify(source.ingress.itemTypeCounts)!==JSON.stringify(expected))throw new Error('Type counts mismatch');
          if(cross.records.length!==76||review.records.length!==76)throw new Error('Alignment count mismatch');
          if(cross.summary.incompleteToneCells!==5||cross.summary.compositionalNumeralCount!==10)throw new Error('Tone/numeral summary mismatch');
          const gaa=cross.records.find(r=>r.sourceDisplay==='架');if(!gaa||!gaa.sourceDiscrepancies.some(d=>d.type==='pronunciation_discrepancy_candidate'))throw new Error('架 gaa2 flag missing');
          if(cross.records.flatMap(r=>[...r.canonicalRuntimeResourceOwners,...r.canonicalParserOwnerCandidates]).some(p=>p==='main.js'||p.endsWith('/main.js')))throw new Error('main.js ownership leak');
          if(fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n').length!==77)throw new Error('TSV row count mismatch');
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit final package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W19-20260726 docs/research/GLOSSIKA-YUEHK-A1-W19-20260726-CORPUS-INGRESS.md
          git rm tools/tmp/cs-work-0283-week19-source-meta.json tools/tmp/cs-work-0283-week19-records-part00.json tools/tmp/cs-work-0283-week19-records-part01.json tools/tmp/cs-work-0283-week19-records-part02.json
          git commit -m "Add Glossika Week 19 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
