name: Temporary 有冇得 repository inspection

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/jau-mou-dak-inspect-temp.yml
      - review-packets/corpus-review/JAU-MOU-DAK/**

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Locate corpus and implementation files
        run: |
          echo '=== candidate corpus/workbench files ==='
          find . -type f \( -iname '*hkcancor*' -o -iname '*.cha' -o -iname '*construction*registry*' -o -iname 'main.js' \) | sort | sed -n '1,240p'
          echo '=== exact surface matches ==='
          grep -RIn --exclude-dir=.git -E '有冇得|冇得|有得' . | sed -n '1,320p' || true
          echo '=== ASCII identity/runtime candidates ==='
          grep -RIn --exclude-dir=.git -E 'Opportunity|Availability|Acceptability|ANotA|ExistentialQuestion|ModalANotA|Jau|Mou|Dak' data grammar tests test-data docs main.js 2>/dev/null | sed -n '1,360p' || true

      - name: Show repository roots
        run: |
          echo '=== top-level ==='
          find . -maxdepth 2 -type f | sort | sed -n '1,240p'
