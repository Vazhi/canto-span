name: Temporary top-2000 lexical R4

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/top-2000-lexical-r4-temp.yml

permissions:
  contents: write

jobs:
  r4:
    if: github.event.pull_request.head.ref == 'agent/top-2000-lexical-coverage-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/top-2000-lexical-coverage-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download pinned Cifu source
        run: curl -fL --retry 3 https://raw.githubusercontent.com/gwinterstein/Cifu/8d5e4903e419193f903823880a7815712072cc80/Lexicon/Cifu-v1.txt -o /tmp/Cifu-v1.txt

      - name: Apply R4 nominal lexical additions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          additions = {
            'src/runtime-resources/lexicon/token-lexicon/places-and-times.js': [
              ('灣', 'where', 'waan1', 'place_or_goal natural_place_np', 'bay / gulf'),
              ('室', 'where', 'sat1', 'place_or_goal room_np', 'room'),
              ('樂園', 'where', 'lok6 jyun4', 'place_or_goal place_np', 'paradise / pleasure park'),
              ('林', 'where', 'lam4', 'place_or_goal natural_place_np', 'woods / forest'),
              ('東方', 'where', 'dung1 fong1', 'direction_np cardinal_region', 'the East / eastern region'),
              ('貨倉', 'where', 'fo3 cong1', 'place_or_goal place_np', 'warehouse'),
              ('店', 'where', 'dim3', 'place_or_goal place_np', 'shop / store / inn'),
              ('北', 'where', 'bak1', 'direction_np cardinal_direction', 'north'),
              ('外國', 'where', 'ngoi6 gwok3', 'place_or_goal geopolitical_place_np', 'foreign country'),
              ('莊', 'where', 'zong1', 'place_or_goal settlement_or_estate_np', 'farmstead / village / manor'),
            ],
            'src/runtime-resources/lexicon/token-lexicon/things.js': [
              ('虛線', 'what', 'heoi1 sin3', 'object_np visual_line_np', 'dotted line'),
              ('自由', 'what', 'zi6 jau4', 'abstract_np concept_np', 'freedom / liberty'),
              ('直線', 'what', 'zik6 sin3', 'object_np visual_line_np', 'straight line'),
              ('性', 'what', 'sing3', 'abstract_np property_np', 'nature / property / sex'),
              ('關係', 'what', 'gwaan1 hai6', 'abstract_np relation_np', 'relation / relationship'),
              ('生活', 'what', 'sang1 wut6', 'abstract_np life_np', 'life / livelihood'),
              ('法', 'what', 'faat3', 'abstract_np method_or_law_np', 'law / method / way'),
              ('方法', 'what', 'fong1 faat3', 'abstract_np method_np', 'method / way / means'),
              ('圖案', 'what', 'tou4 on3', 'object_np visual_object_np', 'design / pattern'),
              ('尾', 'what', 'mei5', 'object_np body_part_np', 'tail / end'),
              ('意見', 'what', 'ji3 gin3', 'abstract_np opinion_np', 'opinion / suggestion'),
              ('圖片', 'what', 'tou4 pin3', 'object_np visual_object_np', 'image / picture / photograph'),
              ('辦法', 'what', 'baan6 faat3', 'abstract_np method_np', 'means / method / way'),
              ('財政', 'what', 'coi4 zing3', 'abstract_np domain_np', 'public finance / finances'),
              ('碑', 'what', 'bei1', 'object_np monument_np', 'monument / stone tablet'),
              ('距離', 'what', 'keoi5 lei4', 'abstract_np distance_np', 'distance'),
              ('概念', 'what', 'koi3 nim6', 'abstract_np concept_np', 'concept / idea'),
              ('人權', 'what', 'jan4 kyun4', 'abstract_np rights_np', 'human rights'),
              ('考試', 'what', 'haau2 si3', 'event_np assessment_np', 'exam'),
              ('杏', 'what', 'hang6', 'object_np food_or_plant_np', 'apricot'),
              ('格', 'what', 'gaak3', 'abstract_or_object_np pattern_np', 'frame / style / pattern'),
              ('團', 'what', 'tyun4', 'collective_np object_np', 'group / society / regiment'),
              ('頭', 'what', 'tau4', 'object_np body_part_np', 'head'),
              ('意', 'what', 'ji3', 'abstract_np idea_or_intention_np', 'idea / meaning / intention'),
            ],
            'src/runtime-resources/lexicon/token-lexicon/places-and-times.js#temporal': [
              ('將來', 'when', 'zoeng1 loi4', 'temporal_adjunct future_time_np', 'the future'),
            ],
          }

          # Fold the temporal pseudo-key into the real module without duplicating mutation logic.
          additions['src/runtime-resources/lexicon/token-lexicon/places-and-times.js'] += additions.pop('src/runtime-resources/lexicon/token-lexicon/places-and-times.js#temporal')

          added = 0
          for rel, entries in additions.items():
              p = Path(rel)
              text = p.read_text()
              lines = []
              for form, label, jyutping, syntax, gloss in entries:
                  if f'["{form}",' in text:
                      continue
                  meta = {'label': label, 'jyutping': jyutping, 'syntax': syntax, 'note': f'{gloss}; Cifu spoken top-2000 R4 lexical audit.'}
                  lines.append('  [' + json.dumps(form, ensure_ascii=False) + ', ' + json.dumps(meta, ensure_ascii=False, separators=(',', ':')) + '],')
                  added += 1
              if lines:
                  text = text.rsplit('\n];', 1)[0] + '\n\n  // v0.5.227: Cifu spoken top-2000 R4 nominal lexical coverage.\n' + '\n'.join(lines) + '\n];\n'
                  p.write_text(text)

          if added != 35:
              raise SystemExit(f'expected 35 R4 additions, added {added}')

          p = Path('manifest.json')
          obj = json.loads(p.read_text())
          obj['description'] = 'v0.5.227 adds 140 source-audited high-frequency Cantonese lexical entries from the Cifu spoken top-2000 audit without broadening grammar.'
          p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n')
          p = Path('src/plugin-entry.js')
          p.write_text(p.read_text().replace('adds 105 source-audited high-frequency lexical entries', 'adds 140 source-audited high-frequency lexical entries'))
          p = Path('docs/current/PROJECT-STATE.md')
          p.write_text(p.read_text().replace('adds 105 independently supported high-frequency lexical entries', 'adds 140 independently supported high-frequency lexical entries'))
          PY

      - name: Regenerate audit and R4 report
        run: |
          cp docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md /tmp/R1.md
          cp docs/research/LEXICAL-COVERAGE-TOP-2000-R2.md /tmp/R2.md
          cp docs/research/LEXICAL-COVERAGE-TOP-2000-R3.md /tmp/R3.md
          node tools/lexical-coverage/top-2000-audit.mjs --source=/tmp/Cifu-v1.txt
          cp /tmp/R1.md docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md
          cp /tmp/R2.md docs/research/LEXICAL-COVERAGE-TOP-2000-R2.md
          cp /tmp/R3.md docs/research/LEXICAL-COVERAGE-TOP-2000-R3.md
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import csv

          rows = list(csv.DictReader(Path('data/lexical-frequency/cifu-spoken-top-2000.tsv').open(), delimiter='\t'))
          counts = Counter(row['runtime_status'] for row in rows)
          r4 = ['虛線','將來','灣','室','樂園','自由','直線','性','林','東方','貨倉','關係','生活','法','方法','店','圖案','尾','意見','圖片','辦法','北','外國','財政','碑','距離','概念','人權','考試','杏','格','團','莊','頭','意']
          missing = [row for row in rows if row['runtime_status'] == 'missing'][:160]
          out = [
              '# Top-2000 spoken Cantonese lexical coverage audit — R4', '',
              '## Scope', '',
              'R4 continues the conservative nominal-first expansion with 35 additional nouns, place nouns, nominal concepts, and one temporal noun (`將來`). Predicate-sensitive and particle-like forms remain outside the batch.', '',
              '## Current coverage after cumulative R1–R4 additions', ''
          ]
          for key in ['covered_main','covered_variant','handled_structurally','surface_covered_sense_uncertain','missing','manual_review']:
              out.append(f'- `{key}`: **{counts.get(key, 0)}**')
          out += ['', '## R4 same-task lexical additions (35)', ''] + [f'- `{x}`' for x in r4]
          out += ['', '## Highest-frequency remaining lexical-gap candidates', '', '| Rank | Form | Count | Jyutping | Cifu definition |', '|---:|---|---:|---|---|']
          for row in missing:
              out.append(f"| {row['rank']} | {row['word']} | {row['cifu_spoken_adult']} | {row['cifu_jyutping']} | {row['cifu_definition'].replace('|','\\|')} |")
          out += ['', '## Interpretation', '', 'The audit still separates lexical opportunity from grammatical authorization. Remaining particles, result/directional material, highly polyfunctional predicates, spelling variants, and generated corpus strings remain unresolved unless they can be added without changing protected parser behavior.', '']
          Path('docs/research/LEXICAL-COVERAGE-TOP-2000-R4.md').write_text('\n'.join(out))
          print(dict(counts))
          PY

      - name: Build and verify R4 runtime state
        run: |
          npm run build:runtime
          npm test
          npm run verify:runtime-build
          npm run verify
          npm run verify:runtime
          npm run verify:research
          git diff --check

      - name: Commit verified R4 changes
        run: |
          git config user.name 'Canto Span scoped automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data/lexical-frequency/cifu-spoken-top-2000.tsv \
            docs/research/LEXICAL-COVERAGE-TOP-2000-R4.md \
            src/runtime-resources/lexicon/token-lexicon/places-and-times.js \
            src/runtime-resources/lexicon/token-lexicon/things.js \
            src/plugin-entry.js manifest.json docs/current/PROJECT-STATE.md main.js
          git diff --cached --quiet && { echo 'No verified R4 changes to commit'; exit 0; }
          git commit -m 'Fill additional nominal top-2000 lexical gaps'
          git push origin HEAD:agent/top-2000-lexical-coverage-audit
