name: Write Week 14 expert review

on:
  pull_request:
    paths:
      - ".github/workflows/write-week14-expert-review.yml"

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week14-ingress-review
          fetch-depth: 0
      - name: Write terminal record review and remove temporary views
        run: |
          python3 - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          package = Path('data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621')
          source = json.loads((package / 'source.json').read_text(encoding='utf-8'))
          crossref = json.loads((package / 'mechanical-cross-reference-r1.json').read_text(encoding='utf-8'))
          source_by_id = {item['id']: item for item in source['items']}
          crossref_by_id = {item['id']: item for item in crossref['records']}

          exact_duplicates = {
              'GLOSSIKA-YUEHK-A1-W14-20260621-I011',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I013',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I022',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I038',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I043',
          }
          pronunciation_discrepancies = {
              'GLOSSIKA-YUEHK-A1-W14-20260621-I001': {
                  'field': 'source.jyutping',
                  'issue': 'Later Week 14 research flags the source-final si1 reading in 唔好意思 for independent lexical verification.',
                  'status': 'conflict_detected_no_replacement_accepted',
              },
              'GLOSSIKA-YUEHK-A1-W14-20260621-I057': {
                  'field': 'phonicsPair.b.ipa',
                  'issue': 'The source labels 聲 seng1 as the short-/ɐ/ member but gives IPA /sɐŋ/, which does not align with the supplied Jyutping vowel.',
                  'status': 'internal_source_mismatch_no_replacement_accepted',
              },
          }
          translation_discrepancies = {
              'GLOSSIKA-YUEHK-A1-W14-20260621-I015': {
                  'field': 'source.english',
                  'issue': 'The gloss “to get paid” is perspective-bound and later research requires broader lexical verification before reuse.',
                  'status': 'scope_alert_no_replacement_accepted',
              },
              'GLOSSIKA-YUEHK-A1-W14-20260621-I017': {
                  'field': 'source.english',
                  'issue': 'The parenthetical restriction “part-time” is narrower than the later Week 14 research disposition supports.',
                  'status': 'scope_alert_no_replacement_accepted',
              },
              'GLOSSIKA-YUEHK-A1-W14-20260621-I021': {
                  'field': 'source.english',
                  'issue': 'The gloss “to have a job interview” fixes one participant perspective and requires direct lexical verification.',
                  'status': 'perspective_alert_no_replacement_accepted',
              },
              'GLOSSIKA-YUEHK-A1-W14-20260621-I060': {
                  'field': 'phonicsPair.a.traditional_and_english',
                  'issue': 'The source pairs 翻 faan1 with the English gloss “to return”; orthographic and lexical-sense verification is required before learner-facing reuse.',
                  'status': 'lexical_gloss_alert_no_replacement_accepted',
              },
          }
          valid_phonics_attestations = {
              'GLOSSIKA-YUEHK-A1-W14-20260621-I054',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I055',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I056',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I058',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I059',
              'GLOSSIKA-YUEHK-A1-W14-20260621-I061',
          }

          def later_links(item_id):
              return crossref_by_id[item_id].get('later_research_links', [])

          def exact_targets(item_id):
              row = crossref_by_id[item_id]
              links = later_links(item_id)
              targets = []
              for link in links:
                  for owner in link.get('exact_runtime_owners', []):
                      targets.append({'path': owner, 'basis': 'accepted_later_runtime_owner'})
              if item_id.endswith('-I043'):
                  for candidate in row.get('exact_match_candidates', []):
                      if candidate.get('path') == 'data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628/source.json':
                          targets.append({'path': candidate['path'], 'basis': 'exact_independent_pedagogical_source'})
              seen = set()
              unique = []
              for target in targets:
                  key = (target['path'], target['basis'])
                  if key not in seen:
                      seen.add(key)
                      unique.append(target)
              return unique

          records = []
          for item in source['items']:
              item_id = item['id']
              item_type = item['itemType']
              links = later_links(item_id)
              classification = None
              duplicate_status = 'no_accepted_duplicate'
              discrepancy = None
              evidence_use = None
              note = None

              if item_id in exact_duplicates:
                  classification = 'exact_duplicate'
                  duplicate_status = 'accepted_exact_duplicate'
                  if item_id.endswith('-I043'):
                      evidence_use = 'duplicate_compositional_numeral_attestation'
                  else:
                      evidence_use = 'duplicate_pedagogical_attestation_no_new_runtime_owner'
                  note = 'A canonical runtime owner or independent exact pedagogical source already preserves the form; this source remains provenance only.'
              elif item_id in pronunciation_discrepancies:
                  classification = 'pronunciation_discrepancy'
                  discrepancy = pronunciation_discrepancies[item_id]
                  evidence_use = 'source_discrepancy_preserved_unresolved'
                  note = 'The source value is preserved unchanged. No corrected reading is asserted in this ingress review.'
              elif item_id in translation_discrepancies:
                  classification = 'translation_discrepancy'
                  discrepancy = translation_discrepancies[item_id]
                  evidence_use = 'source_discrepancy_preserved_unresolved'
                  note = 'The source wording is preserved unchanged. No replacement gloss or orthography is asserted in this ingress review.'
              elif item_id in valid_phonics_attestations:
                  classification = 'new_corpus_attestation'
                  evidence_use = 'pronunciation_candidate_not_adopted'
                  note = 'Retained as pedagogical pronunciation attestation only; direct lexical-source verification remains required before learner-facing adoption.'
              elif item_type == 'lexical_entry':
                  classification = 'lexical_only_attestation'
                  dispositions = [link.get('disposition') for link in links if link.get('kind') == 'lexical_ingress']
                  if 'compositional_numeral' in dispositions:
                      evidence_use = 'compositional_numeral_attestation_no_opaque_lexicon_entry'
                      note = 'Retained as compositional numeral evidence; no opaque whole-form lexicon entry is justified.'
                  elif 'candidate' in dispositions:
                      evidence_use = 'lexical_ingress_candidate_not_implemented'
                      note = 'Retained as lexical attestation and later ingress candidate; no runtime insertion or grammar inference occurs here.'
                  else:
                      evidence_use = 'pedagogical_lexical_attestation_only'
                      note = 'Retained as lexical attestation only; repository mentions are not accepted as duplicate ownership.'
              else:
                  classification = 'new_corpus_attestation'
                  if any(link.get('kind') == 'followup_candidate' for link in links):
                      evidence_use = 'pedagogical_attestation_plus_bounded_followup_research'
                      note = 'Retained as a source attestation and linked to bounded later research; it does not establish productivity, identity, or parser behavior.'
                  elif any(link.get('kind') == 'followup_non_candidate' for link in links):
                      evidence_use = 'pedagogical_attestation_no_separate_research_issue'
                      note = 'Retained as source attestation; later review found no separate admitted research issue for this cluster.'
                  else:
                      evidence_use = 'pedagogical_corpus_attestation_only'
                      note = 'Retained as source attestation only; no independent grammar or naturalness conclusion is drawn.'

              targets = exact_targets(item_id)
              if duplicate_status == 'accepted_exact_duplicate' and not targets:
                  raise AssertionError(f'accepted duplicate lacks target: {item_id}')
              if duplicate_status != 'accepted_exact_duplicate' and targets:
                  raise AssertionError(f'nonduplicate unexpectedly has accepted target: {item_id}')

              records.append({
                  'id': item_id,
                  'source_hash': item['sourceHash'],
                  'review_status': 'reviewed',
                  'reviewed_on': '2026-08-02',
                  'review_authority': 'project_expert_systematic_review',
                  'expert_duplicate_status': duplicate_status,
                  'accepted_duplicate_targets': targets,
                  'terminal_ingress_classification': classification,
                  'evidence_use_disposition': evidence_use,
                  'source_discrepancies': [] if discrepancy is None else [discrepancy],
                  'reviewed_values': {
                      'traditional': None,
                      'jyutping': None,
                      'english': None,
                      'phonics_pair': None,
                  },
                  'later_research_links': links,
                  'mechanical_cross_reference_id': item_id,
                  'review_note': note,
                  'not_claims': [
                      'not_grammar_proof',
                      'not_productivity_evidence',
                      'not_dialect_wide_naturalness',
                      'not_parser_acceptance',
                      'not_linguistic_status_change',
                  ],
              })

          terminal_counts = Counter(row['terminal_ingress_classification'] for row in records)
          duplicate_counts = Counter(row['expert_duplicate_status'] for row in records)
          evidence_counts = Counter(row['evidence_use_disposition'] for row in records)
          review = {
              'schema': 'canto-span-pedagogical-corpus-review-v2',
              'source_id': source['source']['sourceId'],
              'source_path': 'source.json',
              'source_payload_hash': source['ingress']['sourcePayloadHash'],
              'mechanical_cross_reference': 'mechanical-cross-reference-r1.json',
              'reviewed_on': '2026-08-02',
              'review_authority': 'project_expert_systematic_review',
              'record_count': len(records),
              'review_policy': {
                  'source_values_immutable': True,
                  'mechanical_matches_are_candidates_only': True,
                  'terminal_classification_required': True,
                  'accepted_duplicate_target_required_for_exact_or_normalized_duplicate': True,
                  'unresolved_discrepancies_do_not_fabricate_replacements': True,
                  'pedagogical_attestation_has_zero_independent_grammar_weight': True,
              },
              'allowed_terminal_classifications': [
                  'exact_duplicate',
                  'normalized_duplicate',
                  'new_corpus_attestation',
                  'lexical_only_attestation',
                  'pronunciation_discrepancy',
                  'translation_discrepancy',
                  'naturalness_review_candidate',
                  'unusable',
              ],
              'summary': {
                  'review_status_counts': {'reviewed': len(records), 'unreviewed': 0},
                  'terminal_classification_counts': dict(sorted(terminal_counts.items())),
                  'duplicate_status_counts': dict(sorted(duplicate_counts.items())),
                  'evidence_use_counts': dict(sorted(evidence_counts.items())),
                  'records_with_source_discrepancies': sum(bool(row['source_discrepancies']) for row in records),
                  'records_with_reviewed_replacements': 0,
              },
              'records': records,
          }
          (package / 'review.json').write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          fields = [
              'id', 'item_type', 'source_traditional', 'source_jyutping', 'source_english',
              'duplicate_status', 'terminal_classification', 'evidence_use', 'discrepancy_status',
              'accepted_duplicate_targets', 'review_note'
          ]
          with (package / 'expert-review-r1.tsv').open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              for row in records:
                  item = source_by_id[row['id']]
                  src = item.get('source', {})
                  writer.writerow({
                      'id': row['id'],
                      'item_type': item['itemType'],
                      'source_traditional': src.get('traditional') or '',
                      'source_jyutping': src.get('jyutping') or '',
                      'source_english': src.get('english') or '',
                      'duplicate_status': row['expert_duplicate_status'],
                      'terminal_classification': row['terminal_ingress_classification'],
                      'evidence_use': row['evidence_use_disposition'],
                      'discrepancy_status': ';'.join(d['status'] for d in row['source_discrepancies']),
                      'accepted_duplicate_targets': ';'.join(t['path'] for t in row['accepted_duplicate_targets']),
                      'review_note': row['review_note'],
                  })
          PY
          rm -f \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/expert-review-brief.tmp.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/expert-review-brief.part1.tmp.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/expert-review-brief.part2.tmp.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/expert-review-brief.part3.tmp.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/phonics-source-view.tmp.json
          git rm .github/workflows/write-week14-expert-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621
          git commit -m "Complete Week 14 record-level ingress review"
          git push origin HEAD:agent/week14-ingress-review
