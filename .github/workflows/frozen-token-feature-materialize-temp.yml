name: Temporary frozen token-feature materializer

on:
  push:
    branches:
      - agent/frozen-token-feature-arrays
    paths:
      - ".github/workflows/frozen-token-feature-materialize-temp.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frozen-token-feature-arrays
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Clone lexical arrays before feature inference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/parser/features/token-features.js")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'semantic: Array.isArray(entry.semantic) ? entry.semantic : [],': 'semantic: Array.isArray(entry.semantic) ? [...entry.semantic] : [],',
              'verb_class: Array.isArray(entry.verb_class) ? entry.verb_class : [],': 'verb_class: Array.isArray(entry.verb_class) ? [...entry.verb_class] : [],',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Run focused immutability test
        run: node --test tests/tooling/runtime/token-features-immutability.test.js
      - name: Rebuild committed runtime
        run: npm run build:runtime
      - name: Verify rebuilt runtime
        run: node tools/build-runtime.js --check
      - name: Commit source and generated runtime
        run: |
          git config user.name "canto-span-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/parser/features/token-features.js main.js tests/tooling/runtime/token-features-immutability.test.js
          git diff --cached --check
          git commit -m "Clone token feature arrays before inference"
          git push origin HEAD:agent/frozen-token-feature-arrays
