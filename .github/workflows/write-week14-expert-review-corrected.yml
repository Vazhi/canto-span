name: Write corrected Week 14 expert review

on:
  pull_request:
    paths:
      - .github/workflows/write-week14-expert-review-corrected.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week14-ingress-review
          fetch-depth: 0
      - name: Execute corrected deterministic review generation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/write-week14-expert-review.yml')
          text = source.read_text(encoding='utf-8')
          replacements = {
              "              'GLOSSIKA-YUEHK-A1-W14-20260621-I022',\n": "              'GLOSSIKA-YUEHK-A1-W14-20260621-I026',\n",
              "              'GLOSSIKA-YUEHK-A1-W14-20260621-I038',\n": "              'GLOSSIKA-YUEHK-A1-W14-20260621-I031',\n",
              "                  if 'compositional_numeral' in dispositions:\n": "                  if 'compositional_numeral_no_opaque_entry' in dispositions:\n",
              "                  elif 'candidate' in dispositions:\n": "                  elif 'lexical_ingress_candidate' in dispositions:\n",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected generator text not found: {old!r}')
              text = text.replace(old, new, 1)

          lines = text.splitlines()
          marker = '        run: |'
          start = lines.index(marker) + 1
          body = []
          for line in lines[start:]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/week14-review.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash -euxo pipefail /tmp/week14-review.sh
      - name: Remove corrected executor and obsolete push trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/write-week14-expert-review-corrected.yml
          if [ -f .github/workflows/trigger-week14-expert-review.yml ]; then
            git rm .github/workflows/trigger-week14-expert-review.yml
          fi
          git commit -m "Remove Week 14 review generation workflows"
          git push origin HEAD:agent/week14-ingress-review
