name: CS-WORK-0281 Week 18 research validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week18-research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Validate Week 18 research structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = require('./data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719/source.json');
          const crosswalk = require('./data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W18-20260719/crosswalk.json');
          const claims = require('./data/research-ledgers/glossika-week18-claim-source.json');
          const verbs = require('./data/research-ledgers/glossika-week18-common-verb-audit.json');
          const temporal = require('./data/research-ledgers/glossika-week18-temporal-lexicon.json');
          const followup = require('./data/research-ledgers/glossika-week18-followup-candidates.json');
          if (source.items.length !== 99) throw new Error('Expected 99 source records');
          if (source.ingress.sourcePayloadHash !== 'sha256:fb9efc4f693a96015740012e119a678e57645fb9017b9096a5383d8bdaa13579') throw new Error('Unexpected source hash');
          if (crosswalk.records.length !== 99) throw new Error('Expected 99 crosswalk records');
          if (claims.claims.length !== 16) throw new Error('Expected 16 bounded claims');
          if (claims.sources.length < 15) throw new Error('Expected direct and repository source coverage');
          if (verbs.entries.length !== 25 || verbs.summary.covered !== 24 || verbs.summary.uncovered.join(',') !== '著') throw new Error('Common-verb audit mismatch');
          if (temporal.entries.length !== 28 || temporal.summary.covered !== 3) throw new Error('Temporal audit mismatch');
          if (followup.candidates.length !== 13) throw new Error('Expected 13 follow-up candidates');
          if (followup.nonCandidates.length !== 1 || followup.nonCandidates[0].cluster !== 'large_numerals') throw new Error('Numeral non-candidate missing');
          const paths = [
            'data/research-ledgers/glossika-week18-common-verb-audit.json',
            'data/research-ledgers/glossika-week18-temporal-lexicon.json'
          ];
          for (const path of paths) {
            const text = fs.readFileSync(path, 'utf8');
            if (text.includes('main.js')) {
              const parsed = JSON.parse(text);
              const serialized = JSON.stringify(parsed);
              if (serialized.includes('canonicalLexiconOwners":["main.js') || serialized.includes('canonicalPronunciationOwners":["main.js')) throw new Error(`Generated bundle leaked into ${path}`);
            }
          }
          const note = fs.readFileSync('docs/research/GLOSSIKA-YUEHK-A1-W18-20260719-RESEARCH.md','utf8').toLowerCase();
          const required = [
            'clarification items perform different repair jobs',
            '`你食咗飯未` is neither a preverbal `未` negative',
            '`幫你買嘢返嚟` contains an unresolved benefactive relation',
            '24 / 25',
            '28 entries',
            'one-character-to-one-function grammar',
            'no runtime'
          ];
          for (const phrase of required) if (!note.includes(phrase.toLowerCase())) throw new Error(`Research note missing ${phrase}`);
          for (const claim of claims.claims) {
            if (!claim.id || !claim.claim || !claim.status || !claim.sourceIds?.length || !claim.boundary) throw new Error(`Malformed claim ${claim.id || 'unknown'}`);
          }
          console.log({sourceRecords:99,claims:claims.claims.length,verbs:verbs.summary,temporal:temporal.summary,followups:followup.candidates.length});
          NODE
          git diff --check
      - name: Run repository verification
        run: |
          npm run verify:research
          npm run verify
