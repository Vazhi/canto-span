name: Temporary Cifu ranks 1001-1250 v0.5.233 materializer

on:
  push:
    branches:
      - agent/cifu-r1001-1250-runtime-reconcile
    paths:
      - .github/workflows/temporary-cifu-r1001-1250-version-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r1001-1250-runtime-reconcile
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Synchronize v0.5.233 source metadata and project state
        shell: bash
        run: |
          npm version 0.5.233 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          import json

          plugin = Path('src/plugin-entry.js')
          text = plugin.read_text(encoding='utf-8')
          old = 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.232";\n// v0.5.232: reconciles reviewed Cifu ranks 751–1000 with conservative defaults, stable alternatives, evidence-driven typed corrections, and preserved ranks 1–750 behavior.'
          new = 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.233";\n// v0.5.233: reconciles reviewed Cifu ranks 1001–1250 with evidence-graded promotions, stable alternatives, zero-hit safeguards, and preserved ranks 1–1000 behavior.\n// v0.5.232: reconciles reviewed Cifu ranks 751–1000 with conservative defaults, stable alternatives, evidence-driven typed corrections, and preserved ranks 1–750 behavior.'
          assert text.count(old) == 1
          plugin.write_text(text.replace(old, new, 1), encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest.get('version') == '0.5.232'
          manifest['version'] = '0.5.233'
          manifest['description'] = 'v0.5.233 reconciles reviewed Cifu ranks 1001–1250 with evidence-graded promotions, stable reviewed alternatives, zero-hit safeguards, and preserved ranks 1–1000 behavior.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          state = Path('docs/current/PROJECT-STATE.md')
          text = state.read_text(encoding='utf-8')
          assert text.count('| Runtime | v0.5.232 |') == 1
          text = text.replace('| Runtime | v0.5.232 |', '| Runtime | v0.5.233 |', 1)
          marker = '- v0.5.232 implements the final #872 Cifu ranks 751–1000 lexical adjudication'
          assert text.count(marker) == 1
          bullet = '- v0.5.233 implements the consolidated #878/#880 Cifu ranks 1001–1250 lexical authority while retaining complete 2,000/2,000 exact-surface coverage: 93 independently supportable broad rows receive reviewed typed defaults when their prior runtime entry was neutral, 76 surfaces expose stable reviewed alternative records (51 multi-analysis and 25 reading-specific), 32 zero-hit rows explicitly marked `source_only_pending_cantonese_confirmation` receive no new band-specific typed fact, and all 49 `blocked_atomic` rows receive no new typed whole-surface analysis; the independently checked zero-hit rows `兆`, `整個`, and `好話` are implemented according to the authority, explicit audit supersessions for `處理`, `舖`, `好話`, and `拿` are preserved, `盡量` remains split only on independent lexical/orthographic evidence rather than raw HKCanCor tag disagreement, richer pre-existing typed defaults such as `百` are preserved rather than flattened to a generic band role, and ranks 1–1000 stable analyses/defaults remain protected; no construction identity or status, survey, corpus, release-publication, or deployment state is changed;\n\n'
          text = text.replace(marker, bullet + marker, 1)
          state.write_text(text, encoding='utf-8')
          PY
      - name: Build runtime bundle
        run: npm run build:runtime
      - name: Verify source-first bundle
        run: node tools/build-runtime.js --check
      - name: Verify generated-runtime version contract
        run: node tests/tooling/runtime/generated-bundle.test.js
      - name: Verify ranks 1001-1250 focused invariants
        run: node tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Verify bounded finalization diff
        shell: bash
        run: |
          rm .github/workflows/temporary-cifu-r1001-1250-diagnostic.yml
          rm .github/workflows/temporary-cifu-r1001-1250-version-materialize.yml
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          printf 'Pending paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 8
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual-paths
          printf '%s\n' \
            '.github/workflows/temporary-cifu-r1001-1250-diagnostic.yml' \
            '.github/workflows/temporary-cifu-r1001-1250-version-materialize.yml' \
            'docs/current/PROJECT-STATE.md' \
            'main.js' \
            'manifest.json' \
            'package-lock.json' \
            'package.json' \
            'src/plugin-entry.js' | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Commit state synchronization and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugin-entry.js manifest.json package.json package-lock.json main.js docs/current/PROJECT-STATE.md .github/workflows/temporary-cifu-r1001-1250-diagnostic.yml .github/workflows/temporary-cifu-r1001-1250-version-materialize.yml
          git commit -m 'Synchronize ranks 1001-1250 runtime v0.5.233'
          git push origin HEAD:agent/cifu-r1001-1250-runtime-reconcile
