name: AB45 fixture audit temporary

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/ab45-quantified-classifier-source-reaudit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Summarize AB45 fixture roles
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { loadRuntimeApi, internalConstruction, rowSurface } = require('./tests/lib/runtime-api');
          const api = loadRuntimeApi();
          const fixture = JSON.parse(fs.readFileSync('tests/constructions/QuantifiedClassifierNP.json','utf8'));
          const groups = [
            ['snapshot_cases', fixture.snapshot_cases || []],
            ['focused_cases', fixture.focused_cases || []],
            ['np_cases', fixture.np_cases || []],
            ['implementation_probe_cases', fixture.implementation_probe_cases || []],
          ];
          function classify(c, rows) {
            if (c.assertion === 'construction_absent') return 'explicit_non_ab45_boundary';
            if (c.class === 'classifier_policy_control') return 'classifier_noun_compatibility_control';
            if (c.class === 'demonstrative_plus_quantified_classifier_np') return 'demonstrative_outer_composition';
            if (/幾多/u.test(c.source)) return 'wh_quantity_unresolved';
            if (/歲|呎/u.test(c.source)) return 'age_or_dimension_unresolved';
            if (/杯|碗/u.test(c.source)) return 'container_measure_not_classifier_core';
            const hasHead = rows.some(r => Array.isArray(r.assigned_slots) && r.assigned_slots.includes('head_noun'));
            if (hasHead) return 'overt_num_cl_n_core_candidate';
            if (rows.length) return 'headless_num_cl_ellipsis_candidate';
            return 'no_live_ab45_row';
          }
          const all = [];
          for (const [group, cases] of groups) {
            for (const c of cases) {
              const rows = api.diagnosticFinalRows(api.analyzeLine(c.source))
                .filter(r => r.kind === 'construction' && internalConstruction(r) === 'QuantifiedClassifierNP')
                .map(r => ({surface: rowSurface(r), parent: r.internal_parent || r.parent || null, depth: r.depth,
                  assigned_slots: r.trace_detail && r.trace_detail.assigned_slots}));
              all.push({group, case_id:c.case_id, source:c.source, class:c.class || null, role:classify(c, rows), rows});
            }
          }
          const roleCounts = {};
          const roleCases = {};
          for (const row of all) {
            roleCounts[row.role] = (roleCounts[row.role] || 0) + 1;
            (roleCases[row.role] ||= []).push(`${row.case_id}: ${row.source}`);
          }
          console.log(JSON.stringify({
            fixture_counts:Object.fromEntries(groups.map(([g,c])=>[g,c.length])),
            total:all.length,
            role_counts:roleCounts,
            role_cases:roleCases,
          }, null, 2));
          NODE
