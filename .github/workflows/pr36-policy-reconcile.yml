name: PR 36 policy reconciliation

# Temporary branch-local migration; the reconciliation script deletes this file.
on:
  push:
    branches:
      - agent/require-user-review-before-merge
    paths:
      - tools/coordination/reconcile-pr36-review-policy.js
      - .github/workflows/pr36-policy-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/require-user-review-before-merge
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact claimed branch
        run: |
          test "${GITHUB_REF_NAME}" = "agent/require-user-review-before-merge"
          test "${GITHUB_REPOSITORY}" = "Vazhi/canto-span"
      - name: Reconcile review policy and remove temporary automation
        run: node tools/coordination/reconcile-pr36-review-policy.js
      - name: Verify coordination contract
        run: npm run verify:coordination
      - name: Commit reconciled current policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove autonomous merge holdouts"
          git push origin HEAD:agent/require-user-review-before-merge
