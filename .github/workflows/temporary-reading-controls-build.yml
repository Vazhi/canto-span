# Temporary branch-scoped deterministic build for issue #924.
# Delete this workflow from the feature branch before creating the final PR.
name: Temporary reading controls runtime build

on:
  push:
    branches:
      - agent/learner-per-block-reading-supports
    paths:
      - ".github/workflows/temporary-reading-controls-build.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'Vazhi/canto-span' && github.ref == 'refs/heads/agent/learner-per-block-reading-supports'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: agent/learner-per-block-reading-supports
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build generated Obsidian runtime
        run: npm run build:runtime
      - name: Verify runtime and new reading-controls suite
        run: |
          npm run verify:runtime
          node --test tests/tooling/runtime/reading-controls.test.js
      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-controls-main-js
          path: main.js
          if-no-files-found: error
          retention-days: 1
      - name: Commit only generated bundle to this branch
        run: |
          set -euo pipefail
          git add -- main.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged; no commit needed."
            exit 0
          fi
          git -c user.name="canto-span-build" \
              -c user.email="canto-span-build@users.noreply.github.com" \
              commit -m "Regenerate Obsidian runtime for reading controls (#924)"
          git push origin HEAD:refs/heads/agent/learner-per-block-reading-supports
