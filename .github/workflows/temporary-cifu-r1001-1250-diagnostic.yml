name: Temporary Cifu ranks 1001-1250 diagnostics

on:
  push:
    branches:
      - agent/cifu-r1001-1250-runtime-reconcile
    paths:
      - .github/workflows/temporary-cifu-r1001-1250-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: R1001-1250 focused suite after richer-default fix
        shell: bash
        run: |
          set +e
          node tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js >/tmp/focused.log 2>&1
          status=$?
          set -e
          if [[ "$status" != "0" ]]; then
            message="$(tail -c 7000 /tmp/focused.log | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            echo "::error title=R1001-1250 focused failure::$message"
            exit "$status"
          fi
      - name: Parser architecture audit
        run: node tests/tooling/parser-coverage/architecture-audit.test.js
      - name: Week 16 lexical contract
        run: node tests/tooling/lexicon/glossika-week16-runtime-lexicon.test.js
      - name: R251-500 lexical contract
        run: node tests/tooling/lexicon/cifu-r251-500-reviewed-runtime.test.js
      - name: R1-250 lexical contract
        run: node tests/tooling/lexicon/cifu-r1-250-reviewed-runtime.test.js
      - name: R501-750 lexical contract
        run: node tests/tooling/lexicon/cifu-r501-750-reviewed-runtime.test.js
      - name: R751-1000 lexical contract
        run: node tests/tooling/lexicon/cifu-r751-1000-reviewed-runtime.test.js
      - name: Unit-word evidence contract
        run: node tests/tooling/runtime/unit-word-evidence.test.js
      - name: Label-transition policy
        run: node tests/tooling/runtime/label-transition-policy.test.js
      - name: AB33 outer-question composition
        run: node tests/tooling/runtime/ab33-outer-question-composition.test.js
      - name: AA11 change-into-dim boundary
        run: node tests/tooling/runtime/aa11-change-into-dim-boundary.test.js
      - name: AA49 independent-motion boundary
        run: node tests/tooling/runtime/aa49-independent-motion-boundary.test.js
      - name: AB45 quantified-classifier boundary
        run: node tests/tooling/runtime/ab45-quantified-classifier-boundary.test.js
      - name: AB78 transitive boundary
        run: node tests/tooling/runtime/ab78-transitive-boundary.test.js
      - name: AB35 verb-object compound boundary
        run: node tests/tooling/runtime/ab35-verb-object-compound-boundary.test.js
      - name: AB35 做功課 rehome
        run: node tests/tooling/runtime/ab35-zo-gungfo-rehome.test.js
      - name: 過3 comparative behavior
        run: node tests/tooling/runtime/behavior-gwo3-comparative.test.js
      - name: AA61 experiential-question boundary
        run: node tests/tooling/runtime/aa61-experiential-question-boundary.test.js
      - name: AA84 marked-manner boundary
        run: node tests/tooling/runtime/aa84-marked-manner-boundary.test.js
      - name: Parser coverage auditor
        run: node tests/tooling/parser-coverage/coverage.test.js
      - name: Parser coverage enhanced
        run: node tests/tooling/parser-coverage/enhanced.test.js
      - name: Parser prioritizer
        run: node tests/tooling/parser-coverage/prioritizer.test.js
      - name: Regression-ratchet verifier unit suite
        run: node tests/tooling/runtime/regression-ratchet-verifier.test.js
      - name: Enforce source-phase inherited-debt ratchets
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="88aa6e5d6c3582956ba97c43a9e238954c0935a2"
          BASE_DIR="$RUNNER_TEMP/canto-span-ratchet-base"
          rm -rf "$BASE_DIR"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          cleanup() { git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          rm -f \
            "$BASE_DIR/validation/current/regression-suite.json" \
            "$BASE_DIR/validation/current/np-subsystem-results.json" \
            "$BASE_DIR/validation/current/construction-tests.json" \
            "validation/current/regression-suite.json" \
            "validation/current/np-subsystem-results.json" \
            "validation/current/construction-tests.json"

          run_baseline() {
            local label="$1"; shift
            set +e
            (cd "$BASE_DIR" && "$@") >"$RUNNER_TEMP/baseline-$label.stdout" 2>"$RUNNER_TEMP/baseline-$label.stderr"
            local exit_code=$?
            set -e
            printf '%s\n' "$exit_code" >"$RUNNER_TEMP/baseline-$label.exit"
          }
          run_baseline regression node tests/run-regression.js
          run_baseline np node tests/run-np-subsystem.js
          run_baseline constructions node tests/run-constructions.js

          node tests/run-regression.js >/dev/null 2>&1 || true
          node tests/run-np-subsystem.js >/dev/null 2>&1 || true
          node tests/run-constructions.js >/dev/null 2>&1 || true

          synthesize() {
            local suite="$1" label="$2" report="$3" universe="$4"
            if [[ -f "$report" ]]; then return 0; fi
            local code="$(cat "$RUNNER_TEMP/baseline-$label.exit")"
            if [[ "$code" == "0" ]]; then echo "missing baseline report $report" >&2; exit 1; fi
            local reason="$RUNNER_TEMP/baseline-$label.reason"
            { echo "baseline_exit_code=$code"; cat "$RUNNER_TEMP/baseline-$label.stderr"; cat "$RUNNER_TEMP/baseline-$label.stdout"; } >"$reason"
            node tools/ratchet-unobservable-baseline.js --suite "$suite" --universe "$universe" --output "$report" --reason-file "$reason" >/dev/null
          }
          synthesize regression regression "$BASE_DIR/validation/current/regression-suite.json" "$BASE_DIR/tests/fixtures/regression-snapshots.json"
          synthesize np_subsystem np "$BASE_DIR/validation/current/np-subsystem-results.json" "$BASE_DIR/tests/fixtures/np-subsystem.json"
          synthesize construction_files constructions "$BASE_DIR/validation/current/construction-tests.json" "$BASE_DIR/tests/constructions"

          node tools/verify-regression-ratchet.js --suite regression \
            --baseline-result "$BASE_DIR/validation/current/regression-suite.json" --candidate-result validation/current/regression-suite.json \
            --baseline-universe "$BASE_DIR/tests/fixtures/regression-snapshots.json" --candidate-universe tests/fixtures/regression-snapshots.json
          node tools/verify-regression-ratchet.js --suite np_subsystem \
            --baseline-result "$BASE_DIR/validation/current/np-subsystem-results.json" --candidate-result validation/current/np-subsystem-results.json \
            --baseline-universe "$BASE_DIR/tests/fixtures/np-subsystem.json" --candidate-universe tests/fixtures/np-subsystem.json
          node tools/verify-regression-ratchet.js --suite construction_files \
            --baseline-result "$BASE_DIR/validation/current/construction-tests.json" --candidate-result validation/current/construction-tests.json \
            --baseline-universe "$BASE_DIR/tests/constructions" --candidate-universe tests/constructions
