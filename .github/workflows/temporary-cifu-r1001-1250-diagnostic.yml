name: Temporary Cifu ranks 1001-1250 diagnostics

on:
  push:
    branches:
      - agent/cifu-r1001-1250-runtime-reconcile
    paths:
      - .github/workflows/temporary-cifu-r1001-1250-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Load reviewed module
        run: node -e 'const r=require("./src/runtime-resources/lexicon/token-lexicon/cifu-r1001-1250-reviewed"); console.log({promotions:Object.keys(r.PROMOTIONS).length, alternatives:Object.keys(r.ALTERNATIVE_SPECS).length, sourceOnly:r.SOURCE_ONLY_SURFACES.size, blocked:r.BLOCKED_ATOMIC_SURFACES.size})'
      - name: Load composed token lexicon
        run: node -e 'const x=require("./src/runtime-resources/lexicon/token-lexicon"); console.log(`entries=${x.length}`)'
      - name: Load composed lexical analyses
        run: node -e 'const x=require("./src/runtime-resources/lexicon/token-lexicon"); const a=require("./src/runtime-resources/lexicon/lexical-analyses").buildLexicalAnalysisIndex(x); console.log(`surfaces=${Object.keys(a).length}`)'
      - name: Coverage invariant
        continue-on-error: true
        run: node --test --test-name-pattern='retain complete exact-surface coverage' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Partition invariant
        continue-on-error: true
        run: node --test --test-name-pattern='runtime policy exposes' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Broad typing invariant
        continue-on-error: true
        run: node --test --test-name-pattern='93 independently supportable broad rows' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Source-only safeguard
        continue-on-error: true
        run: node --test --test-name-pattern='32 source-only zero-hit rows' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Blocked safeguard
        continue-on-error: true
        run: node --test --test-name-pattern='49 blocked atomic rows' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Alternative-ID invariant
        continue-on-error: true
        run: node --test --test-name-pattern='76 reviewed alternative surfaces' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Default-reading invariant
        continue-on-error: true
        run: node --test --test-name-pattern='reviewed default-reading corrections' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Reading-split invariant
        continue-on-error: true
        run: node --test --test-name-pattern='implementation-critical reading splits' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: 好話 supersession invariant
        continue-on-error: true
        run: node --test --test-name-pattern='好話 stays one broad lexical family' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: 盡量 ontology invariant
        continue-on-error: true
        run: node --test --test-name-pattern='raw HKCanCor tag disagreement' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Prior-band stability invariant
        continue-on-error: true
        run: node --test --test-name-pattern='ranks 1-1000 stable high-value analyses' tests/tooling/lexicon/cifu-r1001-1250-reviewed-runtime.test.js
      - name: Run parser architecture audit
        run: node tests/tooling/parser-coverage/architecture-audit.test.js
