name: Generate Glossika 001-020 decision map

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-001-020-decision-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate bounded inventory and decision map
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { loadGeneratedRuntimeApi } = require("./tests/lib/runtime-api");

          const root = process.cwd();
          const corpusRoot = path.join(root, "data", "pedagogical-corpus", "glossika");
          const api = loadGeneratedRuntimeApi(path.join(root, "main.js"));
          const sourceDirs = fs.readdirSync(corpusRoot)
            .filter((name) => /^GLOSSIKA-YUEHK-A1-DLG-(?:00[1-9]|01[0-9]|020)-/.test(name))
            .sort();

          if (sourceDirs.length !== 20) throw new Error(`Expected 20 source packages, found ${sourceDirs.length}`);

          const count = (object, key, amount = 1) => { object[key] = (object[key] || 0) + amount; };
          const unique = (values) => [...new Set(values.filter(Boolean))].sort();
          const sha256 = (text) => `sha256:${crypto.createHash("sha256").update(text).digest("hex")}`;
          const aggregate = {
            source_packages: 0,
            records: 0,
            dialog_turns: 0,
            lexical_entries: 0,
            vocabulary_entries: 0,
            stage_directions: 0,
            review_classifications: {},
            coverage_classes: {},
            runtime_labels: {},
            signal_tags: {}
          };
          const sources = [];
          const turns = [];

          function signalTags(surface) {
            const tags = [];
            if (/信(?:唔信)?得過|信唔信得過/u.test(surface)) tags.push("potential_standard_v_dak_gwo");
            if (/定/u.test(surface) && /好(?:啲)?[呀呢啊㗎啦？?。！!]*$/u.test(surface)) tags.push("alternative_scalar_choice");
            if (/電話|號碼|幾多號|巴士|地鐵|路線/u.test(surface)) tags.push("number_contact_or_route");
            if (/講咗乜嘢|佢講|話我|話佢|話你/u.test(surface)) tags.push("reported_speech_or_correction");
            if (/唔好意思聽到|聽到.*唔好意思/u.test(surface)) tags.push("sympathy_formula");
            if (/邊度/u.test(surface)) tags.push("locative_wh");
            if (/識唔識|得唔得|可唔可以|做唔到|做得到|做唔做到/u.test(surface)) tags.push("ability_potential_or_permission");
            if (/唔該|借借|借畀|借俾/u.test(surface)) tags.push("request_borrowing_or_politeness");
            return tags;
          }

          for (const directory of sourceDirs) {
            const packageRoot = path.join(corpusRoot, directory);
            const sourceText = fs.readFileSync(path.join(packageRoot, "source.json"), "utf8");
            const reviewText = fs.readFileSync(path.join(packageRoot, "review.json"), "utf8");
            const source = JSON.parse(sourceText);
            const review = JSON.parse(reviewText);
            const meta = source.source || {};
            const perSource = {
              source_id: meta.sourceId || directory,
              title_traditional: meta.titleTraditional || meta.title || directory,
              source_date: meta.sourceDate || null,
              source_payload_sha256: sha256(sourceText),
              record_count: source.items.length,
              item_type_counts: {},
              review_classification_counts: {...((review.summary || {}).classificationCounts || {})},
              coverage_class_counts: {},
              runtime_label_counts: {}
            };
            aggregate.source_packages += 1;
            aggregate.records += source.items.length;
            for (const [classification, value] of Object.entries(perSource.review_classification_counts)) count(aggregate.review_classifications, classification, value);

            for (const item of source.items) {
              const itemType = item.itemType || "unknown";
              count(perSource.item_type_counts, itemType);
              if (itemType === "lexical_entry") aggregate.lexical_entries += 1;
              if (itemType === "vocabulary_entry") aggregate.vocabulary_entries += 1;
              if (itemType === "stage_direction") aggregate.stage_directions += 1;
              if (itemType !== "dialog_turn") continue;

              aggregate.dialog_turns += 1;
              const surface = String(((item.source || {}).traditional) || "");
              const rows = api.diagnosticFinalRows(api.analyzeLine(surface));
              const labels = unique(rows.filter((row) => row && row.kind === "construction").map((row) => row.internal_construction || row.construction || row.type || ""));
              const coverageClass = labels.includes("NeedsContext") ? "needs_context" : labels.length ? "current_construction_coverage" : "no_construction_wrapper";
              count(aggregate.coverage_classes, coverageClass);
              count(perSource.coverage_class_counts, coverageClass);
              for (const label of labels) {
                count(aggregate.runtime_labels, label);
                count(perSource.runtime_label_counts, label);
              }
              const tags = signalTags(surface);
              for (const tag of tags) count(aggregate.signal_tags, tag);
              turns.push({
                item_id: item.id,
                source_id: perSource.source_id,
                source_title: perSource.title_traditional,
                ordinal: item.ordinal,
                speaker: item.speaker || ((item.source || {}).speaker) || null,
                previous_turn_id: item.previousTurnId || null,
                next_turn_id: item.nextTurnId || null,
                traditional: surface,
                jyutping: ((item.source || {}).jyutping) || null,
                runtime_labels: labels,
                coverage_class: coverageClass,
                signal_tags: tags,
                evidence_use: "authorized_pedagogical_attestation_only"
              });
            }
            perSource.runtime_label_counts = Object.fromEntries(Object.entries(perSource.runtime_label_counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])));
            sources.push(perSource);
          }

          if (aggregate.records !== 1526 || aggregate.dialog_turns !== 821) throw new Error(`Unexpected inventory: ${aggregate.records} records, ${aggregate.dialog_turns} turns`);
          if (Object.values(aggregate.coverage_classes).reduce((a,b) => a+b, 0) !== turns.length) throw new Error("Coverage classes do not partition all turns");

          const examplesFor = (tag, limit = 5) => turns.filter((turn) => turn.signal_tags.includes(tag)).slice(0, limit).map((turn) => ({item_id: turn.item_id, traditional: turn.traditional, runtime_labels: turn.runtime_labels}));
          const findings = [
            {finding_id:"G20-F01",subject:"reliability and standard-bearing V得過",terminal_category:"bounded_corpus_research_candidate",evidence_strength:"pedagogical_attestation_plus_existing_independent_corpus_trigger",decision:"A semantically material relation remains unresolved between lexical 信得過, result potential, evaluative standard, experiential 過, and comparative 過.",route:{issue:391,status:"future_issue_created"},examples:examplesFor("potential_standard_v_dak_gwo",6)},
            {finding_id:"G20-F02",subject:"alternative choice plus scalar evaluation",terminal_category:"bounded_corpus_research_candidate",evidence_strength:"recurring_pedagogical_attestation_with_runtime_gap",decision:"The collection motivates a bounded decision between transparent alternative-plus-scalar composition and an integrated choice-evaluation profile; it does not revive the retired broad comparative fallback.",route:{issue:392,status:"future_issue_created"},examples:examplesFor("alternative_scalar_choice",8)},
            {finding_id:"G20-F03",subject:"context-linked short responses and ellipsis diagnostics",terminal_category:"bounded_corpus_research_candidate",evidence_strength:"complete_bounded_dialog_inventory_with_preserved_adjacency",decision:"NeedsContext outputs must be separated into recoverable prior-turn relations, formulae, genuine ambiguity, and ordinary parser misses before any context contract is broadened.",route:{issue:393,status:"future_issue_created"},examples:turns.filter((turn)=>turn.coverage_class==="needs_context").slice(0,8).map((turn)=>({item_id:turn.item_id,traditional:turn.traditional,previous_turn_id:turn.previous_turn_id}))},
            {finding_id:"G20-F04",subject:"matrix locative 邊度 questions",terminal_category:"accepted_runtime_specification_candidate",evidence_strength:"pedagogical_attestation_plus_accepted_boundary_packet_and_full_regression",decision:"The previously demonstrated AA82 undergeneration has been resolved by the bounded matrix-question-force wrapper; the dialog collection creates no additional AA82 issue.",route:{issue:386,pull_request:390,status:"completed"},examples:examplesFor("locative_wh",8)},
            {finding_id:"G20-F05",subject:"reported speech, repetition, and correction sequences",terminal_category:"no_action_required",evidence_strength:"pedagogical_attestation_only",decision:"The observed turns do not independently demonstrate a missing construction identity. Existing clause, complement, quotation, and discourse composition remain the appropriate starting analysis.",route:{status:"no_issue_admitted"},examples:examplesFor("reported_speech_or_correction",8)},
            {finding_id:"G20-F06",subject:"sympathy, apology, and politeness formulae",terminal_category:"no_action_required",evidence_strength:"pedagogical_attestation_only",decision:"The material is compatible with lexical or formulaic treatment and does not establish a productive grammar construction or runtime fallback.",route:{status:"no_issue_admitted"},examples:examplesFor("sympathy_formula",6)},
            {finding_id:"G20-F07",subject:"route clarification and ordinary travel questions",terminal_category:"no_action_required",evidence_strength:"pedagogical_attestation_only",decision:"Route and transport turns supply useful lexical and compositional attestations, but no distinct route-clarification construction survives deduplication and boundary review.",route:{status:"no_issue_admitted"},examples:examplesFor("number_contact_or_route",8)},
            {finding_id:"G20-F08",subject:"telephone, contact-detail, and digit-sequence representation",terminal_category:"unresolved_with_named_evidence_requirement",evidence_strength:"small_pedagogical_cluster_only",decision:"Before admitting work, the project needs a broader source inventory distinguishing ordinary quantified NPs, digit strings, telephone-number grouping, address-like sequences, and display-only tokenization.",route:{status:"future_issue_not_admitted",readiness_gap:"broader independent source and representation inventory"},examples:turns.filter((turn)=>/電話|號碼|幾多號/u.test(turn.traditional)).slice(0,8).map((turn)=>({item_id:turn.item_id,traditional:turn.traditional,runtime_labels:turn.runtime_labels}))},
            {finding_id:"G20-F09",subject:"source notes, Jyutping, lexical glosses, and missing turn-level English",terminal_category:"provenance_or_documentation_correction",evidence_strength:"source_preservation_metadata",decision:"The source packages correctly retain provider claims and Jyutping without adopting them as project conclusions, and preserve absent turn-level English as null. Discrepancies remain review candidates rather than automatic corrections.",route:{status:"handled_by_source_packages_no_new_issue"},examples:[]}
          ];
          if (findings.length !== 9) throw new Error("Expected nine terminal findings");

          aggregate.runtime_labels = Object.fromEntries(Object.entries(aggregate.runtime_labels).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])));
          aggregate.signal_tags = Object.fromEntries(Object.entries(aggregate.signal_tags).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])));
          aggregate.review_classifications = Object.fromEntries(Object.entries(aggregate.review_classifications).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])));

          const packet = {
            schema:"canto-span-glossika-decision-map-v1",
            packet_id:"GLOSSIKA-YUEHK-A1-DLG-001-020-DECISION-MAP-R1",
            generated_at:"2026-07-31",
            parent_issue:130,
            work_claim_issue:394,
            source_scope:{provider:"Glossika",course:"Cantonese (HK) A1 dialogs",first_source_date:"2025-11-30",last_source_date:"2026-04-19",source_ids:sources.map((source)=>source.source_id)},
            method:{
              source_layer:"Immutable source.json records from twenty authorized pedagogical email packages.",
              review_layer:"Existing review.json and crosswalk.json classifications are aggregated without rewriting source content.",
              runtime_layer:"Each preserved dialog turn is analyzed by the generated runtime on the branch base after PR #390. Runtime output is implementation evidence only.",
              coverage_partition:["current_construction_coverage","needs_context","no_construction_wrapper"],
              evidence_boundary:"Pedagogical attestation does not establish productivity, identity, frequency, dialect-wide naturalness, parser correctness, or preferred pronunciation or translation."
            },
            aggregate,
            sources,
            findings,
            turns,
            terminal_routing:{admitted_future_issues:[391,392,393],completed_runtime_route:{issue:386,pull_request:390},no_new_issue_findings:["G20-F05","G20-F06","G20-F07","G20-F09"],unresolved_not_admitted:["G20-F08"]},
            protected_state_unchanged:["construction_uuid","construction_identity","linguistic_status","runtime_behavior","fixtures","survey_state","runtime_version","release_state","deployment_state"]
          };

          const sourceRows = sources.map((source)=>`| ${source.source_id.match(/DLG-(\d{3})/)[1]} | ${source.title_traditional} | ${source.item_type_counts.dialog_turn||0} | ${source.record_count} | ${source.coverage_class_counts.current_construction_coverage||0} | ${source.coverage_class_counts.needs_context||0} | ${source.coverage_class_counts.no_construction_wrapper||0} |`).join("\n");
          const reviewRows = Object.entries(aggregate.review_classifications).map(([key,value])=>`| \`${key}\` | ${value} |`).join("\n");
          const labelRows = Object.entries(aggregate.runtime_labels).slice(0,30).map(([key,value])=>`| \`${key}\` | ${value} |`).join("\n");
          const findingRows = findings.map((finding)=>`| ${finding.finding_id} | ${finding.subject} | \`${finding.terminal_category}\` | ${finding.route.issue?`#${finding.route.issue}`:finding.route.status} |`).join("\n");
          const markdown = `# Glossika Yue-HK A1 dialogs 001–020 decision map R1

Date: 2026-07-31  
Parent issue: #130  
Work claim: #394

## Outcome

The bounded twenty-dialog inventory is complete. Every one of the **${aggregate.dialog_turns}** preserved dialog turns has one exclusive runtime-coverage class, every source record remains linked to its immutable package, and nine substantive findings have a terminal decision-map category.

Three findings independently pass backlog admission and are preserved as Future issues **#391–#393**. The previously routed AA82 correctness defect is complete under **#386 / PR #390**. The remaining findings either require a named evidence acquisition step before admission or require no new project action.

## Source inventory

- Source packages: **${aggregate.source_packages}**
- Total preserved records: **${aggregate.records}**
- Dialog turns: **${aggregate.dialog_turns}**
- General lexical entries: **${aggregate.lexical_entries}**
- Vocabulary entries in Dialogs 015–020: **${aggregate.vocabulary_entries}**
- Stage directions: **${aggregate.stage_directions}**

| Dialog | Title | Turns | Records | Current construction coverage | NeedsContext | No construction wrapper |
|---:|---|---:|---:|---:|---:|---:|
${sourceRows}

## Existing review and deduplication inventory

These are source-package review classifications, not linguistic-status decisions.

| Classification | Records |
|---|---:|
${reviewRows}

## Runtime coverage snapshot

The current generated runtime is used only to locate implementation coverage and gaps. It is not linguistic evidence.

| Coverage class | Turns |
|---|---:|
| Current construction coverage | ${aggregate.coverage_classes.current_construction_coverage||0} |
| \`NeedsContext\` | ${aggregate.coverage_classes.needs_context||0} |
| No construction wrapper | ${aggregate.coverage_classes.no_construction_wrapper||0} |

Top runtime labels in the bounded collection:

| Label | Turns containing label |
|---|---:|
${labelRows}

The machine-readable packet records every turn, exact surface, Jyutping, adjacency IDs, runtime labels, coverage class, and discovery tags.

## Terminal decision map

| Finding | Subject | Terminal category | Route |
|---|---|---|---|
${findingRows}

### Admission-ready consequences

1. **#391 — 信得過 potential-standard profile.** Independent corpus attestations plus the Glossika cluster justify decision-support research separating lexical, result-potential, evaluative-standard, experiential, and comparative analyses.
2. **#392 — alternative-choice questions with scalar evaluation.** Recurrent \`A定B好(啲)\` material justifies research into transparent layered composition versus a bounded integrated profile. The retired broad comparative fallback remains excluded.
3. **#393 — context-linked short responses.** The complete bounded set contains **${aggregate.coverage_classes.needs_context||0}** \`NeedsContext\` turns with preserved adjacency, sufficient for a finite classification packet.

### Completed consequence

The collection contributed to the AA82 matrix-locative question investigation. The accepted implementation merged in PR #390 and the present scan creates no new AA82 issue.

### Explicit no-action findings

- Reported-speech, repetition, and correction sequences do not independently establish a missing identity.
- Sympathy, apology, and politeness material remains compatible with lexical or formulaic treatment.
- Route clarification and ordinary transport questions do not survive as a distinct construction after compositional review.
- Provider notes, Jyutping, lexical glosses, and absent turn-level English are already preserved with the correct provenance boundary.

### Unresolved but not admitted

Telephone, contact-detail, and digit-sequence representation needs a broader independent inventory distinguishing digit strings, grouped telephone numbers, quantified noun phrases, address-like sequences, and display-only tokenization. The current small pedagogical cluster does not yet satisfy backlog admission as a separate issue.

## Evidence-strength classification

- Glossika dialog and vocabulary material: **authorized pedagogical attestation**.
- Existing review and crosswalk matches: **deduplication and review metadata**.
- Current runtime labels and coverage classes: **implementation observation only**.
- The accepted AA82 packet and full regression: **implementation-boundary evidence**, not independent grammar proof.
- Any future identity, productivity, status, or broad runtime decision requires the independent evidence named in its routed issue.

## Stop rule satisfied

- all 20 sources inventoried;
- all ${aggregate.records} preserved records accounted for;
- all ${aggregate.dialog_turns} dialog turns assigned to one coverage class;
- all nine substantive findings assigned to a terminal category;
- all admission-ready consequences routed to #391–#393;
- completed AA82 consequence linked to #386 / PR #390;
- no-action and unresolved-not-admitted findings retained;
- no runtime, identity, status, survey, release, or deployment state changed.
`;

          const jsonPath = path.join(root,"data","corpus-reviews","GLOSSIKA-YUEHK-A1-DLG-001-020-DECISION-MAP-R1.json");
          const mdPath = path.join(root,"docs","research","GLOSSIKA-YUEHK-A1-DLG-001-020-DECISION-MAP-R1.md");
          fs.mkdirSync(path.dirname(jsonPath),{recursive:true});
          fs.mkdirSync(path.dirname(mdPath),{recursive:true});
          fs.writeFileSync(jsonPath,`${JSON.stringify(packet,null,2)}\n`);
          fs.writeFileSync(mdPath,markdown);
          console.log(JSON.stringify({status:"PASS",records:aggregate.records,turns:aggregate.dialog_turns,coverage:aggregate.coverage_classes,findings:findings.length},null,2));
          NODE
      - name: Validate packet shape
        run: node -e 'const p=require("./data/corpus-reviews/GLOSSIKA-YUEHK-A1-DLG-001-020-DECISION-MAP-R1.json"); if(p.turns.length!==821||p.findings.length!==9) process.exit(1); console.log(p.aggregate.coverage_classes)'
      - name: Commit final packet and remove temporary generator
        shell: bash
        run: |
          rm .github/workflows/generate-glossika-001-020-decision-map.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize Glossika dialogs 001-020 decision map"
          git push
