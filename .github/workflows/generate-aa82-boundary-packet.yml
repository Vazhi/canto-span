name: Materialize AA82 boundary packet

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/aa82-attested-boundary-packet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Decode reviewed packet
        shell: bash
        env:
          JSON_GZ_B64: 
          MD_GZ_B64: 
        run: |
          mkdir -p data/corpus-reviews docs/research
          printf '%s' "$JSON_GZ_B64" | base64 -d | gzip -d > data/corpus-reviews/AA82-ATTESTED-BOUNDARY-PACKET-R1.json
          printf '%s' "$MD_GZ_B64" | base64 -d | gzip -d > docs/research/AA82-ATTESTED-BOUNDARY-PACKET-R1.md
      - name: Verify runtime observations
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          const vm = require("node:vm");
          const packet = JSON.parse(fs.readFileSync("data/corpus-reviews/AA82-ATTESTED-BOUNDARY-PACKET-R1.json", "utf8"));
          const moduleRecord = { exports: {} };
          class Plugin {} class PluginSettingTab {} class Setting {} class Notice {}
          const context = { module: moduleRecord, exports: moduleRecord.exports, require: id => id === "obsidian" ? { Plugin, PluginSettingTab, Setting, Notice } : require(id), console, setTimeout, clearTimeout, Buffer };
          const code = fs.readFileSync("main.js", "utf8");
          vm.runInNewContext(`${code}\nmodule.exports.__testApi={analyzeLine,diagnosticFinalRows};`, context);
          const api = moduleRecord.exports.__testApi;
          for (const record of packet.records) {
            const rows = api.diagnosticFinalRows(api.analyzeLine(record.surface));
            const labels = rows.filter(row => row.kind === "construction").map(row => row.internal_construction || row.construction || row.type || "");
            const emitted = labels.includes("LocativeWhQuestion");
            if (emitted !== record.runtime.aa82Emitted) throw new Error(`AA82 observation drift for ${record.packetItemId}`);
            if (JSON.stringify(labels) !== JSON.stringify(record.runtime.constructionLabels)) throw new Error(`construction-label drift for ${record.packetItemId}`);
          }
          console.log(`Verified ${packet.records.length} runtime observations.`);
          NODE
      - name: Commit packet and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/generate-aa82-boundary-packet.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/corpus-reviews/AA82-ATTESTED-BOUNDARY-PACKET-R1.json docs/research/AA82-ATTESTED-BOUNDARY-PACKET-R1.md .github/workflows/generate-aa82-boundary-packet.yml
          git commit -m "Record AA82 attested boundary results"
          git push
