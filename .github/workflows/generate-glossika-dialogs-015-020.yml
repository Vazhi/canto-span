name: Export Glossika dialogs 001-020

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialogs-015-020-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Prepare twenty-dialog snapshot
        run: |
          python <<'PY'
          from pathlib import Path
          import shutil
          source = Path('data/pedagogical-corpus/glossika')
          target = Path('artifacts/glossika')
          target.mkdir(parents=True, exist_ok=True)
          directories = sorted(source.glob('GLOSSIKA-YUEHK-A1-DLG-*'))
          if len(directories) != 20:
              raise SystemExit(f'expected 20 dialog directories, found {len(directories)}')
          for directory in directories:
              shutil.copytree(directory, target / directory.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glossika-dialogs-001-020
          path: artifacts/glossika
          if-no-files-found: error
      - name: Remove temporary exporter
        run: |
          rm .github/workflows/generate-glossika-dialogs-015-020.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/generate-glossika-dialogs-015-020.yml
          git commit -m "Remove temporary Glossika snapshot exporter"
          git push
