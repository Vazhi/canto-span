name: Generate Glossika dialogs 015-020

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialogs-015-020-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate source-preserving packages
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import json
          import pathlib
          import re
          import unicodedata
          from collections import Counter, defaultdict

          ROOT = pathlib.Path.cwd()
          BASE = pathlib.Path('data/pedagogical-corpus/glossika')
          REPORT = pathlib.Path('docs/research/GLOSSIKA-YUEHK-A1-DLG-015-020-CORPUS-INGRESS.md')
          REVIEW_STATE = 'REQUIRES_EXPERT_CONTEXT_REVIEW'
          META = [
              dict(number=15, source_id='GLOSSIKA-YUEHK-A1-DLG-015-20260315', date='2026-03-15', gmail='19cf383c8e06b764', title='信唔信得過？', english='Can We Trust This?', cluster='trust_scam_potential_complement_review'),
              dict(number=16, source_id='GLOSSIKA-YUEHK-A1-DLG-016-20260322', date='2026-03-22', gmail='19d178ff50addfe4', title='佢講咗乜嘢?', english='What Did They Say?', cluster='reported_speech_meeting_wh_review'),
              dict(number=17, source_id='GLOSSIKA-YUEHK-A1-DLG-017-20260329', date='2026-03-29', gmail='19d3b9c433e07f1a', title='更正電話號碼', english='Correcting a Phone Number', cluster='correction_confirmation_contact_details_review'),
              dict(number=18, source_id='GLOSSIKA-YUEHK-A1-DLG-018-20260405', date='2026-04-05', gmail='19d5fa99f6aca9f7', title='邊個好啲?', english='Which One Is Better?', cluster='choice_comparative_preference_review'),
              dict(number=19, source_id='GLOSSIKA-YUEHK-A1-DLG-019-20260412', date='2026-04-12', gmail='19d83b5bd62025ae', title='唔好意思聽到', english='Sorry to Hear That', cluster='sympathy_bad_news_review'),
              dict(number=20, source_id='GLOSSIKA-YUEHK-A1-DLG-020-20260419', date='2026-04-19', gmail='19da7c1daf9d0355', title='問清楚巴士路線', english='Asking for Bus Route Clarification', cluster='bus_route_clarification_review'),
          ]
          TARGET_PREFIXES = tuple(f'{BASE.as_posix()}/{m["source_id"]}/' for m in META)
          TEXT_EXTENSIONS = {'.json', '.md', '.tsv', '.txt', '.js', '.cjs', '.mjs', '.yml', '.yaml'}
          EXCLUDED_DIRS = {'.git', 'node_modules'}

          def canonical(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()

          def sha(value):
              return 'sha256:' + hashlib.sha256(canonical(value)).hexdigest()

          def normalize(text):
              text = unicodedata.normalize('NFKC', text).lower()
              return ''.join(ch for ch in text if not unicodedata.category(ch).startswith(('P', 'Z', 'S', 'C')))

          def files_under(directory):
              for path in directory.rglob('*'):
                  if not path.is_file() or any(part in EXCLUDED_DIRS for part in path.parts):
                      continue
                  yield path

          def owner_class(rel):
              if rel.startswith('src/'):
                  return 'canonical'
              if rel == 'main.js':
                  return 'generated'
              if rel.startswith(('tests/', 'test-data/', 'data/', 'docs/', 'grammar/', 'config/', 'external-evidence/')):
                  return 'supporting'
              return 'other'

          exact_index = defaultdict(set)
          normalized_index = defaultdict(set)
          for path in files_under(ROOT):
              rel = path.relative_to(ROOT).as_posix()
              if rel.startswith(TARGET_PREFIXES) or rel == REPORT.as_posix() or rel == '.github/workflows/generate-glossika-dialogs-015-020.yml':
                  continue
              if path.suffix.lower() not in TEXT_EXTENSIONS or path.stat().st_size > 5_000_000:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for line in text.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      continue
                  exact_index[stripped].add(rel)
                  norm = normalize(stripped)
                  if norm:
                      normalized_index[norm].add(rel)

          def parse_raw(meta):
              directory = BASE / meta['source_id']
              raw_path = directory / 'raw-email.txt'
              text = raw_path.read_text(encoding='utf-8').replace('\r\n', '\n')
              lines = text.split('\n')
              nonempty = [line.strip() for line in lines if line.strip()]
              if nonempty[:4] != ['YUE_HK • A1', meta['title'], meta['english'], 'Dialog']:
                  raise ValueError(f'header mismatch for {meta["source_id"]}: {nonempty[:4]}')
              try:
                  dialog_index = next(i for i, line in enumerate(lines) if line.strip() == 'Dialog')
                  vocab_index = next(i for i, line in enumerate(lines) if line.strip() == 'Vocabulary')
                  notes_index = next(i for i, line in enumerate(lines) if line.strip() == 'Notes')
              except StopIteration as error:
                  raise ValueError(f'missing section in {meta["source_id"]}') from error
              dialog_lines = [line.strip() for line in lines[dialog_index + 1:vocab_index] if line.strip()]
              if len(dialog_lines) % 2:
                  raise ValueError(f'unpaired dialog lines in {meta["source_id"]}')
              turns = []
              for i in range(0, len(dialog_lines), 2):
                  source_line, jyutping = dialog_lines[i], dialog_lines[i + 1]
                  if ':' not in source_line or not (jyutping.startswith('/') and jyutping.endswith('/')):
                      raise ValueError(f'malformed turn pair in {meta["source_id"]}: {source_line!r} {jyutping!r}')
                  speaker, traditional = source_line.split(':', 1)
                  turns.append(dict(speaker=speaker.strip(), source_line=source_line, traditional=traditional.strip(), jyutping=jyutping))
              vocab_lines = [line.strip() for line in lines[vocab_index + 1:notes_index] if line.strip()]
              vocabulary = []
              pattern = re.compile(r'^(.*?)\s+/(.*?)/\s+-\s+(.*)$')
              for source_line in vocab_lines:
                  match = pattern.match(source_line)
                  if not match:
                      raise ValueError(f'malformed vocabulary line in {meta["source_id"]}: {source_line!r}')
                  traditional, jyutping, english = match.groups()
                  vocabulary.append(dict(source_line=source_line, traditional=traditional.strip(), jyutping='/' + jyutping.strip() + '/', english=english.strip()))
              notes = '\n'.join(lines[notes_index + 1:]).strip()
              if not notes:
                  raise ValueError(f'empty notes in {meta["source_id"]}')
              if len(turns) != 40:
                  raise ValueError(f'expected 40 turns in {meta["source_id"]}, found {len(turns)}')
              return raw_path, turns, vocabulary, notes

          def match_owners(surface):
              exact = sorted(exact_index.get(surface, set()))
              normalized = sorted(normalized_index.get(normalize(surface), set()))
              canonical_exact = [p for p in exact if owner_class(p) == 'canonical']
              supporting_exact = [p for p in exact if owner_class(p) == 'supporting']
              canonical_normalized = [p for p in normalized if owner_class(p) == 'canonical' and p not in canonical_exact]
              supporting_normalized = [p for p in normalized if owner_class(p) == 'supporting' and p not in supporting_exact]
              if canonical_exact or supporting_exact:
                  relation = 'exact_duplicate_candidate'
              elif canonical_normalized or supporting_normalized:
                  relation = 'normalized_duplicate_candidate'
              else:
                  relation = 'no_project_match'
              return relation, canonical_exact, canonical_normalized, supporting_exact, supporting_normalized

          all_summaries = []
          discrepancy_rows = []
          raw_paths = []
          for meta in META:
              directory = BASE / meta['source_id']
              raw_path, turns, vocabulary, notes = parse_raw(meta)
              raw_paths.append(raw_path)
              item_specs = []
              for turn_number, turn in enumerate(turns, 1):
                  item_specs.append(dict(item_type='dialog_turn', turn=turn_number, vocabulary_ordinal=None, speaker=turn['speaker'], source=dict(sourceLine=turn['source_line'], traditional=turn['traditional'], jyutpingLine=turn['jyutping'], english=None)))
              for vocabulary_ordinal, entry in enumerate(vocabulary, 1):
                  item_specs.append(dict(item_type='vocabulary_entry', turn=None, vocabulary_ordinal=vocabulary_ordinal, speaker=None, source=dict(sourceLine=entry['source_line'], traditional=entry['traditional'], jyutpingLine=entry['jyutping'], english=entry['english'])))

              items = []
              review_records = []
              crosswalk_items = []
              relation_counts = Counter()
              classification_counts = Counter()
              for ordinal, spec in enumerate(item_specs, 1):
                  item_id = f'{meta["source_id"]}-I{ordinal:03d}'
                  surface = spec['source']['traditional']
                  relation, canonical_exact, canonical_normalized, supporting_exact, supporting_normalized = match_owners(surface)
                  classification = 'naturalness_review_candidate' if spec['item_type'] == 'dialog_turn' else 'lexical_review_candidate'
                  flags = [classification, meta['cluster']]
                  if spec['item_type'] == 'dialog_turn':
                      flags.append('source_turn_translation_not_provided')
                  source_hash = sha(spec['source'])
                  item = dict(id=item_id, ordinal=ordinal, itemType=spec['item_type'], source=spec['source'], sourceHash=source_hash)
                  if spec['turn'] is not None:
                      item['turn'] = spec['turn']; item['speaker'] = spec['speaker']
                  else:
                      item['vocabularyOrdinal'] = spec['vocabulary_ordinal']
                  items.append(item)
                  relation_counts[relation] += 1
                  classification_counts[classification] += 1
                  normalized = normalize(surface)
                  review_records.append(dict(id=item_id, sourceHash=source_hash, normalizedCantonese=normalized, deduplicationRelation=relation, ingressClassification=classification, reviewFlags=flags, reviewedValues={}, reviewerNote='', evidenceUse='not_authorized'))
                  previous_turn_id = f'{meta["source_id"]}-I{spec["turn"] - 1:03d}' if spec['turn'] and spec['turn'] > 1 else None
                  next_turn_id = f'{meta["source_id"]}-I{spec["turn"] + 1:03d}' if spec['turn'] and spec['turn'] < len(turns) else None
                  crosswalk_items.append(dict(
                      sourceItemId=item_id, ordinal=ordinal, itemType=spec['item_type'], sourceDisplay=surface, sourceHash=source_hash,
                      sourceDialogOccurrence=None,
                      adjacency=dict(previousTurnId=previous_turn_id, nextTurnId=next_turn_id,
                                     previousSpeaker=turns[spec['turn'] - 2]['speaker'] if spec['turn'] and spec['turn'] > 1 else None,
                                     nextSpeaker=turns[spec['turn']]['speaker'] if spec['turn'] and spec['turn'] < len(turns) else None),
                      deduplicationRelation=relation, ingressClassification=classification,
                      canonicalExactOwners=canonical_exact, canonicalNormalizedOwners=canonical_normalized,
                      supportingExactOwners=supporting_exact, supportingNormalizedOwners=supporting_normalized,
                      runtimeLexicalOwner=canonical_exact[0] if canonical_exact else None,
                      reviewFlags=flags,
                      constructionRouting=[dict(parentIssue=130, cluster=meta['cluster'], status='research_route_only')]
                  ))
                  if relation != 'no_project_match':
                      discrepancy_rows.append(dict(sourceId=meta['source_id'], itemId=item_id, surface=surface, relation=relation,
                                                   canonicalExactOwners=canonical_exact, canonicalNormalizedOwners=canonical_normalized,
                                                   supportingExactOwners=supporting_exact, supportingNormalizedOwners=supporting_normalized))

              payload_hash = sha([item['source'] for item in items])
              source_doc = dict(
                  schema='canto-span-pedagogical-dialog-source-v1',
                  source=dict(sourceId=meta['source_id'], provider='Glossika', course='Cantonese (Hong Kong) A1 Dialogs', dialogNumber=meta['number'], title=meta['title'], englishTitle=meta['english'], sourceDate=meta['date'], gmailMessageId=meta['gmail'], sourceType='authorized_pedagogical_email', language='yue-Hant-HK', sourceFormat='Glossika dialog email; Cantonese and source Jyutping per turn; vocabulary and notes preserved; no per-turn English translation', authorization=dict(basis='User states Glossika granted permission to use all lesson data in this non-commercial private-use Canto Span project.', scope='Source-preserving corpus ingress for this dialog.', redistributionClaim='none')),
                  ingress=dict(issue=369, workClaimIssue=384, branch='agent/glossika-dialogs-015-020-ingress', reviewState=REVIEW_STATE, policy='Source values are immutable. Normalization, deduplication, naturalness review, construction routing, and evidence use are recorded separately.', recordCount=len(items), turnCount=len(turns), vocabularyCount=len(vocabulary), vocabularyBlockState='source_present', vocabularyExactSurfaceAbsentFromDialogCount=sum(1 for entry in vocabulary if entry['traditional'] not in ''.join(t['traditional'] for t in turns)), itemTypeCounts=dict(dialog_turn=len(turns), vocabulary_entry=len(vocabulary)), sourcePayloadHash=payload_hash, sourcePayloadHashPolicy='SHA-256 of canonical key-sorted JSON for the ordered source-field array.', turnEnglishPolicy='The source email provides an English dialog title but no per-turn English translation; each turn preserves english=null.'),
                  items=items,
                  sourceNotes=dict(raw=notes)
              )
              alerts = [
                  dict(scope='all_dialog_turns', type='missing_turn_english_translation', status='source_omission_preserved', note='The email supplies Cantonese and source Jyutping but no per-turn English translations.'),
                  dict(scope=f'{meta["source_id"]}-I001 through {meta["source_id"]}-I{len(turns):03d}', type=meta['cluster'], status='route_to_parent_130', note='Potential linguistic and naturalness questions remain contextual pedagogical attestations and are routed to #130.'),
                  dict(scope='source_notes', type='pedagogical_claims_unverified', status='source_claim_preserved', note='Glossika notes are preserved as source metadata and are not adopted as Canto Span grammar conclusions.'),
              ]
              review_doc = dict(
                  schema='canto-span-pedagogical-dialog-review-v1', sourceId=meta['source_id'], sourcePayloadHash=payload_hash,
                  policy=dict(sourceLayer='source.json is immutable.', translationBoundary='Missing per-turn translations are preserved and must not be generated during ingress.', sourceBlockBoundary='Vocabulary and notes are preserved from the source email without endorsement.', deduplicationBoundary='Exact and normalized repository matches are candidates until reviewed.', evidenceBoundary='Dialog adjacency and pedagogical attestation do not establish productivity, construction identity, register, or parser behavior.'),
                  summary=dict(recordCount=len(items), reviewedCount=0, unreviewedCount=len(items), classificationCounts=dict(classification_counts), relationCounts=dict(relation_counts), vocabularyCount=len(vocabulary), vocabularyBlockState='source_present', knownSourceAlerts=alerts),
                  records=review_records
              )
              crosswalk_doc = dict(
                  schema='canto-span-pedagogical-dialog-crosswalk-v1', sourceId=meta['source_id'], sourcePayloadHash=payload_hash,
                  architecture=dict(canonicalRuntimeInputs=['src/**', 'src/runtime-resources/**'], generatedExcluded=['main.js'], supportingRecords=['tests/**', 'test-data/**', 'data/**', 'docs/**', 'grammar/**', 'config/**', 'external-evidence/**']),
                  summary=dict(recordCount=len(items), turnCount=len(turns), vocabularyCount=len(vocabulary), vocabularyBlockState='source_present', vocabularyExactSurfaceAbsentFromDialogCount=source_doc['ingress']['vocabularyExactSurfaceAbsentFromDialogCount'], classificationCounts=dict(classification_counts), relationCounts=dict(relation_counts)),
                  sourceBlockAudit=dict(state='source_present', absentVocabulary=[entry['traditional'] for entry in vocabulary if entry['traditional'] not in ''.join(t['traditional'] for t in turns)]),
                  items=crosswalk_items
              )
              directory.mkdir(parents=True, exist_ok=True)
              for filename, doc in [('source.json', source_doc), ('review.json', review_doc), ('crosswalk.json', crosswalk_doc)]:
                  (directory / filename).write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              headers = ['id','ordinal','item_type','turn','speaker','vocabulary_ordinal','source_cantonese','source_jyutping','source_english','source_hash','source_dialog_exact_surface_present','previous_turn_id','next_turn_id','deduplication_relation','ingress_classification','runtime_lexical_owners','canonical_exact_owners','supporting_exact_owners','review_flags','review_state']
              with (directory / 'items.tsv').open('w', encoding='utf-8', newline='') as handle:
                  writer = csv.DictWriter(handle, delimiter='\t', fieldnames=headers, lineterminator='\n')
                  writer.writeheader()
                  for item, cross in zip(items, crosswalk_items):
                      writer.writerow(dict(
                          id=item['id'], ordinal=item['ordinal'], item_type=item['itemType'], turn=item.get('turn',''), speaker=item.get('speaker',''), vocabulary_ordinal=item.get('vocabularyOrdinal',''), source_cantonese=item['source']['traditional'], source_jyutping=item['source']['jyutpingLine'], source_english=item['source']['english'] or '', source_hash=item['sourceHash'], source_dialog_exact_surface_present='', previous_turn_id=cross['adjacency']['previousTurnId'] or '', next_turn_id=cross['adjacency']['nextTurnId'] or '', deduplication_relation=cross['deduplicationRelation'], ingress_classification=cross['ingressClassification'], runtime_lexical_owners=cross['runtimeLexicalOwner'] or '', canonical_exact_owners='|'.join(cross['canonicalExactOwners']), supporting_exact_owners='|'.join(cross['supportingExactOwners']), review_flags='|'.join(cross['reviewFlags']), review_state=REVIEW_STATE
                      ))
              readme = f'''# {meta['source_id']}\n\nGlossika A1 dialog {meta['number']:03d}: **{meta['title']}** / **{meta['english']}**.\n\n- Source date: `{meta['date']}`\n- Gmail message ID: `{meta['gmail']}`\n- Dialog turns: **{len(turns)}**\n- Vocabulary entries: **{len(vocabulary)}**\n- Review state: `{REVIEW_STATE}`\n- Construction routing: issue #130 only\n\n`source.json` preserves source values. `review.json` and `crosswalk.json` keep normalization, deduplication, review flags, adjacency, and evidence-use boundaries separate. Per-turn English remains null because it is absent from the email. Source notes are preserved without endorsement.\n'''
              (directory / 'README.md').write_text(readme, encoding='utf-8')
              all_summaries.append(dict(sourceId=meta['source_id'], dialogNumber=meta['number'], title=meta['title'], turnCount=len(turns), vocabularyCount=len(vocabulary), recordCount=len(items), relationCounts=dict(relation_counts), classificationCounts=dict(classification_counts), sourcePayloadHash=payload_hash))

          total_relations = Counter()
          total_classifications = Counter()
          for summary in all_summaries:
              total_relations.update(summary['relationCounts'])
              total_classifications.update(summary['classificationCounts'])
          lines = [
              '# Glossika A1 dialogs 015–020 corpus ingress', '',
              'Date: 2026-07-31  ',
              'Parent discovery program: #130  ',
              'Ingress issue: #369', '',
              '## Outcome', '',
              'All six authorized emails are preserved as independently identified source packages. Exact Cantonese, punctuation, speakers, turn order, source Jyutping, vocabulary entries, notes, dates, titles, and Gmail identifiers are retained. Missing per-turn English remains null.', '',
              'No grammar, identity, productivity, naturalness, runtime, or preferred-normalization decision is made by this ingress.', '',
              '## Coverage', '',
              '| Dialog | Source ID | Turns | Vocabulary | Records |',
              '|---|---|---:|---:|---:|',
          ]
          for summary in all_summaries:
              lines.append(f"| {summary['dialogNumber']:03d} — {summary['title']} | `{summary['sourceId']}` | {summary['turnCount']} | {summary['vocabularyCount']} | {summary['recordCount']} |")
          lines += ['', f"Total records: **{sum(s['recordCount'] for s in all_summaries)}**.", '', '## Deduplication', '']
          for key in sorted(total_relations):
              lines.append(f'- `{key}`: **{total_relations[key]}**')
          lines += ['', 'Exact and normalized matches are review candidates, not automatic mergers. Owners remain recorded per item in each `crosswalk.json`.', '', '## Review classification', '']
          for key in sorted(total_classifications):
              lines.append(f'- `{key}`: **{total_classifications[key]}**')
          lines += ['', '## Discrepancy and candidate routing', '', f'- Repository-match candidates recorded: **{len(discrepancy_rows)}**.', '- Per-turn English translations are absent in all six emails and remain null.', '- Glossika pedagogical notes are preserved as source claims but not adopted as project conclusions.', '- All construction, naturalness, translation, pronunciation, and coverage questions route to #130 for bounded decision discovery.', '', '## Evidence boundary', '', 'These packages establish authorized pedagogical attestation and provenance only. They do not establish unrestricted productivity, construction identity, dialect-wide naturalness, corpus frequency, parser correctness, or preferred Jyutping where sources conflict.', '']
          REPORT.parent.mkdir(parents=True, exist_ok=True)
          REPORT.write_text('\n'.join(lines), encoding='utf-8')

          for summary in all_summaries:
              directory = BASE / summary['sourceId']
              source = json.loads((directory/'source.json').read_text())
              review = json.loads((directory/'review.json').read_text())
              crosswalk = json.loads((directory/'crosswalk.json').read_text())
              if source['ingress']['sourcePayloadHash'] != sha([item['source'] for item in source['items']]):
                  raise ValueError(f'payload hash drift in {summary["sourceId"]}')
              if len(source['items']) != len(review['records']) or len(source['items']) != len(crosswalk['items']):
                  raise ValueError(f'record count mismatch in {summary["sourceId"]}')
              turn_items = [item for item in crosswalk['items'] if item['itemType'] == 'dialog_turn']
              for index, item in enumerate(turn_items):
                  expected_previous = turn_items[index-1]['sourceItemId'] if index else None
                  expected_next = turn_items[index+1]['sourceItemId'] if index + 1 < len(turn_items) else None
                  if item['adjacency']['previousTurnId'] != expected_previous or item['adjacency']['nextTurnId'] != expected_next:
                      raise ValueError(f'adjacency drift in {summary["sourceId"]} {item["sourceItemId"]}')
          for path in raw_paths:
              path.unlink()
          print(json.dumps(dict(dialogs=len(all_summaries), records=sum(s['recordCount'] for s in all_summaries), relations=dict(total_relations), classifications=dict(total_classifications)), ensure_ascii=False, indent=2))
          PY
      - name: Verify generated package set
        shell: bash
        run: |
          test ! -e data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-015-20260315/raw-email.txt
          for n in 015-20260315 016-20260322 017-20260329 018-20260405 019-20260412 020-20260419; do
            d="data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-$n"
            test -s "$d/source.json"
            test -s "$d/review.json"
            test -s "$d/crosswalk.json"
            test -s "$d/items.tsv"
            test -s "$d/README.md"
          done
          test -s docs/research/GLOSSIKA-YUEHK-A1-DLG-015-020-CORPUS-INGRESS.md
      - name: Commit final ingress package
        shell: bash
        run: |
          rm .github/workflows/generate-glossika-dialogs-015-020.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pedagogical-corpus/glossika docs/research/GLOSSIKA-YUEHK-A1-DLG-015-020-CORPUS-INGRESS.md .github/workflows/generate-glossika-dialogs-015-020.yml
          git commit -m "Preserve Glossika dialogs 015-020"
          git push
