name: Finalize nominal-modification corpus review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/nominal-modification-final-corpus-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Rebuild and verify review packet
        run: |
          cat scripts/tmp-nominal-finalizer.b64.part* > /tmp/nominal-finalizer.b64
          base64 -d /tmp/nominal-finalizer.b64 > scripts/tmp-finalize-nominal-review.py
          rm -f scripts/tmp-nominal-finalizer.b64.part* /tmp/nominal-finalizer.b64
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/tmp-finalize-nominal-review.py")
          text = path.read_text(encoding="utf-8")
          needle = 'assert len({row["candidate_id"] for row in raw_aa07} - set(EXPECTED_AA07_IDS)) == 896'
          replacement = 'assert len({{row["candidate_id"] for row in raw_aa07}} - set(EXPECTED_AA07_IDS)) == 896'
          if needle not in text:
              raise SystemExit("expected verifier set-comprehension line not found")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
          python3 scripts/tmp-finalize-nominal-review.py
      - name: Commit generated findings
        run: |
          git config user.name "canto-span-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Complete nominal-modification corpus review"
            git push origin HEAD:${{ github.head_ref }}
          fi
