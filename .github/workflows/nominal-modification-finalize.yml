name: Finalize nominal-modification corpus review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/nominal-modification-final-corpus-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Rebuild and verify review packet
        run: |
          cat > /tmp/finalizer-parts.sha256 <<'EOF'
          c7630d4ddc646b257d207a02407015959229cdcf25268556473056406b84912a  scripts/tmp-nominal-finalizer.b64.part00a
          631d9f48c866e301b10d820313edf14b356efbc51341974e8a811c89698c4e12  scripts/tmp-nominal-finalizer.b64.part00b
          aedb0a703b003d1f6d5a44e01f68474f216b846b2097033db2011454b644da46  scripts/tmp-nominal-finalizer.b64.part00c
          9e5c5ba4685c220fdcdcfd1b9868bc3ffc4781b2ece1ae0c43d469604ed47968  scripts/tmp-nominal-finalizer.b64.part00d
          1b4970195b57659773cbe18b9530d16eb92cf0db6c495e91c44e35257afaaf7e  scripts/tmp-nominal-finalizer.b64.part01
          d72c4e084ba62afdff214dc5f39c9e3cedd7d2c1dbda9a6c618cca36e58216c2  scripts/tmp-nominal-finalizer.b64.part02
          3e0d715692da1bc6bbc73be943435fbef5c2d52e8af9df33045cf1c9eea25928  scripts/tmp-nominal-finalizer.b64.part03
          feaafcf35858ac80f3208300da77f77050e80292e6464645041f33c4143c8b3a  scripts/tmp-nominal-finalizer.b64.part04
          34de495b4044b0ced00cbdc56a54f8e1669586bd7268dca79426dcb168299eee  scripts/tmp-nominal-finalizer.b64.part05
          8e77be32d9c05c8f04b44e712c959e182b0535b3683862bf3de22dc5475d5f92  scripts/tmp-nominal-finalizer.b64.part06
          041fb8f4e9e34e03d9f70f78551f2b6d26a5ec9468c3902d9855f4dce284f638  scripts/tmp-nominal-finalizer.b64.part07
          EOF
          sha256sum -c /tmp/finalizer-parts.sha256
          cat \
            scripts/tmp-nominal-finalizer.b64.part00a \
            scripts/tmp-nominal-finalizer.b64.part00b \
            scripts/tmp-nominal-finalizer.b64.part00c \
            scripts/tmp-nominal-finalizer.b64.part00d \
            scripts/tmp-nominal-finalizer.b64.part01 \
            scripts/tmp-nominal-finalizer.b64.part02 \
            scripts/tmp-nominal-finalizer.b64.part03 \
            scripts/tmp-nominal-finalizer.b64.part04 \
            scripts/tmp-nominal-finalizer.b64.part05 \
            scripts/tmp-nominal-finalizer.b64.part06 \
            scripts/tmp-nominal-finalizer.b64.part07 \
            > /tmp/nominal-finalizer.b64
          base64 -d /tmp/nominal-finalizer.b64 > scripts/tmp-finalize-nominal-review.py
          rm -f scripts/tmp-nominal-finalizer.b64.part* /tmp/nominal-finalizer.b64 /tmp/finalizer-parts.sha256
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/tmp-finalize-nominal-review.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'assert len({row["candidate_id"] for row in raw_aa07} - set(EXPECTED_AA07_IDS)) == 896':
                  'assert len({{row["candidate_id"] for row in raw_aa07}} - set(EXPECTED_AA07_IDS)) == 896',
              'writer = csv.DictWriter(handle, fieldnames=SOURCE_FIELDS, delimiter="\\t")':
                  'writer = csv.DictWriter(handle, fieldnames=SOURCE_FIELDS, delimiter="\\t", lineterminator="\\n")',
          }
          for needle, replacement in replacements.items():
              if needle not in text:
                  raise SystemExit(f"expected finalizer line not found: {needle}")
              text = text.replace(needle, replacement)
          path.write_text(text, encoding="utf-8")
          PY
          python3 scripts/tmp-finalize-nominal-review.py
      - name: Commit generated findings
        run: |
          git config user.name "canto-span-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Complete nominal-modification corpus review"
            git push origin HEAD:${{ github.head_ref }}
          fi
