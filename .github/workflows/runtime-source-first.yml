name: Runtime source-first validation

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "config/verification-profiles.json"
      - "package.json"
      - "package-lock.json"
      - "main.js"
      - ".github/workflows/runtime-source-first.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "config/verification-profiles.json"
      - "package.json"
      - "package-lock.json"
      - "main.js"
      - ".github/workflows/runtime-source-first.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ab33-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ab33-outer-question-composition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab33-outer-question-composition
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Apply source migration if needed
        shell: bash
        run: |
          if grep -q 'function typedPreferencePredicateParts' src/parser/detectors/questions/a-not-a.js; then
            echo "AB33 repair already applied"
          else
            node tools/temp-apply-ab33-question-repair.js
          fi
      - run: npm run build:runtime
      - name: Commit claimed AB33 outputs only
        shell: bash
        run: |
          allowed='^( M (main\.js|src/parser/detectors/questions/a-not-a\.js|tests/constructions/ANotAQuestion\.json|tests/constructions/CopularANotAQuestion\.json))$'
          status="$(git status --short)"
          unexpected="$(printf '%s\n' "$status" | grep -Ev "$allowed" | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during AB33 repair/build:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js src/parser/detectors/questions/a-not-a.js tests/constructions/ANotAQuestion.json tests/constructions/CopularANotAQuestion.json
          git diff --cached --check
          git diff --cached --quiet && { echo "No claimed AB33 output changes"; exit 0; }
          git commit -m "Repair AB33 outer-question composition"
          git push origin HEAD:agent/ab33-outer-question-composition

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Run runtime verification profile
        run: npm run verify:runtime
