name: CS-WORK-0261 Week 14 research validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week14-research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Regenerate canonical lexicon coverage matrix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sourcePath = 'data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/source.json';
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const tokenPairs = require('./src/runtime-resources/lexicon/token-lexicon');
          const productivePairs = require('./src/runtime-resources/lexicon/productive-vo');
          const formulas = require('./src/runtime-resources/lexicon/formulas');
          const compositional = require('./src/runtime-resources/lexicon/compositional-lexical-phrases');
          const tokenMap = new Map(tokenPairs);
          const productiveMap = new Map(productivePairs);
          const formulaSet = new Set(formulas);
          const compositionalSet = new Set(compositional);
          const lexiconRoot = 'src/runtime-resources/lexicon';
          const files = [];
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, {withFileTypes: true})) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.js')) files.push(full);
            }
          }
          walk(lexiconRoot);
          const fileText = Object.fromEntries(files.map(file => [file, fs.readFileSync(file, 'utf8')]));
          const entries = source.items.filter(item => item.itemType === 'lexical_entry').map(item => {
            const form = item.source.traditional;
            const exactOwners = [];
            if (tokenMap.has(form)) exactOwners.push('src/runtime-resources/lexicon/token-lexicon');
            if (productiveMap.has(form)) exactOwners.push('src/runtime-resources/lexicon/productive-vo.js');
            if (formulaSet.has(form)) exactOwners.push('src/runtime-resources/lexicon/formulas.js');
            if (compositionalSet.has(form)) exactOwners.push('src/runtime-resources/lexicon/compositional-lexical-phrases.js');
            const rawMentions = files.filter(file => fileText[file].includes(JSON.stringify(form)));
            const compositionalNumeral = /^[一二三四五六七八九十]萬$/.test(form);
            let disposition;
            if (exactOwners.length) disposition = 'already_covered_exact';
            else if (compositionalNumeral) disposition = 'compositional_numeral_no_opaque_entry';
            else disposition = 'lexical_ingress_candidate';
            return {
              sourceItemId: item.id,
              ordinal: item.ordinal,
              traditional: form,
              sourceJyutping: item.source.jyutping,
              sourceEnglish: item.source.english,
              exactRuntimeOwners: exactOwners,
              rawCanonicalMentions: rawMentions,
              compositionalNumeral,
              disposition,
              recommendation: disposition === 'lexical_ingress_candidate'
                ? 'review_for_smallest_canonical_lexicon_owner'
                : disposition === 'compositional_numeral_no_opaque_entry'
                  ? 'retain_compositional_analysis_do_not_add_opaque_whole_form'
                  : 'no_duplicate_ingress'
            };
          });
          const counts = entries.reduce((out, entry) => {
            out[entry.disposition] = (out[entry.disposition] || 0) + 1;
            return out;
          }, {});
          const output = {
            schema: 'canto-span-glossika-lexical-ingress-candidates-v1',
            packetId: 'GLOSSIKA-YUEHK-A1-W14-20260621-LEXICAL-INGRESS-R1',
            sourceId: source.source.sourceId,
            generatedFrom: {
              sourcePath,
              canonicalLexiconRoot: lexiconRoot,
              exactOwnersScanned: ['token-lexicon', 'productive-vo', 'formulas', 'compositional-lexical-phrases']
            },
            policy: {
              glossikaWeight: 'pedagogical_and_lexical_attestation_only',
              exactCoverageRule: 'An exact canonical runtime entry blocks duplicate ingress.',
              numeralRule: 'Digit or ten plus 萬 remains compositional; do not add ten opaque whole-form entries.',
              implementationAuthorized: false
            },
            counts,
            entries
          };
          const rendered = JSON.stringify(output, null, 2) + '\n';
          const pathOut = 'data/research-ledgers/glossika-week14-lexical-ingress.json';
          if (fs.readFileSync(pathOut, 'utf8') !== rendered) throw new Error('Lexical ingress matrix is stale');
          NODE
      - name: Validate research packet
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = require('./data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/source.json');
          const claims = require('./data/research-ledgers/glossika-week14-claim-source.json');
          const lexical = require('./data/research-ledgers/glossika-week14-lexical-ingress.json');
          const followup = require('./data/research-ledgers/glossika-week14-followup-candidates.json');
          if (source.items.length !== 61) throw new Error('Expected 61 source records');
          if (lexical.entries.length !== 35) throw new Error('Expected 35 lexical records');
          if (lexical.counts.lexical_ingress_candidate !== 21) throw new Error('Expected 21 lexical candidates');
          if (lexical.counts.already_covered_exact !== 4) throw new Error('Expected 4 exact existing entries');
          if (lexical.counts.compositional_numeral_no_opaque_entry !== 10) throw new Error('Expected 10 compositional numerals');
          if (claims.claims.length !== 11) throw new Error('Expected 11 bounded claims');
          if (followup.candidates.length !== 9) throw new Error('Expected 9 follow-up candidates');
          const note = fs.readFileSync('docs/research/GLOSSIKA-YUEHK-A1-W14-20260621-RESEARCH.md', 'utf8');
          for (const required of ['21 lexical-review candidates', 'no runtime', '唔該', '多謝', '幾辛苦㗎']) {
            if (!note.toLowerCase().includes(required.toLowerCase())) throw new Error(`Research note missing ${required}`);
          }
          console.log({sourceRecords: source.items.length, claims: claims.claims.length, lexical: lexical.counts, followups: followup.candidates.length});
          NODE
          git diff --check
      - name: Run repository verification
        run: |
          npm run verify:research
          npm run verify
