name: Vernacular reading ingest

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  ingest:
    if: github.event.head_commit.message == 'Run vernacular reading ingest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash tools/tmp-vernacular-reading-ingest.sh
