name: Source-scope policy temporary validation

on:
  push:
    branches: [agent/source-scope-outcome-discovery]
    paths: [.github/workflows/source-scope-policy-test-temp.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/source-scope-outcome-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Preconditions and patch generator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b649d6579bce4cbe1a1da1b2ac4586caf5b4d2f4"
          python3 <<'PY'
          import subprocess
          from pathlib import Path
          expected={
            'tools/discovery-source-scope-policy.js',
            'tests/tooling/discovery/source-scope-outcome.test.js',
            '.github/workflows/source-scope-policy-test-temp.yml',
          }
          got=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          assert got == expected,(sorted(got),sorted(expected))

          p=Path('tools/generate-supported-productive-discovery.js')
          text=p.read_text()
          require_anchor='const { loadConstructionNotes } = require("./construction-notes-lib");\n'
          require_line='const { sourceScopeGate, sourceStageCandidateState } = require("./discovery-source-scope-policy");\n'
          assert require_anchor in text
          assert require_line not in text
          text=text.replace(require_anchor,require_anchor+require_line,1)

          old_scope='''  const scopeGate = fm.current_standard_reaudit_complete === true && allVerified\n    ? gate("pass", "current_standard_reaudit_complete_with_verified_sources")\n    : allVerified\n      ? gate("partial", "verified_sources_but_scope_reaudit_incomplete")\n      : gate("unresolved", "source_scope_not_closed");\n'''
          new_scope='''  const scopeGate = sourceScopeGate(fm, allVerified);\n'''
          assert text.count(old_scope)==1,text.count(old_scope)
          text=text.replace(old_scope,new_scope,1)

          old_state='''  let state = "research_candidate";\n  if (gates.independent_source_support.status === "pass") state = "source_supported";\n  if (state === "source_supported" && gates.source_scope_matches_claim.status === "pass" && gates.runtime_research_alignment.status === "pass") state = "behavior_aligned";\n'''
          new_state='''  let state = sourceStageCandidateState(gates);\n  if (state === "narrowing_candidate") return state;\n  if (state === "source_supported" && gates.source_scope_matches_claim.status === "pass" && gates.runtime_research_alignment.status === "pass") state = "behavior_aligned";\n'''
          assert text.count(old_state)==1,text.count(old_state)
          text=text.replace(old_state,new_state,1)
          p.write_text(text)
          PY
      - name: Validate focused policy and unchanged legacy discovery output
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/tooling/discovery/source-scope-outcome.test.js
          node tools/generate-supported-productive-discovery.js
          npm run verify
          npm run verify:discovery
      - name: Commit tooling only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- validation/current 2>/dev/null || true
          git clean -fd validation/current || true
          python3 <<'PY'
          import subprocess
          allowed={'tools/generate-supported-productive-discovery.js'}
          rows=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          normal={row[3:] for row in rows if len(row)>=4 and not row[3:].startswith('.github/workflows/')}
          assert normal == allowed,(normal,allowed)
          PY
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add tools/generate-supported-productive-discovery.js
          git commit -m "Respect explicit source-scope audit outcomes"
          git push origin HEAD:agent/source-scope-outcome-discovery
