name: Temporary AB15 structural implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.head_ref == 'agent/ab15-structural-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Check out claimed branch
        uses: actions/checkout@v4
        with:
          ref: agent/ab15-structural-boundaries
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply accepted AB15 structural consequences
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          templates_path = root / 'src/runtime-resources/grammar/templates/category-span-templates.js'
          text = templates_path.read_text(encoding='utf-8')
          old_ab15 = '''  {
            type: "OvertHeadDemonstrativeClassifierNP",
            label: "NP",
