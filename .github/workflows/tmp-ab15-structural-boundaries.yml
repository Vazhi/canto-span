          },
          ''' + generic_modified
          if generic_modified not in text:
              raise SystemExit('Generic ModifiedNP insertion point not found')
          text = text.replace(generic_modified, specific_modified, 1)
          templates_path.write_text(text, encoding='utf-8')

          def recalc(spec):
              focused = spec.get('focused_cases', [])
              probes = spec.get('implementation_probe_cases', [])
              positive = sum(1 for case in focused if case.get('assertion') == 'construction_present')
              boundary = sum(1 for case in focused if case.get('assertion') == 'construction_absent')
              review = sum(1 for case in focused if case.get('assertion') == 'review_only_parse_succeeds')
              snapshot = len(spec.get('snapshot_cases', []))
              np_count = len(spec.get('np_cases', []))
              alias = sum(1 for case in probes if case.get('assertion') == 'compatibility_alias_present')
              spec['coverage'] = {
                  'state': 'positive_and_boundary' if snapshot + positive and boundary else ('positive_only' if snapshot + positive else 'boundary_only'),
                  'exact_snapshot_positive_count': snapshot,
                  'focused_positive_count': positive,
                  'focused_boundary_count': boundary,
                  'focused_review_only_count': review,
                  'np_case_count': np_count,
                  'implementation_probe_count': len(probes),
                  'compatibility_alias_probe_count': alias,
                  'positive_case_count': snapshot + positive,
                  'boundary_case_count': boundary,
                  'executable_case_count': snapshot + len(focused) + np_count + len(probes),
              }

          ab15_path = root / 'tests/constructions/OvertHeadDemonstrativeClassifierNP.json'
          ab15 = json.loads(ab15_path.read_text(encoding='utf-8'))
          ab15['focused_cases'] = [
              {'case_id':'AB15-P01','source':'呢本書。','class':'no_numeral_dem_cl_overt_n','expected_profile':'construction_present','assertion':'construction_present','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix','source_ids':['SRC-BOND-SIO-2024-CLASSIFIERS','SRC-CHENG-SYBESMA-2014-NP-STRUCTURE','SRC-MATTHEWS-YIP-COMPREHENSIVE-CH6']},
              {'case_id':'AB15-P02','source':'嗰間餐廳。','class':'distal_no_numeral_dem_cl_overt_n','expected_profile':'construction_present','assertion':'construction_present','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix','source_ids':['SRC-MATTHEWS-YIP-COMPREHENSIVE-CH6']},
              {'case_id':'AB15-N01','source':'呢個。','class':'headless_demonstrative_classifier_sibling','expected_profile':'construction_absent','assertion':'construction_absent','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix'},
              {'case_id':'AB15-N02','source':'呢三本書。','class':'overt_numeral_sibling','expected_profile':'construction_absent','assertion':'construction_absent','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix'},
              {'case_id':'AB15-N03','source':'本書。','class':'bare_classifier_noun_sibling','expected_profile':'construction_absent','assertion':'construction_absent','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix'},
              {'case_id':'AB15-N04','source':'三本書。','class':'quantified_classifier_sibling','expected_profile':'construction_absent','assertion':'construction_absent','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix'},
              {'case_id':'AB15-N05','source':'呢書。','class':'missing_classifier_no_repair','expected_profile':'construction_absent','assertion':'construction_absent','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix'},
              {'case_id':'AB15-N06','source':'嗰間新開嘅意大利餐廳。','class':'modifier_bearing_composition','expected_profile':'construction_absent','assertion':'construction_absent','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix'},
