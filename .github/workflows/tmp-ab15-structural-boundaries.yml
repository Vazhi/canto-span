            label: "NP",
            template: ["demonstrative!", "classifier!", "head_noun!"],
            template_family: "generative_template",
            constraints: {
              slot_must_not_have_slots: {
                demonstrative: ["quantity", "wh_determiner", "di_determiner"],
                classifier: ["quantity", "wh_determiner", "di_determiner"],
