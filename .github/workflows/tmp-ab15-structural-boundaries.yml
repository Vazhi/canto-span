name: Temporary AB15 structural implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.head_ref == 'agent/ab15-structural-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ab15-structural-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply accepted migrations
        run: |
          python3 tools/tmp-ab15-apply-runtime.py
          python3 tools/tmp-ab15-apply-tests.py
          python3 tools/tmp-ab15-apply-note.py
      - name: Test source runtime
        run: |
          npm test
          npm run test:np
          npm run test:constructions
      - name: Build and verify generated runtime
        run: |
          npm run build:runtime
          npm run verify:runtime-build
          npm run test:generated-runtime
      - name: Regenerate and verify discovery
        run: |
          npm run discovery:generate
          npm run verify:discovery
      - name: Run repository checks
        run: |
          npm run verify:research
          npm run verify
      - name: Remove temporary files and commit coherent result
        run: |
          rm .github/workflows/tmp-ab15-structural-boundaries.yml
          rm tools/tmp-ab15-apply-runtime.py tools/tmp-ab15-apply-tests.py tools/tmp-ab15-apply-note.py
          git restore --source=HEAD -- validation/current || true
          git clean -f validation/current || true
          git config user.name 'canto-span-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No AB15 changes to commit.'
            exit 1
          fi
          git commit -m 'Implement AB15 structural boundaries'
          git push origin HEAD:agent/ab15-structural-boundaries
