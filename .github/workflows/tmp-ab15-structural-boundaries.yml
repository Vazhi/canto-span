name: Temporary AB15 structural probe

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/ab15-structural-boundaries'
    runs-on: ubuntu-latest
    steps:
      - name: Check out claimed branch
        uses: actions/checkout@v4
        with:
          ref: agent/ab15-structural-boundaries
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Print exact AB15 and sibling structures
        run: |
          node - <<'NODE'
          const { loadRuntimeApi, internalConstruction, rowSurface } = require('./tests/lib/runtime-api');
          const api = loadRuntimeApi();
          const sources = [
            '呢本書。',
            '嗰間餐廳。',
            '呢個。',
            '呢三本書。',
            '本書。',
            '三本書。',
            '呢書。',
            '嗰間新開嘅意大利餐廳。',
          ];
          for (const source of sources) {
            const analysis = api.analyzeLine(source);
            const rows = api.diagnosticFinalRows(analysis)
              .filter((row) => row.kind === 'construction')
              .map((row) => ({
                construction: internalConstruction(row),
                surface: rowSurface(row),
                trace: row.trace_detail || {},
              }));
            console.log(`AB15_PROBE ${JSON.stringify({ source, rows })}`);
            if (source === '嗰間新開嘅意大利餐廳。') {
              console.log(`AB15_RAW ${JSON.stringify(analysis.nodes)}`);
            }
          }
          NODE
