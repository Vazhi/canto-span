          ]
          recalc(classifier)
          classifier_path.write_text(json.dumps(classifier, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          modified_path = root / 'tests/constructions/ModifiedNP.json'
          modified = json.loads(modified_path.read_text(encoding='utf-8'))
          modified['focused_cases'].extend([
              {'case_id':'AB15-MNP-P01','source':'呢三本書。','class':'demonstrative_quantified_classifier_sibling','expected_profile':'construction_present','assertion':'construction_present','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix','source_ids':['SRC-BOND-SIO-2024-CLASSIFIERS','SRC-CHENG-SYBESMA-2014-NP-STRUCTURE']},
              {'case_id':'AB15-MNP-P02','source':'嗰間新開嘅意大利餐廳。','class':'modifier_bearing_composition','expected_profile':'construction_present','assertion':'construction_present','provenance':'docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md#revised-boundary-matrix','source_ids':['SRC-CHENG-SYBESMA-2014-NP-STRUCTURE']},
          ])
          modified['implementation_probe_cases'] = [case for case in modified.get('implementation_probe_cases', []) if not str(case.get('case_id','')).startswith('AB15-MNP-I')] + [
              {'case_id':'AB15-MNP-I01','source':'呢三本書。','assertion':'trace_detail_equals','expected_surface':'呢三本書','expected_trace_detail':{'np_subtype':'demonstrative_quantified_classifier_np'},'purpose':'runtime_reachability_only','linguistic_evidence_weight':0},
              {'case_id':'AB15-MNP-I02','source':'嗰間新開嘅意大利餐廳。','assertion':'trace_detail_equals','expected_surface':'嗰間新開嘅意大利餐廳','expected_trace_detail':{'np_subtype':'demonstrative_classifier_modifier_np'},'purpose':'runtime_reachability_only','linguistic_evidence_weight':0},
          ]
