          note_path = root / 'grammar/research_pending/OvertHeadDemonstrativeClassifierNP.md'
          note = note_path.read_text(encoding='utf-8')
          front, _, _body = note.partition('\n---\n')
          if not front.startswith('---\n'):
              raise SystemExit('AB15 note frontmatter missing')
          spec = ab15
          replacements = {
              'title': '"AB15 DemonstrativeClassifierNounNP"',
              'confidence': '"primary_source_supported_structural_boundaries_runtime_aligned"',
              'last_reviewed': '"2026-07-30"',
              'source_count': '7',
              'verified_source_count': '7',
              'native_positive_contrasts_reviewed': 'false',
              'native_negative_contrasts_reviewed': 'false',
              'negative_boundary_inventory_complete': 'true',
              'code_document_review_date': '"2026-07-30"',
              'current_standard_reaudit_complete': 'true',
              'source_verification_file': '"docs/research/AB15-CLASSIFIER-NP-PRIMARY-SOURCE-LEDGER-R1.tsv"',
              'standard_positive_test_count': str(spec['coverage']['positive_case_count']),
              'standard_boundary_test_count': str(spec['coverage']['boundary_case_count']),
              'standard_implementation_probe_count': str(spec['coverage']['implementation_probe_count']),
              'standard_executable_test_count': str(spec['coverage']['executable_case_count']),
              'source_ids': '["SRC-BOND-SIO-2024-CLASSIFIERS", "SRC-CHENG-SYBESMA-2014-NP-STRUCTURE", "SRC-MATTHEWS-YIP-COMPREHENSIVE-CH6", "SRC-XIA-2025-CLASSIFIERS", "SRC-TSE-LI-LEUNG-2007-CLASSIFIER-ACQUISITION", "SRC-ERBAUGH-2013-CLASSIFIER-DISCOURSE", "SRC-NAGY-LO-2019-CANTONESE-CLASSIFIERS"]',
              'workflow_state': '"active"',
              'workflow_priority': '2',
              'workflow_reason': '"structural_source_audit_complete_panel_and_item_level_choice_evidence_pending"',
              'accepted_fixtures': str(spec['coverage']['positive_case_count']),
          }
          lines = front.splitlines()
          seen = set()
          for index, line in enumerate(lines):
              key, sep, _value = line.partition(':')
              if sep and key in replacements:
                  lines[index] = f'{key}: {replacements[key]}'
                  seen.add(key)
          insert_after = lines.index('construction: "OvertHeadDemonstrativeClassifierNP"')
          additions = [
              'construction_uuid: "4f6df953-62d1-5036-80b3-40bc8f02937e"',
              'construction_code: "AB15"',
              'canonical_name: "DemonstrativeClassifierNounNP"',
              'legacy_runtime_label: "OvertHeadDemonstrativeClassifierNP"',
          ]
          for value in reversed(additions):
              if value.split(':',1)[0] not in {line.split(':',1)[0] for line in lines if ':' in line}:
                  lines.insert(insert_after + 1, value)
          if 'source_verification_file' not in seen and not any(line.startswith('source_verification_file:') for line in lines):
              source_index = next(i for i,line in enumerate(lines) if line.startswith('promotion_gate_version:'))
              lines.insert(source_index + 1, f'source_verification_file: {replacements["source_verification_file"]}')
          new_front = '\n'.join(lines)
          body = '''
# AB15 DemonstrativeClassifierNounNP

## Canonical identity

- UUID: `4f6df953-62d1-5036-80b3-40bc8f02937e`
- Permanent identity: `AB15 DemonstrativeClassifierNounNP`
- Legacy runtime label: `OvertHeadDemonstrativeClassifierNP`
- Linguistic status: `research_pending` (unchanged)

## Plain-language claim

Primary sources directly support a narrow no-numeral Cantonese noun-phrase profile with an overt demonstrative, an overt classifier, and an overt nominal head. The runtime may represent exactly those visible components as AB15. It must not insert a hidden numeral or noun, delete an overt numeral, absorb a modifier-bearing phrase into AB15, or infer item-level classifier compatibility from the structural template.

Semantic cardinality one is a source-attributed interpretation, not an unpronounced token in the parser tree.

## Verified source audit

The proposition-level ledger is `docs/research/AB15-CLASSIFIER-NP-PRIMARY-SOURCE-LEDGER-R1.tsv`; the accepted synthesis is `docs/research/AB15-DEMONSTRATIVE-CLASSIFIER-NOUN-SCOPE-R1.md`.

Seven verified records support the structural core and its limits. Bond and Sio distinguish D-(X)-C-N, X-C-N, and C-N profiles. Cheng and Sybesma state the unmarked Dem–Numeral–Classifier–Modifier–N order, allow numeral omission after a demonstrative, require an overt classifier in the ordinary headed profile, and discuss noun ellipsis. Matthews and Yip directly attest multiple no-numeral Dem-CL-N examples. Xia supports a classifier/measure distinction only at abstract/repository level in the current review; full-PDF locators remain unavailable and no item is classified from that abstract alone. Tse, Erbaugh, and Nagy and Lo establish general-classifier use, alternatives, and population/discourse variation, which blocks a binary universal compatibility interpretation.

## Structural matrix

| Surface/profile | Runtime disposition |
|---|---|
| `呢本書`, `嗰間餐廳` | direct AB15: overt Dem + CL + N, no overt numeral |
| `呢三本書` | transparent demonstrative + `QuantifiedClassifierNP` sibling; numeral preserved |
| `呢個` | headless demonstrative-classifier sibling; no hidden noun |
| `本書` | bare `ClassifierObjectNP` sibling; no hidden demonstrative or numeral |
| `三本書` | `QuantifiedClassifierNP` sibling |
| `呢書` | outside AB15; no hidden classifier repair |
| `嗰間新開嘅意大利餐廳` | modifier-bearing `ModifiedNP`; demonstrative, classifier, modifier, `嘅`, nominal modifier, and head noun preserved |

Classifier versus measure-word typing and item-level classifier–noun choice remain separate evidence questions. Absence from the current compatibility table is not categorical ungrammaticality.

## Implementation state

- The no-numeral AB15 category template requires all three overt components and records subtype `demonstrative_classifier_overt_head_no_numeral`.
- The numeral-bearing wrapper records subtype `demonstrative_quantified_classifier_np` and retains the nested quantified-classifier structure.
- Bare classifier–noun material receives subtype `bare_classifier_noun_np` rather than the generic modified-NP fallback.
- Modifier-bearing demonstrative-classifier NPs receive subtype `demonstrative_classifier_modifier_np` and preserve every overt component.
- Missing-classifier strings remain outside AB15 with no repair.
- Runtime compatibility data and the twelve-rule unit-word evidence model are unchanged.
- Parser tests prove implementation behavior only; they do not add linguistic evidence.

## Panel, corpus, and promotion limits

The single historical speaker record is not a clean role-neutral panel. The five older HKCanCor examples remain occurrence evidence but are not a productivity estimate. No clean panel threshold, held-out gate, frequency claim, dialect-wide naturalness claim, or status promotion is established.

## Open questions

- Item-level classifier/measure and classifier–noun evidence remains with issue #334 or later accepted work.
- `呢啲魚`, `呢班人`, alternative classifiers, mensural profiles, and discourse-conditioned choices require their own item/profile analysis.
- Clean role-neutral panel evidence and held-out validation remain incomplete.
'''
          note_path.write_text(new_front + '\n---\n' + body, encoding='utf-8')

          plugin = root / 'src/plugin-entry.js'
          replace_once(plugin, 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.217";\n', 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.218";\n// v0.5.218: preserves AB15 no-numeral scope and separates overt-numeral, headless, bare-classifier, missing-classifier, and modifier-bearing NP profiles.\n')

          for relative in ['package.json', 'package-lock.json', 'manifest.json']:
              path = root / relative
              data = json.loads(path.read_text(encoding='utf-8'))
              if relative == 'package-lock.json':
                  data['version'] = '0.5.218'
                  data['packages']['']['version'] = '0.5.218'
              else:
                  data['version'] = '0.5.218'
                  if relative == 'manifest.json':
                      data['description'] = 'v0.5.218 preserves AB15 no-numeral scope and separates overt numeral, headless, bare classifier, missing classifier, and modifier-bearing NP profiles.'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          replace_once(root / 'docs/current/PROJECT-STATE.md', '| Runtime | v0.5.217 |', '| Runtime | v0.5.218 |')
          PY

      - name: Run structural tests before generation
        run: |
          npm test
          npm run test:np
          npm run test:constructions

      - name: Build runtime and regenerate discovery
        run: |
          npm run build:runtime
          npm run verify:runtime-build
          npm run test:generated-runtime
          npm run discovery:generate
          npm run verify:discovery

      - name: Run repository checks
        run: |
          npm run verify:research
          npm run verify

      - name: Remove temporary files and commit coherent result
        run: |
          rm .github/workflows/tmp-ab15-structural-boundaries.yml
          git restore --source=HEAD -- validation/current || true
          git clean -f validation/current || true
          git config user.name 'canto-span-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No AB15 changes to commit.'
            exit 1
          fi
          git commit -m 'Implement AB15 structural boundaries'
          git push origin HEAD:agent/ab15-structural-boundaries
