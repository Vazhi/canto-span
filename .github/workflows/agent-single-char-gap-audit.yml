name: Audit all top-2000 single-character gaps

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit all top-2000 single-character gaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: List all exact single-character gaps
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4/export?format=csv&gid=1428902047' -o /tmp/canto-frequency.csv
          python - <<'PY'
          import csv,json,re,unicodedata
          rows=list(csv.DictReader(open('/tmp/canto-frequency.csv',encoding='utf-8-sig',newline='')))
          def tombstone(s):
            x=s.lower(); return x=='del' or re.search(r'(^|[-\\s?])del($|[-\\s?])',x) is not None
          seen=set(); bounded=[]; first={}
          for row in rows:
            s=unicodedata.normalize('NFC',(row.get('Word') or '').strip())
            if not s or tombstone(s): continue
            first.setdefault(s,row)
            if s in seen: continue
            seen.add(s); bounded.append(s)
            if len(bounded)==2000: break
          payload=[]
          for rank,s in enumerate(bounded,1):
            row=first[s]
            payload.append({'rank':rank,'surface':s,'pronunciation':row.get('Pronunciation') or '','meaning':row.get('Meaning') or '','example':row.get('Sentence1') or ''})
          open('/tmp/bounded.json','w').write(json.dumps(payload,ensure_ascii=False))
          PY
          node - <<'NODE'
          const fs=require('node:fs');
          const lexicon=Object.fromEntries(require('./src/runtime-resources/lexicon/token-lexicon'));
          const rows=JSON.parse(fs.readFileSync('/tmp/bounded.json','utf8'));
          const gaps=rows.filter(r=>[...r.surface].length===1 && !lexicon[r.surface]);
          const isCjk=s=>/[\u3400-\u9FFF\uF900-\uFAFF]/u.test(s);
          console.log('SINGLE_GAP_SUMMARY',JSON.stringify({count:gaps.length,cjk:gaps.filter(r=>isCjk(r.surface)).length,non_cjk:gaps.filter(r=>!isCjk(r.surface)).length}));
          console.log('SINGLE_GAPS_JSON');
          console.log(JSON.stringify(gaps,null,2));
          NODE
      - name: Remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-single-char-gap-audit.yml
          git commit -m 'Remove single-character gap audit helper'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
