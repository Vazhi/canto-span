name: Extract Week 15 review tail

on:
  pull_request:
    paths:
      - .github/workflows/extract-week15-tail.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week15-ingress-review
          fetch-depth: 0
      - name: Exclude derived files across pedagogical packages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/build-pedagogical-corpus-review-candidates.py')
          text = path.read_text(encoding='utf-8')
          old = '''PACKAGE_REVIEW_FILES = {
              "source.json",
              "review.json",
              "items.tsv",
              "README.md",
              "research-summary.md",
              "expert-review-r1.tsv",
              "package-integrity-r1.json",
          }
'''
          new = old + '''GLOBAL_PEDAGOGICAL_DERIVED_FILES = {
              "review.json",
              "README.md",
              "research-summary.md",
              "expert-review-r1.tsv",
              "package-integrity-r1.json",
              "mechanical-cross-reference-r1.json",
              "crosswalk.json",
          }
'''
          if old not in text:
              raise SystemExit('package review file block not found')
          text = text.replace(old, new, 1)

          old_loop = '''            relative = path.relative_to(root)
              if relative in excluded_files:
                  continue
'''
          new_loop = '''            relative = path.relative_to(root)
              if relative in excluded_files:
                  continue
              if (
                  len(relative.parts) >= 4
                  and relative.parts[:3] == ("data", "pedagogical-corpus", "glossika")
                  and relative.name in GLOBAL_PEDAGOGICAL_DERIVED_FILES
              ):
                  continue
'''
          if old_loop not in text:
              raise SystemExit('candidate loop insertion point not found')
          path.write_text(text.replace(old_loop, new_loop, 1), encoding='utf-8')
          PY
          python3 -m py_compile tools/build-pedagogical-corpus-review-candidates.py
      - name: Regenerate Week 14 and Week 15 mechanical packets
        run: |
          python3 tools/build-pedagogical-corpus-review-candidates.py \
            --package data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621 \
            --output data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/mechanical-cross-reference-r1.json \
            --write
          python3 tools/build-pedagogical-corpus-review-candidates.py \
            --package data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628 \
            --output data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628/mechanical-cross-reference-r1.json \
            --write
      - name: Commit regenerated packets and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-pedagogical-corpus-review-candidates.py \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/mechanical-cross-reference-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628/mechanical-cross-reference-r1.json
          git rm .github/workflows/extract-week15-tail.yml \
            .github/workflows/build-week15-review-candidates.yml
          git commit -m "Exclude derived pedagogical files from cross-reference scans"
          git push origin HEAD:agent/week15-ingress-review
