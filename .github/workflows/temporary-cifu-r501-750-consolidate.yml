name: Temporary Cifu ranks 501-750 independent confirmation updater

on:
  push:
    branches: [agent/cifu-r501-750-adjudication-consolidation]
    paths: [.github/workflows/temporary-cifu-r501-750-consolidate.yml]

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r501-750-adjudication-consolidation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply independent confirmations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('docs/research/ISSUE-866-CIFU-R501-750-LEXICAL-ADJUDICATION-R1.md')
          text = path.read_text(encoding='utf-8')
          ranks = [511,520,528,536,539,544,545,566,580,594,615,622,625,636,637,642,651,677,712,721,726,727,743]

          for rank in ranks:
              pat = re.compile(rf'(^- \*\*{rank} .+?evidence-status=`)independent_confirmation_pending_corpus_zero(`[^\n]*$)', re.M)
              text, n = pat.subn(r'\1independent_source_confirmed_corpus_zero\2', text)
              if n != 1:
                  raise SystemExit(f'rank {rank}: expected one pending status, changed {n}')

          replacements = {
              '544': ('lok6 happy/name family; ngok6 music morpheme family',
                      'lok6 happy/joyful family and surname; ngok6 music morpheme family; ngaau6 bound/formal enjoy/appreciate family'),
              '636': ('bong6 weigh/pound-related family versus bong2 scale/balance family; needs explicit sense-reading records',
                      'bong6 pound/weight measure plus lexical weigh/pay verb family; bong2 noun scales/balance device; preserve explicit reading/function records'),
              '677': ('spoken motion reading zik6 haang4 versus hong4 row/line reading family; do not use Cifu\'s single zik6hong4 string for all senses',
                      'zik6 haang4 lexical verb/expression “go straight”; zik6 hong4 noun “vertical column/line”; preserve both and do not use one Cifu concatenated reading for all senses'),
          }
          for rank, (old, new) in replacements.items():
              if old not in text:
                  raise SystemExit(f'rank {rank}: description anchor not found')
              text = text.replace(old, new, 1)

          start = text.index('## Corpus-zero implementation gate')
          end = text.index('## Final rank ledger')
          section = '''## Corpus-zero implementation gate

The final #794 audit requires corpus-zero reviewed selections to expose whether independent Cantonese confirmation exists. All **23 non-blocked corpus-zero selections** that were initially pending after mechanical consolidation have now been independently checked against Cantonese lexical/reference sources. They are marked `independent_source_confirmed_corpus_zero`. Zero exact HKCanCor hits remain occurrence metadata, not negative evidence.

No non-blocked ranks 501–750 selection remains gated solely for lack of independent Cantonese confirmation. Blocked/compositional corpus-zero rows remain blocked unless separately re-adjudicated; confirming component words does not turn them into atomic lexemes.

### Independent corpus-zero confirmation references

| Rank | Surface | Independent confirmation | Source |
|---:|---|---|---|
| 511 | 瑞 | `seoi6`, auspicious/lucky adjective/root | [CantoDict](https://www.cantonese.sheik.co.uk/dictionary/characters/2582/) |
| 520 | 繞 | `jiu5` with documented `jiu2` family; move/go around, coil/detour | [CantoDict 繞道](https://www.cantonese.sheik.co.uk/dictionary/words/18763/) |
| 528 | 貧 | `pan4`, poor/deficient adjective with lack/humble-address extensions | [CantoDict](https://www.cantonese.sheik.co.uk/dictionary/characters/3310/) |
| 536 | 灣 | `waan1`, bay/cove noun with moor/anchor verb extension | [CantoDict](https://www.cantonese.sheik.co.uk/dictionary/characters/1169/) |
| 539 | 室 | `sat1`, room/home/chamber nominal root | [CantoDict 室內](https://www.cantonese.sheik.co.uk/dictionary/words/2473/) |
| 544 | 樂 | `lok6` happy, `ngok6` music, `ngaau6` enjoy/appreciate families | [粵典](https://words.hk/zidin/%E6%A8%82), [CantoWords](https://cantowords.com/dictionary/%E6%A8%82) |
| 545 | 樂園 | `lok6 jyun4`, noun paradise/amusement park | [Jyut Dictionary](https://jyutdictionary.com/dictionary/entry/%E6%A8%82%E5%9C%92) |
| 566 | 叢林 | `cung4 lam4`, jungle/forest noun | [Wiktionary](https://en.wiktionary.org/wiki/%E5%8F%A2%E6%9E%97) |
| 580 | 直線 | `zik6 sin3`, straight-line noun | [粵典](https://words.hk/zidin/%E7%9B%B4%E7%B7%9A) |
| 594 | 東方 | `dung1 fong1`, east/the East noun | [粵典](https://words.hk/zidin/%E6%9D%B1%E6%96%B9) |
| 615 | 灘 | `taan1`, beach/bank/shoal root | [CantoDict 沙灘](https://www.cantonese.sheik.co.uk/dictionary/words/1338/) |
| 622 | 會話 | `wui6 waa2` / changed-tone noun conversation | [CantoDict](https://www.cantonese.sheik.co.uk/dictionary/words/9473/), [CC-Canto](https://cantonese.org/search.php?q=%E4%BC%9A) |
| 625 | 轉彎 | turn/corner verb expression; `zyun3 waan1` directly attested, variant evidence retained separately | [CantoDict 彎](https://www.cantonese.sheik.co.uk/dictionary/characters/1876/) |
| 636 | 磅 | `bong6` pound/measure and weigh/pay verb; `bong2` scales noun | [粵典/CantoWords](https://cantowords.com/dictionary/%E7%A3%85) |
| 637 | 山路 | `saan1 lou6`, mountain-road/path noun | [粵典](https://words.hk/zidin/%E5%B1%B1%E8%B7%AF) |
| 642 | 西方 | `sai1 fong1`, west/the West noun | [粵典](https://words.hk/zidin/%E8%A5%BF%E6%96%B9) |
| 651 | 圖案 | `tou4 on3`, design/pattern noun | [CantoDict 案](https://www.cantonese.sheik.co.uk/dictionary/characters/2260/) |
| 677 | 直行 | `zik6 haang4` go-straight verb; `zik6 hong4` vertical-column noun | [Wiktionary](https://en.wiktionary.org/wiki/%E7%9B%B4%E8%A1%8C), [CantoDict](https://www.cantonese.sheik.co.uk/dictionary/words/23140/) |
| 712 | 水平線 | `seoi2 ping4 sin3`, horizon/horizontal-line noun | [CC-Canto](https://cantonese.org/search.php?q=%E6%B0%B4%E5%B9%B3%E7%B7%9A) |
| 721 | 碑 | `bei1`, stele/monument root | [CantoDict 石](https://www.cantonese.sheik.co.uk/dictionary/characters/20/), [CantoWords 里程碑](https://cantowords.com/dictionary/%E9%87%8C%E7%A8%8B%E7%A2%91) |
| 726 | 距離 | `keoi5 lei4`, distance / be apart | [CantoDict](https://www.cantonese.sheik.co.uk/dictionary/words/7354/) |
| 727 | 概念 | `koi3 nim6`, concept | [Wiktionary](https://zh.wiktionary.org/wiki/%E6%A6%82%E5%BF%B5), [CantoDict 概](https://www.cantonese.sheik.co.uk/dictionary/characters/2293/) |
| 743 | 港人 | `gong2 jan4`, Hongkonger/Hong Kong people noun | [粵典](https://words.hk/zidin/%E6%B8%AF%E4%BA%BA) |

'''
          text = text[:start] + section + text[end:]

          ledger_lines = [line for line in text.splitlines() if re.match(r'^- \*\*\d{3} ', line)]
          if len(ledger_lines) != 250:
              raise SystemExit(f'expected 250 ledger rows, got {len(ledger_lines)}')
          cats = {'reviewed_selection':0,'multiple':0,'reading_split':0,'blocked_atomic':0}
          pending_nonblocked = []
          for line in ledger_lines:
              m = re.match(r'^- \*\*(\d{3}) .+? — ([a-z_]+):', line)
              if not m or m.group(2) not in cats:
                  raise SystemExit(f'unparsed category: {line}')
              cats[m.group(2)] += 1
              if m.group(2) != 'blocked_atomic' and 'independent_confirmation_pending_corpus_zero' in line:
                  pending_nonblocked.append(int(m.group(1)))
          expected = {'reviewed_selection':128,'multiple':61,'reading_split':31,'blocked_atomic':30}
          if cats != expected:
              raise SystemExit(f'category drift {cats} != {expected}')
          if pending_nonblocked:
              raise SystemExit(f'non-blocked pending corpus-zero rows remain: {pending_nonblocked}')

          path.write_text(text, encoding='utf-8')
          print('validated 250/250; categories', cats, '; non-blocked pending corpus-zero = 0')
          PY
          git diff --check
      - name: Self-delete and commit ledger only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-cifu-r501-750-consolidate.yml
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','status','--short'], text=True).splitlines()
          paths = {line[3:] for line in changed}
          expected = {
            'docs/research/ISSUE-866-CIFU-R501-750-LEXICAL-ADJUDICATION-R1.md',
            '.github/workflows/temporary-cifu-r501-750-consolidate.yml',
          }
          if paths != expected:
              raise SystemExit(f'unexpected durable diff: {sorted(paths)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Confirm corpus-zero ranks 501–750 lexical selections'
          git push origin HEAD:agent/cifu-r501-750-adjudication-consolidation
