name: AA84 temporary project-state reconciliation

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/aa84-marked-reduplicated-manner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa84-marked-reduplicated-manner
          fetch-depth: 0
      - name: Reconcile derived project-state fields only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/current/PROJECT-STATE.md')
          s = p.read_text()
          replacements = [
              ('| `boundary_ready` | 1 |', '| `boundary_ready` | 2 |'),
              ('| `source_supported` | 63 |', '| `source_supported` | 62 |'),
              ('per-construction assertions: **1,578** across **134** files;', 'per-construction assertions: **1,593** across **134** files;'),
              ('| Per-construction assertions | 1,578 |', '| Per-construction assertions | 1,593 |'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected project-state text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- docs/current/PROJECT-STATE.md
      - name: Commit project-state reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current/PROJECT-STATE.md
          git diff --cached --quiet && { echo "Project state already reconciled"; exit 0; }
          git commit -m "Reconcile AA84 derived project-state counts"
          git push origin HEAD:agent/aa84-marked-reduplicated-manner
