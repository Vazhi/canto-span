name: CS-WORK-0330 Dialog 011 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialog-011-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source-preserving dialog package
        run: node tools/tmp/cs-work-0330-generate-dialog011.js
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-011-20260215';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          if(source.items.length!==80||source.ingress.turnCount!==40||source.ingress.vocabularyCount!==40) throw new Error('Unexpected source counts');
          const turns=source.items.filter(item=>item.itemType==='dialog_turn');
          const vocab=source.items.filter(item=>item.itemType==='lexical_entry');
          if(turns.some((item,index)=>item.turn!==index+1||item.speaker!==((index+1)%2===1?'陳明':'李芳')||item.source.english!==null||/[A-Z]/.test(item.source.jyutpingLine))) throw new Error('Turn sequence, speaker, missing-English, or romanization preservation failed');
          if(vocab.some((item,index)=>item.vocabularyOrdinal!==index+1||typeof item.sourceDialogOccurrence?.exactSurfacePresent!=='boolean')) throw new Error('Vocabulary order or source-block audit failed');
          if(crosswalk.items.length!==80||review.records.length!==80) throw new Error('Crosswalk/review alignment failed');
          if(crosswalk.summary.vocabularyExactSurfaceAbsentFromDialogCount!==4||crosswalk.sourceBlockAudit.absentVocabulary.length!==4) throw new Error('Expected four glossary surfaces absent from dialog');
          const absent=new Set(crosswalk.sourceBlockAudit.absentVocabulary.map(item=>item.traditional));
          for(const value of ['咪','睇','下','先']) if(!absent.has(value)) throw new Error(`Missing expected absent glossary surface ${value}`);
          if(turns[3].source.traditional!=='噢，咁啱我知道有間幾好嘅。'||turns[3].source.jyutpingLine!=='/o5, gam3 ngaam1 ngo5 zi1 dou3 jau5 gaan1 gei2 hou2 ge3./'||vocab[19].source.traditional!=='噢'||vocab[19].source.jyutping!=='o4') throw new Error('噢 o5/o4 discrepancy preservation failed');
          if(turns[5].source.jyutpingLine!=='/hai2 ciu1 kap1 si5 coeng4 gaak3 lei4, hou2 gan6 gaa3./'||turns[29].source.jyutpingLine!=='/haang4 heoi3 laa1, hou2 gan6 zaa3./'||vocab[28].source.traditional!=='近'||vocab[28].source.jyutping!=='kan5') throw new Error('近 gan6/kan5 discrepancy preservation failed');
          if(crosswalk.architecture.generatedExcluded[0]!=='main.js') throw new Error('main.js exclusion missing');
          if(crosswalk.items.some(item=>[...item.canonicalExactOwners,...item.canonicalNormalizedOwners,...item.supportingExactOwners,...item.supportingNormalizedOwners].includes('main.js'))) throw new Error('main.js leaked into ownership');
          const turnWalk=crosswalk.items.filter(item=>item.itemType==='dialog_turn');
          if(turnWalk.some((item,index)=>item.adjacency.previousTurnId!==(index===0?null:`GLOSSIKA-YUEHK-A1-DLG-011-20260215-I${String(index).padStart(3,'0')}`)||item.adjacency.nextTurnId!==(index===39?null:`GLOSSIKA-YUEHK-A1-DLG-011-20260215-I${String(index+2).padStart(3,'0')}`))) throw new Error('Turn adjacency failed');
          const rows=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(rows.length!==81) throw new Error(`Expected TSV header plus 80 rows, found ${rows.length}`);
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='vocabulary_dialog_surface_mismatch')) throw new Error('Source-block mismatch alert absent');
          if(review.summary.knownSourceAlerts.filter(alert=>alert.type==='pronunciation_discrepancy').length!==2) throw new Error('Expected two pronunciation discrepancy alerts');
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-011-20260215 docs/research/GLOSSIKA-YUEHK-A1-DLG-011-20260215-CORPUS-INGRESS.md
          git rm -f tools/tmp/cs-work-0330-dialog011-meta.json tools/tmp/cs-work-0330-dialog011-turns.part00.tsv tools/tmp/cs-work-0330-dialog011-turns.part01.tsv tools/tmp/cs-work-0330-dialog011-turns.part02.tsv tools/tmp/cs-work-0330-dialog011-vocab.part00.tsv tools/tmp/cs-work-0330-dialog011-vocab.part01.tsv tools/tmp/cs-work-0330-generate-dialog011.js
          git commit -m "Add Glossika dialog 011 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
