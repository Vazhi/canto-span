name: Rebuild generated runtime for lexical cleanup

on:
  push:
    branches:
      - agent/common-spoken-core-2000
    paths:
      - .github/workflows/runtime-rebuild-temp.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild and verify generated runtime
        run: |
          set -euo pipefail
          npm run build:runtime
          npm run verify:runtime-build
          git diff --check
      - name: Regression diagnostic only
        run: |
          set +e
          npm run test:regression > /tmp/regression.log 2>&1
          code=$?
          echo "Regression diagnostic exit=$code (not a lexical-validity or bundle-freshness gate)"
          tail -80 /tmp/regression.log || true
          exit 0
      - name: Commit generated runtime
        run: |
          set -euo pipefail
          git config user.name "canto-span-runtime-build"
          git config user.email "actions@users.noreply.github.com"
          git add main.js
          if git diff --cached --quiet; then
            echo "No runtime bundle change"
          else
            git commit -m "Rebuild runtime after invalid lexical cleanup"
            git push origin HEAD:agent/common-spoken-core-2000
          fi
