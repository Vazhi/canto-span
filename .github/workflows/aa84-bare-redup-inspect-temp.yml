name: Temporary AA84 bare reduplication generation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aa84-bare-redup-inspect-temp.yml
      - external-evidence/aa84-bare-redup-hkcancor/query-hkcancor-aa84-bare-redup.py
      - tests/tooling/corpus-review/test_aa84_bare_redup_hkcancor_profile.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa84-bare-reduplication-review
          fetch-depth: 0

      - name: Install frozen corpus dependency
        run: python -m pip install 'pycantonese==5.0.0'

      - name: Test query profile
        run: python -m unittest tests/tooling/corpus-review/test_aa84_bare_redup_hkcancor_profile.py

      - name: Generate high-recall inventory
        run: |
          python external-evidence/aa84-bare-redup-hkcancor/query-hkcancor-aa84-bare-redup.py \
            --profile aa84-bare-redup \
            --output-dir external-evidence/aa84-bare-redup-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256

      - name: Validate and summarize generated outputs
        run: |
          python external-evidence/aa84-bare-redup-hkcancor/query-hkcancor-aa84-bare-redup.py \
            --profile aa84-bare-redup \
            --output-dir external-evidence/aa84-bare-redup-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256 \
            --check
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('external-evidence/aa84-bare-redup-hkcancor/hkcancor-aa84-bare-redup-query-summary.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({
              'endpoint': data['endpoint'],
              'counts': data['counts'],
              'query': data['query'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit generated inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            external-evidence/aa84-bare-redup-hkcancor/hkcancor-aa84-bare-redup-candidate-inventory.json \
            external-evidence/aa84-bare-redup-hkcancor/hkcancor-aa84-bare-redup-candidate-inventory.tsv \
            external-evidence/aa84-bare-redup-hkcancor/hkcancor-aa84-bare-redup-query-summary.json
          if git diff --cached --quiet; then
            echo 'Generated outputs already current.'
          else
            git commit -m 'Generate AA84 bare reduplication corpus inventory'
            git push origin HEAD:agent/aa84-bare-reduplication-review
          fi
