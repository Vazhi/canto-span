name: Temporary AA84 bare reduplication generation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aa84-bare-redup-inspect-temp.yml
      - external-evidence/aa84-bare-redup-hkcancor/query-hkcancor-aa84-bare-redup.py
      - tests/tooling/corpus-review/test_aa84_bare_redup_hkcancor_profile.py
      - review-packets/corpus-review/AA84/select-bare-redup-packet-r2.py
      - review-packets/corpus-review/AA84/render-bare-redup-review-view-r2.py
      - review-packets/corpus-review/AA84/generate-bare-redup-decisions-r2.py
      - review-packets/corpus-review/AA84/verify-bare-redup-decisions-r2.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa84-bare-reduplication-review
          fetch-depth: 0

      - name: Install frozen corpus dependency
        run: python -m pip install 'pycantonese==5.0.0'

      - name: Verify inventory and packet generation
        run: |
          python -m unittest tests/tooling/corpus-review/test_aa84_bare_redup_hkcancor_profile.py
          python external-evidence/aa84-bare-redup-hkcancor/query-hkcancor-aa84-bare-redup.py \
            --profile aa84-bare-redup \
            --output-dir external-evidence/aa84-bare-redup-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256 \
            --check
          python review-packets/corpus-review/AA84/select-bare-redup-packet-r2.py
          python review-packets/corpus-review/AA84/render-bare-redup-review-view-r2.py

      - name: Generate and verify complete expert decisions
        run: |
          python review-packets/corpus-review/AA84/generate-bare-redup-decisions-r2.py
          python review-packets/corpus-review/AA84/verify-bare-redup-decisions-r2.py

      - name: Commit expert decisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            review-packets/corpus-review/AA84/bare-redup-packet-r2.tsv \
            review-packets/corpus-review/AA84/bare-redup-review-view-r2.tsv \
            review-packets/corpus-review/AA84/bare-redup-decisions-r2.tsv
          if git diff --cached --quiet; then
            echo 'Decision outputs already current.'
          else
            git commit -m 'Record complete AA84 bare reduplication decisions'
            git push origin HEAD:agent/aa84-bare-reduplication-review
          fi
