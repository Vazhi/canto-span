name: Temporary AA84 bare reduplication inspection

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aa84-bare-redup-inspect-temp.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Inspect AA84 runtime, identity, fixtures, and project evidence
        run: |
          echo '=== AA84 and manner files ==='
          find docs grammar tests test-data external-evidence review-packets src -type f 2>/dev/null | grep -Ei 'AA84|manner|redup|MannerAdverbialVP' | sort | sed -n '1,320p'
          echo '=== exact references ==='
          grep -RIn --exclude-dir=.git -E 'GamMarkedReduplicatedMannerVP|MannerAdverbialVP|mannerAdverbialVPFallback|慢慢|偷偷|乖乖|細細聲|求求其其|快快趣趣|日日|個個|行行下' docs grammar tests test-data external-evidence review-packets src 2>/dev/null | sed -n '1,700p' || true

      - name: Install frozen corpus dependency
        run: python -m pip install 'pycantonese==3.4.0'

      - name: Measure HKCanCor repeated-token profiles
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          import json
          import unicodedata
          import pycantonese

          corpus = pycantonese.hkcancor()
          predicate_pos = {'v','v1','vd','vi','vu','a','z'}

          def lexical(tok):
              if getattr(tok, 'pos', '') == 'w':
                  return False
              word = str(getattr(tok, 'word', ''))
              return bool(word) and any(unicodedata.category(ch)[0] not in {'P','S','Z'} for ch in word)

          def internal_repeat(word):
              n = len(word)
              return n >= 2 and n % 2 == 0 and word[:n//2] == word[n//2:]

          adjacent = []
          internal = []
          all_rows = []
          for file_index, chat in enumerate(corpus._files):
              for turn_index, utter in enumerate(chat.utterances()):
                  toks = list(utter)
                  lex = [i for i,t in enumerate(toks) if lexical(t)]
                  for p, idx in enumerate(lex):
                      tok = toks[idx]
                      word = tok.word
                      next_lex = lex[p+1] if p+1 < len(lex) else None
                      next2_lex = lex[p+2] if p+2 < len(lex) else None
                      following = [j for j in lex[p+1:p+5] if getattr(toks[j], 'pos', '') in predicate_pos]
                      row = {
                          'file': getattr(chat, 'filename', f'file-{file_index}'),
                          'turn': turn_index,
                          'token': idx,
                          'word': word,
                          'pos': tok.pos,
                          'jyutping': tok.jyutping,
                          'next': toks[next_lex].word if next_lex is not None else None,
                          'next_pos': toks[next_lex].pos if next_lex is not None else None,
                          'later_predicate': toks[following[0]].word if following else None,
                          'later_predicate_pos': toks[following[0]].pos if following else None,
                          'text': ''.join(t.word for t in toks),
                      }
                      if internal_repeat(word):
                          internal.append(row)
                      if next_lex is not None and word == toks[next_lex].word:
                          r = dict(row)
                          r['second_token'] = next_lex
                          r['after_pair'] = toks[next2_lex].word if next2_lex is not None else None
                          r['after_pair_pos'] = toks[next2_lex].pos if next2_lex is not None else None
                          adjacent.append(r)

          print('CORPUS', corpus.n_files, len(corpus.utterances()), len(corpus.words()))
          print('ADJACENT_IDENTICAL_ROWS', len(adjacent))
          print('INTERNALLY_REPEATED_TOKEN_ROWS', len(internal))
          print('ADJACENT_WITH_LATER_PREDICATE', sum(bool(r['later_predicate']) for r in adjacent))
          print('INTERNAL_WITH_LATER_PREDICATE', sum(bool(r['later_predicate']) for r in internal))
          print('TOP_ADJACENT', Counter(r['word'] for r in adjacent).most_common(80))
          print('TOP_INTERNAL', Counter(r['word'] for r in internal).most_common(120))
          print('=== ADJACENT SAMPLE WITH PREDICATE ===')
          for row in [r for r in adjacent if r['later_predicate']][:220]:
              print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          print('=== INTERNAL SAMPLE WITH PREDICATE ===')
          for row in [r for r in internal if r['later_predicate']][:260]:
              print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
