name: Build lexical batch 2

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Build lexical batch 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Build and verify batch
        run: |
          set -euo pipefail
          npm run build:runtime
          node --test tests/tooling/lexicon/vernacular-component-coverage.test.js
          npm run verify:runtime
      - name: Commit generated runtime and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-build-lexical-batch2.yml
          git add main.js
          git commit -m 'Build vernacular reading batch 2'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
