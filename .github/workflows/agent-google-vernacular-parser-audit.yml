name: Agent Google vernacular parser audit

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Add temporary vernacular parser audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Download source and derive clean bounded surface list
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4/export?format=csv&gid=1428902047' \
            -o /tmp/canto-frequency.csv
          python - <<'PY'
          import csv, json, re, unicodedata
          from pathlib import Path
          with Path('/tmp/canto-frequency.csv').open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          def tombstone(s):
              x=s.lower()
              return x == 'del' or re.search(r'(?:^|[\\s\\-?])del(?:$|[\\s\\-?])', x) is not None
          seen=set(); out=[]
          for source_row,row in enumerate(rows,start=1):
              surface=unicodedata.normalize('NFC',(row.get('Word') or '').strip())
              if not surface or tombstone(surface) or surface in seen: continue
              seen.add(surface)
              out.append({
                  'bounded_rank': len(out)+1,
                  'surface': surface,
                  'source_row': source_row,
                  'frequency': (row.get('Frequency') or '').strip(),
                  'pronunciation': (row.get('Pronunciation') or '').strip(),
                  'meaning': (row.get('Meaning') or '').strip(),
              })
              if len(out)==2000: break
          if len(out)!=2000: raise SystemExit(len(out))
          Path('/tmp/bounded.json').write_text(json.dumps(out,ensure_ascii=False))
          PY
      - name: Audit actual parser coverage without materializing source rankings
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const {loadRuntimeApi}=require('./tools/lib/runtime-api');
          const {auditArchitecture}=require('./tools/parser-architecture-audit');
          const tokenEntries=require('./src/runtime-resources/lexicon/token-lexicon');
          const runtime=new Map(tokenEntries);
          const api=loadRuntimeApi({apiNames:['analyzeLine']});
          const rows=JSON.parse(fs.readFileSync('/tmp/bounded.json','utf8'));
          function flatten(nodes,out=[]){for(const n of nodes||[]){if(!n||typeof n!=='object')continue;if(n.kind==='token')out.push(n);if(Array.isArray(n.children))flatten(n.children,out);}return out;}
          function cjkOnly(s){return [...String(s||'')].every(ch=>/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff〇○]/u.test(ch));}
          const results=[];
          for(const row of rows){
            let analysis,error='';
            try{analysis=api.analyzeLine(row.surface);}catch(e){error=e&&e.message||String(e);}
            const tokens=analysis?flatten(analysis.tokens):[];
            const tokenSummary=tokens.map(t=>({surface:t.surface||'',jyutping:t.jyutping||'',label:t.label||'',pos:t.pos||'',syntax:t.syntax||'',kind:t.kind||''}));
            const cjkNoReading=tokenSummary.filter(t=>cjkOnly(t.surface)&&!String(t.jyutping||'').trim()).map(t=>t.surface);
            results.push({...row,
              exact_runtime_key:runtime.has(row.surface),
              parse_error:error,
              token_count:tokenSummary.length,
              tokens:tokenSummary,
              whole_surface_token:tokenSummary.some(t=>t.surface===row.surface),
              cjk_tokens_without_jyutping:[...new Set(cjkNoReading)],
            });
          }
          const corpus=rows.map(r=>({source:r.surface,context_source:'',origins:['external-vernacular-bounded-audit']}));
          const architecture=auditArchitecture({root:process.cwd(),corpus});
          const summary={
            bounded_surfaces:rows.length,
            exact_runtime_keys:results.filter(r=>r.exact_runtime_key).length,
            no_exact_runtime_key:results.filter(r=>!r.exact_runtime_key).length,
            parse_errors:results.filter(r=>r.parse_error).length,
            surfaces_with_cjk_tokens_without_jyutping:results.filter(r=>r.cjk_tokens_without_jyutping.length).length,
            whole_surface_tokens:results.filter(r=>r.whole_surface_token).length,
            decomposed_without_whole_token:results.filter(r=>!r.whole_surface_token&&!r.parse_error).length,
            architecture:{status:architecture.status,blocking_count:architecture.blocking_count,failure_groups:architecture.failure_groups,corpus:architecture.corpus},
          };
          fs.writeFileSync('vernacular-parser-audit.json',JSON.stringify({summary,results},null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: vernacular-parser-audit
          path: vernacular-parser-audit.json
          retention-days: 1
          if-no-files-found: error
      - name: Self-delete temporary parser audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-google-vernacular-parser-audit.yml
          git commit -m 'Remove temporary vernacular parser audit'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
