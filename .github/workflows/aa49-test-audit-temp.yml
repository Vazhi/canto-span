name: AA49 temporary fixture-family audit

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/aa49-independent-motion-source-reaudit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Inventory AA49 current fixture families and runtime spans
        run: |
          node <<'NODE' > aa49-fixture-audit.json
          const fs = require('fs');
          const { loadRuntimeApi, internalConstruction, rowSurface } = require('./tests/lib/runtime-api');
          const api = loadRuntimeApi();
          const spec = JSON.parse(fs.readFileSync('tests/constructions/DirectionalMotionVP.json', 'utf8'));
          const cases = [
            ...(spec.snapshot_cases || []).map((row) => ({...row, source_kind: 'snapshot'})),
            ...(spec.focused_cases || []).map((row) => ({...row, source_kind: 'focused'})),
            ...(spec.implementation_probe_cases || []).map((row) => ({...row, source_kind: 'implementation_probe'})),
          ];
          function tags(source) {
            const out = [];
            if (/[嚟來去走]/u.test(source)) out.push('bare_or_deictic_motion_lexeme');
            if (/[上落出入過返翻][嚟來去]/u.test(source)) out.push('multi_part_directional_complex');
            if (/[行跑飛游揸搬擰攞拉推迫][返翻上落出入過][嚟來去]?/u.test(source)) out.push('manner_or_caused_plus_directional');
            if (/咗/u.test(source)) out.push('perfective_or_aspectual');
            if (/[香港中環廣州北京辦公室房樓下七杯]/u.test(source)) out.push('overt_goal_or_location_candidate');
            if (/[唔冇]/u.test(source)) out.push('negated');
            if (/[可以會使唔使]/u.test(source)) out.push('modal_or_modal_question');
            if (/[咩邊度邊個]/u.test(source)) out.push('wh_or_polar_question_material');
            if (/[啦喇呀啩喎㗎]/u.test(source)) out.push('final_particle_material');
            if (/[如果因為所以但係話]/u.test(source) || /，/u.test(source)) out.push('higher_clause_or_discourse_composition');
            return out.length ? out : ['other'];
          }
          const rows = cases.map((row) => {
            const source = row.source || '';
            const analysis = api.analyzeLine(source, row.context_source || null);
            const motionRows = api.diagnosticFinalRows(analysis)
              .filter((candidate) => candidate.kind === 'construction' && internalConstruction(candidate) === 'DirectionalMotionVP')
              .map((candidate) => ({
                surface: rowSurface(candidate),
                parent: candidate.internal_parent || candidate.parent || '',
                depth: candidate.depth,
                slots: candidate.slots || [],
                trace_kind: candidate.trace_detail && candidate.trace_detail.kind || '',
                trace_rule: candidate.trace_detail && candidate.trace_detail.rule || '',
                structural_scope: candidate.trace_detail && candidate.trace_detail.structural_scope || '',
              }));
            return {
              case_id: row.case_id || row.id || '',
              source,
              source_kind: row.source_kind,
              assertion: row.assertion || '',
              class: row.class || '',
              origins: row.origins || [],
              tags: tags(source),
              motion_rows: motionRows,
              linguistic_evidence_weight: row.linguistic_evidence_weight === undefined ? null : row.linguistic_evidence_weight,
              provenance: row.provenance || '',
            };
          });
          const tagCounts = {};
          const motionSurfaceCounts = {};
          const motionParentCounts = {};
          for (const row of rows) {
            for (const tag of row.tags) tagCounts[tag] = (tagCounts[tag] || 0) + 1;
            for (const motion of row.motion_rows) {
              motionSurfaceCounts[motion.surface] = (motionSurfaceCounts[motion.surface] || 0) + 1;
              motionParentCounts[motion.parent || '<root>'] = (motionParentCounts[motion.parent || '<root>'] || 0) + 1;
            }
          }
          process.stdout.write(JSON.stringify({
            construction: spec.construction,
            declared_coverage: spec.coverage,
            case_count: rows.length,
            tag_counts: tagCounts,
            motion_surface_counts: motionSurfaceCounts,
            motion_parent_counts: motionParentCounts,
            cases: rows,
          }, null, 2));
          NODE
      - name: Verify no runtime source/test mutation
        run: |
          npm run verify:identities
          npm run verify:research
          npm run verify:discovery
      - uses: actions/upload-artifact@v4
        with:
          name: aa49-fixture-audit
          path: aa49-fixture-audit.json
          retention-days: 1
