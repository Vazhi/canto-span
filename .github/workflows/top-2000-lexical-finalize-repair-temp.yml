name: Temporary repair top-2000 lexical finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/top-2000-lexical-finalize-repair-temp.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/top-2000-lexical-coverage-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/top-2000-lexical-coverage-audit
          fetch-depth: 0
      - name: Patch formatting-only failure and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/top-2000-lexical-finalize-temp.yml')
          s = p.read_text()
          old = "          git diff --check\n"
          new = "          sed -i 's/[[:space:]]*$//' data/lexical-frequency/cifu-spoken-top-2000.tsv\n          git diff --check\n"
          if old not in s:
              raise SystemExit('expected git diff --check line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/top-2000-lexical-finalize-repair-temp.yml
          git config user.name 'Canto Span scoped automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Repair lexical audit TSV finalization'
          git push origin HEAD:agent/top-2000-lexical-coverage-audit
