name: Temporary Cifu ranks 751-1000 typed-default audit

on:
  push:
    branches:
      - agent/cifu-r751-1000-runtime-reconcile
    paths:
      - .github/workflows/temporary-cifu-r751-1000-typed-default-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r751-1000-runtime-reconcile
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Print pre-existing typed defaults in ranks 751-1000
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tokenEntries = require('./src/runtime-resources/lexicon/token-lexicon');
          const reviewed = require('./src/runtime-resources/lexicon/token-lexicon/cifu-r751-1000-reviewed');
          const tokenLexicon = new Map(tokenEntries);
          const ledger = fs.readFileSync('docs/research/ISSUE-872-CIFU-R751-1000-LEXICAL-ADJUDICATION-R1.md', 'utf8');
          const specs = new Map();
          for (const line of ledger.split(/\r?\n/)) {
            const m = line.match(/^- \*\*(\d{3,4}) (.+?) — (reviewed_selection|multiple|reading_split|blocked_atomic|research_required|constructional_expression):/);
            if (m) specs.set(Number(m[1]), { surface: m[2], disposition: m[3] });
          }
          const isNeutral = (entry) => Boolean(entry) && entry.label === 'lex' && entry.pos === 'lexical_item' && entry.syntax === 'lexical_item';
          const rows = [];
          for (let rank = 751; rank <= 1000; rank += 1) {
            const spec = specs.get(rank);
            const entry = tokenLexicon.get(spec.surface);
            if (!entry || isNeutral(entry)) continue;
            if (entry.provenance && entry.provenance.kind === 'reviewed_lexical_promotion' && entry.provenance.source === reviewed.SOURCE) continue;
            rows.push({
              rank,
              surface: spec.surface,
              disposition: spec.disposition,
              label: entry.label || '',
              pos: entry.pos || '',
              syntax: entry.syntax || '',
              jyutping: entry.jyutping || '',
              note: entry.note || '',
              provenance_kind: entry.provenance && entry.provenance.kind || '',
            });
          }
          console.log(JSON.stringify({count: rows.length, rows}, null, 2));
          NODE
