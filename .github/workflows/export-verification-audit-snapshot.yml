name: Apply verification workflow alignment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/export-verification-audit-snapshot.yml"
      - ".github/workflows/verification-alignment.patch.b64"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/verification-workflow-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/verification-workflow-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/workflows/verification-alignment.patch.b64 | gzip -d > /tmp/verification-alignment.diff
          patch -p4 < /tmp/verification-alignment.diff
          rm -f .github/workflows/export-verification-audit-snapshot.yml
          rm -f .github/workflows/verification-alignment.patch.b64
          rm -f TEMP_*
      - name: Install build dependency
        run: npm ci
      - name: Verify retained state and tooling
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm run verify:research
          npm run test:coordination
          npm test
          node tools/test-promotion-gate.js
          node tools/test-release-handoff.js
      - name: Verify read-only defaults
        shell: bash
        run: |
          set -euo pipefail
          find validation/current -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/validation-before.sha256
          node tools/verify-parked-constructions.js > /tmp/parked.json
          node tools/enforce-promotion-rules.js > /tmp/promotion.json || true
          node tools/verify-release-handoff.js > /tmp/release.json || true
          find validation/current -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/validation-after.sha256
          cmp /tmp/validation-before.sha256 /tmp/validation-after.sha256
          node tools/verify-parked-constructions.js --output /tmp/parked-output.json > /dev/null
          node tools/enforce-promotion-rules.js --output /tmp/promotion-output.json > /dev/null || true
          node tools/verify-release-handoff.js --output /tmp/release-output.json > /dev/null || true
          test -s /tmp/parked-output.json
          test -s /tmp/promotion-output.json
          test -s /tmp/release-output.json
      - name: Commit audited state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "canto-span automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align verification with current workflows"
          git push origin HEAD:agent/verification-workflow-alignment
