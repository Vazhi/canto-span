name: Diagnose verification alignment chunks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/export-verification-audit-snapshot.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/verification-workflow-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/verification-workflow-alignment
      - name: Report chunk sizes and checksums
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/workflows/verification-alignment.part*
          sha256sum .github/workflows/verification-alignment.part*
          cat .github/workflows/verification-alignment.part00 \
              .github/workflows/verification-alignment.part01 \
              .github/workflows/verification-alignment.part02 \
              .github/workflows/verification-alignment.part03 \
              > /tmp/verification-alignment.b64
          wc -c /tmp/verification-alignment.b64
          sha256sum /tmp/verification-alignment.b64
