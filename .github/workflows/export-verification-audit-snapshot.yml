name: Export verification audit snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/export-verification-audit-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/verification-workflow-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create repository snapshot
        run: |
          tar --exclude=.git -czf /tmp/canto-span-verification-audit-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: canto-span-verification-audit-snapshot
          path: /tmp/canto-span-verification-audit-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
