name: Audit component readings against pinned Rime Cantonese

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit component readings against pinned Rime Cantonese'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compare candidate readings with pinned Rime character dictionary
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/rime/rime-cantonese/259f0e48bba840c3a2e0d117539e96937f3d89bc/jyut6ping3.chars.dict.yaml' -o /tmp/rime-chars.yaml
          node - <<'NODE'
          const fs = require('node:fs');
          const { READINGS } = require('./src/runtime-resources/lexicon/token-lexicon/vernacular-component-coverage');
          const rime = new Map();
          for (const line of fs.readFileSync('/tmp/rime-chars.yaml','utf8').split(/\r?\n/u)) {
            if (!line || line.startsWith('#') || line === '---' || line === '...' || /^[a-z_]+:/u.test(line)) continue;
            const [surface, reading] = line.split('\t');
            if (!surface || !reading || [...surface].length !== 1) continue;
            if (!rime.has(surface)) rime.set(surface, new Set());
            rime.get(surface).add(reading.trim());
          }
          const matched=[]; const mismatched=[]; const absent=[];
          for (const [surface,candidate] of Object.entries(READINGS)) {
            const supported=[...(rime.get(surface)||[])].sort();
            if (!supported.length) absent.push({surface,candidate});
            else if (supported.includes(candidate)) matched.push({surface,candidate});
            else mismatched.push({surface,candidate,rime:supported});
          }
          console.log('RIME_COMPONENT_AUDIT', JSON.stringify({candidate_count:Object.keys(READINGS).length, matched:matched.length, mismatched:mismatched.length, absent:absent.length, rime_revision:'259f0e48bba840c3a2e0d117539e96937f3d89bc'}));
          console.log('RIME_MISMATCHES_JSON');
          console.log(JSON.stringify(mismatched,null,2));
          console.log('RIME_ABSENT_JSON');
          console.log(JSON.stringify(absent,null,2));
          NODE
      - name: Remove temporary audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-audit-rime-component-readings.yml
          git commit -m 'Remove temporary Rime component audit'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
