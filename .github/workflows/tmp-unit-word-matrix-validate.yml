name: Temporary unit-word findings validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-unit-word-matrix-validate.yml
      - docs/research/OBSERVED-UNIT-WORD-NOUN-MISMATCH-MATRIX-R1.md
      - docs/research/UNIT-WORD-NOUN-PRIMARY-SOURCE-LEDGER-R1.tsv
      - review-packets/corpus-review/UNIT-WORDS/observed-unit-word-noun-matrix-r1.tsv
      - review-packets/corpus-review/UNIT-WORDS/verify-observed-unit-word-noun-matrix-r1.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify bounded matrix
        run: python review-packets/corpus-review/UNIT-WORDS/verify-observed-unit-word-noun-matrix-r1.py
      - name: Verify research provenance
        run: npm run verify:research
      - name: Verify coordination system
        run: npm run verify:coordination
      - name: Audit protected paths
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/changed-files.txt
          if grep -E '^(src/|grammar/|tests/fixtures/|data/|package\.json|package-lock\.json|manifest\.json|main\.js)' /tmp/changed-files.txt; then
            echo 'Protected runtime, fixture, data, or release path changed.' >&2
            exit 1
          fi
