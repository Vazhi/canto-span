name: AA84 temporary generated-output runner

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/aa84-marked-reduplicated-manner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa84-marked-reduplicated-manner
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Build canonical construction tests and index
        run: node tools/build-construction-tests.js
      - name: Synchronize construction-note test metadata
        run: node tools/sync-construction-test-metadata.js
      - name: Regenerate discovery outputs
        run: npm run discovery:generate
      - name: Commit generator-owned outputs only
        shell: bash
        run: |
          status="$(git status --short)"
          unexpected="$(printf '%s\n' "$status" | grep -Ev '^( M| D|\?\?) (tests/construction-test-index\.json|tests/constructions/[^/]+\.json|tests/fixtures/regression-snapshots\.json|grammar/[^/]+/[^/]+\.md|data/construction-candidate-readiness\.json|docs/research/(SUPPORTED-PRODUCTIVE-CANDIDATES|ORPHANED-CONSTRUCTION-EVIDENCE|CONSTRUCTION-FAMILY-GAPS|FULL-REPO-SUPPORTED-PRODUCTIVE-SWEEP-R1)\.md)$' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during AA84 generation:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/construction-test-index.json tests/constructions tests/fixtures/regression-snapshots.json grammar data/construction-candidate-readiness.json docs/research/SUPPORTED-PRODUCTIVE-CANDIDATES.md docs/research/ORPHANED-CONSTRUCTION-EVIDENCE.md docs/research/CONSTRUCTION-FAMILY-GAPS.md docs/research/FULL-REPO-SUPPORTED-PRODUCTIVE-SWEEP-R1.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No generated output changes"; exit 0; }
          git commit -m "Generate AA84 construction and discovery outputs"
          git push origin HEAD:agent/aa84-marked-reduplicated-manner
