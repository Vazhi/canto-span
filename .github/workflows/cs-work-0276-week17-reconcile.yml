name: CS-WORK-0276 Week 17 reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/glossika-week17-corpus-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate deterministic Week 17 package
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const {execFileSync} = require('child_process');

          const sourceId = 'GLOSSIKA-YUEHK-A1-W17-20260712';
          const root = `data/pedagogical-corpus/glossika/${sourceId}`;
          const parts = [0,1,2,3].map(n => `tools/tmp/cs-work-0276-week17-seed.part${String(n).padStart(2,'0')}`);
          const hasSeeds = parts.every(file => fs.existsSync(file));

          function stable(value) {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') {
              return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            }
            return JSON.stringify(value);
          }
          function sha(text) {
            return crypto.createHash('sha256').update(text, 'utf8').digest('hex');
          }
          function countBy(values) {
            return Object.fromEntries([...values.reduce((map, value) => map.set(value, (map.get(value) || 0) + 1), new Map())].sort(([a],[b]) => a.localeCompare(b)));
          }
          function parseTsv(file) {
            const lines = fs.readFileSync(file, 'utf8').trimEnd().split(/\r?\n/);
            const header = lines.shift().split('\t');
            return lines.filter(Boolean).map(line => {
              const values = line.split('\t');
              return Object.fromEntries(header.map((key,index) => [key, values[index] ?? '']));
            });
          }
          function normalizeSurface(text) {
            return String(text || '').normalize('NFC').replace(/[\p{P}\p{S}\p{Z}\s]/gu, '');
          }
          function normalizeJyutping(text) {
            return String(text || '').normalize('NFC').toLowerCase().replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim();
          }
          function normalizeEnglish(text) {
            return String(text || '').normalize('NFC').toLowerCase().replace(/[\p{P}\p{S}]/gu, '').replace(/\s+/g, ' ').trim();
          }
          function display(record) {
            if (record.itemType === 'phonics_pair') return `${record.source.wordA} / ${record.source.wordB}`;
            if (record.itemType === 'grammar_phrase') return record.source.exampleTraditional;
            return record.source.traditional;
          }
          function tsv(value) {
            return String(value ?? '').replace(/\t/g,' ').replace(/\r?\n/g,' ');
          }
          function listTextFiles(prefixes, excludedPrefixes = []) {
            const tracked = execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const files=[];
            for (const file of tracked) {
              if (!prefixes.some(prefix => file.startsWith(prefix))) continue;
              if (excludedPrefixes.some(prefix => file.startsWith(prefix))) continue;
              let stat; try { stat=fs.statSync(file); } catch { continue; }
              if (!stat.isFile() || stat.size > 5_000_000) continue;
              let text; try { text=fs.readFileSync(file,'utf8'); } catch { continue; }
              files.push({path:file,text,normalized:normalizeSurface(text)});
            }
            return files.sort((a,b)=>a.path.localeCompare(b.path));
          }

          if (!hasSeeds) {
            if (!fs.existsSync(`${root}/source.json`)) throw new Error('Neither source seeds nor generated package exists');
            console.log('Generated package already exists; validation-only run.');
            process.exit(0);
          }

          const seed = JSON.parse(parts.map(file => fs.readFileSync(file,'utf8')).join(''));
          if (seed.records.length !== 75) throw new Error(`Expected 75 source records, found ${seed.records.length}`);
          const expectedTypes = {dialog_turn:5,grammar_phrase:8,lexical_entry:42,phonics_pair:6,sentence:14};
          const itemTypeCounts = countBy(seed.records.map(record => record.itemType));
          if (stable(itemTypeCounts) !== stable(expectedTypes)) throw new Error(`Unexpected source type counts: ${JSON.stringify(itemTypeCounts)}`);

          const sourcePayloadHash = `sha256:${sha(stable(seed.records.map(record => record.source)))}`;
          const items = seed.records.map((record,index) => ({
            id:`${sourceId}-I${String(index+1).padStart(3,'0')}`,
            ordinal:index+1,
            section:record.section,
            subsection:record.subsection,
            itemType:record.itemType,
            ...(record.register ? {register:record.register}:{}),
            ...(record.dialogTurn ? {dialogTurn:record.dialogTurn}:{}),
            source:record.source,
            sourceHash:`sha256:${sha(stable(record.source))}`
          }));

          const surfaceSeen = new Map();
          const sourceDuplicateOf = new Map();
          for (const item of items) {
            const key = `${item.itemType}:${display(item)}`;
            if (surfaceSeen.has(key)) sourceDuplicateOf.set(item.id, surfaceSeen.get(key));
            else surfaceSeen.set(key, item.id);
          }
          if (sourceDuplicateOf.size !== 3) throw new Error(`Expected 3 repeated source rows, found ${sourceDuplicateOf.size}`);

          const corpusRows = parseTsv('test-data/w17-functional-corpus.tsv');
          const semanticRows = parseTsv('test-data/w17-corpus-semantic-disposition.tsv');
          const readinessRows = parseTsv('test-data/review-only-readiness.tsv');
          const corpusBySurface = new Map(corpusRows.map(row => [row.traditional,row]));
          const semanticById = new Map(semanticRows.map(row => [row.id,row]));
          const readinessByItem = new Map(readinessRows.map(row => [row.source_item_id,row]));
          const readinessBySurface = new Map();
          for (const row of readinessRows) {
            if (!readinessBySurface.has(row.source_surface)) readinessBySurface.set(row.source_surface,[]);
            readinessBySurface.get(row.source_surface).push(row);
          }

          const sourceFiles = listTextFiles(
            ['src/','src/runtime-resources/'],
            ['src/plugin-entry.js']
          );
          const supportingFiles = listTextFiles(
            ['tests/','test-data/','data/','docs/','grammar/','config/'],
            [root+'/', 'tools/tmp/cs-work-0276-', '.github/workflows/cs-work-0276-']
          );

          function exactOwners(surface, files) {
            return files.filter(entry => entry.text.includes(surface)).map(entry => entry.path);
          }
          function normalizedOwners(surface, files) {
            const normalized = normalizeSurface(surface);
            if (normalized.length < 2) return [];
            return files.filter(entry => !entry.text.includes(surface) && entry.normalized.includes(normalized)).map(entry => entry.path);
          }
          function readinessMatch(item) {
            const surface = display(item);
            const prefix = item.itemType === 'lexical_entry' ? 'LEX-W17-'
              : item.itemType === 'grammar_phrase' ? 'GRAM-W17-'
              : item.itemType === 'phonics_pair' ? 'PHO-W17-'
              : null;
            if (!prefix) return null;
            return (readinessBySurface.get(surface) || []).find(row => row.source_item_id.startsWith(prefix)) || null;
          }

          const records=[];
          const crosswalkItems=[];
          for (const item of items) {
            const surface = display(item);
            let projectRecord = null;
            let lifecycle = null;
            let semantic = null;
            if (item.itemType === 'sentence' || item.itemType === 'dialog_turn') {
              const corpus = corpusBySurface.get(surface);
              if (corpus) {
                lifecycle = readinessByItem.get(corpus.id) || null;
                semantic = semanticById.get(corpus.id) || null;
                projectRecord = {
                  id:corpus.id,
                  sourceInventory:'w17-functional-corpus',
                  path:'test-data/w17-functional-corpus.tsv',
                  legacySourcePath:'test-data/w17-glossika-corpus.tsv',
                  semanticPath:'test-data/w17-corpus-semantic-disposition.tsv',
                  lifecyclePath:'test-data/review-only-readiness.tsv',
                  status:corpus.status,
                  lifecycleStatus:corpus.lifecycle_status,
                  utteranceType:corpus.utterance_type,
                  notes:corpus.notes
                };
              }
            } else {
              const ready = readinessMatch(item);
              if (ready) {
                lifecycle = ready;
                projectRecord = {
                  id:ready.source_item_id,
                  sourceInventory:ready.source_inventory,
                  path:'test-data/review-only-readiness.tsv',
                  status:ready.source_status,
                  lifecycleStatus:ready.current_audit_state,
                  promotionTarget:ready.promotion_target,
                  notes:ready.notes
                };
              }
            }

            const canonicalExactOwners = exactOwners(surface,sourceFiles);
            const canonicalNormalizedOwners = normalizedOwners(surface,sourceFiles);
            const supportingExactOwners = exactOwners(surface,supportingFiles);
            const supportingNormalizedOwners = normalizedOwners(surface,supportingFiles);
            const discrepancies=[];

            if (projectRecord?.id === 'COR-W17-002') {
              discrepancies.push({
                type:'morpheme_gloss_discrepancy',
                sourceValue:'喇 labelled (PERF)',
                reviewedValue:'喇 is a sentence-final particle, not perfective aspect',
                status:'project_reviewed'
              });
            }
            if (projectRecord?.id === 'LEX-W17-028') {
              discrepancies.push({
                type:'pronunciation_review_unresolved',
                sourceValue:item.source.jyutping,
                reviewedValue:null,
                status:'waiting_external_evidence',
                note:lifecycle?.notes || 'Source Jyutping remains review-bearing.'
              });
            }
            if (projectRecord?.id === 'PHO-W17-005') {
              discrepancies.push({
                type:'pronunciation_discrepancy',
                sourceValue:'闊 kut3',
                reviewedValue:'闊 fut3',
                status:'project_reviewed',
                note:lifecycle?.notes || 'Project pronunciation review corrected the source reading.'
              });
            }
            if (sourceDuplicateOf.has(item.id)) {
              const first = items.find(candidate => candidate.id === sourceDuplicateOf.get(item.id));
              const duplicate = {
                type:'source_internal_duplicate',
                duplicateOf:first.id,
                status:'source_preserved'
              };
              if (normalizeEnglish(first.source.english) !== normalizeEnglish(item.source.english)) {
                duplicate.glossVariation = {first:first.source.english,repeated:item.source.english};
              }
              discrepancies.push(duplicate);
            }

            if (projectRecord && (item.itemType === 'sentence' || item.itemType === 'dialog_turn')) {
              const corpus = corpusBySurface.get(surface);
              if (corpus && normalizeJyutping(corpus.jyutping) !== normalizeJyutping(item.source.jyutping)) {
                discrepancies.push({type:'jyutping_text_difference',sourceValue:item.source.jyutping,projectValue:corpus.jyutping,status:'mechanical_review'});
              }
              if (corpus && normalizeEnglish(corpus.english) !== normalizeEnglish(item.source.english)) {
                discrepancies.push({type:'translation_difference',sourceValue:item.source.english,projectValue:corpus.english,status:'mechanical_review'});
              }
            }

            const relation = projectRecord ? 'exact_duplicate' : canonicalNormalizedOwners.length || supportingNormalizedOwners.length ? 'normalized_duplicate' : 'new_attestation';
            records.push({
              id:item.id,
              sourceHash:item.sourceHash,
              sourceDisplay:surface,
              normalizedSurface:normalizeSurface(surface),
              relation,
              sourceInternalDuplicateOf:sourceDuplicateOf.get(item.id) || null,
              projectRecordId:projectRecord?.id || null,
              projectStatus:projectRecord?.status || null,
              lifecycleStatus:projectRecord?.lifecycleStatus || null,
              discrepancyTypes:discrepancies.map(entry => entry.type),
              reviewedValues:{},
              reviewerNote:'',
              evidenceUse:'not_authorized'
            });
            crosswalkItems.push({
              sourceItemId:item.id,
              ordinal:item.ordinal,
              itemType:item.itemType,
              sourceDisplay:surface,
              sourceHash:item.sourceHash,
              relation,
              sourceInternalDuplicateOf:sourceDuplicateOf.get(item.id) || null,
              projectRecord,
              semanticReview:semantic ? {
                verdict:semantic.semantic_verdict,
                primaryIssue:semantic.primary_issue,
                roleReview:semantic.role_review,
                structureReview:semantic.structure_review,
                nextAction:semantic.next_action,
                lifecycleStatus:semantic.lifecycle_status
              } : null,
              canonicalExactOwners,
              canonicalNormalizedOwners,
              supportingExactOwners,
              supportingNormalizedOwners,
              discrepancies
            });
          }

          const unmatched = crosswalkItems.filter(item => !item.projectRecord);
          if (unmatched.length) throw new Error(`Source items without project matches: ${unmatched.map(item=>item.sourceItemId).join(', ')}`);

          const projectOnly = readinessRows
            .filter(row => row.source_item_id.startsWith('ALT-W17-'))
            .map(row => ({
              projectItemId:row.source_item_id,
              sourceInventory:row.source_inventory,
              surface:row.source_surface,
              relation:'project_only_item',
              sourcePresence:'missing_source_item',
              status:row.source_status,
              currentAuditState:row.current_audit_state,
              ownerTaskId:row.owner_task_id,
              sourceTaskId:row.source_task_id,
              externalBlocker:row.external_blocker,
              notes:row.notes,
              path:'test-data/review-only-readiness.tsv'
            }));
          if (projectOnly.length !== 5) throw new Error(`Expected 5 project-only alternatives, found ${projectOnly.length}`);

          const relationCounts = {
            exact_duplicate:records.filter(record=>record.relation==='exact_duplicate').length,
            normalized_duplicate:records.filter(record=>record.relation==='normalized_duplicate').length,
            partial_match:records.filter(record=>record.relation==='partial_match').length,
            new_attestation:records.filter(record=>record.relation==='new_attestation').length,
            source_internal_duplicate_occurrence:records.filter(record=>record.sourceInternalDuplicateOf).length,
            project_only_item:projectOnly.length,
            missing_source_item:projectOnly.length,
            pronunciation_discrepancy:crosswalkItems.filter(item=>item.discrepancies.some(entry=>entry.type==='pronunciation_discrepancy')).length,
            pronunciation_review_unresolved:crosswalkItems.filter(item=>item.discrepancies.some(entry=>entry.type==='pronunciation_review_unresolved')).length,
            translation_difference:crosswalkItems.filter(item=>item.discrepancies.some(entry=>entry.type==='translation_difference')).length,
            morpheme_gloss_discrepancy:crosswalkItems.filter(item=>item.discrepancies.some(entry=>entry.type==='morpheme_gloss_discrepancy')).length
          };
          if (relationCounts.exact_duplicate !== 75) throw new Error(`Expected 75 exact duplicates, found ${relationCounts.exact_duplicate}`);

          const source = {
            schema:'canto-span-pedagogical-corpus-source-v1',
            source:seed.source,
            ingress:{
              ...seed.ingress,
              recordCount:items.length,
              itemTypeCounts,
              sectionCounts:countBy(items.map(item=>item.section)),
              sourcePayloadHash,
              sourcePayloadHashPolicy:'SHA-256 of canonical key-sorted JSON for the ordered source-field array.'
            },
            sourceClaims:seed.sourceClaims,
            items
          };
          const crosswalk = {
            schema:'canto-span-pedagogical-corpus-crosswalk-v1',
            sourceId,
            architecture:{
              canonicalRuntimeInputs:['src/**','src/runtime-resources/**'],
              generatedExcluded:['main.js'],
              supportingRecords:['test-data/**','data/**','docs/**','grammar/**','config/**'],
              rule:'Generated main.js is never an ownership authority.'
            },
            sourcePayloadHash,
            summary:{recordCount:75,uniqueSourceSurfaces:72,relationCounts},
            items:crosswalkItems,
            projectOnlyItems:projectOnly
          };
          const review = {
            schema:'canto-span-pedagogical-corpus-review-v1',
            sourceId,
            sourcePayloadHash,
            policy:{
              sourceLayer:'source.json is immutable.',
              reconciliation:'crosswalk.json records existing modular owners and project records without rewriting them.',
              duplicateBoundary:'Exact and normalized matches are reconciliation relations, not new evidence decisions.',
              evidenceBoundary:'Ingress does not promote constructions, change runtime behavior, or alter accepted project review state.'
            },
            summary:{
              recordCount:75,
              reviewedCount:0,
              unreviewedCount:75,
              relationCounts,
              knownSourceAlerts:[
                {scope:'GLOSSIKA-YUEHK-A1-W17-20260712-I002',type:'morpheme_gloss_discrepancy',status:'project_reviewed',note:'The source labels 喇 as perfective; the existing W17 project record identifies it as a sentence-final particle.'},
                {scope:'GLOSSIKA-YUEHK-A1-W17-20260712-I037',type:'pronunciation_review_unresolved',status:'waiting_external_evidence',note:'好奇 hou2 kei4 remains review-bearing in the existing project ledger.'},
                {scope:'GLOSSIKA-YUEHK-A1-W17-20260712-I074',type:'pronunciation_discrepancy',status:'project_reviewed',note:'The source gives 闊 kut3; the existing project review records fut3.'},
                {scope:'phonics_drill',type:'heading_row_mismatch',status:'source_preserved_requires_review',note:'The broad /yː/ versus /uː/ heading does not transparently describe every listed row.'},
                {scope:'emotions_and_states',type:'source_internal_duplicates',status:'source_preserved',note:'嬲, 驚, and 攰 are repeated; the repeated 驚 row broadens the English gloss.'}
              ]
            },
            records
          };

          fs.mkdirSync(root,{recursive:true});
          fs.mkdirSync('docs/research',{recursive:true});
          fs.writeFileSync(`${root}/source.json`,JSON.stringify(source,null,2)+'\n');
          fs.writeFileSync(`${root}/crosswalk.json`,JSON.stringify(crosswalk,null,2)+'\n');
          fs.writeFileSync(`${root}/review.json`,JSON.stringify(review,null,2)+'\n');

          const header=['id','ordinal','section','subsection','item_type','register','source_display','source_jyutping','source_english','source_morpheme_gloss','source_hash','relation','source_internal_duplicate_of','project_record_id','project_status','lifecycle_status','canonical_exact_owners','supporting_exact_owners','discrepancy_types','review_state'];
          const lines=items.map((item,index)=>{
            const record=records[index], walk=crosswalkItems[index], s=item.source;
            const sourceJyutping=s.jyutping || s.exampleJyutping || `${s.jyutpingA || ''}|${s.jyutpingB || ''}`;
            const sourceEnglish=s.english || s.exampleEnglish || `${s.glossA || ''}|${s.glossB || ''}`;
            return [item.id,item.ordinal,item.section,item.subsection,item.itemType,item.register || '',display(item),sourceJyutping,sourceEnglish,s.morphemeGloss || '',item.sourceHash,record.relation,record.sourceInternalDuplicateOf || '',record.projectRecordId || '',record.projectStatus || '',record.lifecycleStatus || '',walk.canonicalExactOwners.join('|'),walk.supportingExactOwners.join('|'),record.discrepancyTypes.join('|'),seed.ingress.reviewState].map(tsv).join('\t');
          });
          fs.writeFileSync(`${root}/items.tsv`,[header.join('\t'),...lines].join('\n')+'\n');

          fs.writeFileSync(`${root}/README.md`,`# Glossika Cantonese (HK) A1 Week 17 corpus reconciliation\n\n- Source ID: \`${sourceId}\`\n- Lesson: Emotions & States\n- Source date: 2026-07-12\n- Gmail message: \`19f5511dfc37c9ea\`\n- Intake issue: #134\n- Work claim: #276\n- Source records: 75\n- Unique source surfaces: 72\n- Project-only alternatives: 5\n- Source payload hash: \`${sourcePayloadHash}\`\n\n## Architecture\n\nCanonical runtime ownership comes from \`src/**\` and \`src/runtime-resources/**\`. Generated \`main.js\` is excluded. Existing Week 17 sentence, semantic, lifecycle, lexical, grammar-phrase, phonics, and alternative records are crosswalked without modification.\n\n## Files\n\n- \`source.json\`: immutable ordered source fields and hashes.\n- \`crosswalk.json\`: item-level modular owners, existing project records, lifecycle state, and discrepancies.\n- \`review.json\`: review routing and source alerts.\n- \`items.tsv\`: flat review rendering.\n\n## Stop boundary\n\nNo parser, lexicon, construction identity/status, existing Week 17 record, evidence classification, survey, version, release, or deployment change is included.\n`);

          fs.writeFileSync('docs/research/GLOSSIKA-YUEHK-A1-W17-20260712-CORPUS-RECONCILIATION.md',`# Glossika Week 17 corpus reconciliation\n\n- Source ID: \`${sourceId}\`\n- Intake: #134\n- Work claim: #276\n- Status: source-preserving reconciliation complete; no runtime or promotion change\n\n## Result\n\n- 75 ordered source records\n- 72 unique source surfaces\n- 19 sentence/dialog records crosswalked to \`COR-W17-*\`\n- 42 lexical source rows crosswalked to 39 unique \`LEX-W17-*\` records\n- 8 grammar phrases crosswalked to \`GRAM-W17-*\`\n- 6 phonics pairs crosswalked to \`PHO-W17-*\`\n- 5 project-only \`ALT-W17-*\` alternatives retained as source-missing project records\n- Source payload hash: \`${sourcePayloadHash}\`\n\n## Modular ownership\n\nThe reconciliation uses current source-first ownership. \`src/**\` and \`src/runtime-resources/**\` are canonical runtime inputs; \`main.js\` is generated and excluded. Sentence lifecycle and semantic review come from the existing \`test-data/w17-*\` files and \`review-only-readiness.tsv\`. The Week 17 lexical block is owned by \`src/runtime-resources/lexicon/token-lexicon/referents-and-boundaries.js\`.\n\n## Reconciliation classes\n\n\`${JSON.stringify(relationCounts)}\`\n\nAll 75 source records have exact-surface project matches. Three source rows repeat earlier lexical items. Five naturalized alternatives exist only in the project and are not rewritten into the source layer.\n\n## Preserved discrepancies\n\n- Source 喇 glossed as perfective versus the project-reviewed sentence-final-particle analysis.\n- 好奇 source pronunciation remains externally unresolved.\n- Source 闊 \`kut3\` versus project-reviewed \`fut3\`.\n- The phonics heading does not transparently describe every row.\n- Repeated 驚 broadens its English gloss from “scared” to “scared / surprised.”\n\n## Protected state\n\nExisting Week 17 corpus verdicts, lifecycle states, canonical lexicon entries, grammar identities, parser behavior, surveys, versioning, release state, and deployment artifacts remain unchanged.\n`);

          console.log({sourcePayloadHash,itemTypeCounts,relationCounts});
          NODE
      - name: Validate generated reconciliation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W17-20260712';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          const expected={dialog_turn:5,grammar_phrase:8,lexical_entry:42,phonics_pair:6,sentence:14};
          if(source.items.length!==75) throw new Error('Expected 75 source items');
          if(JSON.stringify(source.ingress.itemTypeCounts)!==JSON.stringify(expected)) throw new Error('Unexpected source type counts');
          if(crosswalk.items.length!==75||review.records.length!==75) throw new Error('Crosswalk/review count mismatch');
          if(crosswalk.summary.uniqueSourceSurfaces!==72) throw new Error('Expected 72 unique source surfaces');
          if(crosswalk.summary.relationCounts.exact_duplicate!==75) throw new Error('Expected 75 exact project matches');
          if(crosswalk.summary.relationCounts.source_internal_duplicate_occurrence!==3) throw new Error('Expected 3 repeated source rows');
          if(crosswalk.projectOnlyItems.length!==5) throw new Error('Expected 5 project-only alternatives');
          if(crosswalk.architecture.generatedExcluded[0]!=='main.js') throw new Error('Generated bundle exclusion missing');
          if(crosswalk.items.some(item=>!item.projectRecord)) throw new Error('Unmatched source item');
          const rows=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(rows.length!==76) throw new Error(`Expected TSV header plus 75 rows, found ${rows.length}`);
          if(!crosswalk.items.find(item=>item.projectRecord?.id==='PHO-W17-005')?.discrepancies.some(entry=>entry.type==='pronunciation_discrepancy')) throw new Error('闊 discrepancy missing');
          if(!crosswalk.items.find(item=>item.projectRecord?.id==='COR-W17-002')?.discrepancies.some(entry=>entry.type==='morpheme_gloss_discrepancy')) throw new Error('喇 discrepancy missing');
          NODE
          git diff --check
      - name: Run repository verification
        run: |
          npm run verify:research
          npm run verify
      - name: Commit generated reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W17-20260712 docs/research/GLOSSIKA-YUEHK-A1-W17-20260712-CORPUS-RECONCILIATION.md
          git rm tools/tmp/cs-work-0276-week17-seed.part00 tools/tmp/cs-work-0276-week17-seed.part01 tools/tmp/cs-work-0276-week17-seed.part02 tools/tmp/cs-work-0276-week17-seed.part03
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
