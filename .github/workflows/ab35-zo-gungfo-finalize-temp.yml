name: AB35 做功課 rehome temporary R2

on:
  push:
    branches:
      - agent/ab35-rehome-zo-gungfo-r2

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/agent/ab35-rehome-zo-gungfo-r2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab35-rehome-zo-gungfo-r2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Bind AA84 preservation guard to canonical readiness schema
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ab35-zo-gungfo-finalize-temp.py')
          text = p.read_text()
          old = '''aa84 = next((row for row in readiness.get("candidates", []) if row.get("code") == "AA84" or row.get("short_code") == "AA84"), None)\nif aa84 is None:\n    aa84 = next((row for row in readiness.get("records", []) if row.get("code") == "AA84" or row.get("short_code") == "AA84"), None)\nassert aa84 is not None\nserialized_aa84 = json.dumps(aa84, ensure_ascii=False)\nassert 'reviewed_genuine_corpus_hits' in serialized_aa84 and '3/14 genuine' in serialized_aa84, aa84'''
          new = '''aa84 = next((row for row in readiness.get("records", []) if row.get("construction_code") == "AA84"), None)\nassert aa84 is not None\ncorpus_gate = aa84.get("gates", {}).get("reviewed_corpus_evidence", {})\nassert corpus_gate.get("status") == "pass", aa84\nassert corpus_gate.get("evidence") == "reviewed_genuine_corpus_hits", aa84\nassert corpus_gate.get("detail") == "3/14 genuine", aa84'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply, verify, clean, and commit single-entry ownership transition
        run: python3 tools/ab35-zo-gungfo-finalize-temp.py
