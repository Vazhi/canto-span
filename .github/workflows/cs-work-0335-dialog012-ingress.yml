name: CS-WORK-0335 Dialog 012 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialog-012-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build and run source-preserving generator
        run: |
          git show 3e0b67d0535ab5d2c44581ef7b196d505e176498:tools/tmp/cs-work-0330-generate-dialog011.js > /tmp/dialog011-base.js
          node tools/tmp/cs-work-0335-transform-dialog012.js /tmp/dialog011-base.js tools/tmp/cs-work-0335-generate-dialog012.js
          node tools/tmp/cs-work-0335-generate-dialog012.js
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-012-20260222';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          if(source.items.length!==80||source.ingress.turnCount!==40||source.ingress.vocabularyCount!==40) throw new Error('Unexpected source counts');
          const turns=source.items.filter(item=>item.itemType==='dialog_turn');
          const vocab=source.items.filter(item=>item.itemType==='lexical_entry');
          if(turns.some((item,index)=>item.turn!==index+1||item.speaker!==((index+1)%2===1?'張美玲':'黃志明')||item.source.english!==null||/[A-Z]/.test(item.source.jyutpingLine))) throw new Error('Turn sequence, speaker, missing-English, or romanization preservation failed');
          if(vocab.some((item,index)=>item.vocabularyOrdinal!==index+1||typeof item.sourceDialogOccurrence?.exactSurfacePresent!=='boolean')) throw new Error('Vocabulary order or source-block audit failed');
          if(crosswalk.items.length!==80||review.records.length!==80) throw new Error('Crosswalk/review alignment failed');
          const expected=['驚','怕','但係','而家','安全','覺得','難','易','睇','有啲','練習','會','美玲','張','黃'];
          if(crosswalk.summary.vocabularyExactSurfaceAbsentFromDialogCount!==15||crosswalk.sourceBlockAudit.absentVocabulary.length!==15) throw new Error('Expected fifteen glossary surfaces absent from dialog');
          const absent=new Set(crosswalk.sourceBlockAudit.absentVocabulary.map(item=>item.traditional));
          for(const value of expected) if(!absent.has(value)) throw new Error(`Missing expected absent glossary surface ${value}`);
          if(crosswalk.architecture.generatedExcluded[0]!=='main.js') throw new Error('main.js exclusion missing');
          if(crosswalk.items.some(item=>[...item.canonicalExactOwners,...item.canonicalNormalizedOwners,...item.supportingExactOwners,...item.supportingNormalizedOwners].includes('main.js'))) throw new Error('main.js leaked into ownership');
          const turnWalk=crosswalk.items.filter(item=>item.itemType==='dialog_turn');
          if(turnWalk.some((item,index)=>item.adjacency.previousTurnId!==(index===0?null:`GLOSSIKA-YUEHK-A1-DLG-012-20260222-I${String(index).padStart(3,'0')}`)||item.adjacency.nextTurnId!==(index===39?null:`GLOSSIKA-YUEHK-A1-DLG-012-20260222-I${String(index+2).padStart(3,'0')}`))) throw new Error('Turn adjacency failed');
          const rows=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(rows.length!==81) throw new Error(`Expected TSV header plus 80 rows, found ${rows.length}`);
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='vocabulary_dialog_surface_mismatch')) throw new Error('Source-block mismatch alert absent');
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-012-20260222 docs/research/GLOSSIKA-YUEHK-A1-DLG-012-20260222-CORPUS-INGRESS.md
          git rm -f tools/tmp/cs-work-0335-dialog012-meta.json tools/tmp/cs-work-0335-dialog012-turns.part00.tsv tools/tmp/cs-work-0335-dialog012-turns.part01.tsv tools/tmp/cs-work-0335-dialog012-turns.part02.tsv tools/tmp/cs-work-0335-dialog012-vocab.part00.tsv tools/tmp/cs-work-0335-dialog012-vocab.part01.tsv tools/tmp/cs-work-0335-transform-dialog012.js tools/tmp/cs-work-0335-generate-dialog012.js
          git commit -m "Add Glossika dialog 012 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
