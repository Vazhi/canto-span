name: CS-WORK-0257 AA89 generation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/temporary/CS-WORK-0257-source.b64"
      - ".github/workflows/cs-work-0257-generate.yml"
      - "external-evidence/aa89-hkcancor/**"
      - "tests/tooling/corpus-review/test_aa89_hkcancor_profile.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs-work-0257-aa89-generation
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'Vazhi/canto-span' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.ref == 'agent/aa89-hkcancor-modal-lexeme')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa89-hkcancor-modal-lexeme
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Detect staged payload
        id: payload
        run: |
          if test -f tools/temporary/CS-WORK-0257-source.b64; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct validated AA89 source files
        if: steps.payload.outputs.ready == 'true'
        run: |
          set -euo pipefail
          echo 'cbf4984c553669c643c1f3e4e9728466bca6f7bda40894f0c09cbb2a96526965  tools/temporary/CS-WORK-0257-source.b64' | sha256sum --check --strict
          base64 --decode tools/temporary/CS-WORK-0257-source.b64 > /tmp/CS-WORK-0257-source.tar.gz
          echo 'e5650692936488408fe64af8e1e4189e5ad77c3ebc8ec68aa188669dd3182c89  /tmp/CS-WORK-0257-source.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/CS-WORK-0257-source.tar.gz -C .
          python -m py_compile \
            external-evidence/aa89-hkcancor/query-hkcancor-aa89-modal-lexeme.py \
            tests/tooling/corpus-review/test_aa89_hkcancor_profile.py

      - name: Install dependencies
        if: steps.payload.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'pycantonese==5.0.0'
          npm ci

      - name: Generate and validate AA89 inventory
        if: steps.payload.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m unittest tests/tooling/corpus-review/test_aa89_hkcancor_profile.py
          python external-evidence/aa89-hkcancor/query-hkcancor-aa89-modal-lexeme.py \
            --output-dir external-evidence/aa89-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256
          python external-evidence/aa89-hkcancor/query-hkcancor-aa89-modal-lexeme.py \
            --output-dir external-evidence/aa89-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256 \
            --check
          npm run verify:research
          npm run verify

      - name: Commit coherent AA89 packet
        if: steps.payload.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -f tools/temporary/CS-WORK-0257-source.b64
          rmdir tools/temporary 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            external-evidence/aa89-hkcancor \
            tests/tooling/corpus-review/test_aa89_hkcancor_profile.py \
            tools/temporary
          git diff --cached --check
          git diff --cached --name-only | sort
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Add AA89 HKCanCor modal-lexeme inventory'
          git push origin HEAD:agent/aa89-hkcancor-modal-lexeme
