name: CS-WORK-0324 Dialog 009 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialog-009-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source-preserving dialog package
        run: node tools/tmp/cs-work-0324-generate-dialog009.js
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-009-20260201';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          if(source.items.length!==80||source.ingress.turnCount!==40||source.ingress.vocabularyCount!==40) throw new Error('Unexpected source counts');
          const turns=source.items.filter(item=>item.itemType==='dialog_turn');
          const vocab=source.items.filter(item=>item.itemType==='lexical_entry');
          if(turns.some((item,index)=>item.turn!==index+1||item.speaker!==((index+1)%2===1?'陳先生':'黃小姐')||item.source.english!==null)) throw new Error('Turn sequence, speaker, or missing-English preservation failed');
          if(turns.some(item=>/[A-Z]/.test(item.source.jyutpingLine.replace(/send/g,'').replace(/email/g,'')))) throw new Error('Unexpected uppercase source token');
          if(!turns[32].source.traditional.includes('send')||!turns[33].source.traditional.includes('email')||!turns[34].source.traditional.includes('email')||!turns[35].source.traditional.includes('email')) throw new Error('Source-authored Latin-token preservation failed');
          if(vocab.some((item,index)=>item.vocabularyOrdinal!==index+1||typeof item.sourceDialogOccurrence?.exactSurfacePresent!=='boolean')) throw new Error('Vocabulary order or source-block audit failed');
          if(crosswalk.items.length!==80||review.records.length!==80) throw new Error('Crosswalk/review alignment failed');
          if(crosswalk.summary.vocabularyExactSurfaceAbsentFromDialogCount!==2||crosswalk.sourceBlockAudit.absentVocabulary.length!==2) throw new Error('Expected two glossary surfaces absent from dialog');
          const absent=new Set(crosswalk.sourceBlockAudit.absentVocabulary.map(item=>item.traditional));
          for(const value of ['辦公室','指示']) if(!absent.has(value)) throw new Error(`Missing expected absent glossary surface ${value}`);
          if(turns[5].source.traditional!=='多謝你，我會努力嘅。'||turns[5].source.jyutpingLine!=='/do1 ze6 nei5, ngo5 wui5 nou5 lik6 gaa3./'||vocab[23].source.traditional!=='嘅'||vocab[23].source.jyutping!=='ge3') throw new Error('嘅 gaa3/ge3 source discrepancy preservation failed');
          if(crosswalk.architecture.generatedExcluded[0]!=='main.js') throw new Error('main.js exclusion missing');
          if(crosswalk.items.some(item=>[...item.canonicalExactOwners,...item.canonicalNormalizedOwners,...item.supportingExactOwners,...item.supportingNormalizedOwners].includes('main.js'))) throw new Error('main.js leaked into ownership');
          const turnWalk=crosswalk.items.filter(item=>item.itemType==='dialog_turn');
          if(turnWalk.some((item,index)=>item.adjacency.previousTurnId!==(index===0?null:`GLOSSIKA-YUEHK-A1-DLG-009-20260201-I${String(index).padStart(3,'0')}`)||item.adjacency.nextTurnId!==(index===39?null:`GLOSSIKA-YUEHK-A1-DLG-009-20260201-I${String(index+2).padStart(3,'0')}`))) throw new Error('Turn adjacency failed');
          const rows=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(rows.length!==81) throw new Error(`Expected TSV header plus 80 rows, found ${rows.length}`);
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='vocabulary_dialog_surface_mismatch')) throw new Error('Source-block mismatch alert absent');
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='romanization_discrepancy')) throw new Error('Romanization discrepancy alert absent');
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='source_authored_latin_tokens')) throw new Error('Latin-token alert absent');
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-009-20260201 docs/research/GLOSSIKA-YUEHK-A1-DLG-009-20260201-CORPUS-INGRESS.md
          git rm -f tools/tmp/cs-work-0324-dialog009-meta.json tools/tmp/cs-work-0324-dialog009-turns.part00.tsv tools/tmp/cs-work-0324-dialog009-turns.part01.tsv tools/tmp/cs-work-0324-dialog009-turns.part02.tsv tools/tmp/cs-work-0324-dialog009-vocab.part00.tsv tools/tmp/cs-work-0324-dialog009-vocab.part01.tsv tools/tmp/cs-work-0324-generate-dialog009.js
          git commit -m "Add Glossika dialog 009 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
