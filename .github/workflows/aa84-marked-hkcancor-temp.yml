name: AA84 marked HKCanCor temporary

on:
  push:
    branches:
      - agent/aa84-marked-hkcancor-review

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/agent/aa84-marked-hkcancor-review' && !contains(github.event.head_commit.message, '[aa84-generated]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa84-marked-hkcancor-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen corpus dependency
        run: python -m pip install --disable-pip-version-check pycantonese==5.0.0
      - name: Run profile unit tests
        run: python -m unittest tests/tooling/corpus-review/test_aa84_marked_hkcancor_profile.py -v
      - name: Generate deterministic marked inventory
        run: |
          python external-evidence/aa84-marked-hkcancor/query-hkcancor-aa84-marked.py \
            --profile aa84-marked-redup \
            --output-dir external-evidence/aa84-marked-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256
      - name: Recheck deterministic outputs
        run: |
          python external-evidence/aa84-marked-hkcancor/query-hkcancor-aa84-marked.py \
            --profile aa84-marked-redup \
            --output-dir external-evidence/aa84-marked-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256 \
            --check
      - name: Commit exact generated outputs
        run: |
          set -euo pipefail
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            external-evidence/aa84-marked-hkcancor/hkcancor-aa84-marked-candidate-inventory.json \
            external-evidence/aa84-marked-hkcancor/hkcancor-aa84-marked-candidate-inventory.tsv \
            external-evidence/aa84-marked-hkcancor/hkcancor-aa84-marked-query-summary.json
          git diff --cached --check
          git commit -m "[aa84-generated] Add frozen marked HKCanCor inventory"
          git push origin HEAD:agent/aa84-marked-hkcancor-review
