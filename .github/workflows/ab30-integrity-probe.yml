name: AB30 integrity probe

on:
  push:
    branches:
      - agent/ab30-aggregate-integrity
    paths:
      - ".github/workflows/ab30-integrity-probe.yml"
  pull_request:
    paths:
      - ".github/workflows/ab30-integrity-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Report immutable file identities and schemas
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          paths = [
              "review-packets/corpus-review/AB30/review-decisions-r1.json",
              "review-packets/corpus-review/AB30/candidate-ledger.json",
              "review-packets/corpus-review/AB30/hkcancor-zo-r-decisions-r2.json",
              "external-evidence/ab30-hkcancor/hkcancor-ab30-zo-r-candidate-inventory.json",
              "external-evidence/ab30-hkcancor/hkcancor-ab30-zo-r-query-summary.json",
              "review-packets/corpus-review/AB30/hkcancor-zo-m-decisions-r1.json",
              "external-evidence/ab30-hkcancor/hkcancor-ab30-zo-m-candidate-inventory.json",
              "external-evidence/ab30-hkcancor/hkcancor-ab30-zo-m-query-summary.json",
              "external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256",
          ]
          for name in paths:
              data = Path(name).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              sha256 = hashlib.sha256(data).hexdigest()
              print(f"FILE {name}")
              print(f"  git_blob_sha={blob}")
              print(f"  sha256={sha256}")
              if name.endswith(".json"):
                  value = json.loads(data)
                  print(f"  keys={sorted(value)}")
                  for key in ("decisions", "candidates", "records", "items"):
                      if isinstance(value.get(key), list):
                          rows = value[key]
                          print(f"  row_key={key} row_count={len(rows)}")
                          if rows:
                              print(f"  row_keys={sorted(rows[0])}")
                          break
          PY
