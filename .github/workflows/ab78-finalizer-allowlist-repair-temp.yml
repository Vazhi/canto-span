name: AB78 finalizer allowlist repair

on:
  push:
    branches:
      - agent/ab78-transitive-runtime-alignment
    paths:
      - .github/workflows/ab78-finalizer-allowlist-repair-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab78-transitive-runtime-alignment
          fetch-depth: 0
      - name: Repair only the generated ClauseSpan lifecycle path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ab78-runtime-finalize-v4-temp.yml')
          s=p.read_text()
          old="'grammar/research_pending/TransitiveVP.md','grammar/research_pending/ClauseSpan.md',"
          new="'grammar/research_pending/TransitiveVP.md','grammar/parser_heuristic/ClauseSpan.md',"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/ab78-finalizer-allowlist-repair-temp.yml
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "Fix AB78 finalizer lifecycle allowlist"
          git push origin HEAD:agent/ab78-transitive-runtime-alignment
