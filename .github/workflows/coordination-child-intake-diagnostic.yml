name: Temporary coordination child-intake repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/coordination-child-intake-diagnostic.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/allow-active-child-intakes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/allow-active-child-intakes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply focused lifecycle patch
        run: |
          git apply <<'PATCH'
          diff --git a/tests/tooling/coordination/child-intake-lifecycle.test.js b/tests/tooling/coordination/child-intake-lifecycle.test.js
          new file mode 100644
          --- /dev/null
          +++ b/tests/tooling/coordination/child-intake-lifecycle.test.js
          @@ -0,0 +1,103 @@
          +"use strict";
          +
          +const assert = require("assert");
          +const test = require("node:test");
          +const { validateTaskMetadata } = require("../../../tools/coordination/codex-intake");
          +const { validateOwnershipBinding } = require("../../../tools/coordination/check-pr");
          +
          +function childIntake(overrides = {}) {
          +  return {
          +    schema: "canto-span-task-intake-v2",
          +    created_by: "chatgpt",
          +    pickup_target: "chatgpt",
          +    pickup_status: "active",
          +    category: "ci-repository-tooling",
          +    risk: "medium",
          +    execution_mode: "implementation",
          +    dependencies: [161],
          +    protected_state: ["merge_authorization"],
          +    active_pickup_owner: "chatgpt",
          +    ownership_revision: 1,
          +    previous_pickup_target: null,
          +    ownership_reason: "initial-routing",
          +    ownership_updated_at: "2026-07-26T10:09:30Z",
          +    pickup_allowed: true,
          +    handoff_status: "no-handoff",
          +    active_claim_issue: 174,
          +    active_branch: "agent/allow-active-child-intakes",
          +    active_pr: 175,
          +    work_claim_required: true,
          +    user_merge_approval_required: true,
          +    codex_self_screen_required: false,
          +    ...overrides,
          +  };
          +}
          +
          +function childClaim(overrides = {}) {
          +  return {
          +    schema: "canto-span-work-claim-v2",
          +    work_id: "CS-WORK-0174",
          +    status: "active",
          +    claim_mode: "exclusive",
          +    integration_role: "integrator",
          +    branch: "agent/allow-active-child-intakes",
          +    expires_at: "2099-01-01T00:00:00Z",
          +    intake_issue: 173,
          +    active_worker: "chatgpt",
          +    ownership_revision: 1,
          +    targets: [{ type: "file", path: "tools/coordination/codex-intake.js", region: "lifecycle" }],
          +    generated_outputs: [],
          +    protected_state: ["merge_authorization"],
          +    dependencies: [161, 162, 173],
          +    summary: "Allow active child intake bindings.",
          +    ...overrides,
          +  };
          +}
          +
          +function childPr(overrides = {}) {
          +  return {
          +    number: 175,
          +    body: "Active worker: chatgpt\nOwnership revision: 1",
          +    head: { ref: "agent/allow-active-child-intakes" },
          +    ...overrides,
          +  };
          +}
          +
          +test("revision-1 child intake may bind its first claim, branch, and PR", () => {
          +  const intake = childIntake();
          +  assert.deepEqual(validateTaskMetadata(intake), []);
          +  assert.deepEqual(validateOwnershipBinding(childClaim(), 174, intake, 173, childPr()), []);
          +});
          +
          +test("unclaimed child intake remains valid before work begins", () => {
          +  assert.deepEqual(validateTaskMetadata(childIntake({
          +    pickup_status: "chatgpt-pickup-required",
          +    active_claim_issue: null,
          +    active_branch: null,
          +    active_pr: null,
          +  })), []);
          +});
          +
          +test("partial claim bindings fail closed", () => {
          +  for (const field of ["active_claim_issue", "active_branch", "active_pr"]) {
          +    assert.ok(validateTaskMetadata(childIntake({ [field]: null }))
          +      .some((error) => error.includes("must set active_claim_issue, active_branch, and active_pr together")));
          +  }
          +});
          +
          +test("non-active lifecycle states cannot authorize an open PR", () => {
          +  for (const pickup_status of ["chatgpt-pickup-required", "blocked", "completed"]) {
          +    assert.ok(validateOwnershipBinding(
          +      childClaim(),
          +      174,
          +      childIntake({ pickup_status }),
          +      173,
          +      childPr(),
          +    ).some((error) => error.includes("does not authorize an active pull request")));
          +  }
          +});
          +
          +test("active intake must remain pickup-enabled", () => {
          +  assert.ok(validateTaskMetadata(childIntake({ pickup_allowed: false }))
          +    .some((error) => error.includes("active intake must permit pickup")));
          +});
          diff --git a/tools/coordination/check-pr.js b/tools/coordination/check-pr.js
          --- a/tools/coordination/check-pr.js
          +++ b/tools/coordination/check-pr.js
          @@ -103,6 +103,9 @@ function validateOwnershipBinding(claim, claimIssue, intake, intakeIssue, pr) {
             if (intake.ownership_revision !== claim.ownership_revision) {
               errors.push(`live ownership revision ${intake.ownership_revision} does not match claim revision ${claim.ownership_revision}`);
             }
          +  if (intake.pickup_status !== "active") {
          +    errors.push(`live intake status ${intake.pickup_status} does not authorize an active pull request`);
          +  }
             if (!intake.pickup_allowed) errors.push("live intake does not permit pickup");
             if (intake.active_claim_issue !== claimIssue) {
               errors.push(`live intake active claim ${intake.active_claim_issue} does not match work claim ${claimIssue}`);
          diff --git a/tools/coordination/codex-intake.js b/tools/coordination/codex-intake.js
          --- a/tools/coordination/codex-intake.js
          +++ b/tools/coordination/codex-intake.js
          @@ -311,7 +311,6 @@ function validateTaskMetadata(metadata) {
                 active_pickup_owner: target,
                 codex_self_screen_required: policy.codexSelfScreenRequired,
               };
          -    if (metadata.ownership_revision === 1) expected.pickup_status = policy.status;
               if (target === "codex") {
                 expected.work_claim_required = true;
                 expected.user_merge_approval_required = true;
          @@ -319,6 +318,11 @@ function validateTaskMetadata(metadata) {
               for (const [field, value] of Object.entries(expected)) {
                 if (metadata[field] !== value) errors.push(`${field} conflicts with pickup_target ${target}`);
               }
          +
          +    const pickupRequiredStatuses = new Set(Object.values(PICKUP_POLICY).map((entry) => entry.status));
          +    if (pickupRequiredStatuses.has(metadata.pickup_status) && metadata.pickup_status !== policy.status) {
          +      errors.push(`pickup_status conflicts with pickup_target ${target}`);
          +    }
             }
             if (!Number.isInteger(metadata.ownership_revision) || metadata.ownership_revision < 1) {
               errors.push("ownership_revision must be a positive integer");
          @@ -340,6 +344,23 @@ function validateTaskMetadata(metadata) {
                 && !/^agent\/[a-z0-9][a-z0-9._/-]*$/.test(String(metadata.active_branch || ""))) {
               errors.push("active_branch must be null or use agent/<description>");
             }
          +
          +  const bindingFields = ["active_claim_issue", "active_branch", "active_pr"];
          +  const boundFieldCount = bindingFields.filter((field) => metadata[field] !== null).length;
          +  const hasNoBinding = boundFieldCount === 0;
          +  const hasCompleteBinding = boundFieldCount === bindingFields.length;
          +  if (!hasNoBinding && !hasCompleteBinding) {
          +    errors.push("active claim binding must set active_claim_issue, active_branch, and active_pr together");
          +  }
          +  if (hasCompleteBinding && metadata.pickup_status !== "active") {
          +    errors.push("a complete active claim binding requires pickup_status active");
          +  }
          +  if (["blocked", "completed"].includes(metadata.pickup_status) && !hasNoBinding) {
          +    errors.push(`${metadata.pickup_status} intake must not retain an active claim binding`);
          +  }
          +  if (metadata.pickup_status === "active" && !metadata.pickup_allowed) {
          +    errors.push("active intake must permit pickup");
          +  }
             return errors;
           }
          PATCH
      - name: Run focused coordination verification
        run: npm run verify:coordination
      - name: Commit repair to claimed branch
        run: |
          git config user.name "Canto Span coordination repair"
          git config user.email "actions@users.noreply.github.com"
          git add tools/coordination/codex-intake.js tools/coordination/check-pr.js tests/tooling/coordination/child-intake-lifecycle.test.js
          git commit -m "Allow active first-claim child intakes"
          git push origin HEAD:agent/allow-active-child-intakes
