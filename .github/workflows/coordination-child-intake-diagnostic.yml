name: Temporary coordination child-intake repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/coordination-child-intake-diagnostic.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/allow-active-child-intakes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/allow-active-child-intakes
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply validated lifecycle patch
        run: |
          echo '' | base64 -d > /tmp/child-intake.patch
          git apply --check /tmp/child-intake.patch
          git apply /tmp/child-intake.patch
      - name: Run focused coordination verification
        run: npm run verify:coordination
      - name: Commit repair to claimed branch
        run: |
          git config user.name "Canto Span coordination repair"
          git config user.email "actions@users.noreply.github.com"
          git add tools/coordination/codex-intake.js tools/coordination/check-pr.js tests/tooling/coordination/child-intake-lifecycle.test.js
          git commit -m "Allow active first-claim child intakes"
          git push origin HEAD:agent/allow-active-child-intakes
