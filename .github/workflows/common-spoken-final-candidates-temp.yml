name: Materialize expanded spoken Cantonese candidate evidence

on:
  push:
    branches:
      - agent/common-spoken-core-final-2000
    paths:
      - .github/workflows/common-spoken-final-candidates-temp.yml
      - tools/lexical-coverage/export-common-spoken-candidate-pool.py
      - tools/lexical-coverage/export-rime-cantonese-candidate-pool.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned corpus dependency
        run: pip install 'pycantonese==5.0.0'
      - name: Generate and deterministically verify candidate pool
        run: |
          set -euo pipefail
          python tools/lexical-coverage/export-common-spoken-candidate-pool.py --pool-size 5000
          python tools/lexical-coverage/export-common-spoken-candidate-pool.py --pool-size 5000 --check
          python -m py_compile tools/lexical-coverage/export-common-spoken-candidate-pool.py
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('data/lexical-frequency/common-spoken-cantonese-candidates-5000.tsv')
          rows = list(csv.DictReader(p.open(encoding='utf-8'), delimiter='\t'))
          assert len(rows) == 5000, len(rows)
          manifest = json.loads(Path('data/lexical-frequency/common-spoken-cantonese-candidates-5000.manifest.json').read_text())
          assert manifest['output']['rows'] == 5000
          print(json.dumps(manifest['output'], ensure_ascii=False, indent=2))
          PY
      - name: Fetch pinned Rime-Cantonese source
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/rime/rime-cantonese.git /tmp/rime-cantonese
          git -C /tmp/rime-cantonese checkout --detach c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0
          test "$(git -C /tmp/rime-cantonese rev-parse HEAD)" = "c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0"
      - name: Generate and verify Rime rescue ledger
        run: |
          set -euo pipefail
          python tools/lexical-coverage/export-rime-cantonese-candidate-pool.py --rime-dir /tmp/rime-cantonese
          python tools/lexical-coverage/export-rime-cantonese-candidate-pool.py --rime-dir /tmp/rime-cantonese --check
          python -m py_compile tools/lexical-coverage/export-rime-cantonese-candidate-pool.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('external-evidence/lexical-pos/rime-cantonese/c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0/common-spoken-candidates-5000.manifest.json')
          manifest = json.loads(p.read_text())
          assert manifest['output']['rows'] == 5000
          print(json.dumps(manifest['output'], ensure_ascii=False, indent=2))
          PY
          git diff --check
      - name: Commit permanent candidate evidence
        run: |
          set -euo pipefail
          git config user.name "canto-span-final-core-candidates"
          git config user.email "actions@users.noreply.github.com"
          git add data/lexical-frequency/common-spoken-cantonese-candidates-5000.tsv \
                  data/lexical-frequency/common-spoken-cantonese-candidates-5000.manifest.json \
                  external-evidence/lexical-pos/rime-cantonese/c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0/common-spoken-candidates-5000-readings.tsv \
                  external-evidence/lexical-pos/rime-cantonese/c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0/common-spoken-candidates-5000.manifest.json
          if git diff --cached --quiet; then
            echo 'No generated candidate evidence change'
          else
            git commit -m 'Materialize expanded spoken Cantonese candidate evidence'
            git push origin HEAD:agent/common-spoken-core-final-2000
          fi
