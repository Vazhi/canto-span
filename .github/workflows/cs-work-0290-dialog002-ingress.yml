name: CS-WORK-0290 Dialog 002 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialog-002-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source-preserving dialog package
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const {execFileSync} = require('child_process');

          const sourceId = 'GLOSSIKA-YUEHK-A1-DLG-002-20251207';
          const root = `data/pedagogical-corpus/glossika/${sourceId}`;
          const parts = Array.from({length:6},(_,i)=>`tools/tmp/cs-work-0290-dialog002-seed.part${String(i).padStart(2,'0')}`);
          const hasSeeds = parts.every(file=>fs.existsSync(file));

          function stable(value) {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') return `{${Object.keys(value).sort().map(key=>`${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            return JSON.stringify(value);
          }
          function sha(text) { return crypto.createHash('sha256').update(text,'utf8').digest('hex'); }
          function countBy(values) { return Object.fromEntries([...values.reduce((m,v)=>m.set(v,(m.get(v)||0)+1),new Map())].sort(([a],[b])=>a.localeCompare(b))); }
          function normalize(text) { return String(text||'').normalize('NFC').replace(/[\p{P}\p{S}\p{Z}\s]/gu,''); }
          function tsv(value) { return String(value ?? '').replace(/\t/g,' ').replace(/\r?\n/g,' '); }
          function listTextFiles(prefixes,excludedPrefixes=[]) {
            const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const files=[];
            for(const file of tracked) {
              if(file==='main.js'||!prefixes.some(prefix=>file.startsWith(prefix))||excludedPrefixes.some(prefix=>file.startsWith(prefix))) continue;
              let stat; try{stat=fs.statSync(file);}catch{continue;}
              if(!stat.isFile()||stat.size>5_000_000) continue;
              let text; try{text=fs.readFileSync(file,'utf8');}catch{continue;}
              files.push({path:file,text,normalized:normalize(text)});
            }
            return files.sort((a,b)=>a.path.localeCompare(b.path));
          }
          function exactPaths(surface,files){return files.filter(entry=>entry.text.includes(surface)).map(entry=>entry.path);}
          function normalizedPaths(surface,files){const n=normalize(surface);if(n.length<2)return[];return files.filter(entry=>!entry.text.includes(surface)&&entry.normalized.includes(n)).map(entry=>entry.path);}

          if(!hasSeeds) {
            if(!fs.existsSync(`${root}/source.json`)) throw new Error('Neither source seeds nor generated package exists');
            console.log('Generated package already exists; validation-only run.');
            process.exit(0);
          }

          const seed=JSON.parse(parts.map(file=>fs.readFileSync(file,'utf8')).join(''));
          if(seed.records.length!==72) throw new Error(`Expected 72 records, found ${seed.records.length}`);
          const turns=seed.records.filter(record=>record.itemType==='dialog_turn');
          const vocabulary=seed.records.filter(record=>record.itemType==='lexical_entry');
          if(turns.length!==38||vocabulary.length!==34) throw new Error(`Expected 38 turns and 34 vocabulary entries, found ${turns.length}/${vocabulary.length}`);
          for(let i=0;i<turns.length;i++) {
            const expected=i+1;
            if(turns[i].turn!==expected) throw new Error(`Turn order mismatch at ${expected}`);
            const expectedSpeaker=expected%2===1?'阿珊':'店員';
            if(turns[i].speaker!==expectedSpeaker) throw new Error(`Speaker alternation mismatch at turn ${expected}`);
            if(turns[i].source.english!==null) throw new Error(`Turn ${expected} must preserve missing English as null`);
            if(!turns[i].source.sourceLine.startsWith(`${turns[i].speaker}:`)) throw new Error(`Source line speaker mismatch at turn ${expected}`);
            if(!turns[i].source.jyutpingLine.startsWith('/')||!turns[i].source.jyutpingLine.endsWith('/')) throw new Error(`Jyutping line delimiters missing at turn ${expected}`);
          }
          for(let i=0;i<vocabulary.length;i++) if(vocabulary[i].vocabularyOrdinal!==i+1) throw new Error(`Vocabulary order mismatch at ${i+1}`);

          const payloadHash=`sha256:${sha(stable(seed.records.map(record=>record.source)))}`;
          const items=seed.records.map((record,index)=>({
            id:`${sourceId}-I${String(index+1).padStart(3,'0')}`,
            ordinal:index+1,
            itemType:record.itemType,
            ...(record.turn?{turn:record.turn,speaker:record.speaker}:{}),
            ...(record.vocabularyOrdinal?{vocabularyOrdinal:record.vocabularyOrdinal}:{}),
            source:record.source,
            sourceHash:`sha256:${sha(stable(record.source))}`
          }));

          const tokenPairs=require('./src/runtime-resources/lexicon/token-lexicon');
          const tokenMap=new Map(tokenPairs);
          const tokenRoot='src/runtime-resources/lexicon/token-lexicon';
          const tokenFiles=fs.readdirSync(tokenRoot).filter(file=>file.endsWith('.js')).map(file=>path.join(tokenRoot,file)).sort();
          const tokenText=Object.fromEntries(tokenFiles.map(file=>[file,fs.readFileSync(file,'utf8')]));
          const canonicalFiles=listTextFiles(['src/','src/runtime-resources/'],[root+'/', 'tools/tmp/cs-work-0290-', '.github/workflows/cs-work-0290-']);
          const supportingFiles=listTextFiles(['tests/','test-data/','data/','docs/','grammar/','config/'],[root+'/', 'tools/tmp/cs-work-0290-', '.github/workflows/cs-work-0290-']);
          if([...canonicalFiles,...supportingFiles].some(entry=>entry.path==='main.js')) throw new Error('Generated main.js leaked into ownership scan');

          const naturalnessTurns=new Set([3,9,17,18,20,22,23,33,34,36]);
          const constructionRoutes={
            9:['particle_cluster_context','biased_question_context'],
            17:['change_of_state_comparative'],
            18:['comparative_size_expression','translation_gloss_review'],
            20:['nominal_ellipsis_go3','comparative_degree'],
            23:['nominal_ellipsis_go3','purchase_decision_particle'],
            28:['quantity_classifier_question'],
            29:['headless_classifier_answer'],
            30:['transfer_dative_order','inclusive_particle_maai4'],
            33:['time_expression_register','a_not_a_acceptability'],
            34:['motion_purpose_or_sequence','zau6_dak1_laa3'],
            35:['a_not_a_necessity','deposit_lexicon'],
            36:['arrival_sequence','transfer_payment','zau6_dak1_laa3']
          };
          const lexicalFlags={
            '蚊':['hong_kong_specific_currency_gloss'],
            '細個':['context_sensitive_comparative_gloss'],
            '支':['classifier_compatibility_review'],
            '鐘':['register_and_time_expression_review'],
            '嚟到':['compositionality_and_clause_relation_review']
          };

          const records=[];
          const crosswalkItems=[];
          for(const item of items) {
            const surface=item.source.traditional;
            const canonicalExact=exactPaths(surface,canonicalFiles);
            const canonicalNormalized=normalizedPaths(surface,canonicalFiles);
            const supportingExact=exactPaths(surface,supportingFiles);
            const supportingNormalized=normalizedPaths(surface,supportingFiles);
            const allExact=[...new Set([...canonicalExact,...supportingExact])].sort();
            const allNormalized=[...new Set([...canonicalNormalized,...supportingNormalized])].sort();
            const deduplicationRelation=allExact.length?'exact_duplicate_candidate':allNormalized.length?'normalized_duplicate_candidate':'no_project_match';
            const runtimeEntry=item.itemType==='lexical_entry'?(tokenMap.get(surface)||null):null;
            const runtimeOwners=item.itemType==='lexical_entry'?tokenFiles.filter(file=>tokenText[file].includes(JSON.stringify(surface))):[];
            const reviewFlags=[];
            if(item.itemType==='dialog_turn'&&naturalnessTurns.has(item.turn)) reviewFlags.push('naturalness_review_candidate');
            for(const route of constructionRoutes[item.turn]||[]) reviewFlags.push(route);
            for(const flag of lexicalFlags[surface]||[]) reviewFlags.push(flag);
            if(item.itemType==='dialog_turn') reviewFlags.push('source_turn_translation_not_provided');
            let ingressClassification;
            if(item.itemType==='dialog_turn'&&naturalnessTurns.has(item.turn)) ingressClassification='naturalness_review_candidate';
            else if(item.itemType==='lexical_entry'&&runtimeEntry) ingressClassification='lexical_only_attestation';
            else if(deduplicationRelation==='exact_duplicate_candidate') ingressClassification='exact_duplicate';
            else if(deduplicationRelation==='normalized_duplicate_candidate') ingressClassification='normalized_duplicate';
            else ingressClassification='new_attestation';
            const previous=item.itemType==='dialog_turn'&&item.turn>1?`${sourceId}-I${String(item.turn-1).padStart(3,'0')}`:null;
            const next=item.itemType==='dialog_turn'&&item.turn<38?`${sourceId}-I${String(item.turn+1).padStart(3,'0')}`:null;
            records.push({
              id:item.id,
              sourceHash:item.sourceHash,
              normalizedCantonese:normalize(surface),
              deduplicationRelation,
              ingressClassification,
              reviewFlags,
              reviewedValues:{},
              reviewerNote:'',
              evidenceUse:'not_authorized'
            });
            crosswalkItems.push({
              sourceItemId:item.id,
              ordinal:item.ordinal,
              itemType:item.itemType,
              sourceDisplay:surface,
              sourceHash:item.sourceHash,
              adjacency:item.itemType==='dialog_turn'?{previousTurnId:previous,nextTurnId:next,previousSpeaker:item.turn>1?turns[item.turn-2].speaker:null,nextSpeaker:item.turn<38?turns[item.turn].speaker:null}:null,
              deduplicationRelation,
              ingressClassification,
              canonicalExactOwners:canonicalExact,
              canonicalNormalizedOwners:canonicalNormalized,
              supportingExactOwners:supportingExact,
              supportingNormalizedOwners:supportingNormalized,
              runtimeLexicalOwner:item.itemType==='lexical_entry'?{entry:runtimeEntry,owners:runtimeOwners}:null,
              reviewFlags,
              constructionRouting:(constructionRoutes[item.turn]||[]).map(cluster=>({parentIssue:130,cluster,status:'research_route_only'}))
            });
          }

          const classificationCounts=countBy(records.map(record=>record.ingressClassification));
          const relationCounts=countBy(records.map(record=>record.deduplicationRelation));
          const source={
            schema:'canto-span-pedagogical-dialog-source-v1',
            source:seed.source,
            ingress:{...seed.ingress,recordCount:items.length,turnCount:turns.length,vocabularyCount:vocabulary.length,itemTypeCounts:countBy(items.map(item=>item.itemType)),sourcePayloadHash:payloadHash,sourcePayloadHashPolicy:'SHA-256 of canonical key-sorted JSON for the ordered source-field array.',turnEnglishPolicy:'The source email provides no per-turn English translation; each turn preserves english=null.'},
            items
          };
          const crosswalk={
            schema:'canto-span-pedagogical-dialog-crosswalk-v1',
            sourceId,
            sourcePayloadHash:payloadHash,
            architecture:{canonicalRuntimeInputs:['src/**','src/runtime-resources/**'],generatedExcluded:['main.js'],supportingRecords:['tests/**','test-data/**','data/**','docs/**','grammar/**','config/**']},
            summary:{recordCount:72,turnCount:38,vocabularyCount:34,classificationCounts,relationCounts},
            items:crosswalkItems
          };
          const review={
            schema:'canto-span-pedagogical-dialog-review-v1',
            sourceId,
            sourcePayloadHash:payloadHash,
            policy:{sourceLayer:'source.json is immutable.',translationBoundary:'Missing per-turn translations are preserved and must not be generated during ingress.',deduplicationBoundary:'Exact and normalized repository matches are candidates until reviewed.',evidenceBoundary:'Dialog adjacency and pedagogical attestation do not establish productivity, construction identity, register, or parser status.'},
            summary:{recordCount:72,reviewedCount:0,unreviewedCount:72,classificationCounts,relationCounts,knownSourceAlerts:[
              {scope:'all_dialog_turns',type:'missing_turn_english_translation',status:'source_omission_preserved',note:'The email supplies Cantonese and Jyutping but no per-turn English translations.'},
              {scope:'speaker_labels',type:'speaker_role_jyutping_format',status:'source_preserved',note:'The source Jyutping lines include Aa3 Saan1 and Dim3 Jyun4 speaker prefixes.'},
              {scope:'source_notes',type:'source_confidence_metadata',status:'not_evidence',note:'Review Priority: Low and Confidence Level: High are preserved source claims, not Canto Span adjudication.'},
              {scope:`${sourceId}-I009`,type:'particle_context_review',status:'route_to_parent_130',note:'㗎咩 requires tone-, context-, stance-, and particle-cluster analysis.'},
              {scope:`${sourceId}-I017`,type:'change_comparative_review',status:'route_to_parent_130',note:'平咗 may involve a change-of-state or contextual comparative reading.'},
              {scope:`${sourceId}-I018`,type:'naturalness_translation_review',status:'requires_context_review',note:'細個啲 and its implied comparison require item-level review.'},
              {scope:`${sourceId}-I020,${sourceId}-I023`,type:'nominal_ellipsis_review',status:'route_to_parent_130',note:'士多啤梨個 and related 個-headed forms require ellipsis and reference analysis.'},
              {scope:`${sourceId}-I030`,type:'dative_benefactive_review',status:'route_to_parent_130',note:'送埋蠟燭畀你 preserves transfer order and inclusive-particle material without analysis.'},
              {scope:`${sourceId}-I034,${sourceId}-I036`,type:'sequence_condition_review',status:'route_to_parent_130',note:'嚟攞／嚟到畀錢 + 就得喇 requires motion, sequence, condition, result, and particle separation.'}
            ]},
            records
          };

          fs.mkdirSync(root,{recursive:true});
          fs.mkdirSync('docs/research',{recursive:true});
          fs.writeFileSync(`${root}/source.json`,JSON.stringify(source,null,2)+'\n');
          fs.writeFileSync(`${root}/crosswalk.json`,JSON.stringify(crosswalk,null,2)+'\n');
          fs.writeFileSync(`${root}/review.json`,JSON.stringify(review,null,2)+'\n');
          const header=['id','ordinal','item_type','turn','speaker','vocabulary_ordinal','source_cantonese','source_jyutping','source_english','source_hash','previous_turn_id','next_turn_id','deduplication_relation','ingress_classification','runtime_lexical_owners','canonical_exact_owners','supporting_exact_owners','review_flags','review_state'];
          const rows=items.map((item,index)=>{
            const record=records[index],walk=crosswalkItems[index];
            const sourceJyutping=item.source.jyutpingLine||item.source.jyutping||'';
            const sourceEnglish=item.source.english===null?'':item.source.english||'';
            return [item.id,item.ordinal,item.itemType,item.turn||'',item.speaker||'',item.vocabularyOrdinal||'',item.source.traditional,sourceJyutping,sourceEnglish,item.sourceHash,walk.adjacency?.previousTurnId||'',walk.adjacency?.nextTurnId||'',record.deduplicationRelation,record.ingressClassification,(walk.runtimeLexicalOwner?.owners||[]).join('|'),walk.canonicalExactOwners.join('|'),walk.supportingExactOwners.join('|'),record.reviewFlags.join('|'),seed.ingress.reviewState].map(tsv).join('\t');
          });
          fs.writeFileSync(`${root}/items.tsv`,[header.join('\t'),...rows].join('\n')+'\n');
          fs.writeFileSync(`${root}/README.md`,`# Glossika Cantonese A1 dialog 002 corpus package\n\n- Source ID: \`${sourceId}\`\n- Title: 讚吓個蛋糕\n- Source date: 2025-12-07\n- Gmail message: \`19afa819bdfae102\`\n- Intake issue: #138\n- Work claim: #290\n- Records: 38 dialog turns + 34 vocabulary entries = 72\n- Source payload hash: \`${payloadHash}\`\n\n## Source fidelity\n\nSpeaker labels, Cantonese, punctuation, Jyutping lines, vocabulary glosses, scenario, notes, and order are preserved. The source contains no per-turn English translations; the turn records retain \`english: null\`.\n\n## Modular ownership\n\nCanonical runtime ownership comes from \`src/**\` and \`src/runtime-resources/**\`. Generated \`main.js\` is excluded.\n\n## Files\n\n- \`source.json\`: immutable ordered source records.\n- \`crosswalk.json\`: adjacency, modular owners, and deduplication candidates.\n- \`review.json\`: review classifications and source alerts.\n- \`items.tsv\`: flat review rendering.\n\nNo parser, lexicon, identity/status, survey, version, release, or deployment change is included.\n`);
          fs.writeFileSync('docs/research/GLOSSIKA-YUEHK-A1-DLG-002-20251207-CORPUS-INGRESS.md',`# Glossika dialog 002 corpus ingress — 讚吓個蛋糕\n\n- Source ID: \`${sourceId}\`\n- Intake: #138\n- Work claim: #290\n- Parent research: #130\n- Status: source-preserving ingress complete; expert review required\n\n## Coverage\n\n- 38 ordered dialog turns\n- 34 ordered vocabulary entries\n- 72 total records\n- source payload hash: \`${payloadHash}\`\n- classifications: \`${JSON.stringify(classificationCounts)}\`\n- deduplication relations: \`${JSON.stringify(relationCounts)}\`\n\n## Adjacency\n\nEach turn records its previous and next source turn without treating adjacency as construction evidence.\n\n## Source omissions and alerts\n\nThe email provides no turn-level English translations. It also supplies source-authored confidence and review-priority claims; those remain metadata rather than evidence. Review routing preserves the 㗎咩 particle cluster, 平咗, 細個啲, 個-headed ellipsis, transfer order, and 嚟／嚟到 + 就得喇 sequences for later bounded research under #130.\n\n## Stop boundary\n\nNo parser test, grammar promotion, runtime source, generated \`main.js\`, version, survey, or release state changed.\n`);
          console.log({payloadHash,classificationCounts,relationCounts});
          NODE
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-002-20251207';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          if(source.items.length!==72) throw new Error('Expected 72 source records');
          if(source.ingress.turnCount!==38||source.ingress.vocabularyCount!==34) throw new Error('Unexpected source counts');
          const turns=source.items.filter(item=>item.itemType==='dialog_turn');
          const vocab=source.items.filter(item=>item.itemType==='lexical_entry');
          if(turns.some((item,index)=>item.turn!==index+1||item.speaker!==((index+1)%2===1?'阿珊':'店員')||item.source.english!==null)) throw new Error('Turn sequence, speaker, or missing-English preservation failed');
          if(vocab.some((item,index)=>item.vocabularyOrdinal!==index+1)) throw new Error('Vocabulary order failed');
          if(crosswalk.items.length!==72||review.records.length!==72) throw new Error('Crosswalk/review alignment failed');
          if(crosswalk.architecture.generatedExcluded[0]!=='main.js') throw new Error('main.js exclusion missing');
          if(crosswalk.items.some(item=>[...item.canonicalExactOwners,...item.canonicalNormalizedOwners,...item.supportingExactOwners,...item.supportingNormalizedOwners].includes('main.js'))) throw new Error('main.js leaked into ownership');
          if(crosswalk.items.filter(item=>item.itemType==='dialog_turn').some((item,index)=>item.adjacency.previousTurnId!==(index===0?null:`GLOSSIKA-YUEHK-A1-DLG-002-20251207-I${String(index).padStart(3,'0')}`)||item.adjacency.nextTurnId!==(index===37?null:`GLOSSIKA-YUEHK-A1-DLG-002-20251207-I${String(index+2).padStart(3,'0')}`))) throw new Error('Turn adjacency failed');
          const rows=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(rows.length!==73) throw new Error(`Expected TSV header plus 72 rows, found ${rows.length}`);
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='missing_turn_english_translation')) throw new Error('Missing translation alert absent');
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-002-20251207 docs/research/GLOSSIKA-YUEHK-A1-DLG-002-20251207-CORPUS-INGRESS.md
          git rm tools/tmp/cs-work-0290-dialog002-seed.part00 tools/tmp/cs-work-0290-dialog002-seed.part01 tools/tmp/cs-work-0290-dialog002-seed.part02 tools/tmp/cs-work-0290-dialog002-seed.part03 tools/tmp/cs-work-0290-dialog002-seed.part04 tools/tmp/cs-work-0290-dialog002-seed.part05
          git commit -m "Add Glossika dialog 002 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
