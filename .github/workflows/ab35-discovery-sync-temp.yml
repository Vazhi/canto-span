name: AB35 discovery sync temporary

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.number == 746 && github.event.pull_request.head.ref == 'agent/ab35-productive-vo-behavior-reaudit' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab35-productive-vo-behavior-reaudit
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Apply explicit audit outcome and regenerate discovery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "a947cb9eada1990f44ff8c2bd78c27692e87545d"
          python3 <<'PY'
          from pathlib import Path
          p=Path('grammar/research_pending/ProductiveVO.md')
          text=p.read_text()
          anchor='current_standard_reaudit_complete: true\n'
          line='source_scope_matches_claim: false\n'
          assert text.count(anchor)==1
          assert line not in text
          p.write_text(text.replace(anchor, anchor+line, 1))
          PY
          node tools/generate-supported-productive-discovery.js --write
          python3 <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/construction-candidate-readiness.json').read_text())
          counts=r['state_counts']
          assert counts.get('narrowing_candidate') == 31, counts
          assert counts.get('source_supported') == 59, counts
          ab35=[x for x in r['records'] if x.get('construction_code') == 'AB35']
          assert len(ab35)==1, len(ab35)
          row=ab35[0]
          assert row['candidate_state']=='narrowing_candidate', row['candidate_state']
          assert row['gates']['source_scope_matches_claim']['status']=='fail', row['gates']['source_scope_matches_claim']
          p=Path('docs/current/PROJECT-STATE.md')
          text=p.read_text()
          assert text.count('| `narrowing_candidate` | 30 |')==1
          assert text.count('| `source_supported` | 60 |')==1
          text=text.replace('| `narrowing_candidate` | 30 |','| `narrowing_candidate` | 31 |',1)
          text=text.replace('| `source_supported` | 60 |','| `source_supported` | 59 |',1)
          p.write_text(text)
          PY
      - name: Verify research and canonical projections
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:research
          npm run verify:identities
          npm run verify:discovery
          npm run verify
      - name: Commit final research-only state and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- validation/current 2>/dev/null || true
          git clean -fd validation/current || true
          rm .github/workflows/ab35-discovery-sync-temp.yml
          python3 <<'PY'
          import subprocess
          allowed={
            'grammar/research_pending/ProductiveVO.md',
            'data/construction-candidate-readiness.json',
            'docs/research/SUPPORTED-PRODUCTIVE-CANDIDATES.md',
            'docs/research/ORPHANED-CONSTRUCTION-EVIDENCE.md',
            'docs/research/CONSTRUCTION-FAMILY-GAPS.md',
            'docs/research/FULL-REPO-SUPPORTED-PRODUCTIVE-SWEEP-R1.md',
            'docs/current/PROJECT-STATE.md',
            '.github/workflows/ab35-discovery-sync-temp.yml',
          }
          rows=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          got={row[3:] for row in rows if len(row)>=4}
          assert got <= allowed, (sorted(got), sorted(allowed))
          required={'grammar/research_pending/ProductiveVO.md','data/construction-candidate-readiness.json','docs/current/PROJECT-STATE.md'}
          assert required <= got, (sorted(required), sorted(got))
          PY
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add grammar/research_pending/ProductiveVO.md data/construction-candidate-readiness.json docs/research/SUPPORTED-PRODUCTIVE-CANDIDATES.md docs/research/ORPHANED-CONSTRUCTION-EVIDENCE.md docs/research/CONSTRUCTION-FAMILY-GAPS.md docs/research/FULL-REPO-SUPPORTED-PRODUCTIVE-SWEEP-R1.md docs/current/PROJECT-STATE.md .github/workflows/ab35-discovery-sync-temp.yml
          git commit -m "Record AB35 source-scope mismatch"
          git push origin HEAD:agent/ab35-productive-vo-behavior-reaudit
