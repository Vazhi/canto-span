name: Temporary architecture audit detail

on:
  push:
    branches:
      - agent/frozen-token-feature-arrays
    paths:
      - ".github/workflows/architecture-audit-detail-temp.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frozen-token-feature-arrays
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Print exact acceptability trace
        run: |
          node - <<'NODE'
          const { loadRuntimeApi } = require('./tests/lib/runtime-api');
          const api = loadRuntimeApi({ apiNames: ['analyzeLine', 'diagnosticFinalRows'] });
          const rows = api.diagnosticFinalRows(api.analyzeLine('是但幾時去都得。'));
          console.log(JSON.stringify(rows.filter(row => row.construction === 'AcceptabilityClause'), null, 2));
          NODE
