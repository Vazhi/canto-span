name: Temporary architecture audit detail

on:
  push:
    branches:
      - agent/frozen-token-feature-arrays
    paths:
      - ".github/workflows/architecture-audit-detail-temp.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frozen-token-feature-arrays
      - name: Locate broad predicate template and acceptability definitions
        run: |
          set -euo pipefail
          grep -R -n -E 'bounded_complement|AcceptabilityClause' src/runtime-resources/grammar src/parser | head -n 250 || true
