name: Temporary acceptability trace materializer

on:
  push:
    branches:
      - agent/frozen-token-feature-arrays
    paths:
      - ".github/workflows/architecture-audit-detail-temp.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frozen-token-feature-arrays
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Repair AcceptabilityClause trace contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/parser/detectors/acceptability/clauses.js')
          text = path.read_text(encoding='utf-8')
          old = '''  return construction("AcceptabilityClause", "Acceptability", children, {\n    slots: ["acceptability_clause", "acceptability", "focus_adverb", "acceptability_predicate", "predicate", "clause"],\n    note: "Bounded action-feasibility clause: an overt action predicate followed by 都得 and an optional final particle. Wh/free-choice 都得 remains outside this node. When a subject + transparent predicate is present, preserve it as a child clause for learner visibility.",\n    trace: traceInfo("generative_template", {\n      construction_type: "AcceptabilityClause",\n      retired_label_alias: "PermissionAcceptabilityClause",\n      acceptability_subtype: "action_feasibility",\n      template: ["subject?", "predicate!", "focus_adverb!", "acceptability_predicate!", "particle?"],\n      assigned_slots: ["subject", "predicate", "focus_adverb", "acceptability_predicate", "particle"],'''
          new = '''  const traceTemplate = subjectPredicateChild\n    ? ["predicate!", "focus_adverb!", "acceptability_predicate!", "particle?"]\n    : ["subject?", "predicate!", "focus_adverb!", "acceptability_predicate!", "particle?"];\n  const assignedSlots = subjectPredicateChild\n    ? ["predicate", "focus_adverb", "acceptability_predicate", ...(match.particle ? ["particle"] : [])]\n    : [...(match.subject ? ["subject"] : []), "predicate", "focus_adverb", "acceptability_predicate", ...(match.particle ? ["particle"] : [])];\n  return construction("AcceptabilityClause", "Acceptability", children, {\n    slots: ["acceptability_clause", "acceptability", "focus_adverb", "acceptability_predicate", "predicate", "clause"],\n    note: "Bounded action-feasibility clause: an overt action predicate followed by 都得 and an optional final particle. Wh/free-choice 都得 remains outside this node. When a subject + transparent predicate is present, preserve it as a child clause for learner visibility.",\n    trace: traceInfo("generative_template", {\n      construction_type: "AcceptabilityClause",\n      template_family: "generative_template",\n      retired_label_alias: "PermissionAcceptabilityClause",\n      acceptability_subtype: "action_feasibility",\n      template: traceTemplate,\n      assigned_slots: assignedSlots,'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one AcceptabilityClause trace block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run focused runtime checks
        run: |
          node --test tests/tooling/runtime/token-features-immutability.test.js
          node --test tests/tooling/parser-coverage/architecture-audit.test.js
      - name: Rebuild and verify committed runtime
        run: |
          npm run build:runtime
          node tools/build-runtime.js --check
      - name: Commit permanent source and generated runtime only
        run: |
          git config user.name "canto-span-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/parser/detectors/acceptability/clauses.js main.js
          git diff --cached --check
          git commit -m "Repair acceptability trace bindings"
          git push origin HEAD:agent/frozen-token-feature-arrays
