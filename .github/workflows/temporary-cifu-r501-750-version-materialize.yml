name: Temporary Cifu ranks 501-750 v0.5.231 materializer

on:
  push:
    branches:
      - agent/cifu-r501-750-runtime-reconcile
    paths:
      - .github/workflows/temporary-cifu-r501-750-version-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r501-750-runtime-reconcile
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Synchronize v0.5.231 source metadata and project state
        shell: bash
        run: |
          npm version 0.5.231 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path

          plugin = Path('src/plugin-entry.js')
          text = plugin.read_text(encoding='utf-8')
          old = 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.230";\n// v0.5.230: reconciles reviewed Cifu ranks 1–250 lexical analyses with neutral/compositional safeguards, stable alternatives, and native-reviewed 喀 pronunciation handling.'
          new = 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.231";\n// v0.5.231: reconciles reviewed Cifu ranks 501–750 with conservative default selection, 101 stable reviewed alternative surfaces, and preserved ranks 1–500 behavior.\n// v0.5.230: reconciles reviewed Cifu ranks 1–250 lexical analyses with neutral/compositional safeguards, stable alternatives, and native-reviewed 喀 pronunciation handling.'
          assert text.count(old) == 1
          plugin.write_text(text.replace(old, new, 1), encoding='utf-8')

          state = Path('docs/current/PROJECT-STATE.md')
          text = state.read_text(encoding='utf-8')
          assert text.count('| Runtime | v0.5.230 |') == 1
          text = text.replace('| Runtime | v0.5.230 |', '| Runtime | v0.5.231 |', 1)
          marker = '- v0.5.230 implements the final #792 Cifu ranks 1–250 lexical adjudication'
          assert text.count(marker) == 1
          bullet = '- v0.5.231 implements the final #866 R1+R2 Cifu ranks 501–750 lexical adjudication while retaining complete 2,000/2,000 exact-surface coverage: 45 previously neutral single-analysis lexical gaps receive reviewed typed defaults, 45 neutral or default-sensitive surfaces retain their existing neutral defaults while exposing reviewed whole-form alternatives, and 56 already-typed multi-analysis or reading-split surfaces retain their current defaults while reviewed alternatives are appended; all 30 `blocked_atomic` rows receive no new atomic lexical promotion, existing structured `一次` and `第二個` parser entries are preserved, 101 surfaces expose stable reviewed alternative records, R2 distinctions for `樂`, `磅`, and `直行` are represented, and the evidence-resolved `轉彎` and `早` records are complete; no construction identity or status, survey, corpus, release-publication, or deployment state is changed;\n\n'
          text = text.replace(marker, bullet + marker, 1)
          state.write_text(text, encoding='utf-8')
          PY
      - name: Build and verify source-first runtime
        shell: bash
        run: |
          npm run build:runtime
          node tools/build-runtime.js --check
          node tests/tooling/lexicon/cifu-r501-750-reviewed-runtime.test.js
      - name: Verify bounded state diff
        shell: bash
        run: |
          rm .github/workflows/temporary-cifu-r501-750-version-materialize.yml
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          printf 'Pending paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 6
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual-paths
          printf '%s\n' \
            '.github/workflows/temporary-cifu-r501-750-version-materialize.yml' \
            'docs/current/PROJECT-STATE.md' \
            'main.js' \
            'package-lock.json' \
            'package.json' \
            'src/plugin-entry.js' | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Commit state synchronization and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugin-entry.js package.json package-lock.json main.js docs/current/PROJECT-STATE.md .github/workflows/temporary-cifu-r501-750-version-materialize.yml
          git commit -m 'Synchronize ranks 501-750 runtime v0.5.231'
          git push origin HEAD:agent/cifu-r501-750-runtime-reconcile
