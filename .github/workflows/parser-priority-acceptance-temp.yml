name: Parser priority temporary acceptance

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  acceptance:
    if: github.event.pull_request.head.ref == 'agent/evidence-coverage-prioritizer'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/evidence-coverage-prioritizer
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Refine unknown-lexicon queue in workspace only
        run: |
          python3 <<'PY'
          from pathlib import Path

          tool = Path('tools/parser-work-prioritizer.js')
          text = tool.read_text()
          old = '''function unknownLexiconQueue(records = [], sampleLimit = DEFAULT_SAMPLE_LIMIT) {
            const grouped = new Map();
            for (const record of records) {
              for (const token of record.token_provenance || []) {
                if (token.lexical_status !== "unknown" || !token.surface) continue;
                if (!grouped.has(token.surface)) grouped.set(token.surface, { surface: token.surface, executable_case_count: 0, examples: [] });
                const item = grouped.get(token.surface);
                item.executable_case_count += 1;
                if (item.examples.length < sampleLimit && !item.examples.includes(record.source)) item.examples.push(record.source);
              }
            }
            return [...grouped.values()]
              .sort((a, b) => b.executable_case_count - a.executable_case_count || a.surface.localeCompare(b.surface))
              .map((item, index) => ({
                rank: index + 1,
                action_class: "lexicon_work",
                ...item,
                linguistic_confidence: null,
                evidence_weight: 0,
                reason: "Unknown token observed in the executable development corpus. Count is a test/development reach signal only, not lexical productivity or frequency evidence.",
              }));
          }
          '''
          new = '''function validUniqueSourceSpan(span = {}) {
            return span && span.status === "unique"
              && Number.isInteger(span.start) && Number.isInteger(span.end)
              && span.start >= 0 && span.end >= span.start;
          }

          function unknownLexicalSpansForRecord(record = {}) {
            const source = String(record.source || record.parser_shadow_source || "");
            const spans = [];
            let current = null;

            function flush() {
              if (!current) return;
              const surface = current.span_backed && source && current.end <= source.length
                ? source.slice(current.start, current.end)
                : current.parts.join("");
              if (surface) {
                spans.push({
                  surface,
                  start: current.span_backed ? current.start : null,
                  end: current.span_backed ? current.end : null,
                  token_count: current.parts.length,
                  span_status: current.span_backed ? "unique" : "unavailable",
                });
              }
              current = null;
            }

            for (const token of record.token_provenance || []) {
              if (token.lexical_status !== "unknown" || !token.surface) {
                flush();
                continue;
              }
              const span = token.source_span || {};
              if (!validUniqueSourceSpan(span)) {
                flush();
                spans.push({ surface: token.surface, start: null, end: null, token_count: 1, span_status: "unavailable" });
                continue;
              }
              if (current && current.span_backed && current.end === span.start) {
                current.end = span.end;
                current.parts.push(token.surface);
                continue;
              }
              flush();
              current = {
                span_backed: true,
                start: span.start,
                end: span.end,
                parts: [token.surface],
              };
            }
            flush();
            return spans;
          }

          function unknownLexiconQueue(records = [], sampleLimit = DEFAULT_SAMPLE_LIMIT) {
            const grouped = new Map();
            for (const record of records) {
              for (const span of unknownLexicalSpansForRecord(record)) {
                if (!grouped.has(span.surface)) grouped.set(span.surface, { surface: span.surface, executable_case_count: 0, examples: [] });
                const item = grouped.get(span.surface);
                item.executable_case_count += 1;
                if (item.examples.length < sampleLimit && !item.examples.includes(record.source)) item.examples.push(record.source);
              }
            }
            return [...grouped.values()]
              .sort((a, b) => b.executable_case_count - a.executable_case_count || a.surface.localeCompare(b.surface))
              .map((item, index) => ({
                rank: index + 1,
                action_class: "lexicon_work",
                ...item,
                linguistic_confidence: null,
                evidence_weight: 0,
                reason: "Unknown contiguous lexical span observed in the executable development corpus. Count is a test/development reach signal only, not lexical productivity or frequency evidence.",
              }));
          }
          '''
          if old not in text:
              raise SystemExit('expected unknownLexiconQueue block not found')
          text = text.replace(old, new)
          text = text.replace(
              '      learner_value_factor: "not_available_in_canonical_inputs_and_not_invented",\n',
              '      learner_value_factor: "not_available_in_canonical_inputs_and_not_invented",\n      canonical_readiness_score_used_in_rank: false,\n'
          )
          text = text.replace(
              '  unknownLexiconQueue,\n',
              '  unknownLexicalSpansForRecord,\n  unknownLexiconQueue,\n'
          )
          tool.write_text(text)

          test_file = Path('tests/tooling/parser-coverage/prioritizer.test.js')
          tests = test_file.read_text()
          tests = tests.replace(
              '  unknownLexiconQueue,\n',
              '  unknownLexicalSpansForRecord,\n  unknownLexiconQueue,\n'
          )
          tests = tests.replace(
              '  assert.equal(report.policy.learner_value_factor, "not_available_in_canonical_inputs_and_not_invented");\n',
              '  assert.equal(report.policy.learner_value_factor, "not_available_in_canonical_inputs_and_not_invented");\n  assert.equal(report.policy.canonical_readiness_score_used_in_rank, false);\n'
          )
          marker = '''test("unmapped structural gaps remain explicit instead of receiving fabricated construction mappings", () => {'''
          addition = '''test("contiguous unknown atoms are grouped into lexical spans when ordered source spans are available", () => {
            const passwordTokens = Array.from("password").map((surface, index) => ({
              surface,
              lexical_status: "unknown",
              source_span: { status: "unique", start: index, end: index + 1 },
            }));
            const chineseTokens = [
              { surface: "繁", lexical_status: "unknown", source_span: { status: "unique", start: 0, end: 1 } },
              { surface: "殖", lexical_status: "unknown", source_span: { status: "unique", start: 1, end: 2 } },
            ];
            const spanRecords = [
              coverageRecord("password", "UNKNOWN_LEXICON", [], { tokens: passwordTokens }),
              coverageRecord("繁殖", "UNKNOWN_LEXICON", [], { tokens: chineseTokens }),
            ];
            assert.deepEqual(unknownLexicalSpansForRecord(spanRecords[0]), [
              { surface: "password", start: 0, end: 8, token_count: 8, span_status: "unique" },
            ]);
            const queue = unknownLexiconQueue(spanRecords, 2);
            assert(queue.some((row) => row.surface === "password"));
            assert(queue.some((row) => row.surface === "繁殖"));
            assert(!queue.some((row) => row.surface === "p"));
          });

          ''' + marker
          if marker not in tests:
              raise SystemExit('expected test insertion marker not found')
          tests = tests.replace(marker, addition)
          test_file.write_text(tests)
          PY
      - name: Focused prioritizer tests
        run: npm run test:parser-priorities
      - name: Build full deterministic priority report
        run: npm run audit:parser-priorities -- --json --limit 20 --samples 5 > parser-priorities.json
      - name: Permanent architecture gate
        run: npm run audit:parser-architecture
      - name: Core and research verification
        run: |
          npm run verify
          npm run verify:research
      - name: Stage verified tool/test tree without moving branch ref
        run: |
          set -euo pipefail
          base_tree=$(git rev-parse HEAD^{tree})
          : > /tmp/tree-elements.jsonl
          for file in tools/parser-work-prioritizer.js tests/tooling/parser-coverage/prioritizer.test.js; do
            FILE_TO_STAGE="$file" python3 <<'PY'
          import base64, json, os
          path = os.environ['FILE_TO_STAGE']
          with open(path, 'rb') as handle:
              content = base64.b64encode(handle.read()).decode('ascii')
          with open('/tmp/blob-request.json', 'w', encoding='utf-8') as handle:
              json.dump({'content': content, 'encoding': 'base64'}, handle)
          PY
            blob_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob-request.json --jq '.sha')
            jq -n --arg path "$file" --arg sha "$blob_sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> /tmp/tree-elements.jsonl
          done
          jq -n --arg base "$base_tree" --slurpfile tree /tmp/tree-elements.jsonl '{base_tree:$base,tree:$tree}' > /tmp/tree-request.json
          tree_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree-request.json --jq '.sha')
          printf '%s\n' "$tree_sha" > parser-priority-tree-sha.txt
          git rev-parse HEAD > parser-priority-parent-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parser-priority-acceptance
          path: |
            parser-priorities.json
            parser-priority-tree-sha.txt
            parser-priority-parent-sha.txt
          retention-days: 1
