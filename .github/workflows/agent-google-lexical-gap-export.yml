name: Agent Google lexical gap export

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  export:
    if: github.event.head_commit.message == 'Add temporary lexical gap export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download live sheet and produce ephemeral gap packet
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4/export?format=csv&gid=1428902047' \
            -o /tmp/canto-frequency.csv
          node - <<'NODE' > /tmp/runtime-surfaces.json
          const entries = require('./src/runtime-resources/lexicon/token-lexicon');
          process.stdout.write(JSON.stringify([...new Map(entries).keys()]));
          NODE
          python - <<'PY'
          import csv, json, re, unicodedata
          from pathlib import Path

          runtime = set(json.loads(Path('/tmp/runtime-surfaces.json').read_text()))
          with Path('/tmp/canto-frequency.csv').open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              rows = list(reader)

          seen = set(); bounded = []; first = {}; all_rows = {}
          for i, row in enumerate(rows, start=1):
              s = unicodedata.normalize('NFC', (row.get('Word') or '').strip())
              if not s: continue
              all_rows.setdefault(s, []).append({
                  'source_row': i,
                  'frequency': (row.get('Frequency') or '').strip(),
                  'meaning': (row.get('Meaning') or '').strip(),
                  'pronunciation': (row.get('Pronunciation') or '').strip(),
                  'more_jyutping': (row.get('More/Alternate Jyutping') or '').strip(),
                  'notes': (row.get('Notes') or '').strip(),
              })
              if s in seen: continue
              seen.add(s); bounded.append(s); first[s] = all_rows[s][0]
              if len(bounded) == 2000: break
          if len(bounded) != 2000: raise SystemExit(f'only {len(bounded)} distinct surfaces')

          cjk_re = re.compile(r'^[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u3007]+$')
          jyut_re = re.compile(r'^(?:[a-z]+[1-6](?:\s+[a-z]+[1-6])*)$', re.I)
          gaps = []
          for rank, s in enumerate(bounded, start=1):
              if s in runtime: continue
              record = first[s]
              pronunciation = record['pronunciation']
              chars = list(s)
              gaps.append({
                  'bounded_rank': rank,
                  'surface': s,
                  'source_row': record['source_row'],
                  'frequency': record['frequency'],
                  'pronunciation': pronunciation,
                  'meaning': record['meaning'],
                  'more_jyutping': record['more_jyutping'],
                  'notes': record['notes'],
                  'source_analysis_count': len(all_rows.get(s, [])),
                  'char_length': len(chars),
                  'cjk_only': bool(cjk_re.match(s)),
                  'jyutping_simple_valid': bool(jyut_re.match(pronunciation)),
              })

          Path('lexical-gap-packet.json').write_text(json.dumps({
              'sheet_title': 'Most Common Cantonese Words (Frequency List)',
              'sheet_url': 'https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4',
              'bounded_definition': 'first 2000 distinct NFC-normalized nonempty Word surfaces in live sheet row order',
              'runtime_surface_count': len(runtime),
              'bounded_surface_count': 2000,
              'gap_count': len(gaps),
              'gaps': gaps,
          }, ensure_ascii=False, indent=2) + '\n')
          Path('runtime-surfaces.json').write_text(json.dumps(sorted(runtime), ensure_ascii=False, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: google-lexical-gap-packet
          path: |
            lexical-gap-packet.json
            runtime-surfaces.json
          retention-days: 1
          if-no-files-found: error
      - name: Self-delete temporary export workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-google-lexical-gap-export.yml
          git commit -m 'Remove temporary lexical gap export'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
