name: Temporary AA56 no-place corpus generation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aa56-no-place-inspect-temp.yml
      - external-evidence/aa56-no-place-hkcancor/**
      - review-packets/corpus-review/AA56/**
      - docs/research/AA56-NO-PLACE-EXISTENTIAL-PRESENTATIONAL-BOUNDARIES-R1.md
      - docs/research/AA56-NO-PLACE-PRIMARY-SOURCE-LEDGER-R1.tsv
      - tests/tooling/corpus-review/test_aa56_no_place_hkcancor_profile.py

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install frozen corpus dependency
        run: python3 -m pip install pycantonese==5.0.0

      - name: Test query profile
        run: python3 -m unittest tests/tooling/corpus-review/test_aa56_no_place_hkcancor_profile.py

      - name: Generate inventory, packet, and complete decisions
        run: |
          python3 external-evidence/aa56-no-place-hkcancor/query-hkcancor-aa56-no-place.py \
            --profile aa56-no-place \
            --output-dir external-evidence/aa56-no-place-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256
          python3 review-packets/corpus-review/AA56/select-bounded-review-packet-r1.py
          python3 review-packets/corpus-review/AA56/write-bounded-review-decisions-r1.py
          python3 review-packets/corpus-review/AA56/verify-bounded-review-decisions-r1.py

      - name: Validate deterministic outputs and findings
        run: |
          test -s external-evidence/aa56-no-place-hkcancor/hkcancor-aa56-no-place-candidate-inventory.json
          test -s external-evidence/aa56-no-place-hkcancor/hkcancor-aa56-no-place-candidate-inventory.tsv
          test -s external-evidence/aa56-no-place-hkcancor/hkcancor-aa56-no-place-query-summary.json
          test -s review-packets/corpus-review/AA56/bounded-review-packet-r1.tsv
          test -s review-packets/corpus-review/AA56/bounded-review-decisions-r1.tsv
          test -s docs/research/AA56-NO-PLACE-EXISTENTIAL-PRESENTATIONAL-BOUNDARIES-R1.md
          test -s docs/research/AA56-NO-PLACE-PRIMARY-SOURCE-LEDGER-R1.tsv
          python3 external-evidence/aa56-no-place-hkcancor/query-hkcancor-aa56-no-place.py \
            --profile aa56-no-place \
            --output-dir external-evidence/aa56-no-place-hkcancor \
            --source-manifest external-evidence/cp021b/hkcancor-cp021b-source-manifest.sha256 \
            --check
          cp review-packets/corpus-review/AA56/bounded-review-packet-r1.tsv /tmp/aa56-packet.tsv
          cp review-packets/corpus-review/AA56/bounded-review-decisions-r1.tsv /tmp/aa56-decisions.tsv
          python3 review-packets/corpus-review/AA56/select-bounded-review-packet-r1.py
          python3 review-packets/corpus-review/AA56/write-bounded-review-decisions-r1.py
          cmp /tmp/aa56-packet.tsv review-packets/corpus-review/AA56/bounded-review-packet-r1.tsv
          cmp /tmp/aa56-decisions.tsv review-packets/corpus-review/AA56/bounded-review-decisions-r1.tsv
          python3 review-packets/corpus-review/AA56/verify-bounded-review-decisions-r1.py
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          decisions_path = Path('review-packets/corpus-review/AA56/bounded-review-decisions-r1.tsv')
          report_path = Path('docs/research/AA56-NO-PLACE-EXISTENTIAL-PRESENTATIONAL-BOUNDARIES-R1.md')
          ledger_path = Path('docs/research/AA56-NO-PLACE-PRIMARY-SOURCE-LEDGER-R1.tsv')
          with decisions_path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          classes = Counter(row['expert_class'] for row in rows)
          confidence = Counter(row['decision_confidence'] for row in rows)
          expected = {
              'positive_np_predication_core': 44,
              'layered_place_plus_positive_predication': 2,
              'positive_topic_chain_extended': 1,
              'partitive_indefinite_subject_not_marker': 16,
              'bare_existential_or_listing': 18,
              'existential_interrogative_or_complement': 4,
              'aa55_possession_or_subject_have': 14,
              'aa77_overt_place_existential': 14,
              'negative_human_quantificational_clause': 20,
              'negative_existential_or_availability_complement': 3,
              'event_negation_or_minimizer': 3,
              'negative_property_or_discourse_absence': 5,
              'lexicalized_or_fixed_expression': 7,
              'temporal_or_conditional_have': 5,
              'wh_degree_or_quantity': 3,
              'repair_or_unusable': 10,
              'ambiguous_boundary': 8,
              'lexical_compound_false_positive': 1,
              'rhetorical_polarity_human': 1,
          }
          assert dict(classes) == expected, classes
          assert confidence == {'high': 166, 'medium': 11, 'low': 2}, confidence
          report = report_path.read_text(encoding='utf-8')
          assert '(discourse setting / condition / location outside the core)' in report
          assert 'Candidate tokens | 1,372' in report
          assert 'Positive source-compatible NP predication | 44' in report
          assert 'Negative-human quantificational clause | 20' in report
          assert '**Total** | **179**' in report
          assert 'JauMarkedIndefiniteNPPredication' in report
          assert 'implementation_authorized: false' in report
          assert 'identity_change_authorized: false' in report
          with ledger_path.open(encoding='utf-8', newline='') as handle:
              ledger = list(csv.DictReader(handle, delimiter='\t'))
          assert len(ledger) == 6, len(ledger)
          assert {row['verification_status'] for row in ledger} == {
              'VERIFIED_FULL_TEXT', 'VERIFIED_INTERNAL_RECORD', 'VERIFIED_FROZEN_CORPUS_PACKET'
          }
          assert all(row['explicit_limit'].strip() for row in ledger)
          print('findings classes:', dict(classes))
          print('confidence:', dict(confidence))
          print('source ledger rows:', len(ledger))
          PY
          git diff --check -- . \
            ':(exclude)external-evidence/aa56-no-place-hkcancor/hkcancor-aa56-no-place-candidate-inventory.tsv' \
            ':(exclude)review-packets/corpus-review/AA56/bounded-review-packet-r1.tsv' \
            ':(exclude)review-packets/corpus-review/AA56/bounded-review-decisions-r1.tsv'

      - name: Commit generated outputs
        run: |
          paths=(
            external-evidence/aa56-no-place-hkcancor/hkcancor-aa56-no-place-candidate-inventory.json
            external-evidence/aa56-no-place-hkcancor/hkcancor-aa56-no-place-candidate-inventory.tsv
            external-evidence/aa56-no-place-hkcancor/hkcancor-aa56-no-place-query-summary.json
            review-packets/corpus-review/AA56/bounded-review-packet-r1.tsv
            review-packets/corpus-review/AA56/bounded-review-decisions-r1.tsv
          )
          if test -z "$(git status --porcelain -- "${paths[@]}")"; then
            echo "Generated inventory, packet, and decisions are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Audit AA56 findings package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
