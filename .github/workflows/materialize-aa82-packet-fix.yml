name: Recover AA82 packet materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'agent/aa82-attested-boundary-packet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Decode packet and generate report
        shell: bash
        run: |
          python <<'PY'
          import base64, gzip, json, pathlib, re
          workflow = pathlib.Path('.github/workflows/generate-aa82-boundary-packet.yml').read_text()
          match = re.search(r'^\s*JSON_GZ_B64:\s*([A-Za-z0-9+/=]+)\s*$', workflow, re.M)
          if not match:
              raise SystemExit('missing JSON_GZ_B64')
          encoded = match.group(1)
          encoded += '=' * (-len(encoded) % 4)
          content = gzip.decompress(base64.b64decode(encoded, validate=False))
          packet_path = pathlib.Path('data/corpus-reviews/AA82-ATTESTED-BOUNDARY-PACKET-R1.json')
          packet_path.parent.mkdir(parents=True, exist_ok=True)
          packet_path.write_bytes(content)
          packet = json.loads(content)
          summary = packet['summary']
          counts = summary['classificationCounts']
          lines = [
              '# AA82 attested boundary packet R1', '',
              'Date: 2026-07-31  ',
              'Construction: `AA82` / `BinDouWhPlaceQuestion`  ',
              'Runtime label: `LocativeWhQuestion`', '',
              '## Decision', '',
              '**A bounded runtime implementation is required.** The merged specification remains valid, and the current parser correctly avoids lexical-only wrapping in the selected embedded and rhetorical cases. It also preserves several motion and purpose questions compositionally without AA82. However, the packet contains repeated false negatives for admitted direct matrix location questions, event-location questions, bare fragments, abstract-location questions, and independently bounded question fragments.', '',
              '## Method', '',
              f"- Selected {summary['recordCount']} attested items from preserved Glossika packages and the immutable HKCanCor AA82 candidate inventory.",
              '- Applied the merged `AA82-RUNTIME-SPECIFICATION-R1` contract rather than treating every lexical occurrence of `邊度` as an expected hit.',
              '- Evaluated every exact surface against the post-merge generated runtime with `analyzeLine` and `diagnosticFinalRows`.',
              '- Kept source attestation, expert classification, and runtime output as separate evidence layers.', '',
              '## Results', '',
              f"- Required-wrapper cases: **{summary['requiredWrapperCaseCount']}**",
              f"- Required-wrapper hits: **{summary['requiredWrapperHitCount']}**",
              f"- False negatives: **{summary['falseNegativeCount']}**",
              f"- False positives in selected exclusions and compositional cases: **{summary['falsePositiveCount']}**",
          ]
          for key in sorted(counts):
              lines.append(f"- `{key}`: **{counts[key]}**")
          lines += [
              '', 'No selected embedded or rhetorical exclusion was incorrectly wrapped. The material defect is undergeneration, not broad lexical overgeneration.', '',
              '## False-negative families', '',
              '1. **Full direct location questions:** `影印機喺邊度？`, `超市喺邊度？`.',
              '2. **Event-location questions:** `喺邊度等你？`, `我哋邊度見？`, `喺邊度搞唧?`.',
              '3. **Independently bounded fragments:** the final question in `得呀!喺邊度見呀?`, and the second question in `邊間呀？你講緊邊度？`.',
              '4. **Bare motion-goal fragment:** `去邊度呀？`.',
              '5. **Abstract or existential location questions:** `Up-doubling同acting嘅分別喺邊度?`, `邊度有十個percent啊?`.', '',
              '## Correct boundaries preserved', '',
              '- Embedded `邊度` under `知唔知` or `問` does not trigger AA82.',
              '- Rhetorical denial-like `佢邊度會跑吖` does not trigger AA82.',
              '- Several motion-goal, experiential-motion, perfective-motion, and motion-purpose questions remain compositionally typed without requiring the compatibility wrapper.',
              '- Multi-fragment inputs with a correct hit restrict the wrapper to the locative question fragment.', '',
              '## Implementation route', '',
              'Open one T6 runtime issue to derive AA82 from independently licensed matrix interrogative clause or fragment force plus overt exact `邊度`, rather than from the lexical item alone. Cover admitted direct, event-location, bare-fragment, and split-fragment cases while preserving embedded, rhetorical, negative-indefinite, motion/aspect, and multi-fragment boundaries.', '',
              'The implementation package must not use AA82 to repair independently rejected motion or aspect analyses. It must add attested regression cases for every false-negative family and retain the correct exclusion and compositional cases in this packet.', '',
              '## No specification revision', '',
              'The packet does not contradict the accepted AA82 contract. The current failure is a reproducible implementation gap: matrix question force is not consistently connected to the compatibility wrapper outside a narrow set of templates.', '',
              '## Item table', '',
              '| Item | Source | Surface | Classification | AA82 |',
              '|---|---|---|---|---|',
          ]
          for record in packet['records']:
              surface = record['surface'].replace('|', '\\|')
              emitted = 'yes' if record['runtime']['aa82Emitted'] else 'no'
              lines.append(f"| `{record['packetItemId']}` | `{record['sourceId']}` | {surface} | `{record['classification']}` | {emitted} |")
          lines += ['', 'The machine-readable packet contains full source paths, HKCanCor anchors and local context, runtime labels, contract expectations, and per-item rationale.', '']
          report_path = pathlib.Path('docs/research/AA82-ATTESTED-BOUNDARY-PACKET-R1.md')
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text('\n'.join(lines))
          print('decoded', len(content), 'records', summary['recordCount'])
          PY
      - name: Verify runtime observations
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          const vm = require("node:vm");
          const packet = JSON.parse(fs.readFileSync("data/corpus-reviews/AA82-ATTESTED-BOUNDARY-PACKET-R1.json", "utf8"));
          const moduleRecord = { exports: {} };
          class Plugin {} class PluginSettingTab {} class Setting {} class Notice {}
          const context = { module: moduleRecord, exports: moduleRecord.exports, require: id => id === "obsidian" ? { Plugin, PluginSettingTab, Setting, Notice } : require(id), console, setTimeout, clearTimeout, Buffer };
          const code = fs.readFileSync("main.js", "utf8");
          vm.runInNewContext(`${code}\nmodule.exports.__testApi={analyzeLine,diagnosticFinalRows};`, context);
          const api = moduleRecord.exports.__testApi;
          for (const record of packet.records) {
            const rows = api.diagnosticFinalRows(api.analyzeLine(record.surface));
            const labels = rows.filter(row => row.kind === "construction").map(row => row.internal_construction || row.construction || row.type || "");
            const emitted = labels.includes("LocativeWhQuestion");
            if (emitted !== record.runtime.aa82Emitted) throw new Error(`AA82 observation drift for ${record.packetItemId}`);
            if (JSON.stringify(labels) !== JSON.stringify(record.runtime.constructionLabels)) throw new Error(`construction-label drift for ${record.packetItemId}`);
          }
          console.log(`Verified ${packet.records.length} runtime observations.`);
          NODE
      - name: Commit final packet
        shell: bash
        run: |
          rm .github/workflows/generate-aa82-boundary-packet.yml .github/workflows/materialize-aa82-packet-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/corpus-reviews/AA82-ATTESTED-BOUNDARY-PACKET-R1.json docs/research/AA82-ATTESTED-BOUNDARY-PACKET-R1.md .github/workflows/generate-aa82-boundary-packet.yml .github/workflows/materialize-aa82-packet-fix.yml
          git commit -m "Record AA82 attested boundary results"
          git push
