name: Patch portfolio routing documentation

on:
  pull_request:
    paths:
      - ".github/workflows/patch-portfolio-routing-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/retire-portfolio-ownership-path
          fetch-depth: 0
      - name: Reconcile current coordination documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          codex = Path("docs/current/CODEX-ISSUE-WORKFLOW.md")
          text = codex.read_text(encoding="utf-8")
          text = text.replace(
              'related: "[[00-START-HERE]] [[AGENT-WORKFLOW-SETTINGS]] [[MULTI-AGENT-COORDINATION]] [[USER-MERGE-REVIEW]]"',
              'related: "[[00-START-HERE]] [[AGENT-WORKFLOW-SETTINGS]] [[MULTI-AGENT-COORDINATION]] [[PORTFOLIO-ROUTING]] [[USER-MERGE-REVIEW]]"',
          )
          start = text.index("## 7. Intake ownership and portfolio routing")
          end = text.index("## 8. Labels and assignment")
          replacement = '''## 7. Intake ownership and portfolio planning

Active repository execution has one ownership path: exactly one current
`canto-span-task-intake-v2` block in the canonical intake issue. The linked
`canto-span-work-claim-v2`, branch, and pull request must agree with that live
ownership record. This is an operating contract rather than a universal merge-time
metadata gate.

A `canto-span-portfolio-routing-v2` block is optional planning metadata only. It may
record track, kind, research mode, priority, decision or discovery scope,
dependencies, expected locks, cancellation conditions, null outcomes, and completion
endpoints. It cannot assign an owner, authorize pickup, bind a claim, authorize a
branch or pull request, perform takeover or reassignment, or establish merge
eligibility. See [`PORTFOLIO-ROUTING.md`](PORTFOLIO-ROUTING.md).

### Ownership-aware task intake

A current operational intake uses one `canto-span-task-intake-v2` block and
distinguishes:

- `created_by`: who prepared the issue;
- `pickup_target`: who must act next;
- `active_pickup_owner`: the current live owner;
- `ownership_revision`: the monotonic ownership version;
- claim, branch, and PR bindings.

The latest valid block in the canonical issue body is the sole pickup authority.
Comments, labels, assignments, mentions, reviews, dispatch events, portfolio fields,
and cached copies cannot change ownership. A takeover or reassignment replaces the
block, increases the revision exactly once, records the previous target, reason,
later timestamp, pickup permission, and explicit handoff state, and releases or
narrows overlapping work.

An initial ChatGPT intake may use:

```task-intake
{
  "schema": "canto-span-task-intake-v2",
  "created_by": "chatgpt",
  "pickup_target": "chatgpt",
  "pickup_status": "chatgpt-pickup-required",
  "category": "documentation-consistency",
  "risk": "medium",
  "execution_mode": "implementation",
  "dependencies": [],
  "protected_state": [],
  "active_pickup_owner": "chatgpt",
  "ownership_revision": 1,
  "previous_pickup_target": null,
  "ownership_reason": "initial-routing",
  "ownership_updated_at": "2026-07-25T00:00:00Z",
  "pickup_allowed": true,
  "handoff_status": "no-handoff",
  "active_claim_issue": null,
  "active_branch": null,
  "active_pr": null,
  "work_claim_required": true,
  "user_merge_approval_required": true,
  "codex_self_screen_required": false
}
```

Use the checked-in schema rather than copying this example blindly. The selected
pickup target and current workflow setting must agree.

### Activating portfolio-planned work

A Future or historical issue may retain a portfolio block while it is only planning
work. Before Codex, ChatGPT, or a human begins or resumes repository execution:

1. create or replace the issue's current ownership record with exactly one valid
   `task-intake-v2` block;
2. assign a truthful pickup target and live owner permitted by current settings;
3. record the ownership revision, permission, handoff state, active claim, branch,
   and pull request as they become known;
4. create the v2 work claim bound to that intake revision;
5. re-fetch the live issue before every execution gate.

Do not retain both portfolio and task-intake blocks as competing active routing modes.
Planning information needed during execution belongs in ordinary issue prose or the
accepted task specification; ownership remains in `task-intake-v2`.

Codex may not self-pick, branch from, or resume a portfolio-only issue. It must report
`routing result: unavailable` until a valid live task-intake explicitly assigns it.

Legacy intake and claim formats remain readable historical records. They must migrate
to current ownership-aware formats before takeover, reassignment, resumed work, or
active binding.

'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "7. Open one linked PR and bind `active_pr` to the assigned GitHub PR number when the\n   parent uses task-intake ownership; repeat the claim worker and revision in every PR.",
              "7. Open one linked PR, bind `active_pr` to the assigned GitHub PR number in the\n   live task-intake, and repeat the claim worker and revision in every PR.",
          )
          text = text.replace(
              "9. Validate exact head, live routing mode, ownership or claim binding, overlap,\n   changed-file coverage, and required checks.",
              "9. Validate exact head, live task-intake ownership, claim binding, overlap,\n   changed-file coverage, and required checks.",
          )
          prohibited = "- treat portfolio planning metadata as pickup, ownership, claim, branch, PR, or merge authority;\n"
          anchor = "- preserve stale pickup authority through an old claim, branch, PR, or assignment;\n"
          if prohibited not in text:
              text = text.replace(anchor, anchor + prohibited)
          codex.write_text(text, encoding="utf-8")

          coordination = Path("docs/current/MULTI-AGENT-COORDINATION.md")
          text = coordination.read_text(encoding="utf-8")
          owner_line = "- Portfolio planning contract: `docs/current/PORTFOLIO-ROUTING.md`\n"
          anchor = "- Current intake ownership format: `schemas/task-intake.schema.json`\n"
          if owner_line not in text:
              text = text.replace(anchor, anchor + owner_line)
          paragraph = (
              "\n`portfolio-routing` is optional planning metadata only. It cannot authorize pickup, "
              "takeover, reassignment, claim binding, branch ownership, pull-request ownership, or merge. "
              "Before new or resumed execution, a portfolio-planned issue must receive exactly one current "
              "`task-intake-v2` ownership block. See [`PORTFOLIO-ROUTING.md`](PORTFOLIO-ROUTING.md).\n"
          )
          authority = (
              "The latest valid ownership block in the canonical intake issue body owns pickup\n"
              "authority. The linked work-claim issue owns semantic scope. They do not own\n"
              "linguistic status, construction identity, runtime behavior, evidence, survey state,\n"
              "or release state.\n"
          )
          if paragraph.strip() not in text:
              text = text.replace(authority, authority + paragraph)
          coordination.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/patch-portfolio-routing-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current/CODEX-ISSUE-WORKFLOW.md docs/current/MULTI-AGENT-COORDINATION.md
          git commit -m "Retire portfolio routing as ownership authority"
          git push origin HEAD:agent/retire-portfolio-ownership-path
