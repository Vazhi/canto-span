name: Trigger interim disclosure rewrite

on:
  pull_request:
    paths:
      - ".github/workflows/trigger-interim-disclosure-rewrite.yml"

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/interim-pilot-disclosure-controls
          fetch-depth: 0
      - name: Execute and remove temporary rewrite workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/interim-pilot-disclosure-rewrite.yml').read_text(encoding='utf-8').splitlines()
          marker = '        run: |'
          start = source.index(marker) + 1
          shell = []
          for line in source[start:]:
              shell.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/interim-rewrite.sh').write_text('\n'.join(shell) + '\n', encoding='utf-8')
          PY
          bash /tmp/interim-rewrite.sh
          git rm .github/workflows/trigger-interim-disclosure-rewrite.yml
          git commit -m "Remove temporary interim disclosure trigger"
          git push origin HEAD:agent/interim-pilot-disclosure-controls
