name: Agent lexical-ingestion validation

on:
  push:
    branches:
      - agent/cifu-tokenization-contamination-gate

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-tokenization-contamination-gate
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synchronize v0.5.235 metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.5.235';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.version = '0.5.235';
          manifest.description = 'v0.5.235 adds scalable lexical-ingestion contamination/tokenization architecture gates and preserves independent lexical authority.';
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');

          let plugin = fs.readFileSync('src/plugin-entry.js', 'utf8');
          plugin = plugin.replace('const CANTO_SPAN_RUNTIME_VERSION = "0.5.234";', 'const CANTO_SPAN_RUNTIME_VERSION = "0.5.235";');
          const versionComment = '// v0.5.235: adds a scalable lexical-ingestion contamination/tokenization architecture gate, force-composes only neutral multi-character promotion-blocked fallbacks, and completes generated modal-clause trace-family metadata.\n';
          if (!plugin.includes('// v0.5.235:')) plugin = plugin.replace('// v0.5.234:', versionComment + '// v0.5.234:');
          fs.writeFileSync('src/plugin-entry.js', plugin);

          let state = fs.readFileSync('docs/current/PROJECT-STATE.md', 'utf8');
          state = state.replace('| Runtime | v0.5.234 |', '| Runtime | v0.5.235 |');
          const consequence = '- v0.5.235 adds a reusable lexical-ingestion contamination/tokenization gate: registered ingestions are checked for source uniqueness, Unicode-normalization collisions, exact runtime coverage and removals, pronunciation authority, lexical-analysis ID integrity, contamination-ledger synchronization, promotion-block/runtime-token dispositions, carrier tokenization, and injected parser architecture; only multi-character `blocked_atomic` rows that remain neutral frequency fallbacks are automatically force-compositional, while independently reviewed atomic lexemes and single-character rows retain stronger runtime authority; the injected Cifu corpus also exposed and closed missing `generative_template` family metadata on generated modal-clause traces without changing linguistic recognition, construction status, evidence, survey, corpus, release-publication, or deployment state;\n\n';
          if (!state.includes('- v0.5.235 adds a reusable lexical-ingestion')) state = state.replace('- v0.5.234 implements', consequence + '- v0.5.234 implements');
          fs.writeFileSync('docs/current/PROJECT-STATE.md', state);
          NODE
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build:runtime
      - run: npm run test:lexical-ingestions
      - run: node --test tests/tooling/lexicon/glossika-week16-runtime-lexicon.test.js
      - run: npm run audit:lexical-ingestions -- --json
      - name: Commit synchronized runtime state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json src/plugin-entry.js docs/current/PROJECT-STATE.md main.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronize v0.5.235 lexical ingestion gate"
          git push origin HEAD:agent/cifu-tokenization-contamination-gate
