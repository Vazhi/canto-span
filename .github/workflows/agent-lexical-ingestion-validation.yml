name: Agent lexical-ingestion validation

on:
  push:
    branches:
      - agent/cifu-tokenization-contamination-gate

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-tokenization-contamination-gate
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:runtime
      - run: npm run test:lexical-ingestions
      - run: node --test tests/tooling/lexicon/glossika-week16-runtime-lexicon.test.js
      - name: Commit generated runtime when changed
        run: |
          if git diff --quiet -- main.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Regenerate runtime for lexical ingestion gate"
          git push origin HEAD:agent/cifu-tokenization-contamination-gate
