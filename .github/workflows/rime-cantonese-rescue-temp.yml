name: Materialize Rime-Cantonese rescue snapshot

on:
  push:
    branches:
      - agent/rime-cantonese-rescue
    paths:
      - .github/workflows/rime-cantonese-rescue-temp.yml
      - tools/lexical-coverage/export-rime-cantonese-top2000.py
      - tools/lexical-coverage/patch-rime-evidence-contract-temp.py
      - external-evidence/lexical-pos/rime-cantonese/README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify claimed branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/agent/rime-cantonese-rescue"

      - name: Fetch pinned Rime-Cantonese source
        run: |
          set -euo pipefail
          rm -rf /tmp/rime-cantonese
          git init /tmp/rime-cantonese
          git -C /tmp/rime-cantonese remote add origin https://github.com/rime/rime-cantonese.git
          git -C /tmp/rime-cantonese fetch --depth 1 origin c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0
          git -C /tmp/rime-cantonese checkout --detach FETCH_HEAD
          test "$(git -C /tmp/rime-cantonese rev-parse HEAD)" = "c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0"

      - name: Patch evidence contract
        run: |
          set -euo pipefail
          python tools/lexical-coverage/patch-rime-evidence-contract-temp.py

      - name: Generate and verify frozen top-2000 intersection
        run: |
          set -euo pipefail
          python tools/lexical-coverage/export-rime-cantonese-top2000.py --rime-dir /tmp/rime-cantonese
          python tools/lexical-coverage/export-rime-cantonese-top2000.py --rime-dir /tmp/rime-cantonese --check
          rows=$(($(wc -l < external-evidence/lexical-pos/rime-cantonese/c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0/cifu-top-2000-readings.tsv) - 1))
          test "$rows" -eq 2000

      - name: Commit claimed permanent outputs
        run: |
          set -euo pipefail
          git config user.name "canto-span-rime-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/research/CIFU-LEXICAL-POS-EVIDENCE-CONTRACT.md \
            external-evidence/lexical-pos/rime-cantonese/c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0/cifu-top-2000-readings.tsv \
            external-evidence/lexical-pos/rime-cantonese/c99b16e44d2df77a5cb8fb0867dd2bab7a112cb0/manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Materialize frozen Rime-Cantonese evidence"
            git push origin HEAD:agent/rime-cantonese-rescue
          fi
