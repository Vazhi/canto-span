name: CS-WORK-0322 Dialog 008 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-dialog-008-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source-preserving dialog package
        run: node tools/tmp/cs-work-0322-generate-dialog008.js
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-008-20260125';
          const source=require(`./${root}/source.json`);
          const crosswalk=require(`./${root}/crosswalk.json`);
          const review=require(`./${root}/review.json`);
          if(source.items.length!==80||source.ingress.turnCount!==40||source.ingress.vocabularyCount!==40) throw new Error('Unexpected source counts');
          const turns=source.items.filter(item=>item.itemType==='dialog_turn');
          const vocab=source.items.filter(item=>item.itemType==='lexical_entry');
          if(turns.some((item,index)=>item.turn!==index+1||item.speaker!==((index+1)%2===1?'志明':'美華')||item.source.english!==null||/[A-Z]/.test(item.source.jyutpingLine))) throw new Error('Turn sequence, speaker, missing-English, or romanization preservation failed');
          if(vocab.some((item,index)=>item.vocabularyOrdinal!==index+1||typeof item.sourceDialogOccurrence?.exactSurfacePresent!=='boolean')) throw new Error('Vocabulary order or source-block audit failed');
          if(crosswalk.items.length!==80||review.records.length!==80) throw new Error('Crosswalk/review alignment failed');
          if(crosswalk.summary.vocabularyExactSurfaceAbsentFromDialogCount!==8||crosswalk.sourceBlockAudit.absentVocabulary.length!==8) throw new Error('Expected eight glossary surfaces absent from the dialog');
          const absent=new Set(crosswalk.sourceBlockAudit.absentVocabulary.map(item=>item.traditional));
          for(const value of ['冇問題','問題','咁','可以','返','畀','先','同']) if(!absent.has(value)) throw new Error(`Missing expected absent glossary surface ${value}`);
          if(!turns[7].source.traditional.includes('俾')||!turns[29].source.traditional.includes('俾')||vocab[35].source.traditional!=='畀') throw new Error('俾/畀 source orthography preservation failed');
          if(crosswalk.architecture.generatedExcluded[0]!=='main.js') throw new Error('main.js exclusion missing');
          if(crosswalk.items.some(item=>[...item.canonicalExactOwners,...item.canonicalNormalizedOwners,...item.supportingExactOwners,...item.supportingNormalizedOwners].includes('main.js'))) throw new Error('main.js leaked into ownership');
          const turnWalk=crosswalk.items.filter(item=>item.itemType==='dialog_turn');
          if(turnWalk.some((item,index)=>item.adjacency.previousTurnId!==(index===0?null:`GLOSSIKA-YUEHK-A1-DLG-008-20260125-I${String(index).padStart(3,'0')}`)||item.adjacency.nextTurnId!==(index===39?null:`GLOSSIKA-YUEHK-A1-DLG-008-20260125-I${String(index+2).padStart(3,'0')}`))) throw new Error('Turn adjacency failed');
          const rows=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(rows.length!==81) throw new Error(`Expected TSV header plus 80 rows, found ${rows.length}`);
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='vocabulary_dialog_surface_mismatch')) throw new Error('Source-block mismatch alert absent');
          if(!review.summary.knownSourceAlerts.some(alert=>alert.type==='orthography_discrepancy')) throw new Error('Orthography discrepancy alert absent');
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-DLG-008-20260125 docs/research/GLOSSIKA-YUEHK-A1-DLG-008-20260125-CORPUS-INGRESS.md
          git rm -f tools/tmp/cs-work-0322-dialog008-meta.json tools/tmp/cs-work-0322-dialog008-turns.part00.tsv tools/tmp/cs-work-0322-dialog008-turns.part01.tsv tools/tmp/cs-work-0322-dialog008-turns.part02.tsv tools/tmp/cs-work-0322-dialog008-vocab.part00.tsv tools/tmp/cs-work-0322-dialog008-vocab.part01.tsv tools/tmp/cs-work-0322-generate-dialog008.js
          git commit -m "Add Glossika dialog 008 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
