name: Audit bounded multi-character lexical gaps

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit bounded multi-character lexical gaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Report highest-priority split whole-form candidates
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4/export?format=csv&gid=1428902047' -o /tmp/canto-frequency.csv
          python - <<'PY'
          import csv, json, re, unicodedata
          rows=list(csv.DictReader(open('/tmp/canto-frequency.csv',encoding='utf-8-sig',newline='')))
          def tombstone(s):
            x=s.lower(); return x=='del' or re.search(r'(^|[-\s?])del($|[-\s?])',x) is not None
          seen=set(); bounded=[]; first={}
          for row in rows:
            s=unicodedata.normalize('NFC',(row.get('Word') or '').strip())
            if not s or tombstone(s): continue
            first.setdefault(s,row)
            if s in seen: continue
            seen.add(s); bounded.append(s)
            if len(bounded)==2000: break
          out=[]
          for rank,s in enumerate(bounded,1):
            if len(s)<2: continue
            row=first[s]
            out.append({'rank':rank,'surface':s,'pronunciation':row.get('Pronunciation') or '','meaning':row.get('Meaning') or '','example':row.get('Sentence1') or ''})
          open('/tmp/multi.json','w').write(json.dumps(out,ensure_ascii=False))
          PY
          node - <<'NODE'
          const fs=require('node:fs');
          const entries=require('./src/runtime-resources/lexicon/token-lexicon');
          const lexicon=Object.fromEntries(entries);
          const {loadRuntimeApi}=require('./tools/lib/runtime-api');
          const api=loadRuntimeApi({apiNames:['analyzeLine']});
          const rows=JSON.parse(fs.readFileSync('/tmp/multi.json','utf8'));
          function flatten(nodes,out=[]){for(const n of nodes||[]){if(!n||typeof n!=='object')continue;if(n.kind==='token')out.push(n);if(Array.isArray(n.children))flatten(n.children,out);}return out;}
          const candidates=[];
          for(const row of rows){
            if(lexicon[row.surface]) continue;
            const tokens=flatten(api.analyzeLine(row.surface).tokens).map(t=>({surface:t.surface,jyutping:t.jyutping||'',label:t.label||'',syntax:t.syntax||''}));
            if(tokens.length<2) continue;
            candidates.push({...row,tokens});
            if(candidates.length===60) break;
          }
          console.log('MWE_GAP_CANDIDATES_JSON');
          console.log(JSON.stringify(candidates,null,2));
          NODE
      - name: Remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-mwe-gap-audit.yml
          git commit -m 'Remove temporary multi-character gap audit'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
