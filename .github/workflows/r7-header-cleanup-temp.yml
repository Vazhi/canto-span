name: Fix historical R7 header

on:
  push:
    branches:
      - agent/common-spoken-core-2000
    paths:
      - .github/workflows/r7-header-cleanup-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace obsolete blanket-retention header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/runtime-resources/lexicon/token-lexicon/frequency-gap-fill-r7.js')
          text = p.read_text(encoding='utf-8')
          old = '''// AUTO-MATERIALIZED from data/lexical-frequency/cifu-spoken-top-2000.tsv.\n// Every Cifu top-2,000 surface lacking direct runtime coverage on the baseline is retained here.\n// Entries are neutral lexical coverage; parser regressions or uncertain POS do not justify deleting them.\n'''
          new = '''// HISTORICAL R7 materialization from data/lexical-frequency/cifu-spoken-top-2000.tsv.\n// Surviving records are neutral review candidates, not proof that each Cifu surface is an atomic Cantonese lexeme.\n// Cifu definitions/Jyutping are provenance/candidate metadata only; expert lexicality evidence governs retention.\n// Adjudicated nonlexical, malformed, contaminated, or compositional whole-surface atoms are retired via the lexical-cleanup ledgers.\n// Valid rare/formal/archaic Cantonese may remain even when it is not a common-core development priority.\n'''
          if old not in text:
              raise SystemExit('expected obsolete R7 header not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check src/runtime-resources/lexicon/token-lexicon/frequency-gap-fill-r7.js
          git diff --check
      - name: Commit header correction
        run: |
          git config user.name "canto-span-r7-header-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add src/runtime-resources/lexicon/token-lexicon/frequency-gap-fill-r7.js
          git commit -m "Clarify historical R7 lexical provenance"
          git push origin HEAD:agent/common-spoken-core-2000
