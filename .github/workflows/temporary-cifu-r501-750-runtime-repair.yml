name: Temporary Cifu ranks 501-750 transcription repair

on:
  push:
    branches:
      - agent/cifu-r501-750-runtime-reconcile
    paths:
      - .github/workflows/temporary-cifu-r501-750-runtime-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r501-750-runtime-reconcile
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Insert the two evidence-resolved missing analyses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/runtime-resources/lexicon/token-lexicon/cifu-r501-750-reviewed.js')
          text = path.read_text(encoding='utf-8')

          turn_marker = '  "攬": Object.freeze(['
          turn_record = '  "轉彎": Object.freeze([alt(625, "turn_verb", "verb", "turn / turn a corner", "zyun3 waan1", "turning_motion_predicate")]),\n'
          assert text.count(turn_marker) == 1
          assert '  "轉彎": Object.freeze([' not in text
          text = text.replace(turn_marker, turn_record + turn_marker, 1)

          early_marker = '  "發展": Object.freeze(['
          early_record = '''  "早": Object.freeze([\n    alt(647, "early_stative", "adjective", "early", "zou2"),\n    alt(647, "early_adverb", "adverb", "early", "zou2", "temporal_adverb"),\n    alt(647, "morning_temporal", "temporal", "morning / early time", "zou2"),\n  ]),\n'''
          assert text.count(early_marker) == 1
          assert '  "早": Object.freeze([' not in text
          text = text.replace(early_marker, early_record + early_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused lexical invariants
        run: node tests/tooling/lexicon/cifu-r501-750-reviewed-runtime.test.js
      - name: Rebuild and verify committed runtime bundle
        shell: bash
        run: |
          npm run build:runtime
          node tools/build-runtime.js --check
      - name: Verify bounded diff
        shell: bash
        run: |
          rm .github/workflows/temporary-cifu-r501-750-runtime-repair.yml
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          printf 'Pending paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual-paths
          printf '%s\n' '.github/workflows/temporary-cifu-r501-750-runtime-repair.yml' 'main.js' 'src/runtime-resources/lexicon/token-lexicon/cifu-r501-750-reviewed.js' | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Commit repair, generated bundle, and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime-resources/lexicon/token-lexicon/cifu-r501-750-reviewed.js main.js .github/workflows/temporary-cifu-r501-750-runtime-repair.yml
          git commit -m 'Complete ranks 501-750 reviewed alternatives'
          git push origin HEAD:agent/cifu-r501-750-runtime-reconcile
