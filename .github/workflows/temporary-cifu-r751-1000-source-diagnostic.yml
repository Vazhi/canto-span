name: Temporary Cifu ranks 751-1000 source diagnostic

on:
  push:
    branches:
      - agent/cifu-r751-1000-runtime-reconcile
    paths:
      - .github/workflows/temporary-cifu-r751-1000-source-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cifu-r751-1000-runtime-reconcile
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Inspect reviewed lexical construction
        shell: bash
        run: |
          set +e
          node <<'NODE'
          try {
            const tokenEntries = require('./src/runtime-resources/lexicon/token-lexicon');
            const reviewed = require('./src/runtime-resources/lexicon/token-lexicon/cifu-r751-1000-reviewed');
            const { buildLexicalAnalysisIndex } = require('./src/runtime-resources/lexicon/lexical-analyses');
            console.log(JSON.stringify({
              promotions: Object.keys(reviewed.PROMOTIONS).length,
              candidates: reviewed.CANDIDATE_ONLY_SURFACES.size,
              blocked: reviewed.BLOCKED_ATOMIC_SURFACES.size,
              research_required: reviewed.RESEARCH_REQUIRED_SURFACES.size,
              alternative_specs: Object.keys(reviewed.ALTERNATIVE_SPECS).length,
            }, null, 2));
            const dynamic = reviewed.buildExplicitAnalyses(tokenEntries);
            console.log(`dynamic_surfaces=${Object.keys(dynamic).length}`);
            const index = buildLexicalAnalysisIndex(tokenEntries);
            console.log(`analysis_index_surfaces=${Object.keys(index).length}`);
          } catch (error) {
            console.error(error && error.stack || error);
            process.exitCode = 1;
          }
          NODE
          echo "construction_exit=$?"
      - name: Run focused ranks 751-1000 invariants
        continue-on-error: true
        run: node tests/tooling/lexicon/cifu-r751-1000-reviewed-runtime.test.js
