name: Temporary AA77 bounded packet generation

on:
  pull_request:
    branches:
      - main
    paths:
      - review-packets/corpus-review/AA77/select-bounded-profile-packet-r1.py
      - .github/workflows/aa77-bounded-packet-temp.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Generate deterministic bounded packet
        run: python3 review-packets/corpus-review/AA77/select-bounded-profile-packet-r1.py

      - name: Validate packet
        run: |
          test -s review-packets/corpus-review/AA77/bounded-profile-packet-r1.tsv
          test "$(wc -l < review-packets/corpus-review/AA77/bounded-profile-packet-r1.tsv)" -eq 41
          git diff --check

      - name: Commit generated packet
        run: |
          if test -z "$(git status --porcelain -- review-packets/corpus-review/AA77/bounded-profile-packet-r1.tsv)"; then
            echo "Packet is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-packets/corpus-review/AA77/bounded-profile-packet-r1.tsv
          git commit -m "Generate AA77 bounded review packet"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
