name: Temporary AA77 bounded packet generation

on:
  pull_request:
    branches:
      - main
    paths:
      - review-packets/corpus-review/AA77/select-bounded-profile-packet-r1.py
      - review-packets/corpus-review/AA77/verify-bounded-profile-decisions-r1.py
      - review-packets/corpus-review/AA77/bounded-profile-decisions-r1.tsv
      - .github/workflows/aa77-bounded-packet-temp.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Generate deterministic bounded packet
        run: python3 review-packets/corpus-review/AA77/select-bounded-profile-packet-r1.py

      - name: Normalize decision fields
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("review-packets/corpus-review/AA77/bounded-profile-decisions-r1.tsv")
          with path.open(encoding="utf-8", newline="") as handle:
              reader = csv.DictReader(handle, delimiter="\t")
              fields = reader.fieldnames
              rows = list(reader)
          if fields is None:
              raise SystemExit("missing decision header")
          for row in rows:
              for key, value in row.items():
                  row[key] = value.strip()
          with path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Validate packet and decisions
        run: |
          test "$(wc -l < review-packets/corpus-review/AA77/bounded-profile-packet-r1.tsv)" -eq 41
          test "$(wc -l < review-packets/corpus-review/AA77/bounded-profile-decisions-r1.tsv)" -eq 41
          python3 review-packets/corpus-review/AA77/verify-bounded-profile-decisions-r1.py
          git diff --check -- . \
            ':(exclude)review-packets/corpus-review/AA77/bounded-profile-packet-r1.tsv' \
            ':(exclude)review-packets/corpus-review/AA77/bounded-profile-decisions-r1.tsv'

      - name: Commit generated or normalized files
        run: |
          paths=(
            review-packets/corpus-review/AA77/bounded-profile-packet-r1.tsv
            review-packets/corpus-review/AA77/bounded-profile-decisions-r1.tsv
          )
          if test -z "$(git status --porcelain -- "${paths[@]}")"; then
            echo "Generated and decision files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Normalize verified AA77 review packet"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
