name: Agent Cifu cleanup regex hotfix

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Repair Unicode regex and verify helper parses
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/agent-cifu-active-tree-cleanup.js')
          text = path.read_text()
          old = r'([^;\"]+)'
          new = r'([^;"]+)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one invalid regex fragment, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check tools/agent-cifu-active-tree-cleanup.js
      - name: Remove hotfix workflow and commit mechanical repair
        run: |
          set -euo pipefail
          rm .github/workflows/agent-cifu-cleanup-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/agent-cifu-active-tree-cleanup.js .github/workflows/agent-cifu-cleanup-hotfix.yml
          git commit -m 'Fix final-band cleanup helper regex'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
