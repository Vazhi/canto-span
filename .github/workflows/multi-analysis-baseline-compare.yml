name: multi-analysis finalizer

on:
  push:
    branches:
      - agent/multi-analysis-lexicon

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore complete project-state document and apply v0.5.228 delta
        shell: bash
        run: |
          git show origin/main:docs/current/PROJECT-STATE.md > docs/current/PROJECT-STATE.md
          python3 <<'PY'
          from pathlib import Path
          p = Path('docs/current/PROJECT-STATE.md')
          s = p.read_text()
          s = s.replace('| Runtime | v0.5.227 |', '| Runtime | v0.5.228 |', 1)
          needle = '- v0.5.227 adds 184 independently supported high-frequency lexical entries identified by the Cifu spoken top-2000 audit;'
          insert = '- v0.5.228 introduces a first-class surface-to-analyses lexical compatibility layer with stable lexical-analysis IDs while retaining all 2,384 runtime lexical surfaces and complete 2,000/2,000 Cifu top-frequency surface coverage; legacy single-analysis entries normalize automatically, and existing context-sensitive `住`, `定`, and `咪` paths preserve explicit alternative analyses rather than forcing one global lexical category;\n\n'
          if insert.strip() not in s:
              s = s.replace(needle, insert + needle, 1)
          p.write_text(s)
          PY
      - name: Verify architecture-specific invariants
        shell: bash
        run: |
          npm ci
          node tools/lexical-coverage/verify-multi-analysis-runtime.mjs
          node -e "console.log(require('./src/runtime-resources/lexicon/validate').validateRuntimeLexicalResources())"
          node tools/build-runtime.js --check
          node tools/verify-current-state.js --profile core
          git diff --check
      - name: Remove temporary diagnostics and workflows
        shell: bash
        run: |
          rm -rf .diagnostics/multi-analysis
          rm -f .github/workflows/multi-analysis-diagnostics.yml
          rm -f .github/workflows/multi-analysis-lexicon-salvage.yml
          rm -f .github/workflows/multi-analysis-lexicon-temp.yml
          rm -f .github/workflows/multi-analysis-baseline-compare.yml
      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize multi-analysis lexical architecture"
          git push origin HEAD:${GITHUB_REF_NAME}
