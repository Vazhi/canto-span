name: Temporary structured trace binding migration

on:
  push:
    branches:
      - agent/structured-parser-trace-bindings

permissions:
  contents: write

jobs:
  migrate-and-regenerate:
    if: github.event.head_commit.message != 'Apply structured trace binding migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/structured-parser-trace-bindings
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node tools/temp-apply-trace-binding-migration.js
      - run: npm run build:runtime
      - name: Commit claimed migration outputs only
        shell: bash
        run: |
          allowed='^( M (main\.js|src/parser/diagnostics/trace-bindings\.js|tools/parser-coverage-report\.js|tools/parser-coverage-enhanced\.js))$'
          status="$(git status --short)"
          unexpected="$(printf '%s\n' "$status" | grep -Ev "$allowed" | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during migration/build:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js src/parser/diagnostics/trace-bindings.js tools/parser-coverage-report.js tools/parser-coverage-enhanced.js
          git diff --cached --check
          git diff --cached --quiet && { echo "No migration changes"; exit 0; }
          git commit -m "Apply structured trace binding migration"
          git push origin HEAD:agent/structured-parser-trace-bindings
