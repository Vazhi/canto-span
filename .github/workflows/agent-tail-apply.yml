name: Apply final vernacular tail

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply final vernacular tail patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash tools/tmp-apply-vernacular-tail.sh
