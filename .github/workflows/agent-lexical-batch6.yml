name: Lexical batch 6

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  ingest:
    if: github.event.head_commit.message == 'Ingest verified Cantonese reading batch 6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Add 11 independently verified Cantonese readings
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          additions = {
            "丫":"aa1", "唓":"ce1", "喔":"o1", "尷":"gaam1", "氛":"fan1",
            "瑩":"jing4", "痴":"ci1", "薛":"sit3", "訓":"fan3", "訝":"ngaa6", "輝":"fai1"
          }
          p = Path('src/runtime-resources/lexicon/token-lexicon/vernacular-component-coverage.js')
          text = p.read_text()
          start = text.index('const READINGS = Object.freeze({')
          end = text.index('\n});', start)
          block = text[start:end]
          for surface in additions:
            if json.dumps(surface, ensure_ascii=False) in block:
              raise SystemExit(f'duplicate reading already present: {surface}')
          lines = block.splitlines()
          if not lines[-1].rstrip().endswith(','):
            lines[-1] = lines[-1] + ','
          for i, (surface, jyutping) in enumerate(additions.items()):
            comma = ',' if i + 1 < len(additions) else ''
            lines.append(f'  {json.dumps(surface, ensure_ascii=False)}: {json.dumps(jyutping)}{comma}')
          text = text[:start] + '\n'.join(lines) + text[end:]
          marker = 'const SOURCE_URL = "https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4";\n'
          extra = marker + 'const DICTIONARY_VERIFIED_SURFACES = new Set(["丫", "唓", "喔", "尷", "氛", "瑩", "痴", "薛", "訓", "訝", "輝"]);\nconst DICTIONARY_SOURCE = "粵音資料集叢 / established Cantonese reading references";\n'
          if 'DICTIONARY_VERIFIED_SURFACES' not in text:
            text = text.replace(marker, extra, 1)
          old = '      provenance: { kind: "external_vernacular_component_reading", source: SOURCE, url: SOURCE_URL },'
          new = '      provenance: DICTIONARY_VERIFIED_SURFACES.has(surface)\n        ? { kind: "independently_verified_cantonese_component_reading", source: DICTIONARY_SOURCE }\n        : { kind: "external_vernacular_component_reading", source: SOURCE, url: SOURCE_URL },'
          if old not in text:
            raise SystemExit('provenance anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('module.exports = Object.freeze({ SOURCE, SOURCE_URL, READINGS, applyVernacularComponentCoverage });', 'module.exports = Object.freeze({ SOURCE, SOURCE_URL, DICTIONARY_SOURCE, DICTIONARY_VERIFIED_SURFACES, READINGS, applyVernacularComponentCoverage });')
          p.write_text(text)

          t = Path('tests/tooling/lexicon/vernacular-component-coverage.test.js')
          test_text = t.read_text()
          test_text = test_text.replace('exactly 270 simple single-character readings', 'exactly 281 simple single-character readings')
          test_text = test_text.replace('Object.keys(READINGS).length, 270', 'Object.keys(READINGS).length, 281')
          t.write_text(test_text)
          PY
      - name: Build and verify
        run: |
          set -euo pipefail
          npm run build:runtime
          node --test tests/tooling/lexicon/vernacular-component-coverage.test.js
          npm run verify:runtime
      - name: Re-audit bounded source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4/export?format=csv&gid=1428902047' -o /tmp/canto-frequency.csv
          python - <<'PY'
          import csv, json, re, unicodedata
          rows=list(csv.DictReader(open('/tmp/canto-frequency.csv',encoding='utf-8-sig',newline='')))
          def tombstone(s):
            x=s.lower(); return x=='del' or re.search(r'(^|[-\\s?])del($|[-\\s?])',x) is not None
          seen=set(); bounded=[]
          for row in rows:
            s=unicodedata.normalize('NFC',(row.get('Word') or '').strip())
            if not s or tombstone(s) or s in seen: continue
            seen.add(s); bounded.append(s)
            if len(bounded)==2000: break
          open('/tmp/bounded.json','w').write(json.dumps(bounded,ensure_ascii=False))
          PY
          node - <<'NODE'
          const fs=require('node:fs');
          const {loadRuntimeApi}=require('./tools/lib/runtime-api');
          const api=loadRuntimeApi({apiNames:['analyzeLine']});
          const bounded=JSON.parse(fs.readFileSync('/tmp/bounded.json','utf8'));
          function flatten(nodes,out=[]){for(const n of nodes||[]){if(!n||typeof n!=='object')continue;if(n.kind==='token')out.push(n);if(Array.isArray(n.children))flatten(n.children,out);}return out;}
          function cjk(s){return [...String(s||'')].every(ch=>/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff〇○]/u.test(ch));}
          const missing=new Set();
          for(const surface of bounded) for(const token of flatten(api.analyzeLine(surface).tokens)) if(cjk(token.surface)&&!String(token.jyutping||'').trim()) missing.add(token.surface);
          const remaining=[...missing].sort();
          console.log(JSON.stringify({bounded_surfaces:bounded.length,unique_missing_reading_tokens:remaining.length,remaining_tokens:remaining},null,2));
          const expected=new Set(['咧','哂','跙','這']);
          if(remaining.length!==4 || remaining.some(x=>!expected.has(x))) throw new Error('unexpected bounded missing-reading tail: '+remaining.join(','));
          NODE
      - name: Commit batch and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-lexical-batch6.yml
          git add src/runtime-resources/lexicon/token-lexicon/vernacular-component-coverage.js tests/tooling/lexicon/vernacular-component-coverage.test.js main.js
          git commit -m 'Ingest verified Cantonese reading batch 6'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
