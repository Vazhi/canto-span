name: Publish PRQ2-035 provenance integrity repair

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/export-prq2-035-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/prq2-035-provenance-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact provenance repair
        run: |
          cp main.js /tmp/main.before.js
          python .github/prq2-035-repair.py
      - name: Rebuild and verify behavior
        run: |
          npm ci
          npm run build:runtime
          npm run verify:runtime-build
          node .github/prq2-035-behavior-check.js
      - name: Run repository verification
        run: |
          npm run test:generated-runtime
          npm test
          npm run verify
          npm run verify:research
          node tools/verify-project-state.js
          git diff --check
      - name: Clean temporary and unrelated generated files
        shell: bash
        run: |
          set -euo pipefail
          rm -f validation/current/glossika-week16-runtime-lexicon.json
          rm .github/workflows/export-prq2-035-integrity.yml
          rm .github/prq2-035-repair.py
          rm .github/prq2-035-behavior-check.js
          git add -A
          mapfile -t files < <(git diff --cached --name-only origin/main)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 6
          printf '%s\n' "${files[@]}" | grep -Fx 'docs/current/PROJECT-STATE.md'
          printf '%s\n' "${files[@]}" | grep -Fx 'grammar/parser_heuristic/ClauseRelationGraph.md'
          printf '%s\n' "${files[@]}" | grep -Fx 'main.js'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/parser/clause-relations/graph.js'
          printf '%s\n' "${files[@]}" | grep -Fx 'tests/constructions/ClauseRelationGraph.json'
          printf '%s\n' "${files[@]}" | grep -Fx 'tests/run-constructions.js'
          git diff --cached --check
      - name: Commit and push clean repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair PRQ2-035 committed-preference provenance"
          git push origin HEAD:agent/prq2-035-provenance-integrity
