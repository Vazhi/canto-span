name: top2000 lexical validation temp

on:
  push:
    branches:
      - agent/fill-top2000-lexical-gaps-r7

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lexical resources and top-2000 inclusion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { validateRuntimeLexicalResources } = require('./src/runtime-resources/lexicon/validate');
          const tokenEntries = require('./src/runtime-resources/lexicon/token-lexicon');
          const validation = validateRuntimeLexicalResources();
          const text = fs.readFileSync('data/lexical-frequency/cifu-spoken-top-2000.tsv', 'utf8').replace(/^\uFEFF/, '');
          const lines = text.trimEnd().split(/\r?\n/);
          const header = lines.shift().split('\t');
          const wordIx = header.indexOf('word');
          const rows = lines.map((line) => line.split('\t'));
          const runtime = new Set(tokenEntries.map(([surface]) => surface));
          const missing = rows.filter((row) => !runtime.has(row[wordIx])).map((row) => row[wordIx]);
          if (rows.length !== 2000) throw new Error(`Expected 2000 audit rows, got ${rows.length}`);
          if (missing.length) throw new Error(`Missing top-2000 surfaces: ${missing.slice(0, 20).join(', ')}`);
          const topSet = new Set(rows.map((row) => row[wordIx]));
          const outside = [...runtime].filter((surface) => !topSet.has(surface));
          console.log(JSON.stringify({
            lexicalValidation: validation,
            top2000ExactCoverage: 2000,
            totalRuntimeUniqueSurfaces: runtime.size,
            runtimeSurfacesOutsideTop2000: outside.length
          }, null, 2));
          NODE
