name: Publish Glossika context review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/export-glossika-context-review.yml"
      - ".github/glossika-context-review-generator.py.gz.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/glossika-context-response-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify and reconstruct generator
        shell: bash
        run: |
          set -euo pipefail
          echo "399f9c3fda920e999580f7560777dfe966b5a8bcb04e7f5cdce51cd2f453cbec  .github/glossika-context-review-generator.py.gz.b64" | sha256sum -c -
          base64 -d .github/glossika-context-review-generator.py.gz.b64 | gzip -d > /tmp/build_glossika_context_review.py
          echo "e8faafeac290b59959ba31066184dc120e2a4b3efe93d5c42e0d9953abc0a294  /tmp/build_glossika_context_review.py" | sha256sum -c -
          sed -i "/^out_tsv=ROOT\/.*context-linked-response-decisions-r1.tsv'$/a out_tsv.parent.mkdir(parents=True, exist_ok=True)" /tmp/build_glossika_context_review.py
          echo "8b2422f1302f0229e95e889b9a1f70dcb138f9e874aef0b84d0d831aab17cf35  /tmp/build_glossika_context_review.py" | sha256sum -c -
      - name: Install dependencies
        run: npm ci
      - name: Generate complete review packet
        run: python /tmp/build_glossika_context_review.py
      - name: Verify exact generated files
        shell: bash
        run: |
          set -euo pipefail
          echo "407d5c7299e291869de7cf25ca21d5e2bb1ffa5c150c3b398cf55756f965b177  review-packets/corpus-review/GLOSSIKA-CONTEXT/context-linked-response-decisions-r1.tsv" | sha256sum -c -
          echo "0cc8053f32154b6cf402956ce5c9eda46d2bf79416d109c4b381aae90786ca77  data/research/GLOSSIKA-CONTEXT-LINKED-RESPONSE-DECISIONS-R1.json" | sha256sum -c -
          echo "485fa0c1f60ec81a2adc9446b8aaae68a131b92d3f3459e5ecf7c88d40e1c30f  docs/research/GLOSSIKA-CONTEXT-LINKED-RESPONSES-R1.md" | sha256sum -c -
          echo "9b1b07f9c258b5f8432bf3dc426000e5e9f6cdd7d8311b5707505d8493937e02  docs/current/PROJECT-STATE.md" | sha256sum -c -
      - name: Audit row-level reconciliation
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          tsv_path = root / 'review-packets/corpus-review/GLOSSIKA-CONTEXT/context-linked-response-decisions-r1.tsv'
          json_path = root / 'data/research/GLOSSIKA-CONTEXT-LINKED-RESPONSE-DECISIONS-R1.json'

          with tsv_path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          packet = json.loads(json_path.read_text(encoding='utf-8'))
          records = packet['records']

          assert len(rows) == 59
          assert len(records) == 59
          assert len({row['item_id'] for row in rows}) == 59
          assert [int(row['review_index']) for row in rows] == list(range(1, 60))
          assert [record['item_id'] for record in records] == [row['item_id'] for row in rows]

          disposition_counts = Counter(row['terminal_disposition'] for row in rows)
          class_counts = Counter(row['review_class'] for row in rows)
          route_counts = Counter(row['routed_issue'] for row in rows if row['routed_issue'])

          assert dict(disposition_counts) == {
              'context_licensed': 44,
              'route_independent_parser_gap': 12,
              'no_context_needed': 2,
              'retain_needs_context': 1,
          }
          assert dict(class_counts) == {
              'multi_clause_member_local': 32,
              'continuation_or_fragment_question': 4,
              'recoverable_answer': 3,
              'formula_or_discourse_response': 7,
              'ordinary_parser_gap': 12,
              'genuinely_ambiguous': 1,
          }
          assert dict(route_counts) == {'423': 4, '424': 5, '425': 3}
          assert packet['aggregate']['terminal_disposition_counts'] == dict(disposition_counts)
          assert packet['aggregate']['review_class_counts'] == dict(class_counts)
          assert packet['aggregate']['routed_issue_counts'] == {'423': 4, '424': 5, '425': 3}
          assert packet['decision']['runtime_change_authorized'] is False
          assert packet['decision']['context_contract_accepted'] is True
          print('Glossika context review reconciliation: PASS')
          PY
      - name: Run repository verification
        run: |
          npm run verify
          npm run verify:research
          node tools/verify-project-state.js
      - name: Remove temporary publication files and enforce final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-glossika-context-review.yml
          rm -f .github/glossika-context-review-generator.py.gz.b64
          git add -A
          mapfile -t changed < <(git diff --name-only origin/main | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            data/research/GLOSSIKA-CONTEXT-LINKED-RESPONSE-DECISIONS-R1.json
            docs/current/PROJECT-STATE.md
            docs/research/GLOSSIKA-CONTEXT-LINKED-RESPONSES-R1.md
            review-packets/corpus-review/GLOSSIKA-CONTEXT/context-linked-response-decisions-r1.tsv
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected final net scope" >&2
            exit 1
          fi
      - name: Commit and push complete review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Classify Glossika context-linked responses"
          git push origin HEAD:agent/glossika-context-response-review
