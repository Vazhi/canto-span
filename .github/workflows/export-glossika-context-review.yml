name: Export Glossika context review snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/export-glossika-context-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/glossika-context-response-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create repository snapshot
        run: tar --exclude=.git -czf /tmp/canto-span-glossika-context-review.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: canto-span-glossika-context-review
          path: /tmp/canto-span-glossika-context-review.tar.gz
          if-no-files-found: error
          retention-days: 1
