name: CS-WORK-0275 Week 16 corpus ingress

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week16-corpus-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Generate source-preserving Week 16 corpus package
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const {execFileSync} = require('child_process');

          const sourceId = 'GLOSSIKA-YUEHK-A1-W16-20260705';
          const root = `data/pedagogical-corpus/glossika/${sourceId}`;
          const seedPath = 'tools/tmp/cs-work-0275-week16-seed.json';
          const seed = JSON.parse(fs.readFileSync(seedPath,'utf8'));
          if (seed.records.length !== 59) throw new Error(`Expected 59 records, found ${seed.records.length}`);

          function stable(value) {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            return JSON.stringify(value);
          }
          function sha(text) { return crypto.createHash('sha256').update(text,'utf8').digest('hex'); }
          function countBy(values) { return Object.fromEntries([...values.reduce((map,value)=>map.set(value,(map.get(value)||0)+1),new Map())].sort(([a],[b])=>a.localeCompare(b))); }
          function normalize(text) { return String(text||'').normalize('NFC').replace(/[\p{P}\p{S}\p{Z}\s]/gu,''); }
          function display(record) { return record.itemType === 'phonics_pair' ? `${record.source.wordA}|${record.source.wordB}` : record.source.traditional; }
          function tsv(value) { return String(value ?? '').replace(/\t/g,' ').replace(/\r?\n/g,' '); }

          const expectedTypes = {dialog_turn:4,lexical_entry:35,phonics_pair:6,sentence:14};
          const itemTypeCounts = countBy(seed.records.map(record=>record.itemType));
          if (stable(itemTypeCounts) !== stable(expectedTypes)) throw new Error(`Unexpected types ${JSON.stringify(itemTypeCounts)}`);
          const sectionCounts = countBy(seed.records.map(record=>record.section));
          const payloadHash = `sha256:${sha(stable(seed.records.map(record=>record.source)))}`;
          const items = seed.records.map((record,index)=>({
            id:`${sourceId}-I${String(index+1).padStart(3,'0')}`,
            ordinal:index+1,
            section:record.section,
            subsection:record.subsection,
            itemType:record.itemType,
            ...(record.register ? {register:record.register}:{}),
            ...(record.dialogTurn ? {dialogTurn:record.dialogTurn}:{}),
            source:record.source,
            sourceHash:`sha256:${sha(stable(record.source))}`
          }));
          const source = {
            schema:'canto-span-pedagogical-corpus-source-v1',
            source:seed.source,
            ingress:{...seed.ingress,recordCount:items.length,itemTypeCounts,sectionCounts,sourcePayloadHash:payloadHash,sourcePayloadHashPolicy:'SHA-256 of canonical key-sorted JSON for the ordered source-field array.'},
            sourceClaims:seed.sourceClaims,
            items
          };

          const tracked = execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const excluded = [root+'/',seedPath,'.github/workflows/cs-work-0275-week16-ingress.yml'];
          const searchable=[];
          for (const file of tracked) {
            if (excluded.some(prefix=>file.startsWith(prefix))) continue;
            let stat; try { stat=fs.statSync(file); } catch { continue; }
            if (!stat.isFile() || stat.size>5_000_000) continue;
            let text; try { text=fs.readFileSync(file,'utf8'); } catch { continue; }
            searchable.push({file,text,normalized:normalize(text)});
          }

          const runtimeDiscrepancies = {
            '釣魚':[{type:'jyutping_review',sourceValue:'diu3 jyu2',reviewedRuntimeValue:'diu3 jyu4',status:'merged_pr_121',note:'PR #121 retains the reviewed lexical reading 魚 jyu4 and does not import the source tone.'}],
            '畫畫':[{type:'reading_collision',sourceValue:'waak6 waa2',reviewedRuntimeValue:'waak6 waa2',status:'merged_pr_121',note:'PR #121 corrected the drawing verb reading while preserving noun 畫 waa2.'}],
            '公園':[{type:'changed_tone_variant',sourceValue:'gung1 jyun2',reviewedRuntimeValue:'gung1 jyun2',acceptedVariant:'gung1 jyun4',status:'merged_pr_121'}],
            '煮嘢食':[{type:'tokenization_boundary',status:'merged_pr_121',note:'Phrase-local food-object handling preserves existing 有冇嘢食 behavior.'}],
            '下棋':[{type:'reading_boundary',sourceValue:'haa5 kei2',reviewedRuntimeValue:'haa5 kei2',status:'merged_pr_121'}]
          };
          const naturalness = new Set(['阿哥/阿姐','噉就講到呢度先喇。','噉我哋就講到呢度喇。','今個星期六有時間嗎？']);
          const records=items.map(item=>{
            const form=display(item);
            const norm=normalize(form);
            const exact=form ? searchable.filter(entry=>entry.text.includes(form)).map(entry=>entry.file) : [];
            const normalized=norm.length>=2 ? searchable.filter(entry=>entry.normalized.includes(norm)).map(entry=>entry.file) : [];
            const paths=[...new Set([...exact,...normalized])].sort();
            const lexical=item.itemType==='lexical_entry';
            const crosswalk=lexical ? {
              status:'merged_runtime_crosswalk',
              intakeIssue:119,
              pullRequest:121,
              mergeCommit:'252f8e432bfc2b2f37e25514c940d959580a548e',
              provenancePath:'docs/research/GLOSSIKA-WEEK16-LEXICON-PROVENANCE.md',
              evidenceBoundary:'lexical_and_pedagogical_attestation_only'
            } : null;
            const discrepancies=runtimeDiscrepancies[form]||[];
            let classification;
            if (lexical) classification='runtime_crosswalk_merged';
            else if (item.itemType==='phonics_pair') classification='pronunciation_review_candidate';
            else if (naturalness.has(form)) classification='naturalness_register_review_candidate';
            else if (paths.length) classification='duplicate_candidate';
            else classification='new_attestation';
            return {
              id:item.id,
              sourceHash:item.sourceHash,
              normalizedCantonese:norm,
              duplicateStatus:exact.length?'mechanical_exact_candidate':normalized.length?'mechanical_normalized_candidate':'no_mechanical_match',
              duplicateOf:paths,
              ingressClassification:classification,
              runtimeCrosswalk:crosswalk,
              sourceDiscrepancies:discrepancies,
              reviewedValues:{},
              reviewerNote:'',
              evidenceUse:'not_authorized'
            };
          });
          const classificationCounts=countBy(records.map(record=>record.ingressClassification));
          const review={
            schema:'canto-span-pedagogical-corpus-review-v1',
            sourceId,
            sourcePayloadHash:payloadHash,
            policy:{
              sourceLayer:'source.json is immutable.',
              runtimeCrosswalk:'PR #121 is recorded as reviewed runtime coverage and does not overwrite source fields.',
              duplicateBoundary:'Mechanical repository matches are candidates only.',
              evidenceBoundary:'Pedagogical attestation does not establish frequency, productivity, construction identity, parser status, or native naturalness.'
            },
            summary:{recordCount:59,reviewedCount:0,unreviewedCount:59,classificationCounts,runtimeCrosswalkRecords:35,knownSourceAlerts:[
              {scope:'lesson-wide',type:'register_labels',status:'requires_external_verification',note:'Casual, Polite, Formal, and Standard labels remain source metadata.'},
              {scope:'grammar_patterns',type:'generic_negation_rule',status:'requires_direct_cantonese_evidence',note:'The source negation prose is preserved but not accepted as a complete aspect-sensitive negation analysis.'},
              {scope:'phonics_drill',type:'phonetic_material',status:'requires_independent_verification',note:'The heading /ɔː/ versus /uː/ does not transparently describe every listed IPA pair.'},
              {scope:'runtime_crosswalk',type:'reviewed_source_runtime_differences',status:'merged_pr_121',note:'釣魚, 畫畫, 公園, 煮嘢食, and 下棋 boundaries are preserved in review metadata.'}
            ]},
            records
          };

          fs.mkdirSync(root,{recursive:true});
          fs.mkdirSync('docs/research',{recursive:true});
          fs.writeFileSync(`${root}/source.json`,JSON.stringify(source,null,2)+'\n');
          fs.writeFileSync(`${root}/review.json`,JSON.stringify(review,null,2)+'\n');
          const header=['id','ordinal','section','subsection','item_type','register','source_display','source_jyutping','source_english','source_morpheme_gloss','source_hash','normalized_cantonese','duplicate_status','ingress_classification','runtime_crosswalk_status','duplicate_candidate_paths','source_discrepancies_json','review_state'];
          const lines=items.map((item,index)=>{
            const record=records[index], s=item.source;
            return [item.id,item.ordinal,item.section,item.subsection,item.itemType,item.register||'',display(item),s.jyutping||`${s.jyutpingA||''}|${s.jyutpingB||''}`,s.english||`${s.glossA||''}|${s.glossB||''}`,s.morphemeGloss||'',item.sourceHash,record.normalizedCantonese,record.duplicateStatus,record.ingressClassification,record.runtimeCrosswalk?.status||'',record.duplicateOf.join('|'),JSON.stringify(record.sourceDiscrepancies),seed.ingress.reviewState].map(tsv).join('\t');
          });
          fs.writeFileSync(`${root}/items.tsv`,[header.join('\t'),...lines].join('\n')+'\n');
          fs.writeFileSync(`${root}/README.md`,`# Glossika Cantonese (HK) A1 Week 16 corpus package\n\n- Source ID: \`${sourceId}\`\n- Lesson: Hobbies & Free Time\n- Source date: 2026-07-05\n- Gmail message: \`19f3100f131df130\`\n- Intake issue: #133\n- Work claim: #274\n- Runtime crosswalk: #119 / PR #121\n- Record count: 59\n- Types: 14 sentences, 4 dialog turns, 35 lexical entries, 6 phonics pairs\n- Source payload hash: \`${payloadHash}\`\n\n## Files\n\n- \`source.json\`: immutable source values and order.\n- \`items.tsv\`: review-oriented flat rendering.\n- \`review.json\`: mechanical duplicate candidates, PR #121 crosswalks, source discrepancies, and empty reviewed-value fields.\n\n## Boundary\n\nPR #121 already owns runtime lexical integration. This corpus package does not modify it, count evidence, infer productivity, accept register labels, or promote grammar.\n`);
          fs.writeFileSync('docs/research/GLOSSIKA-YUEHK-A1-W16-20260705-CORPUS-INGRESS.md',`# Glossika Week 16 corpus ingress\n\n- Source ID: \`${sourceId}\`\n- Intake: #133\n- Work claim: #274\n- Runtime crosswalk: #119 / PR #121\n- Status: source-preserving ingress complete; expert review required\n\n## Coverage\n\n- 59 total records\n- 14 sentences\n- 4 dialog turns\n- 35 lexical entries\n- 6 phonics pairs\n- Source payload hash: \`${payloadHash}\`\n- Classifications: \`${JSON.stringify(classificationCounts)}\`\n\n## Runtime crosswalk\n\nAll 35 lexical records point to the already merged Week 16 runtime work. Source values remain immutable; PR #121's reviewed readings and tokenization decisions are represented only in review metadata.\n\n## Stop boundary\n\nNo parser, runtime lexicon, construction identity/status, evidence classification, survey, native-panel, version, release, or deployment change is included.\n`);
          console.log({payloadHash,itemTypeCounts,classificationCounts});
          NODE
      - name: Validate package and repository
        run: |
          node <<'NODE'
          const fs=require('fs');
          const root='data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705';
          const source=require(`./${root}/source.json`);
          const review=require(`./${root}/review.json`);
          if(source.items.length!==59) throw new Error('Expected 59 source items');
          const expected={dialog_turn:4,lexical_entry:35,phonics_pair:6,sentence:14};
          if(JSON.stringify(source.ingress.itemTypeCounts)!==JSON.stringify(expected)) throw new Error('Unexpected type counts');
          if(review.records.length!==59) throw new Error('Expected 59 review records');
          if(review.summary.runtimeCrosswalkRecords!==35) throw new Error('Expected 35 runtime crosswalks');
          if(!review.records.filter(record=>record.runtimeCrosswalk).every(record=>record.runtimeCrosswalk.pullRequest===121)) throw new Error('Crosswalk mismatch');
          if(!review.records.every((record,index)=>record.id===source.items[index].id&&record.sourceHash===source.items[index].sourceHash)) throw new Error('Source/review alignment failed');
          const tsv=fs.readFileSync(`${root}/items.tsv`,'utf8').trimEnd().split('\n');
          if(tsv.length!==60) throw new Error(`Expected header plus 59 rows, found ${tsv.length}`);
          NODE
          git diff --check
          npm run verify:research
          npm run verify
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705 docs/research/GLOSSIKA-YUEHK-A1-W16-20260705-CORPUS-INGRESS.md
          git rm tools/tmp/cs-work-0275-week16-seed.json
          git commit -m "Add Glossika Week 16 corpus package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
