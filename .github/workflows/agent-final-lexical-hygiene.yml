name: Verify final lexical branch hygiene

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify final lexical branch hygiene'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Remove completed one-shot helper from candidate tree
        run: git rm tools/agent-cifu-r1751-2000-runtime-build.js
      - name: Verify clean candidate tree
        run: |
          set -euo pipefail
          npm run verify
          npm run verify:research
          npm run verify:runtime
          npm run test:lexical-ingestions
          npm run verify:runtime-build
      - name: Publish only from unchanged branch head
        run: |
          set -euo pipefail
          git fetch origin agent/cifu-r1751-2000-runtime-reconcile
          test "$(git rev-parse origin/agent/cifu-r1751-2000-runtime-reconcile)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-final-lexical-hygiene.yml
          git commit -m 'Remove completed lexical reconciliation helpers'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
