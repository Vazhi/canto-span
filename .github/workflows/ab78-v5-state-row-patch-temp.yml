name: Patch AB78 behavior-aligned projection

on:
  push:
    branches: [agent/ab78-transitive-runtime-alignment]
    paths: [.github/workflows/ab78-v5-state-row-patch-temp.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab78-transitive-runtime-alignment
          fetch-depth: 0
      - name: Add new discovery state to PROJECT-STATE synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ab78-runtime-finalize-v5-temp.yml')
          s=p.read_text()
          old="""          s=p.read_text()\n          for key,value in ready['state_counts'].items():\n              s=re.sub(rf'\\| `{re.escape(key)}` \\| \\d+ \\|',f'| `{key}` | {value} |',s,count=1)\n"""
          new="""          s=p.read_text()\n          counts=ready['state_counts']\n          if 'behavior_aligned' in counts and '`behavior_aligned`' not in s:\n              anchor='| Candidate state | Records |\\n|---|---:|\\n'\n              assert anchor in s\n              s=s.replace(anchor,anchor+f\"| `behavior_aligned` | {counts['behavior_aligned']} |\\n\",1)\n          for key,value in counts.items():\n              s=re.sub(rf'\\| `{re.escape(key)}` \\| \\d+ \\|',f'| `{key}` | {value} |',s,count=1)\n"""
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/ab78-v5-state-row-patch-temp.yml
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Handle behavior-aligned discovery state"
          git push origin HEAD:agent/ab78-transitive-runtime-alignment
