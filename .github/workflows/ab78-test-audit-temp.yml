name: AB78 temporary behavior/fixture audit

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/ab78-transitive-behavior-reaudit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Inventory AB78 fixture behavior and runtime spans
        run: |
          node <<'NODE' > ab78-fixture-audit.json
          const fs = require('fs');
          const { loadRuntimeApi, internalConstruction, rowSurface } = require('./tests/lib/runtime-api');
          const api = loadRuntimeApi();
          const spec = JSON.parse(fs.readFileSync('tests/constructions/TransitiveVP.json', 'utf8'));
          const cases = [
            ...(spec.snapshot_cases || []).map((row) => ({...row, source_kind: 'snapshot'})),
            ...(spec.focused_cases || []).map((row) => ({...row, source_kind: 'focused'})),
            ...(spec.implementation_probe_cases || []).map((row) => ({...row, source_kind: 'implementation_probe'})),
          ];

          function tags(source) {
            const out = [];
            if (/[咩邊]/u.test(source)) out.push('wh_object_or_wh_material');
            if (/[過咗緊]/u.test(source)) out.push('aspectual_material');
            if (/[一兩三四五六七八九十百千萬幾多]/u.test(source)) out.push('quantified_or_measure_material');
            if (/七杯度/u.test(source)) out.push('approximate_measure_profile');
            if (/香港/u.test(source) && /[食飲]香港/u.test(source)) out.push('semantic_selection_control');
            if (/[去嚟返]/u.test(source) && /[攞買食]|去/u.test(source)) out.push('serial_or_directional_composition_candidate');
            if (/嘅/u.test(source)) out.push('relative_or_modifier_composition');
            if (/，/u.test(source) || /[一對關於如果因為所以但係]/u.test(source)) out.push('higher_clause_or_discourse_composition');
            if (/[有冇想]/u.test(source)) out.push('modal_question_or_host_material');
            if (/[問講睇買食飲寫見到攞]/u.test(source)) out.push('lexical_predicate_candidate');
            return out.length ? out : ['other'];
          }

          function selectionRows(analysis) {
            return api.diagnosticFinalRows(analysis)
              .filter((row) => {
                const txt = JSON.stringify(row);
                return /selection|compatib|incompatib/i.test(txt);
              })
              .map((row) => ({kind: row.kind, surface: rowSurface(row), row}));
          }

          const rows = cases.map((row) => {
            const source = row.source || '';
            const analysis = api.analyzeLine(source, row.context_source || null);
            const finalRows = api.diagnosticFinalRows(analysis);
            const transitiveRows = finalRows
              .filter((candidate) => candidate.kind === 'construction' && internalConstruction(candidate) === 'TransitiveVP')
              .map((candidate) => ({
                surface: rowSurface(candidate),
                parent: candidate.internal_parent || candidate.parent || '',
                depth: candidate.depth,
                slots: candidate.slots || [],
                trace_kind: candidate.trace_detail && candidate.trace_detail.kind || '',
                trace_rule: candidate.trace_detail && candidate.trace_detail.rule || '',
                structural_scope: candidate.trace_detail && candidate.trace_detail.structural_scope || '',
                assigned_slots: candidate.trace_detail && candidate.trace_detail.assigned_slots || [],
                surfaces: candidate.trace_detail && candidate.trace_detail.surfaces || [],
                structured_bindings: candidate.trace_detail && candidate.trace_detail.structured_bindings || candidate.trace_detail && candidate.trace_detail.bindings || null,
                trace_detail: candidate.trace_detail || {},
              }));
            return {
              case_id: row.case_id || row.id || '',
              source,
              source_kind: row.source_kind,
              assertion: row.assertion || '',
              class: row.class || '',
              expected_profile: row.expected_profile || '',
              provenance: row.provenance || '',
              origins: row.origins || [],
              tags: tags(source),
              transitive_rows: transitiveRows,
              selection_rows: selectionRows(analysis),
              linguistic_evidence_weight: 0,
            };
          });

          const tagCounts = {};
          const surfaceCounts = {};
          const parentCounts = {};
          const ruleCounts = {};
          let transitiveNodeCount = 0;
          for (const row of rows) {
            for (const tag of row.tags) tagCounts[tag] = (tagCounts[tag] || 0) + 1;
            for (const tr of row.transitive_rows) {
              transitiveNodeCount += 1;
              surfaceCounts[tr.surface] = (surfaceCounts[tr.surface] || 0) + 1;
              parentCounts[tr.parent || '<root>'] = (parentCounts[tr.parent || '<root>'] || 0) + 1;
              ruleCounts[tr.trace_rule || '<none>'] = (ruleCounts[tr.trace_rule || '<none>'] || 0) + 1;
            }
          }
          process.stdout.write(JSON.stringify({
            schema: 'canto-span-ab78-fixture-audit-v1',
            construction: spec.construction,
            policy: { linguistic_evidence_weight: 0, runtime_and_fixture_reach_is_not_linguistic_evidence: true },
            declared_coverage: spec.coverage,
            case_count: rows.length,
            transitive_node_count: transitiveNodeCount,
            tag_counts: tagCounts,
            transitive_surface_counts: surfaceCounts,
            transitive_parent_counts: parentCounts,
            transitive_rule_counts: ruleCounts,
            cases: rows,
          }, null, 2));
          NODE
      - name: Verify protected research state
        run: |
          npm run verify:identities
          npm run verify:research
          npm run verify:discovery
      - uses: actions/upload-artifact@v4
        with:
          name: ab78-fixture-audit
          path: ab78-fixture-audit.json
          retention-days: 1
