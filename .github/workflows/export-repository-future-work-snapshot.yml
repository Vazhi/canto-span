name: Publish repository future-work map

on:
  push:
    branches:
      - agent/repository-future-work-map
    paths:
      - ".github/future-work-map-payload.part-*"
      - ".github/workflows/export-repository-future-work-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/agent/repository-future-work-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify and reconstruct publication payload
        shell: bash
        run: |
          set -euo pipefail
          echo "278bfcc869879280b74776ecc428289330befe7c7c7dd2e48732387cc274ffba  .github/future-work-map-payload.part-00" | sha256sum -c -
          echo "c7607608c8a623e9ce8a3ff56dbccfb9115fc1bba932a2c3bcb0fbdb8dfdff08  .github/future-work-map-payload.part-01" | sha256sum -c -
          echo "80a0f7fb2f047faee89d83af53ac431cfb5ee0110c0c41b17fdd8c17d96525c9  .github/future-work-map-payload.part-02" | sha256sum -c -
          echo "ff925631df710fb8c154c7386da6f1d4c443a8db5271f2473015a1f065fd504f  .github/future-work-map-payload.part-03" | sha256sum -c -
          echo "55e060287a4a7fdd4dc7bf770315d7fbc1be4772a4f0c4e3d7c4e463fa371efd  .github/future-work-map-payload.part-04" | sha256sum -c -
          echo "addac16ad05c1fc93096cbaf008a956b38c08b09b1e6264dd40f7f1b50b5c2e5  .github/future-work-map-payload.part-05" | sha256sum -c -
          cat .github/future-work-map-payload.part-* > /tmp/future-work-map-payload.b64
          echo "2bdb854c5f51e04c6a4c367f3b8f61d87cd63943b77bc782c97e2576fccfe9d2  /tmp/future-work-map-payload.b64" | sha256sum -c -
          base64 -d /tmp/future-work-map-payload.b64 > /tmp/future-work-map-payload.tar.gz
          echo "02284bc380ecf160c2dd3ed9d738a6d5c9e7cbbff2ef26848a20fc8bd0cdbcf6  /tmp/future-work-map-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/future-work-map-payload.tar.gz
          echo "58fd1cb165f5e7e27a87419e496a0f9bff52c824a632a665beb83d2fa2d6bbe7  data/research/REPOSITORY-FUTURE-PARSER-WORK-MAP-R1.json" | sha256sum -c -
          echo "81df6a24129216e455b4a4771bc249805d420e7ac813e0898af854867dff2f79  docs/research/REPOSITORY-FUTURE-PARSER-WORK-MAP-R1.md" | sha256sum -c -
      - name: Validate map invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/research/REPOSITORY-FUTURE-PARSER-WORK-MAP-R1.json >/dev/null
          python - <<'PY'
          import json
          path = 'data/research/REPOSITORY-FUTURE-PARSER-WORK-MAP-R1.json'
          with open(path, encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['schema'] == 'canto-span-repository-future-parser-work-map-v1'
          assert len(data['identity_inventory']) == 181
          assert len(data['prq2_inventory']) == 18
          assert len(data['candidate_clusters']) == 20
          assert data['recommended_next']['issue_number'] == 405
          assert data['repository_coverage']['new_future_issues_created'] == list(range(405, 415))
          assert data['repository_coverage']['glossika_dialog_turns'] == 821
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify canonical state and research provenance
        run: |
          npm run verify:research
          npm run verify
      - name: Remove temporary publication files and verify final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/future-work-map-payload.part-*
          rm -f .github/workflows/export-repository-future-work-snapshot.yml
          git add -A
          mapfile -t changed < <(git diff --name-only origin/main)
          printf '%s\n' "${changed[@]}"
          expected=(
            data/research/REPOSITORY-FUTURE-PARSER-WORK-MAP-R1.json
            docs/research/REPOSITORY-FUTURE-PARSER-WORK-MAP-R1.md
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected final net scope" >&2
            exit 1
          fi
      - name: Commit and push canonical maps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish repository-wide future parser work map"
          git push origin HEAD:agent/repository-future-work-map
