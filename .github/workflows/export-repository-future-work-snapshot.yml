name: Export repository future-work snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/export-repository-future-work-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/repository-future-work-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create repository snapshot
        run: tar --exclude=.git -czf /tmp/canto-span-repository-future-work-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: canto-span-repository-future-work-snapshot
          path: /tmp/canto-span-repository-future-work-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
