name: Trigger Week 14 expert review generation

on:
  push:
    branches:
      - agent/week14-ingress-review
    paths:
      - .github/workflows/trigger-week14-expert-review.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week14-ingress-review
          fetch-depth: 0
      - name: Execute the checked-in deterministic review script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/write-week14-expert-review.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          marker = '        run: |'
          start = lines.index(marker) + 1
          body = []
          for line in lines[start:]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/week14-review.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash -euxo pipefail /tmp/week14-review.sh
      - name: Remove this one-time trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trigger-week14-expert-review.yml
          git commit -m "Remove Week 14 review trigger"
          git push origin HEAD:agent/week14-ingress-review
