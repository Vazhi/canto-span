name: AB35 adjudication inspection temporary

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/ab35-identity-narrowing'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Extract AB35 and latest adjudication schema
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > ab35-adjudication-inspection.json
          const fs=require('fs');
          const path=require('path');
          const identities=JSON.parse(fs.readFileSync('data/construction-identities.json','utf8'));
          const adjudications=JSON.parse(fs.readFileSync('data/construction-adjudications.json','utf8'));
          const ab35Identity=identities.records.find((r)=>r.construction_code==='AB35');
          const collect=(value)=>Array.isArray(value)?value:(value && Array.isArray(value.records)?value.records:[]);
          const allAdj=collect(adjudications);
          const ab35Adjudications=allAdj.filter((r)=>r.construction_code==='AB35' || r.construction_uuid===ab35Identity.construction_uuid);
          const dir='data/construction-adjudication-batches';
          const files=fs.readdirSync(dir).filter((f)=>f.endsWith('.json')).sort();
          const latest=files.slice(-5).map((file)=>({file,content:JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'))}));
          process.stdout.write(JSON.stringify({
            identity_schema: identities.schema,
            current_ab35_identity: ab35Identity,
            adjudication_root_schema: adjudications.schema || null,
            ab35_adjudications: ab35Adjudications,
            batch_count: files.length,
            latest_batches: latest,
          },null,2));
          NODE
      - run: npm run verify:adjudications
      - run: npm run verify:identities
      - uses: actions/upload-artifact@v4
        with:
          name: ab35-adjudication-inspection
          path: ab35-adjudication-inspection.json
          retention-days: 1
