name: Verify 嚟講 lexical expression

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify 嚟講 lexical expression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: python tools/tmp-lai4-gong2-batch.py
      - name: Inspect related locative variants
        run: |
          node - <<'NODE'
          const lexicon = Object.fromEntries(require('./src/runtime-resources/lexicon/token-lexicon'));
          for (const surface of ['呢度','呢道','嗰度','嗰道']) {
            console.log('LOCATIVE_TARGET', surface, JSON.stringify(lexicon[surface] || null));
          }
          NODE
      - run: |
          set -euo pipefail
          npm run build:runtime
          node --test tests/tooling/lexicon/vernacular-component-coverage.test.js
          npm run verify:runtime
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-build-lai4-gong2.yml
          git rm tools/tmp-lai4-gong2-batch.py
          git add src/runtime-resources/lexicon/token-lexicon/explicit-analyses.js tests/tooling/lexicon/vernacular-component-coverage.test.js main.js
          git commit -m 'Build 嚟講 lexical expression'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
