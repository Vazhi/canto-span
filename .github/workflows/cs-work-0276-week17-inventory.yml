name: CS-WORK-0276 Week 17 source reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/glossika-week17-corpus-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check whether generation inputs remain
        id: inputs
        run: |
          if test -f tools/tmp/cs-work-0276-week17-source-meta.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Generation inputs already removed; final package is committed."
          fi
      - name: Install dependencies
        if: steps.inputs.outputs.present == 'true'
        run: npm ci
      - name: Generate source, review, and modular crosswalk
        if: steps.inputs.outputs.present == 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const sourceId = 'GLOSSIKA-YUEHK-A1-W17-20260712';
          const root = `data/pedagogical-corpus/glossika/${sourceId}`;
          const meta = JSON.parse(fs.readFileSync('tools/tmp/cs-work-0276-week17-source-meta.json', 'utf8'));
          const records = [0, 1, 2].flatMap(index => JSON.parse(fs.readFileSync(`tools/tmp/cs-work-0276-week17-records-part0${index}.json`, 'utf8')));
          if (records.length !== 75) throw new Error(`Expected 75 source records, found ${records.length}`);

          function stable(value) {
            if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
            if (value && typeof value === 'object') {
              return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
            }
            return JSON.stringify(value);
          }
          function sha(value) {
            return crypto.createHash('sha256').update(value, 'utf8').digest('hex');
          }
          function countBy(values) {
            return Object.fromEntries([...values.reduce((map, value) => map.set(value, (map.get(value) || 0) + 1), new Map())].sort(([a], [b]) => a.localeCompare(b)));
          }
          function parseTsv(file) {
            const lines = fs.readFileSync(file, 'utf8').trimEnd().split(/\r?\n/);
            const header = lines.shift().split('\t');
            return lines.map(line => Object.fromEntries(line.split('\t').map((value, index) => [header[index], value])));
          }
          function normalizeCantonese(value) {
            return String(value || '').normalize('NFC').replace(/[\p{P}\p{S}\p{Z}\s]/gu, '');
          }
          function normalizeJyutping(value) {
            return String(value || '').toLowerCase().replace(/[.,!?;:()'’“”"/\-]/g, ' ').replace(/\s+/g, ' ').trim();
          }
          function normalizeEnglish(value) {
            return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
          }
          function sourceDisplay(record) {
            return record.itemType === 'phonics_pair' ? `${record.source.wordA}|${record.source.wordB}` : record.source.traditional;
          }
          function tsvEscape(value) {
            return String(value ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
          }
          function unique(values) {
            return [...new Set(values.filter(Boolean))].sort();
          }
          function rowRef(path, row) {
            return { path, id: row.id || null };
          }

          const corpusPath = 'test-data/w17-glossika-corpus.tsv';
          const functionalPath = 'test-data/w17-functional-corpus.tsv';
          const lexiconPath = 'test-data/w17-lexicon.tsv';
          const rolePath = 'test-data/w17-lexicon-role-review.tsv';
          const grammarPath = 'test-data/w17-grammar-phrases.tsv';
          const phonicsPath = 'test-data/w17-phonics-pairs.tsv';
          const semanticPath = 'test-data/w17-corpus-semantic-disposition.tsv';
          const naturalizedPath = 'test-data/w17-naturalized-alternatives.tsv';

          const corpusRows = parseTsv(corpusPath);
          const functionalRows = parseTsv(functionalPath);
          const lexiconRows = parseTsv(lexiconPath);
          const roleRows = parseTsv(rolePath);
          const grammarRows = parseTsv(grammarPath);
          const phonicsRows = parseTsv(phonicsPath);
          const semanticRows = parseTsv(semanticPath);
          const naturalizedRows = parseTsv(naturalizedPath);

          if (corpusRows.length !== 19 || functionalRows.length !== 19) throw new Error('Expected 19 existing Week 17 corpus rows');
          if (lexiconRows.length !== 59 || roleRows.length !== 59) throw new Error('Expected 59 existing Week 17 lexical rows');
          if (grammarRows.length !== 8) throw new Error('Expected 8 Week 17 grammar phrases');
          if (phonicsRows.length !== 6) throw new Error('Expected 6 Week 17 phonics pairs');
          if (semanticRows.length !== 19) throw new Error('Expected 19 semantic dispositions');
          if (naturalizedRows.length !== 5) throw new Error('Expected 5 naturalized project-only alternatives');

          const corpusByTraditional = new Map(corpusRows.map(row => [row.traditional, row]));
          const functionalByTraditional = new Map(functionalRows.map(row => [row.traditional, row]));
          const semanticById = new Map(semanticRows.map(row => [row.id, row]));
          const lexiconBySurface = new Map(lexiconRows.map(row => [row.surface, row]));
          const roleById = new Map(roleRows.map(row => [row.id, row]));
          const grammarByTarget = new Map(grammarRows.map(row => [row.target, row]));
          const phonicsByPair = new Map(phonicsRows.map(row => [`${row.word_a}|${row.word_b}`, row]));

          const trackedPaths = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const sourcePaths = trackedPaths.filter(file => file.startsWith('src/') && file !== 'src/plugin-entry.js' && /\.(js|json)$/.test(file));
          const sourceTexts = Object.fromEntries(sourcePaths.map(file => [file, fs.readFileSync(file, 'utf8')]));
          const parserPaths = sourcePaths.filter(file => file.startsWith('src/parser/'));
          const lexiconOwnerPaths = sourcePaths.filter(file => file.startsWith('src/runtime-resources/lexicon/'));

          const parserKeywordMap = {
            discourse_transition_plus_wh_question: ['clause-relations', '/questions/'],
            negative_imperative: ['imperative'],
            topic_frame_plus_desiderative_statement: ['clause-relations', 'intention-preference'],
            hortative_statement: ['motion/', 'clause-relations'],
            enumeration_sequence: ['clause-relations', 'terminal/particles'],
            example_frame_plus_preference_statement: ['clause-relations', 'intention-preference'],
            example_statement: ['clause-relations', 'predicates/basic'],
            contrastive_enumeration: ['clause-relations', 'definition/', 'predicates/basic'],
            stative_statement: ['predicates/basic', 'wrap-predicate'],
            a_not_a_question_plus_suggestion: ['/questions/', 'imperative'],
            elliptical_result_state_clause: ['complements/', 'predicates/basic', 'clause-relations'],
            seeming_stative_statement: ['predicates/basic', 'wrap-predicate'],
            response_plus_stative_statement: ['formula-responses', 'predicates/basic', 'clause-relations'],
            wh_question_plus_elliptical_question: ['/questions/', 'boundaries/', 'clause-relations'],
            response_plus_code_switched_clause: ['formula-responses', 'complements/', 'clause-relations'],
            modal_clause_sequence: ['modality/', 'clause-relations'],
            locative_clause: ['coverbs/', 'locative', 'predicates/basic'],
            comitative_motion_purpose_clause: ['coverbs/', 'motion/', 'clause-relations']
          };
          function parserOwnerCandidates(utteranceType) {
            const keywords = parserKeywordMap[utteranceType] || [];
            return unique(parserPaths.filter(file => keywords.some(keyword => file.includes(keyword))));
          }
          function exactLexiconOwners(forms) {
            const owners = [];
            for (const file of lexiconOwnerPaths) {
              const text = sourceTexts[file];
              for (const form of forms) {
                const quoted = JSON.stringify(form);
                if (text.includes(`[${quoted},`) || text.includes(`${quoted}, {`) || text.includes(`${quoted},\n`) || text.includes(` ${quoted},`) || text.includes(`\n  ${quoted}`)) {
                  owners.push(file);
                  break;
                }
              }
            }
            return unique(owners);
          }

          const payloadHash = `sha256:${sha(stable(records.map(record => record.source)))}`;
          const itemTypeCounts = countBy(records.map(record => record.itemType));
          const sectionCounts = countBy(records.map(record => record.section));
          const expectedTypes = { dialog_turn: 5, lexical_entry: 50, phonics_pair: 6, sentence: 14 };
          if (stable(itemTypeCounts) !== stable(expectedTypes)) throw new Error(`Unexpected source type counts: ${JSON.stringify(itemTypeCounts)}`);

          const items = records.map((record, index) => ({
            id: `${sourceId}-I${String(index + 1).padStart(3, '0')}`,
            ordinal: index + 1,
            section: record.section,
            subsection: record.subsection,
            itemType: record.itemType,
            ...(record.register ? { register: record.register } : {}),
            ...(record.dialogTurn ? { dialogTurn: record.dialogTurn } : {}),
            source: record.source,
            sourceHash: `sha256:${sha(stable(record.source))}`
          }));

          const firstSourceOccurrence = new Map();
          const crosswalkRecords = [];
          for (const item of items) {
            const display = sourceDisplay(item);
            const sourceRepeatOf = firstSourceOccurrence.get(display) || null;
            if (!sourceRepeatOf) firstSourceOccurrence.set(display, item.id);

            const projectRecords = [];
            const discrepancies = [];
            let primaryProject = null;
            let reviewedUtteranceType = null;

            if (item.itemType === 'sentence' || item.itemType === 'dialog_turn') {
              const row = corpusByTraditional.get(item.source.traditional);
              const functional = functionalByTraditional.get(item.source.traditional);
              if (row) {
                primaryProject = row;
                reviewedUtteranceType = row.utterance_type;
                projectRecords.push(rowRef(corpusPath, row));
                const semantic = semanticById.get(row.id);
                if (semantic) projectRecords.push(rowRef(semanticPath, semantic));
              }
              if (functional) projectRecords.push(rowRef(functionalPath, functional));
              if (row) {
                if (normalizeJyutping(item.source.jyutping) !== normalizeJyutping(row.jyutping)) {
                  discrepancies.push({ type: 'pronunciation_discrepancy', sourceValue: item.source.jyutping, projectValue: row.jyutping });
                }
                if (normalizeEnglish(item.source.english) !== normalizeEnglish(row.english)) {
                  discrepancies.push({ type: 'translation_discrepancy', sourceValue: item.source.english, projectValue: row.english });
                }
                if (row.status === 'REVIEW' || row.notes) {
                  discrepancies.push({ type: 'project_review_note', status: row.status, note: row.notes || '' });
                }
              }
            } else if (item.itemType === 'lexical_entry') {
              const row = lexiconBySurface.get(item.source.traditional);
              if (row) {
                primaryProject = row;
                projectRecords.push(rowRef(lexiconPath, row));
                const role = roleById.get(row.id);
                if (role) projectRecords.push(rowRef(rolePath, role));
                if (item.subsection === 'prepositions') {
                  const grammar = grammarByTarget.get(item.source.traditional);
                  if (grammar) projectRecords.push(rowRef(grammarPath, grammar));
                }
                if (normalizeJyutping(item.source.jyutping) !== normalizeJyutping(row.jyutping)) {
                  discrepancies.push({ type: 'pronunciation_discrepancy', sourceValue: item.source.jyutping, projectValue: row.jyutping });
                }
                if (normalizeEnglish(item.source.english) !== normalizeEnglish(row.english)) {
                  discrepancies.push({ type: 'translation_discrepancy', sourceValue: item.source.english, projectValue: row.english });
                }
                if (row.status === 'REVIEW' || row.notes) {
                  discrepancies.push({ type: 'project_review_note', status: row.status, note: row.notes || '' });
                }
              }
            } else if (item.itemType === 'phonics_pair') {
              const row = phonicsByPair.get(display);
              if (row) {
                primaryProject = row;
                projectRecords.push(rowRef(phonicsPath, row));
                for (const word of [item.source.wordA, item.source.wordB]) {
                  const lex = lexiconBySurface.get(word);
                  if (lex) projectRecords.push(rowRef(lexiconPath, lex));
                }
                if (normalizeJyutping(item.source.jyutpingA) !== normalizeJyutping(row.jyutping_a) || normalizeJyutping(item.source.jyutpingB) !== normalizeJyutping(row.jyutping_b)) {
                  discrepancies.push({
                    type: 'pronunciation_discrepancy',
                    sourceValue: `${item.source.jyutpingA}|${item.source.jyutpingB}`,
                    projectValue: `${row.jyutping_a}|${row.jyutping_b}`,
                    note: row.notes || ''
                  });
                }
                if (row.notes) discrepancies.push({ type: 'project_review_note', status: row.status, note: row.notes });
              }
            }

            let classification = 'new_attestation';
            if (projectRecords.length) {
              if (sourceRepeatOf) classification = 'exact_duplicate';
              else if (discrepancies.some(entry => entry.type === 'pronunciation_discrepancy' || entry.type === 'translation_discrepancy')) classification = 'partial_match';
              else if (primaryProject && item.itemType !== 'phonics_pair') {
                const projectSurface = primaryProject.traditional || primaryProject.surface || '';
                const sourceSurface = item.source.traditional || '';
                classification = projectSurface === sourceSurface ? 'normalized_duplicate' : 'partial_match';
              } else classification = 'normalized_duplicate';
            }

            const lexicalForms = item.itemType === 'phonics_pair'
              ? [item.source.wordA, item.source.wordB]
              : item.itemType === 'lexical_entry'
                ? [item.source.traditional]
                : [];
            const canonicalLexiconOwners = exactLexiconOwners(lexicalForms);
            const canonicalParserOwners = reviewedUtteranceType ? parserOwnerCandidates(reviewedUtteranceType) : [];
            if ([...canonicalLexiconOwners, ...canonicalParserOwners].some(file => file === 'main.js')) throw new Error('Generated main.js leaked into modular ownership');

            crosswalkRecords.push({
              sourceItemId: item.id,
              sourceHash: item.sourceHash,
              sourceDisplay: display,
              sourceRepeatOf,
              classification,
              existingProjectRecords: projectRecords,
              canonicalLexiconOwners,
              canonicalParserOwnerCandidates: canonicalParserOwners,
              reviewedUtteranceType,
              discrepancies,
              evidenceBoundary: 'Crosswalk and runtime ownership are project metadata only; neither source attestation nor an existing runtime path establishes construction productivity or linguistic status.'
            });
          }

          const projectOnlyItems = naturalizedRows.map((row, index) => ({
            id: `W17-PROJECT-ONLY-${String(index + 1).padStart(3, '0')}`,
            classification: 'project_only_item',
            missingSourceItem: true,
            sourceProjectRecord: rowRef(naturalizedPath, row),
            relatedSourceProjectId: row.source_id,
            traditional: row.traditional,
            jyutping: row.jyutping,
            english: row.english,
            lifecycleStatus: row.lifecycle_status,
            reason: 'Project-created naturalized alternative; no corresponding original lesson row.'
          }));

          const classificationCounts = countBy(crosswalkRecords.map(record => record.classification));
          const discrepancyCounts = countBy(crosswalkRecords.flatMap(record => record.discrepancies.map(entry => entry.type)));
          const sourceRepeatCount = crosswalkRecords.filter(record => record.sourceRepeatOf).length;
          const unmatchedSourceCount = crosswalkRecords.filter(record => record.classification === 'new_attestation').length;

          const source = {
            schema: 'canto-span-pedagogical-corpus-source-v1',
            source: meta.source,
            ingress: {
              ...meta.ingress,
              recordCount: items.length,
              itemTypeCounts,
              sectionCounts,
              sourcePayloadHash: payloadHash,
              sourcePayloadHashPolicy: 'SHA-256 of canonical key-sorted JSON for the ordered source-field array.'
            },
            sourceClaims: meta.sourceClaims,
            items
          };

          const crosswalk = {
            schema: 'canto-span-pedagogical-corpus-crosswalk-v1',
            sourceId,
            sourcePayloadHash: payloadHash,
            architecture: {
              canonicalRuntimeInputs: ['src/**', 'src/runtime-resources/**'],
              generatedBundle: 'main.js',
              generatedBundleExcludedFromOwnership: true,
              buildEntrypoint: 'src/plugin-entry.js',
              buildContract: 'tools/build-runtime.js'
            },
            existingWeek17Inputs: {
              corpusPath,
              functionalPath,
              lexiconPath,
              rolePath,
              grammarPath,
              phonicsPath,
              semanticPath,
              naturalizedPath
            },
            summary: {
              sourceRecordCount: items.length,
              sourceRepeatCount,
              classificationCounts,
              discrepancyCounts,
              unmatchedSourceCount,
              projectOnlyItemCount: projectOnlyItems.length
            },
            records: crosswalkRecords,
            projectOnlyItems
          };

          const review = {
            schema: 'canto-span-pedagogical-corpus-review-v1',
            sourceId,
            sourcePayloadHash: payloadHash,
            policy: {
              sourceLayer: 'source.json is immutable and preserves all repeated lesson rows.',
              existingProjectLayer: 'Existing w17-* records remain authoritative for their own reviewed corrections and lifecycle metadata; this package does not overwrite them.',
              modularRuntimeLayer: 'Only src/** and src/runtime-resources/** may be named as runtime owners. main.js is generated and excluded.',
              evidenceBoundary: 'Pedagogical attestation, tests, parser output, and prior project promotion do not independently establish grammatical productivity, identity, frequency, or dialect-wide naturalness.'
            },
            summary: {
              recordCount: items.length,
              reviewedCount: 0,
              unreviewedCount: items.length,
              sourceRepeatCount,
              classificationCounts,
              discrepancyCounts,
              projectOnlyItemCount: projectOnlyItems.length,
              knownSourceAlerts: [
                { scope: 'lesson-wide', type: 'register_labels', status: 'source_only', note: 'Casual, polite, and standard labels remain source metadata.' },
                { scope: 'emotion_lexicon', type: 'repeated_source_rows', status: 'preserved', note: '攰, 嬲, and 驚 each occur twice in the source; the project later deduplicated them.' },
                { scope: 'grammar_patterns', type: 'category_simplification', status: 'requires_external_verification', note: 'The lesson groups multifunctional verbs, coverbs, conjunctions, and complex forms under Prepositions.' },
                { scope: 'phonics_drill', type: 'pronunciation_discrepancy', status: 'project_reviewed_correction', note: 'The source gives 闊 kut3; existing project records correct it to fut3.' },
                { scope: 'phonics_drill', type: 'heading_scope', status: 'requires_independent_verification', note: 'The /yː/ versus /uː/ heading does not transparently describe every listed pair.' },
                { scope: 'source_claims', type: 'pedagogical_generalization', status: 'source_only', note: 'The phonics comparison with Mandarin is preserved but not adopted as project evidence.' }
              ]
            },
            records: crosswalkRecords.map(record => ({
              id: record.sourceItemId,
              sourceHash: record.sourceHash,
              normalizedCantonese: normalizeCantonese(record.sourceDisplay),
              ingressClassification: record.classification,
              sourceRepeatOf: record.sourceRepeatOf,
              existingProjectRecords: record.existingProjectRecords,
              canonicalLexiconOwners: record.canonicalLexiconOwners,
              canonicalParserOwnerCandidates: record.canonicalParserOwnerCandidates,
              sourceDiscrepancies: record.discrepancies,
              reviewedValues: {},
              reviewerNote: '',
              evidenceUse: 'not_authorized'
            }))
          };

          fs.mkdirSync(root, { recursive: true });
          fs.mkdirSync('docs/research', { recursive: true });
          fs.writeFileSync(`${root}/source.json`, JSON.stringify(source, null, 2) + '\n');
          fs.writeFileSync(`${root}/crosswalk.json`, JSON.stringify(crosswalk, null, 2) + '\n');
          fs.writeFileSync(`${root}/review.json`, JSON.stringify(review, null, 2) + '\n');

          const header = [
            'id', 'ordinal', 'section', 'subsection', 'item_type', 'register', 'source_display',
            'source_jyutping', 'source_english', 'source_morpheme_gloss', 'source_hash',
            'crosswalk_classification', 'source_repeat_of', 'existing_project_records',
            'canonical_lexicon_owners', 'canonical_parser_owner_candidates',
            'source_discrepancies_json', 'review_state'
          ];
          const lines = items.map((item, index) => {
            const record = crosswalkRecords[index];
            const s = item.source;
            return [
              item.id, item.ordinal, item.section, item.subsection, item.itemType, item.register || '',
              sourceDisplay(item),
              s.jyutping || `${s.jyutpingA || ''}|${s.jyutpingB || ''}`,
              s.english || `${s.glossA || ''}|${s.glossB || ''}`,
              s.morphemeGloss || '', item.sourceHash, record.classification, record.sourceRepeatOf || '',
              record.existingProjectRecords.map(ref => `${ref.path}#${ref.id || ''}`).join('|'),
              record.canonicalLexiconOwners.join('|'), record.canonicalParserOwnerCandidates.join('|'),
              JSON.stringify(record.discrepancies), meta.ingress.reviewState
            ].map(tsvEscape).join('\t');
          });
          fs.writeFileSync(`${root}/items.tsv`, [header.join('\t'), ...lines].join('\n') + '\n');

          fs.writeFileSync(`${root}/README.md`, `# Glossika Cantonese (HK) A1 Week 17 corpus reconciliation\n\n- Source ID: \`${sourceId}\`\n- Lesson: Emotions & States\n- Source date: 2026-07-12\n- Gmail message: \`19f5511dfc37c9ea\`\n- Intake issue: #134\n- Work claim: #276\n- Pull request: #277\n- Source records: 75\n- Source payload hash: \`${payloadHash}\`\n\n## Preserved source structure\n\n- 8 functional-language sentences\n- 32 emotion/state lexical rows, including repeated 攰, 嬲, and 驚 rows\n- 10 number entries\n- 4 situation sentences\n- 5 dialog turns\n- 8 source-labeled preposition entries\n- 2 preposition example sentences\n- 6 phonics pairs\n\n## Reconciliation\n\nThe package crosswalks every source row to existing \`test-data/w17-*\` records and current modular owners. It preserves five project-created naturalized alternatives as project-only records. Existing project corrections and lifecycle states remain unchanged.\n\n## Architecture boundary\n\n\`src/**\` and \`src/runtime-resources/**\` are canonical runtime inputs. \`main.js\` is generated and is not an ownership source. This corpus-only package does not regenerate or modify the runtime bundle.\n`);

          fs.writeFileSync('docs/research/GLOSSIKA-YUEHK-A1-W17-20260712-CORPUS-RECONCILIATION.md', `# Glossika Week 17 corpus reconciliation\n\n- Source ID: \`${sourceId}\`\n- Intake: #134\n- Work claim: #276\n- PR: #277\n- Status: source preserved and reconciled; no runtime or promotion change\n\n## Result\n\n- 75 source records preserved in email order.\n- 3 repeated source lexical rows retained rather than silently deduplicated.\n- 19 sentence/dialog records crosswalked to the existing corpus and semantic-disposition files.\n- 50 source lexical rows crosswalked to the 59-entry deduplicated project lexicon, including grammar and phonics records where relevant.\n- 6 phonics pairs crosswalked to reviewed project pairs.\n- 5 naturalized alternatives retained as project-only records with no source-row claim.\n- Crosswalk classifications: \`${JSON.stringify(classificationCounts)}\`.\n- Discrepancy flags: \`${JSON.stringify(discrepancyCounts)}\`.\n- Unmatched source rows: ${unmatchedSourceCount}.\n\n## Key discrepancies\n\n- Source duplicates: 攰, 嬲, and 驚 occur twice; project lexicon records merge them.\n- Gloss expansion: several project lexical glosses add reviewed senses that are not present in the source wording.\n- Source/project translation wording differs for some complete sentences without changing the preserved Cantonese source.\n- The source gives \`闊 kut3\`; the reviewed project record gives \`闊 fut3\`.\n- The source labels all eight grammar-table items as prepositions even though current project records preserve multifunctional lexical categories and contextual roles.\n- Five naturalized alternatives are project-only and must not be represented as original Glossika rows.\n\n## Modular ownership\n\nCrosswalk ownership is resolved only against current \`src/**\` and \`src/runtime-resources/**\` paths. Existing sentence-level parser paths are recorded as candidate owners derived from reviewed utterance types; they are not new identity or promotion decisions. Generated \`main.js\` is excluded throughout.\n\n## Stop boundary\n\nNo parser behavior, runtime lexicon, generated bundle, construction identity/status, existing Week 17 review decision, evidence classification, survey, native panel, version, release, or deployment state changed.\n`);

          console.log({ payloadHash, itemTypeCounts, sectionCounts, classificationCounts, discrepancyCounts, sourceRepeatCount, projectOnlyItems: projectOnlyItems.length });
          NODE
      - name: Validate generated reconciliation
        if: steps.inputs.outputs.present == 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W17-20260712';
          const source = require(`./${root}/source.json`);
          const crosswalk = require(`./${root}/crosswalk.json`);
          const review = require(`./${root}/review.json`);
          const expectedTypes = { dialog_turn: 5, lexical_entry: 50, phonics_pair: 6, sentence: 14 };
          if (source.items.length !== 75) throw new Error('Expected 75 source records');
          if (JSON.stringify(source.ingress.itemTypeCounts) !== JSON.stringify(expectedTypes)) throw new Error('Unexpected source type counts');
          if (crosswalk.records.length !== 75 || review.records.length !== 75) throw new Error('Crosswalk/review alignment count failed');
          if (crosswalk.projectOnlyItems.length !== 5) throw new Error('Expected five project-only naturalized alternatives');
          if (crosswalk.summary.sourceRepeatCount !== 3) throw new Error('Expected three repeated source rows');
          if (crosswalk.summary.unmatchedSourceCount !== 0) throw new Error('Every source row should crosswalk to existing Week 17 project data');
          if (!crosswalk.records.every((record, index) => record.sourceItemId === source.items[index].id && record.sourceHash === source.items[index].sourceHash)) throw new Error('Source/crosswalk alignment failed');
          if (!review.records.every((record, index) => record.id === source.items[index].id && record.sourceHash === source.items[index].sourceHash)) throw new Error('Source/review alignment failed');
          const mainLeaks = crosswalk.records.flatMap(record => [...record.canonicalLexiconOwners, ...record.canonicalParserOwnerCandidates]).filter(path => path === 'main.js' || path.endsWith('/main.js'));
          if (mainLeaks.length) throw new Error('Generated main.js leaked into canonical ownership');
          const phonicsCorrection = crosswalk.records.find(record => record.sourceDisplay === '血|闊');
          if (!phonicsCorrection || !phonicsCorrection.discrepancies.some(entry => entry.type === 'pronunciation_discrepancy')) throw new Error('闊 source/project reading discrepancy not preserved');
          const tsv = fs.readFileSync(`${root}/items.tsv`, 'utf8').trimEnd().split('\n');
          if (tsv.length !== 76) throw new Error(`Expected TSV header plus 75 rows, found ${tsv.length}`);
          const note = fs.readFileSync('docs/research/GLOSSIKA-YUEHK-A1-W17-20260712-CORPUS-RECONCILIATION.md', 'utf8');
          for (const phrase of ['75 source records', 'Generated `main.js` is excluded', 'five naturalized alternatives']) {
            if (!note.toLowerCase().includes(phrase.toLowerCase())) throw new Error(`Research note missing ${phrase}`);
          }
          console.log(crosswalk.summary);
          NODE
          git diff --check
      - name: Run repository verification
        if: steps.inputs.outputs.present == 'true'
        run: |
          npm run verify:research
          npm run verify
      - name: Commit final reconciliation package
        if: steps.inputs.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W17-20260712 \
            docs/research/GLOSSIKA-YUEHK-A1-W17-20260712-CORPUS-RECONCILIATION.md
          git rm \
            tools/tmp/cs-work-0276-week17-source-meta.json \
            tools/tmp/cs-work-0276-week17-records-part00.json \
            tools/tmp/cs-work-0276-week17-records-part01.json \
            tools/tmp/cs-work-0276-week17-records-part02.json \
            tools/tmp/cs-work-0276-week17-inventory.json
          git commit -m "Reconcile Glossika Week 17 source corpus"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
