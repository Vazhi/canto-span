name: CS-WORK-0276 Week 17 modular inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'agent/glossika-week17-corpus-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Inventory current modular Week 17 owners
        run: |
          mkdir -p tools/tmp
          node <<'NODE'
          const fs = require('fs');
          const {execFileSync} = require('child_process');

          const tracked = execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const allowedPrefixes = ['src/','tests/','test-data/','data/','docs/','grammar/','config/','tools/'];
          const excluded = new Set(['main.js','tools/tmp/cs-work-0276-week17-inventory.json','tools/tmp/cs-work-0276-week17-explicit-paths.json']);
          const identityTerms = ['w17','week17','week-17','week 17','emotions & states','emotions and states'];
          const lexicalTerms = [
            '唔開心','攰','嬲','驚','擔心','悶','緊張','壓力','辛苦','感動','激動','失望','放鬆','開心','傷心','鍾意','唔鍾意','興奮','孤獨','滿足','驕傲','嫉妒','焦慮','感激','慚愧','害怕','感恩','好奇','樂觀',
            '講返正題','唔好離題','關於呢個問題','返去頭先嘅話題','第一嘛','好似我噉','一方面係時間','另一方面係費用'
          ];
          const allTerms=[...identityTerms,...lexicalTerms];
          const records=[];
          for (const file of tracked) {
            if (excluded.has(file) || !allowedPrefixes.some(prefix=>file.startsWith(prefix))) continue;
            let stat; try { stat=fs.statSync(file); } catch { continue; }
            if (!stat.isFile() || stat.size>5_000_000) continue;
            let text; try { text=fs.readFileSync(file,'utf8'); } catch { continue; }
            const lower=text.toLowerCase();
            const matched=allTerms.filter(term=>lower.includes(term.toLowerCase()));
            const filenameMatch=/w17|week.?17|emotion|state/i.test(file);
            if (!filenameMatch && matched.length===0) continue;
            records.push({path:file,size:stat.size,filenameMatch,identityTerms:identityTerms.filter(term=>lower.includes(term.toLowerCase())),matchedTerms:matched});
          }
          records.sort((a,b)=>a.path.localeCompare(b.path));
          const base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const authority={canonical:['src/**','src/runtime-resources/**'],generatedExcluded:['main.js'],supporting:['tests/**','test-data/**','data/**','docs/**','grammar/**','config/**']};
          fs.writeFileSync('tools/tmp/cs-work-0276-week17-inventory.json',JSON.stringify({schema:'canto-span-week17-modular-inventory-v2',base,authority,pathCount:records.length,paths:records},null,2)+'\n');
          const explicit=records.filter(record=>record.filenameMatch||record.identityTerms.length);
          fs.writeFileSync('tools/tmp/cs-work-0276-week17-explicit-paths.json',JSON.stringify({schema:'canto-span-week17-explicit-paths-v1',base,authority,pathCount:explicit.length,paths:explicit},null,2)+'\n');
          console.log({allPaths:records.length,explicitPaths:explicit.length,explicit:explicit.map(r=>r.path)});
          NODE
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tmp/cs-work-0276-week17-inventory.json tools/tmp/cs-work-0276-week17-explicit-paths.json
          git commit -m "Refine modular Week 17 inventory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
