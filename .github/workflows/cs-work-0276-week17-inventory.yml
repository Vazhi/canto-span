name: CS-WORK-0276 Week 17 modular inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'agent/glossika-week17-corpus-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Inventory current modular Week 17 owners
        run: |
          mkdir -p tools/tmp
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const {execFileSync} = require('child_process');

          const tracked = execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const allowedPrefixes = ['src/','tests/','data/','docs/','grammar/','config/','tools/'];
          const excluded = new Set(['main.js','tools/tmp/cs-work-0276-week17-inventory.json']);
          const terms = [
            'w17','week17','week-17','week 17','emotions & states','emotions and states',
            '唔開心','攰','嬲','驚','擔心','悶','緊張','壓力','辛苦','感動','激動','失望','放鬆','開心','傷心','鍾意','唔鍾意','興奮',
            '講返正題','唔好離題','關於呢個問題','返去頭先嘅話題','第一嘛','好似我噉','一方面係時間','另一方面係費用'
          ];
          const lowerTerms = terms.map(term=>term.toLowerCase());
          const records = [];
          for (const file of tracked) {
            if (excluded.has(file) || !allowedPrefixes.some(prefix=>file.startsWith(prefix))) continue;
            let stat; try { stat=fs.statSync(file); } catch { continue; }
            if (!stat.isFile() || stat.size>5_000_000) continue;
            let text; try { text=fs.readFileSync(file,'utf8'); } catch { continue; }
            const lower=text.toLowerCase();
            const matched=terms.filter((term,index)=>lower.includes(lowerTerms[index]));
            const filenameMatch=/w17|week.?17|emotion|state/i.test(file);
            if (!filenameMatch && matched.length===0) continue;
            const snippets=[];
            for (const term of matched.slice(0,20)) {
              const i=text.toLowerCase().indexOf(term.toLowerCase());
              const start=Math.max(0,i-120), end=Math.min(text.length,i+term.length+180);
              snippets.push({term,text:text.slice(start,end).replace(/\s+/g,' ').trim()});
            }
            records.push({path:file,size:stat.size,filenameMatch,matchedTerms:matched,snippets});
          }
          records.sort((a,b)=>a.path.localeCompare(b.path));
          const output={
            schema:'canto-span-week17-modular-inventory-v1',
            base:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            authority:{canonical:['src/**','src/runtime-resources/**'],generatedExcluded:['main.js'],supporting:['tests/**','data/**','docs/**','grammar/**','config/**']},
            termCount:terms.length,
            pathCount:records.length,
            paths:records
          };
          fs.writeFileSync('tools/tmp/cs-work-0276-week17-inventory.json',JSON.stringify(output,null,2)+'\n');
          console.log({pathCount:records.length,paths:records.map(r=>r.path)});
          NODE
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tmp/cs-work-0276-week17-inventory.json
          git commit -m "Inventory modular Week 17 owners"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
