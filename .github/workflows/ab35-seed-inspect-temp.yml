name: AB35 seed runtime inspection temporary

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.pull_request.number == 761 && github.event.pull_request.head.ref == 'agent/ab35-verb-object-compound-seed' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab35-verb-object-compound-seed
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Inventory source ownership, template engine, and baseline traces
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== PRODUCTIVE VO REFERENCES ==='
            grep -R -n -E 'productive-vo|ProductiveVO' src tools tests/lib tests/tooling 2>/dev/null || true
            echo '=== TEMPLATE ENGINE REFERENCES ==='
            grep -R -n -E 'category-span-templates|CATEGORY_SPAN|categorySpan|surface_sequence_in|template_family|assigned_slots' src/parser src/plugin-entry.js 2>/dev/null | head -n 800 || true
            echo '=== LIKELY TEMPLATE ENGINE FILES ==='
            for f in $(grep -R -l -E 'surface_sequence_in|category-span-templates' src/parser src/plugin-entry.js 2>/dev/null | sort -u); do
              echo "--- $f ---"
              nl -ba "$f" | sed -n '1,760p'
            done
            echo '=== TRACE METADATA SOURCE-LINKED REFERENCES ==='
            grep -R -n -E 'source_linked_runtime_matcher' src 2>/dev/null || true
            echo '=== PRODUCTIVE VO RESOURCE ==='
            nl -ba src/runtime-resources/lexicon/productive-vo.js
          } > ab35-engine-inspection.txt
          node <<'NODE' > ab35-baseline-traces.json
          const { loadRuntimeApi, internalConstruction, rowSurface } = require('./tests/lib/runtime-api');
          const api = loadRuntimeApi();
          const probes = [
            '飲茶。','我飲茶。','游水。','我會游水。','沖涼。','我想沖涼。','你飲茶咩？',
            '做功課。','食飯。','打電話。','打籃球。','飲咗茶。','游咗水。','沖咗涼。','飲水。'
          ];
          const rows = probes.map((source) => {
            const analysis = api.analyzeLine(source, null);
            const finalRows = api.diagnosticFinalRows(analysis).map((row) => ({
              kind: row.kind || '',
              construction: internalConstruction(row),
              surface: rowSurface(row),
              parent: row.internal_parent || row.parent || '',
              depth: row.depth,
              slots: row.slots || [],
              trace_detail: row.kind === 'construction' ? (row.trace_detail || null) : undefined,
            }));
            return { source, rows: finalRows };
          });
          process.stdout.write(JSON.stringify({runtime_version: api.runtimeVersion, probes: rows}, null, 2));
          NODE
      - name: Baseline verification
        run: |
          npm run verify:runtime
          npm run audit:parser-architecture -- --json > ab35-architecture-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: ab35-seed-runtime-engine-inspection
          path: |
            ab35-engine-inspection.txt
            ab35-baseline-traces.json
            ab35-architecture-baseline.json
          retention-days: 1
      - name: Execute the existing claimed apply plan
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/ab35-seed-apply-temp.yml').read_text().splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              if lines[i] == '        run: |':
                  i += 1
                  block = []
                  while i < len(lines) and (lines[i].startswith('          ') or lines[i] == ''):
                      block.append(lines[i][10:] if lines[i].startswith('          ') else '')
                      i += 1
                  blocks.append('\n'.join(block).rstrip() + '\n')
                  continue
              i += 1

          if len(blocks) < 6:
              raise SystemExit(f'expected at least 6 multiline apply blocks, found {len(blocks)}')

          for index, block in enumerate(blocks, start=1):
              print(f'=== EXECUTING APPLY BLOCK {index}/{len(blocks)} ===', flush=True)
              subprocess.run(['bash', '-lc', block], check=True)
          PY
