name: AB35 seed runtime inspection temporary

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.pull_request.number == 761 && github.event.pull_request.head.ref == 'agent/ab35-verb-object-compound-seed' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab35-verb-object-compound-seed
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Patch finalizer for current architecture and regression contracts
        run: python3 .github/ab35-hotpatch-temp.py
      - name: Apply, verify, clean, and commit bounded AB35 seed
        run: python3 .github/ab35-seed-apply-temp.py
