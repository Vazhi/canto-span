name: Generate runtime artifact

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/tooling/build/licensed-fragments-complement-type.test.js"
      - ".github/workflows/generate-runtime-artifact.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Generate deterministic runtime
        run: npm run build:runtime
      - name: Verify generated runtime
        run: npm run verify:runtime-build
      - name: Run focused regression tests
        run: node --test tests/tooling/build/licensed-fragments-complement-type.test.js
      - name: Commit generated runtime when changed
        run: |
          if git diff --quiet -- main.js; then
            echo "main.js already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Regenerate runtime bundle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload generated runtime
        uses: actions/upload-artifact@v4
        with:
          name: generated-main-js-${{ github.event.pull_request.head.sha }}
          path: main.js
          if-no-files-found: error
          retention-days: 1
