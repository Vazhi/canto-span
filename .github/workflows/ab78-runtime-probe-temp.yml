name: AB78 temporary runtime candidate validation

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'agent/ab78-transitive-runtime-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Locate category-template loader
        run: |
          grep -R -n --exclude=main.js --exclude-dir=node_modules --exclude-dir=.git 'category-span-templates' src > ab78-loader-hits.txt || true
      - name: Apply minimal candidate in checkout only
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/runtime-resources/grammar/templates/category-span-templates.js')
          text = p.read_text()
          anchor = '    template: ["consumption_verb!", "approximate_quantity!", "particle?"],'
          anchor_at = text.index(anchor)
          start = text.rfind('  {\n', 0, anchor_at)
          assert start >= 0
          next_anchor = '    template: ["action_verb!", "object!"],'
          next_at = text.index(next_anchor, anchor_at + len(anchor))
          end = text.rfind('  {\n', anchor_at, next_at + 1)
          assert end > start
          removed = text[start:end]
          assert 'type: "TransitiveVP"' in removed
          assert 'approximate_measured_quantity_object' in removed
          assert 'consumption_verb!' in removed
          p.write_text(text[:start] + text[end:])
          Path('ab78-removed-template.txt').write_text(removed)
          PY
          npm run build:runtime
      - name: Candidate behavior probe
        run: |
          node <<'NODE' > ab78-candidate-probe.json
          const assert = require('assert');
          const { loadRuntimeApi, internalConstruction, rowSurface } = require('./tests/lib/runtime-api');
          const api = loadRuntimeApi();
          function rows(source, context=null) { return api.diagnosticFinalRows(api.analyzeLine(source, context)).filter(r => r.kind === 'construction'); }
          function of(all, type) { return all.filter(r => internalConstruction(r) === type); }
          function one(all, type, surface) { return all.find(r => internalConstruction(r) === type && (!surface || rowSurface(r) === surface)); }
          const report = {};
          for (const source of ['飲七杯度喇。','我飲七杯度喇。']) {
            const all = rows(source);
            report[source] = all.map(r => ({type: internalConstruction(r), surface: rowSurface(r), parent:r.internal_parent||r.parent||''}));
            assert.strictEqual(of(all,'TransitiveVP').length, 0, `unexpected AB78 for ${source}`);
            assert(one(all,'ApproximateQuantity','七杯度'), `ApproximateQuantity missing for ${source}`);
          }
          for (const [source,surface] of [['我講廣東話。','講廣東話'],['我食一個蘋果。','食一個蘋果'],['你睇邊本書？','睇邊本書'],['食過飯。','食過飯']]) {
            const all=rows(source); const vp=one(all,'TransitiveVP',surface); assert(vp,`AB78 missing ${source}`);
            assert((vp.trace_detail.assigned_slots||[]).includes('object'),`object binding missing ${source}`);
          }
          const rel = rows('我買嘅書好貴。');
          const gap = one(rel,'TransitiveVP','買');
          assert(gap,'relative-gap AB78 missing');
          assert.strictEqual(gap.trace_detail.relative_gap_status,'licensed_by_overt_head_noun');
          assert.strictEqual(gap.trace_detail.relative_head_surface,'書');
          assert.deepStrictEqual(Array.from(gap.trace_detail.missing_argument_slots||[]),['object']);
          assert(!(gap.trace_detail.surfaces||[]).some(s=>s==='書'),'hidden relative object surfaced');
          const sel = rows('食香港。');
          assert(one(sel,'TransitiveVP','食香港'),'structural AB78 selection control should remain');
          for (const source of ['佢瞓覺。','佢好高。','我記得佢好叻。','我教佢廣東話。','我揀佢做班長。']) assert.strictEqual(of(rows(source),'TransitiveVP').length,0,`unexpected AB78 ${source}`);
          process.stdout.write(JSON.stringify(report,null,2));
          NODE
      - name: Discover exact expectation fallout
        run: |
          set +e
          npm run test:regression > regression.log 2>&1
          echo $? > regression.exit
          npm run test:constructions > constructions.log 2>&1
          echo $? > constructions.exit
          npm run test:parser-architecture > architecture.log 2>&1
          echo $? > architecture.exit
          set -e
          echo "regression=$(cat regression.exit) constructions=$(cat constructions.exit) architecture=$(cat architecture.exit)"
      - name: Protected-state checks
        run: |
          npm run verify:identities
          npm run verify:research
      - uses: actions/upload-artifact@v4
        with:
          name: ab78-runtime-candidate
          path: |
            ab78-loader-hits.txt
            src/runtime-resources/grammar/templates/category-span-templates.js
            main.js
            ab78-removed-template.txt
            ab78-candidate-probe.json
            regression.log
            regression.exit
            constructions.log
            constructions.exit
            architecture.log
            architecture.exit
          retention-days: 1
