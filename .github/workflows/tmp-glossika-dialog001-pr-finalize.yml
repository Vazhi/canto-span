name: Temporary Glossika dialog 001 PR finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/glossika-dialog-001-ingress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/glossika-dialog-001-ingress
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Configure and merge current main
        run: |
          git config user.name 'canto-span-automation'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - run: npm ci --ignore-scripts
      - name: Build and validate the corpus package
        run: python3 tools/tmp/cs-work-0288-finalize.py
      - name: Remove temporary files and workflows
        run: |
          rm tools/tmp/cs-work-0288-dialog001-meta.json
          rm tools/tmp/cs-work-0288-dialog001-turns-part00.json
          rm tools/tmp/cs-work-0288-dialog001-turns-part01.json
          rm tools/tmp/cs-work-0288-dialog001-turns-part02.json
          rm tools/tmp/cs-work-0288-finalize.py
          rm .github/workflows/tmp-glossika-dialog001-ingress.yml
          rm .github/workflows/tmp-glossika-dialog001-pr-finalize.yml
      - name: Verify protected state and repository checks
        run: |
          git diff --exit-code origin/main -- src main.js package.json package-lock.json manifest.json tests grammar data/registry
          npm run verify:research
          npm run verify:coordination
      - name: Commit coherent final package
        run: |
          git add -A
          git commit -m 'Ingest Glossika dialog 001 corpus packet'
          git push origin HEAD:agent/glossika-dialog-001-ingress
