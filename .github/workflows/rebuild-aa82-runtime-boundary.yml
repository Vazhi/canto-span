name: Rebuild AA82 perfective boundary

on:
  pull_request:
    branches:
      - agent/aa82-attested-boundary-packet
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.ref == 'agent/aa82-matrix-parent-force'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Preserve unresolved-context boundary
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/parser/orchestration/apply-terminal-patterns.js')
          text = path.read_text()
          anchor = '  if (constructionTypePresent(wrapped, "LocativeWhQuestion")) return null;\n'
          replacement = anchor + '  if (constructionTypePresent(wrapped, "NeedsContext")) return null;\n'
          if anchor not in text:
              raise SystemExit('AA82 wrapper anchor not found')
          if replacement not in text:
              text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
      - name: Install and rebuild
        run: |
          npm ci
          npm run build:runtime
      - name: Verify focused and full runtime suites
        run: |
          node --test tests/tooling/runtime/aa82-matrix-parent-force.test.js
          npm run verify:runtime-build
          npm run test:generated-runtime
          npm test
      - name: Commit corrected runtime
        run: |
          rm .github/workflows/rebuild-aa82-runtime-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/parser/orchestration/apply-terminal-patterns.js tests/tooling/runtime/aa82-matrix-parent-force.test.js main.js .github/workflows/rebuild-aa82-runtime-boundary.yml
          git commit -m "Preserve AA82 unresolved perfective boundary"
          git push
