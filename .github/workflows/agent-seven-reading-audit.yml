name: Audit seven bundled reading targets

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit seven bundled reading targets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          node - <<'NODE'
          const entries = require('./src/runtime-resources/lexicon/token-lexicon');
          const { buildLexicalAnalysisIndex } = require('./src/runtime-resources/lexicon/lexical-analyses');
          const lexicon = Object.fromEntries(entries);
          const index = buildLexicalAnalysisIndex(entries);
          for (const surface of ['行','知','難','兩','咋']) {
            console.log('TARGET', surface, JSON.stringify({entry: lexicon[surface], analyses: index[surface] || []}));
          }
          NODE
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-seven-reading-audit.yml
          git commit -m 'Remove temporary seven-reading audit'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
