name: Audit high-confidence pronunciation targets

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit high-confidence pronunciation targets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Inspect effective entries and analyses
        run: |
          node - <<'NODE'
          const entries=require('./src/runtime-resources/lexicon/token-lexicon');
          const lexicon=Object.fromEntries(entries);
          const {buildLexicalAnalysisIndex}=require('./src/runtime-resources/lexicon/lexical-analyses');
          const analyses=buildLexicalAnalysisIndex(entries);
          const targets=['機會','社會','時間','處理','嘛','電話','知道','見到','屋企','爸爸','媽媽','醫院'];
          for(const surface of targets){
            console.log('PRON_TARGET',surface,JSON.stringify({entry:lexicon[surface]||null,analyses:analyses[surface]||[]}));
          }
          NODE
      - name: Remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-pronunciation-target-audit.yml
          git commit -m 'Remove pronunciation target audit helper'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
