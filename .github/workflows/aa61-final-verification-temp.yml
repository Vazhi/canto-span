name: AA61 temporary final verification

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/aa61-gwo-final-mei-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Focused AA61 tests
        run: node --test tests/tooling/runtime/aa61-experiential-question-boundary.test.js
      - name: Construction suite
        run: npm run test:constructions
      - name: Runtime verification
        run: npm run verify:runtime
      - name: Architecture verification
        run: |
          npm run test:parser-architecture
          npm run audit:parser-architecture
      - name: Core verification
        run: npm run verify
      - name: Research verification
        run: npm run verify:research
      - name: Full diagnostic verification
        id: full
        continue-on-error: true
        run: npm run verify:all
      - name: Record full verification outcome
        run: |
          echo "verify_all_outcome=${{ steps.full.outcome }}"
          if [ "${{ steps.full.outcome }}" != "success" ]; then
            echo "verify:all did not fully pass; inspect logs and confirm only pre-existing release-only mismatch before merge."
          fi
