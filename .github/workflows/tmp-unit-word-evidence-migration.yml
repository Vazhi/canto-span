name: Temporary unit-word evidence migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate-build-and-verify:
    if: github.head_ref == 'agent/unit-word-evidence-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out claimed branch
        uses: actions/checkout@v4
        with:
          ref: agent/unit-word-evidence-migration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply bounded runtime and test migration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          plugin = root / 'src/plugin-entry.js'
          replace_once(
              plugin,
              'const CANTO_SPAN_RUNTIME_VERSION = "0.5.216";\n',
              'const CANTO_SPAN_RUNTIME_VERSION = "0.5.217";\n'
              '// v0.5.217: separates unit-word category, lexical evidence, visible NP structure, and downstream policy while preserving the exact twelve-rule acceptance outcomes.\n',
          )

          start_marker = 'const LICENSED_CLASSIFIER_HEAD_RULES = require("./runtime-resources/grammar/classifier-head-rules");\n'
          end_marker = '\nfunction nodeNpLicenseStatus(node) {'
          plugin_text = plugin.read_text(encoding='utf-8')
          start = plugin_text.find(start_marker)
          end = plugin_text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Unable to locate classifier compatibility block')

          replacement = r'''const UNIT_WORD_EVIDENCE_MODEL = require("./runtime-resources/grammar/unit-word-evidence.json");
          const LICENSED_CLASSIFIER_HEAD_RULES = require("./runtime-resources/grammar/classifier-head-rules");
          const UNIT_WORD_SENSES_BY_ID = new Map(
            UNIT_WORD_EVIDENCE_MODEL.unit_word_senses.map((entry) => [entry.unit_word_sense_id, Object.freeze(entry)]),
          );
          const UNIT_WORD_RULES_BY_SURFACE = new Map(
            UNIT_WORD_EVIDENCE_MODEL.noun_choice_rule_records.map((entry) => [entry.surface, Object.freeze(entry)]),
          );

          function unitWordMetadataForSurface(surface) {
            const rule = UNIT_WORD_RULES_BY_SURFACE.get(String(surface || ""));
            if (!rule) return null;
            const sense = UNIT_WORD_SENSES_BY_ID.get(rule.unit_word_sense_id);
            if (!sense) return null;
            return {
              unit_word_evidence_model: UNIT_WORD_EVIDENCE_MODEL.schema,
              unit_word_evidence_version: UNIT_WORD_EVIDENCE_MODEL.version,
              unit_word_evidence_id: rule.evidence_id,
              unit_word_sense_id: sense.unit_word_sense_id,
              unit_word_type: sense.unit_word_type,
              semantic_unit_relation: sense.semantic_unit_relation,
              unit_word_provenance_state: sense.provenance_state,
              unit_word_source_scope: sense.source_scope,
              unit_word_construction_profiles: sense.construction_profiles.slice(),
              lexical_choice_status: rule.pair_status,
            };
          }

          function lexicalClassifierClassesForNode(node) {
            if (!node) return [];
            if (node.kind === "token") {
              const entry = TOKEN_LEXICON[node.surface] || {};
              return Array.isArray(entry.classifier_classes) ? entry.classifier_classes.slice() : [];
            }
            const classes = new Set();
            for (const child of node.children || []) {
              for (const value of lexicalClassifierClassesForNode(child)) classes.add(value);
            }
            return Array.from(classes);
          }

          function classifierHeadCompatibility(children = [], trace = {}) {
            const assigned = Array.isArray(trace.assigned_slots) ? trace.assigned_slots : [];
            const classifierIndex = assigned.indexOf("classifier");
            const headIndex = assigned.indexOf("head_noun");
            if (classifierIndex < 0 || headIndex < 0) return null;
            const classifier = children[classifierIndex];
            const head = children[headIndex];
            const classifierSurface = flattenSurface(classifier);
            const acceptedClasses = LICENSED_CLASSIFIER_HEAD_RULES[classifierSurface];
            const headClasses = lexicalClassifierClassesForNode(head);
            const unitWordMetadata = unitWordMetadataForSurface(classifierSurface);
            const evidenceMetadata = unitWordMetadata || {
              unit_word_evidence_model: UNIT_WORD_EVIDENCE_MODEL.schema,
              unit_word_evidence_version: UNIT_WORD_EVIDENCE_MODEL.version,
              lexical_choice_status: "unreviewed",
            };
            if (!acceptedClasses) {
              return {
                status: "unverified",
                classifier_surface: classifierSurface,
                head_surface: flattenSurface(head),
                observed_head_classes: headClasses,
                ...evidenceMetadata,
                downstream_argument_licensing: "blocked_by_conservative_policy",
                reason: "This unit word has no reviewed bounded runtime rule; its noun choice remains unreviewed and downstream consumption is blocked by conservative policy.",
              };
            }
            const matchedClasses = acceptedClasses.filter((value) => headClasses.includes(value));
            if (matchedClasses.length) {
              return {
                status: "verified_compatible",
                classifier_surface: classifierSurface,
                head_surface: flattenSurface(head),
                matched_head_classes: matchedClasses,
                ...evidenceMetadata,
                downstream_argument_licensing: "allowed_by_bounded_runtime_rule",
                reason: "The pair matches a bounded runtime class and may license downstream structure; pair-level linguistic evidence remains separately unreviewed.",
              };
            }
            if (!headClasses.length) {
              return {
                status: "unverified",
                classifier_surface: classifierSurface,
                head_surface: flattenSurface(head),
                expected_head_classes: acceptedClasses,
                ...evidenceMetadata,
                downstream_argument_licensing: "blocked_by_conservative_policy",
                reason: "The noun has no recorded compatibility class; the pair remains unreviewed and downstream consumption is blocked by conservative policy.",
              };
            }
            return {
              status: "incompatible",
              classifier_surface: classifierSurface,
              head_surface: flattenSurface(head),
              expected_head_classes: acceptedClasses,
              observed_head_classes: headClasses,
              ...evidenceMetadata,
              downstream_argument_licensing: "blocked_by_conservative_policy",
              reason: "The pair fails the bounded runtime class allowlist; this is a parser-policy control, not a categorical Cantonese grammaticality judgment.",
            };
          }

          function npLicenseMetadata(type, children = [], trace = {}) {
            if (!COMPOSITIONAL_NP_TYPES.has(type) && !PROVISIONAL_NP_TYPES.has(type)) return null;
            const surface = children.map((child) => flattenSurface(child)).join("");
            const headlessQuantified = type === "QuantifiedClassifierNP"
              && (trace.fragment_subtype === "quantified_classifier_head_ellipsis"
                || trace.np_subtype === "quantified_classifier_head_ellipsis"
                || (Array.isArray(trace.missing_argument_slots) && trace.missing_argument_slots.includes("nominal_head")));
            if (PROVISIONAL_NP_TYPES.has(type) || headlessQuantified || nodeContainsUnknownNominalMaterial({ kind: "construction", children })) {
              return {
                np_license_status: "provisional_np_candidate",
                construction_licensing_allowed: false,
                structural_np_status: "structurally_incomplete_or_unknown",
                lexical_choice_status: "not_assessed",
                downstream_argument_licensing: "blocked_by_structural_or_unknown_material",
                np_license_reason: PROVISIONAL_NP_TYPES.has(type) || headlessQuantified
                  ? "The NP lacks an overt nominal head; no hidden noun is reconstructed."
                  : "At least one token is unknown or only pronunciation-backed.",
              };
            }
            if (type === "QuantifiedClassifierNP" || type === "OvertHeadDemonstrativeClassifierNP" || type === "DemonstrativeClassifierNP") {
              const compatibility = classifierHeadCompatibility(children, trace);
              if (compatibility && compatibility.status !== "verified_compatible") {
                return {
                  np_license_status: "provisional_np_candidate",
                  construction_licensing_allowed: false,
                  structural_np_status: "visible_profile_complete",
                  lexical_choice_status: compatibility.lexical_choice_status,
                  downstream_argument_licensing: compatibility.downstream_argument_licensing,
                  classifier_head_compatibility_status: compatibility.status,
                  classifier_head_compatibility: compatibility,
                  np_license_reason: compatibility.reason,
                };
              }
              if (compatibility) {
                trace = {
                  ...trace,
                  structural_np_status: "visible_profile_complete",
                  lexical_choice_status: compatibility.lexical_choice_status,
                  downstream_argument_licensing: compatibility.downstream_argument_licensing,
                  classifier_head_compatibility_status: compatibility.status,
                  classifier_head_compatibility: compatibility,
                };
              }
            }
            if (type === "AssociativeNP" && /^啲/u.test(surface)) {
              return {
                np_license_status: "ambiguous_licensed_np",
                construction_licensing_allowed: true,
                structural_np_status: "visible_profile_complete",
                lexical_choice_status: "not_applicable",
                downstream_argument_licensing: "allowed",
                np_attachment_ambiguity: ["啲 [A 嘅 N]", "[啲 A] 嘅 N"],
                np_license_reason: "The outer NP span is licensed, but internal 啲/嘅 attachment remains unresolved.",
              };
            }
            const compatibility = (type === "QuantifiedClassifierNP" || type === "OvertHeadDemonstrativeClassifierNP" || type === "DemonstrativeClassifierNP")
              ? classifierHeadCompatibility(children, trace)
              : null;
            return {
              np_license_status: "licensed_np",
              construction_licensing_allowed: true,
              structural_np_status: "visible_profile_complete",
              lexical_choice_status: compatibility ? compatibility.lexical_choice_status : "not_applicable",
              downstream_argument_licensing: compatibility ? compatibility.downstream_argument_licensing : "allowed",
              classifier_head_compatibility_status: compatibility ? compatibility.status : undefined,
              classifier_head_compatibility: compatibility || undefined,
              np_license_reason: compatibility
                ? compatibility.reason
                : "All required overt components are sufficiently analyzed under a reusable NP rule.",
            };
          }
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          plugin.write_text(plugin_text[:start] + replacement + plugin_text[end:], encoding='utf-8')

          runner = root / 'tests/run-all.js'
          replace_once(
              runner,
              '  ["glossika_week16_lexicon", path.join(root, "tests", "tooling", "lexicon", "glossika-week16-runtime-lexicon.test.js")],\n',
              '  ["glossika_week16_lexicon", path.join(root, "tests", "tooling", "lexicon", "glossika-week16-runtime-lexicon.test.js")],\n'
              '  ["unit_word_evidence", path.join(root, "tests", "tooling", "runtime", "unit-word-evidence.test.js")],\n',
          )

          np_runner = root / 'tests/run-np-subsystem.js'
          replace_once(
              np_runner,
              '      if (testCase.expected_classifier_compatibility) {\n'
              '        assert.strictEqual(trace(row).classifier_head_compatibility_status, testCase.expected_classifier_compatibility);\n'
              '        checks.push("classifier_head_compatibility_exact");\n'
              '      }\n',
              '      if (testCase.expected_classifier_compatibility) {\n'
              '        assert.strictEqual(trace(row).classifier_head_compatibility_status, testCase.expected_classifier_compatibility);\n'
              '        checks.push("classifier_head_compatibility_exact");\n'
              '      }\n'
              '      for (const [fixtureKey, traceKey, checkName] of [\n'
              '        ["expected_structural_np_status", "structural_np_status", "structural_np_status_exact"],\n'
              '        ["expected_lexical_choice_status", "lexical_choice_status", "lexical_choice_status_exact"],\n'
              '        ["expected_downstream_argument_licensing", "downstream_argument_licensing", "downstream_argument_licensing_exact"],\n'
              '      ]) {\n'
              '        if (testCase[fixtureKey]) {\n'
              '          assert.strictEqual(trace(row)[traceKey], testCase[fixtureKey]);\n'
              '          checks.push(checkName);\n'
              '        }\n'
              '      }\n'
              '      if (testCase.expected_unit_word_type || testCase.expected_semantic_unit_relation || testCase.expected_unit_word_sense_id) {\n'
              '        const compatibility = trace(row).classifier_head_compatibility || {};\n'
              '        if (testCase.expected_unit_word_type) assert.strictEqual(compatibility.unit_word_type, testCase.expected_unit_word_type);\n'
              '        if (testCase.expected_semantic_unit_relation) assert.strictEqual(compatibility.semantic_unit_relation, testCase.expected_semantic_unit_relation);\n'
              '        if (testCase.expected_unit_word_sense_id) assert.strictEqual(compatibility.unit_word_sense_id, testCase.expected_unit_word_sense_id);\n'
              '        checks.push("unit_word_evidence_metadata_exact");\n'
              '      }\n',
          )

          fixture_path = root / 'tests/fixtures/np-subsystem.json'
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          fixture['principles']['mismatch_controls_are_bounded_parser_policy_not_linguistic_evidence'] = True
          metadata = {
              '本': ('sortal_classifier', 'sortal_selection', 'UW-BUN2-SORTAL'),
              '杯': ('container_measure', 'container_content_measure', 'UW-BUI1-CONTAINER-MEASURE'),
              '間': ('sortal_classifier', 'sortal_selection', 'UW-GAAN1-SORTAL'),
              '隻': ('sortal_classifier', 'sortal_selection', 'UW-ZEK3-SORTAL'),
              '個': ('general_classifier', 'general_counting', 'UW-GO3-GENERAL'),
              '支': ('sortal_classifier', 'sortal_selection', 'UW-ZI1-SORTAL'),
              '件': ('sortal_classifier', 'sortal_selection', 'UW-GIN6-SORTAL'),
              '張': ('sortal_classifier', 'sortal_selection', 'UW-ZOENG1-SORTAL'),
              '架': ('sortal_classifier', 'sortal_selection', 'UW-GAA3-SORTAL'),
              '部': ('sortal_classifier', 'sortal_selection', 'UW-BOU6-SORTAL'),
              '碗': ('container_measure', 'container_content_measure', 'UW-WUN2-CONTAINER-MEASURE'),
          }
          for case in fixture['cases']:
              case['group'] = case['group'].replace('classifier_incompatible', 'classifier_policy_control')
              compatibility = case.get('expected_classifier_compatibility')
              if compatibility:
                  surface = case['expected_surface']
                  unit_surface = next((key for key in metadata if key in surface), None)
                  if not unit_surface:
                      raise SystemExit(f"No unit-word metadata for fixture {case['id']}")
                  unit_type, relation, sense_id = metadata[unit_surface]
                  case['expected_structural_np_status'] = 'visible_profile_complete'
                  case['expected_lexical_choice_status'] = 'unreviewed'
                  case['expected_downstream_argument_licensing'] = (
                      'allowed_by_bounded_runtime_rule' if compatibility == 'verified_compatible'
                      else 'blocked_by_conservative_policy'
                  )
                  case['expected_unit_word_type'] = unit_type
                  case['expected_semantic_unit_relation'] = relation
                  case['expected_unit_word_sense_id'] = sense_id
              elif case['id'] == 'NP-P001':
                  case['expected_structural_np_status'] = 'structurally_incomplete_or_unknown'
                  case['expected_lexical_choice_status'] = 'not_assessed'
                  case['expected_downstream_argument_licensing'] = 'blocked_by_structural_or_unknown_material'
          fixture_path.write_text(json.dumps(fixture, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package['version'] != '0.5.216':
              raise SystemExit('Unexpected package version')
          package['version'] = '0.5.217'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          lock_path = root / 'package-lock.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          if lock['version'] != '0.5.216' or lock['packages']['']['version'] != '0.5.216':
              raise SystemExit('Unexpected package-lock version')
          lock['version'] = '0.5.217'
          lock['packages']['']['version'] = '0.5.217'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['version'] != '0.5.216':
              raise SystemExit('Unexpected manifest version')
          manifest['version'] = '0.5.217'
          manifest['description'] = 'v0.5.217 separates unit-word category, lexical evidence, visible NP structure, and downstream licensing without expanding the twelve-rule compatibility map.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          state_path = root / 'docs/current/PROJECT-STATE.md'
          replace_once(state_path, '| Runtime | v0.5.216 |', '| Runtime | v0.5.217 |')
          PY

      - name: Run evidence-model and parser tests
        run: |
          node --test tests/tooling/runtime/unit-word-evidence.test.js
          npm test
          npm run test:np

      - name: Build and verify generated runtime
        run: |
          npm run build:runtime
          npm run verify:runtime-build
          npm run test:generated-runtime

      - name: Run repository checks
        run: |
          npm run verify:research
          npm run verify

      - name: Remove temporary files and commit coherent result
        run: |
          rm .github/workflows/tmp-unit-word-evidence-migration.yml
          git restore --source=HEAD -- validation/current || true
          git clean -f validation/current || true
          git config user.name 'canto-span-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 1
          fi
          git commit -m 'Migrate unit-word evidence and licensing metadata'
          git push origin HEAD:agent/unit-word-evidence-migration
