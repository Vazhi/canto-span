name: AA11 temporary staged-tree verification

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.ref == 'agent/aa11-binsing-dim-boundaries'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa11-binsing-dim-boundaries
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Synchronize version and derived state in workspace only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          p = Path('package.json')
          d = json.loads(p.read_text())
          d['version'] = '0.5.220'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          p = Path('package-lock.json')
          d = json.loads(p.read_text())
          d['version'] = '0.5.220'
          d['packages']['']['version'] = '0.5.220'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          p = Path('src/plugin-entry.js')
          s = p.read_text()
          s = s.replace(
              'const CANTO_SPAN_RUNTIME_VERSION = "0.5.219";\n// v0.5.219:',
              'const CANTO_SPAN_RUNTIME_VERSION = "0.5.220";\n// v0.5.220: narrows AA11 to exact adjacent 變成 + 點, records bounded VP scope/provenance, and closes neighboring wh/result boundaries.\n// v0.5.219:'
          )
          p.write_text(s)

          p = Path('manifest.json')
          d = json.loads(p.read_text())
          d['version'] = '0.5.220'
          d['description'] = 'v0.5.220 narrows AA11 to exact adjacent 變成 + 點 and closes neighboring result-complement boundaries.'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          p = Path('docs/current/PROJECT-STATE.md')
          s = p.read_text()
          s = s.replace('| Runtime | v0.5.219 |', '| Runtime | v0.5.220 |')
          s = s.replace('**1,603**', '**1,616**')
          s = s.replace('| Per-construction assertions | 1,603 |', '| Per-construction assertions | 1,616 |')
          p.write_text(s)
          PY
          npm run build:runtime
          node tools/build-construction-tests.js
          node tools/sync-construction-test-metadata.js
          npm run discovery:generate
      - name: Verify staged AA11 state
        run: |
          node --test tests/tooling/runtime/aa11-change-into-dim-boundary.test.js
          npm run test:constructions
          npm run verify:runtime
          npm run test:parser-architecture
          npm run audit:parser-architecture
          npm run verify
          npm run verify:research
      - name: Stage unreferenced Git tree object
        run: |
          set -euo pipefail
          base_tree=$(git rev-parse HEAD^{tree})
          paths=(
            package.json
            package-lock.json
            src/plugin-entry.js
            manifest.json
            docs/current/PROJECT-STATE.md
            main.js
            tests/construction-test-index.json
            grammar/research_pending/ChangeIntoPredicate.md
            data/construction-candidate-readiness.json
          )
          : > /tmp/tree-elements.jsonl
          for path in "${paths[@]}"; do
            content=$(base64 -w0 "$path")
            blob_sha=$(jq -n --arg content "$content" '{content:$content,encoding:"base64"}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')
            jq -n --arg path "$path" --arg sha "$blob_sha" \
              '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> /tmp/tree-elements.jsonl
          done
          jq -n --arg base "$base_tree" --slurpfile tree /tmp/tree-elements.jsonl \
            '{base_tree:$base,tree:$tree}' > /tmp/tree-request.json
          tree_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree-request.json --jq '.sha')
          printf '%s\n' "$tree_sha" > aa11-staged-tree-sha.txt
          git rev-parse HEAD > aa11-staged-parent-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aa11-staged-tree
          path: |
            aa11-staged-tree-sha.txt
            aa11-staged-parent-sha.txt
          retention-days: 1
