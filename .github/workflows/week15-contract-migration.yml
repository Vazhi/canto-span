name: Week 15 contract migration

on:
  push:
    branches:
      - agent/week15-contract-migration
    paths:
      - tools/build-week15-contract.py
      - .github/workflows/week15-contract-migration.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week15-contract-migration
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate Week 15 contract package
        run: python3 tools/build-week15-contract.py
      - name: Validate pedagogical-corpus contract
        run: |
          npm run test:pedagogical-corpus-contract
          npm run verify:pedagogical-corpus-contract
          npm run verify:research
      - name: Commit reviewed package and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/pedagogical-corpus-packages.json
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628
          git rm .github/workflows/week15-contract-migration.yml tools/build-week15-contract.py
          git commit -m "Migrate Glossika Week 15 into corpus contract"
          git push origin HEAD:agent/week15-contract-migration
