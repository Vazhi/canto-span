name: multi-analysis lexicon salvage

on:
  push:
    branches:
      - agent/multi-analysis-lexicon

permissions:
  contents: write

jobs:
  salvage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recreate implementation from the original one-shot workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/multi-analysis-lexicon-temp.yml').read_text().splitlines()
          start_marker = '      - name: Implement lexical analysis compatibility layer'
          end_marker = '      - name: Validate lexical analysis representation'
          start = lines.index(start_marker)
          run_line = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
          end = lines.index(end_marker)
          body = []
          for line in lines[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/multi-analysis-implement.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/multi-analysis-implement.sh
      - name: Commit generated source before validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime-resources/lexicon src/parser/nodes/node-factories.js src/parser/features/token-features.js src/parser/tokenization/contextual-overrides.js src/plugin-entry.js tools/lexical-coverage/verify-multi-analysis-runtime.mjs package.json package-lock.json manifest.json
          git commit -m "Add first-class lexical analysis representation"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Build runtime and persist generated bundle
        shell: bash
        run: |
          npm ci
          npm run build:runtime
          if ! git diff --quiet -- main.js; then
            git add main.js
            git commit -m "Rebuild runtime for multi-analysis lexicon"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Validate implementation
        shell: bash
        run: |
          node tools/lexical-coverage/verify-multi-analysis-runtime.mjs
          node -e "console.log(require('./src/runtime-resources/lexicon/validate').validateRuntimeLexicalResources())"
          npm run verify:runtime-build
          npm test
          npm run verify:runtime
          git diff --check
