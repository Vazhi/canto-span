name: Build Week 14 expert review brief

on:
  pull_request:
    paths:
      - ".github/workflows/build-week14-review-brief.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week14-ingress-review
          fetch-depth: 0
      - name: Build compact temporary review brief
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          package = Path('data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621')
          packet = json.loads((package / 'mechanical-cross-reference-r1.json').read_text(encoding='utf-8'))
          output = package / 'expert-review-brief.tmp.tsv'
          fields = [
              'id', 'ordinal', 'item_type', 'section', 'subsection', 'source_traditional',
              'source_jyutping', 'source_english', 'later_research', 'top_owner_candidates'
          ]
          with output.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              for row in packet['records']:
                  later = []
                  for link in row.get('later_research_links', []):
                      parts = [link.get('kind', '')]
                      for key in ('disposition', 'candidate_id', 'cluster', 'priority', 'recommendation', 'reason'):
                          value = link.get(key)
                          if value:
                              parts.append(f'{key}={value}')
                      if link.get('exact_runtime_owners'):
                          parts.append('runtime=' + ','.join(link['exact_runtime_owners']))
                      later.append(' | '.join(parts))
                  owners = []
                  for candidate in row.get('exact_match_candidates', []):
                      if candidate['layer'] in {
                          'runtime_lexicon', 'runtime_source', 'current_grammar_note',
                          'executable_test_or_fixture', 'canonical_or_research_data', 'pedagogical_corpus'
                      }:
                          owners.append(f"{candidate['layer']}:{candidate['path']}")
                      if len(owners) >= 6:
                          break
                  writer.writerow({
                      'id': row['id'],
                      'ordinal': row['ordinal'],
                      'item_type': row['item_type'],
                      'section': row['section'],
                      'subsection': row['subsection'],
                      'source_traditional': row['source_traditional'],
                      'source_jyutping': row.get('source_jyutping') or '',
                      'source_english': row.get('source_english') or '',
                      'later_research': ' || '.join(later),
                      'top_owner_candidates': ' || '.join(owners),
                  })
          PY
          git rm .github/workflows/build-week14-review-brief.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W14-20260621/expert-review-brief.tmp.tsv
          git commit -m "Build temporary Week 14 expert review brief"
          git push origin HEAD:agent/week14-ingress-review
