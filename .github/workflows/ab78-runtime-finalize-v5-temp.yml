name: AB78 corrected one-shot finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/ab78-runtime-finalize-v5-temp.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 741 && github.event.pull_request.head.ref == 'agent/ab78-transitive-runtime-alignment' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ab78-transitive-runtime-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci

      - name: Preconditions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "34dd42be109a461368c3e0c4bdfc0d08e0ff1a99"
          test "$(node -p "require('./package.json').version")" = "0.5.222"
          test ! -e tests/tooling/runtime/ab15-current-alignment.test.js
          ! grep -q ab15_current_alignment tests/run-all.js
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          got=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          expected={'tests/run-all.js','tests/tooling/runtime/ab15-current-alignment.test.js','.github/workflows/ab78-runtime-finalize-v5-temp.yml'}
          assert got == expected,(got,expected)
          s=Path('src/runtime-resources/grammar/templates/category-span-templates.js').read_text()
          assert s.count('template: ["consumption_verb!", "approximate_quantity!", "particle?"]') == 1
          assert 'approximate_measured_quantity_object' in s
          q=Path('src/parser/detectors/relative-clauses/clauses.js').read_text()
          for n in ['relative_gap_status: "licensed_by_overt_head_noun"','missing_argument_slots: ["object"]','not_fabricated_object_token']:
              assert n in q
          PY

      - name: Apply accepted AB78 transition
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('src/runtime-resources/grammar/templates/category-span-templates.js'); s=p.read_text()
          a='    template: ["consumption_verb!", "approximate_quantity!", "particle?"],'; at=s.index(a); start=s.rfind('  {\n',0,at); nxt=s.index('    template: ["action_verb!", "object!"],',at+len(a)); end=s.rfind('  {\n',at,nxt+1)
          removed=s[start:end]; assert 'type: "TransitiveVP"' in removed and 'approximate_measured_quantity_object' in removed; p.write_text(s[:start]+s[end:])
          p=Path('src/plugin-entry.js'); s=p.read_text(); old='const CANTO_SPAN_RUNTIME_VERSION = "0.5.222";\n// v0.5.222:'; new='const CANTO_SPAN_RUNTIME_VERSION = "0.5.223";\n// v0.5.223: removes AB78 TransitiveVP ownership from approximate measured-quantity material while preserving typed-object and explicit relative-gap transitive relations.\n// v0.5.222:'; assert old in s; p.write_text(s.replace(old,new,1))
          m=Path('manifest.json'); d=json.loads(m.read_text()); assert d['version']=='0.5.222'; d['version']='0.5.223'; d['description']='v0.5.223 aligns AB78 with typed predicate-object behavior and leaves approximate measured quantity outside TransitiveVP.'; m.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          t=Path('tests/constructions/TransitiveVP.json'); d=json.loads(t.read_text()); target={'REG-0296','REG-0465'}; removed=[x for x in d.get('snapshot_cases',[]) if x.get('case_id') in target]; assert {x['case_id'] for x in removed}==target; d['snapshot_cases']=[x for x in d.get('snapshot_cases',[]) if x.get('case_id') not in target]
          add={'AB78-MEASURE-N01','AB78-MEASURE-N02','AB78-CP-N01','AB78-DITRANSITIVE-N01','AB78-PIVOTAL-N01'}; f=[x for x in d.get('focused_cases',[]) if x.get('case_id') not in add]; prov='docs/research/ISSUE-736-AB78-TRANSITIVE-BEHAVIOR-PROFILES-R1.md#negative-and-boundary-requirements-for-later-executable-specification'
          f += [
            {'case_id':'AB78-MEASURE-N01','source':'我飲七杯度喇。','class':'approximate_measure_without_typed_object','expected_profile':'construction_absent','assertion':'construction_absent','provenance':prov},
            {'case_id':'AB78-MEASURE-N02','source':'飲七杯度喇。','class':'approximate_measure_without_typed_object','expected_profile':'construction_absent','assertion':'construction_absent','provenance':prov},
            {'case_id':'AB78-CP-N01','source':'我記得佢好叻。','class':'clausal_complement_not_simple_object','expected_profile':'construction_absent','assertion':'construction_absent','provenance':prov},
            {'case_id':'AB78-DITRANSITIVE-N01','source':'我教佢廣東話。','class':'ditransitive_argument_structure_not_simple_object','expected_profile':'construction_absent','assertion':'construction_absent','provenance':prov},
            {'case_id':'AB78-PIVOTAL-N01','source':'我揀佢做班長。','class':'pivotal_structure_not_simple_object','expected_profile':'construction_absent','assertion':'construction_absent','provenance':prov}]
          d['focused_cases']=f; t.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          npm version 0.5.223 --no-git-tag-version
          npm run build:runtime

      - name: Add AB78 recurring boundary contract
        shell: bash
        run: |
          cat > tests/tooling/runtime/ab78-transitive-boundary.test.js <<'NODE'
          "use strict";
          const assert=require("assert"); const test=require("node:test"); const {loadRuntimeApi,internalConstruction,rowSurface}=require("../../lib/runtime-api"); const api=loadRuntimeApi();
          const rows=(s,c=null)=>api.diagnosticFinalRows(api.analyzeLine(s,c)); const cs=(s,t,c=null)=>rows(s,c).filter(r=>r.kind==="construction"&&internalConstruction(r)===t); const one=(s,t,sf,c=null)=>cs(s,t,c).find(r=>!sf||rowSurface(r)===sf)||null;
          test("AB78 overt objects retain explicit object bindings",()=>{for(const [s,sf] of [["我講廣東話。","講廣東話"],["我食一個蘋果。","食一個蘋果"],["你睇邊本書？","睇邊本書"],["食過飯。","食過飯"]]){const v=one(s,"TransitiveVP",sf);assert(v,s);assert((v.trace_detail.assigned_slots||[]).includes("object"),s);}});
          test("AB78 remains narrow under serial composition",()=>{const s="我去街市買餸煮飯。";assert(one(s,"SerialVerbPurposeChain"));assert.strictEqual(Array.from(cs(s,"TransitiveVP"),rowSurface).sort().join("|"),"煮飯|買餸");});
          test("AB78 relative object gap is overt-head licensed without hidden object",()=>{const s="我買嘅書好貴。";assert(one(s,"RelativeClauseNP","我買嘅書"));const v=one(s,"TransitiveVP","買");assert(v);assert.strictEqual(v.trace_detail.relative_gap_status,"licensed_by_overt_head_noun");assert.deepStrictEqual(Array.from(v.trace_detail.missing_argument_slots||[]),["object"]);assert(!(v.trace_detail.assigned_slots||[]).includes("object"));assert((v.trace_detail.not_claims||[]).includes("not_fabricated_object_token"));});
          test("AB78 excludes approximate measured quantity",()=>{for(const s of ["飲七杯度喇。","我飲七杯度喇."]) {const src=s.replace('.', '。');assert.strictEqual(cs(src,"TransitiveVP").length,0,src);assert(one(src,"ApproximateQuantity","七杯度"),src);}assert.strictEqual(cs("我飲七杯度喇。","ClauseSpan").length,0);});
          test("AB78 keeps semantic selection separate",()=>{assert(one("食香港。","TransitiveVP","食香港"));assert(one("食香港。","NeedsContext"));});
          test("AB78 stays absent from neighboring structures",()=>{for(const s of ["佢瞓覺。","佢好高。","我記得佢好叻。","我教佢廣東話。","我揀佢做班長。"])assert.strictEqual(cs(s,"TransitiveVP").length,0,s);});
          NODE
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/run-all.js'); s=p.read_text(); a='  ["ab45_quantified_classifier_boundary", path.join(root, "tests", "tooling", "runtime", "ab45-quantified-classifier-boundary.test.js")],\n'; line='  ["ab78_transitive_boundary", path.join(root, "tests", "tooling", "runtime", "ab78-transitive-boundary.test.js")],\n'; assert a in s and 'ab15_current_alignment' not in s; p.write_text(s if line in s else s.replace(a,a+line,1))
          PY

      - name: Rebaseline exactly two reviewed regression sources
        shell: bash
        run: |
          set +e; npm run test:regression >/tmp/reg.log 2>&1; rc=$?; set -e; test "$rc" -ne 0
          python3 <<'PY'
          import json
          d=json.load(open('validation/current/regression-suite.json')); expected={'我飲七杯度喇。','飲七杯度喇。'}; got={x['source'] for x in d['failures']}; assert d['failed']==2 and got==expected,(d['failed'],got)
          PY
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/run-regression.js'); s=p.read_text(); a='const cp021bIntentionalSnapshotSources = new Set([\n'; assert a in s
          b='''const ab78V05223SnapshotSources = new Set(["我飲七杯度喇。", "飲七杯度喇。"]);\nif (process.argv.includes("--update-ab78-v05223")) {\n let updated=0; for (const testCase of fixture.cases) { if (!ab78V05223SnapshotSources.has(testCase.source)) continue; testCase.expected=JSON.parse(JSON.stringify(signature(api,testCase.source,testCase.context_source||null))); testCase.accepted_transition="v0.5.223_ab78_approximate_measure_boundary"; testCase.transition_reason="AB78 now requires an overt typed object or explicit independently licensed gap relation; approximate measured quantity remains typed but no longer fabricates TransitiveVP or dependent ClauseSpan ownership."; updated+=1; } fixture.runtime_version=api.runtimeVersion; fixture.last_intentional_transition="v0.5.223_ab78_predicate_object_alignment"; fs.writeFileSync(fixturePath,JSON.stringify(fixture,null,2)+"\\n"); process.exit(updated===ab78V05223SnapshotSources.size?0:1);\n}\n'''; p.write_text(s.replace(a,b+a,1))
          PY
          node tests/run-regression.js --update-ab78-v05223
          git checkout -- tests/run-regression.js

      - name: Generate and validate runtime tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-construction-tests.js
          node tools/sync-construction-test-metadata.js
          npm run discovery:generate
          npm run build:runtime
          python3 <<'PY'
          import json,re
          from pathlib import Path
          total=0
          for f in Path('tests/constructions').glob('*.json'):
            d=json.loads(f.read_text()); total+=sum(len(d.get(k,[])) for k in ['snapshot_cases','focused_cases','np_cases','implementation_probe_cases','compatibility_alias_probe_cases'])
          p=Path('docs/current/PROJECT-STATE.md'); s=p.read_text().replace('| Runtime | v0.5.222 |','| Runtime | v0.5.223 |',1); s=re.sub(r'- per-construction assertions: \*\*[\d,]+\*\* across \*\*134\*\* files;',f'- per-construction assertions: **{total:,}** across **134** files;',s,count=1); s=re.sub(r'\| Per-construction assertions \| [\d,]+ \|',f'| Per-construction assertions | {total:,} |',s,count=1); p.write_text(s)
          PY
          npm run test:regression
          npm run test:constructions
          node --test tests/tooling/runtime/ab78-transitive-boundary.test.js
          npm test
          npm run test:parser-architecture
          npm run verify:runtime
          npm run verify
          npm run verify:research
          npm run verify:identities
          npm run verify:discovery

      - name: Commit runtime implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- validation/current 2>/dev/null || true; git clean -fd validation/current || true
          rm .github/workflows/ab78-runtime-finalize-v5-temp.yml
          git config user.name "Canto Span scoped automation"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -m "Align AB78 runtime to typed predicate-object behavior"
          echo "IMPL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record runtime-research alignment and new discovery state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          sha=os.environ['IMPL_SHA']; p=Path('grammar/research_pending/TransitiveVP.md'); s=p.read_text()
          reps={'last_reviewed: "unknown"':'last_reviewed: "2026-08-10"','code_document_reconciled: false':'code_document_reconciled: true','code_document_review_date: null':'code_document_review_date: "2026-08-10"','code_document_review_commit: null':f'code_document_review_commit: "{sha}"','code_document_code_locations: []':'code_document_code_locations: ["src/runtime-resources/grammar/templates/category-span-templates.js", "src/parser/detectors/relative-clauses/clauses.js", "src/plugin-entry.js", "tests/constructions/TransitiveVP.json", "tests/tooling/runtime/ab78-transitive-boundary.test.js"]','current_standard_reaudit_complete: false':'current_standard_reaudit_complete: true','- Current action: `retain_transitive_predicate_object_core_pending_runtime_alignment_and_boundary_completion`':'- Current action: `retain_transitive_predicate_object_core_runtime_aligned_boundary_inventory_incomplete`','- Runtime alignment with the 2026-08-10 behavior-first re-audit: **not yet completed**.':'- Runtime alignment with the 2026-08-10 behavior-first re-audit: **completed at v0.5.223**.','- `code_document_reconciled`: remains false intentionally.':'- `code_document_reconciled`: true; v0.5.223 removes the unsupported approximate-measure AB78 producer while preserving typed-object and explicit relative-gap routes.'}
          for a,b in reps.items(): assert a in s,a; s=s.replace(a,b,1)
          p.write_text(s)
          PY
          npm run discovery:generate
          python3 <<'PY'
          import json,re
          from pathlib import Path
          ready=json.loads(Path('data/construction-candidate-readiness.json').read_text()); counts=ready['state_counts']; p=Path('docs/current/PROJECT-STATE.md'); s=p.read_text()
          if 'behavior_aligned' in counts and '`behavior_aligned`' not in s:
            a='| Candidate state | Records |\n|---|---:|\n'; assert a in s; s=s.replace(a,a+f"| `behavior_aligned` | {counts['behavior_aligned']} |\n",1)
          for k,v in counts.items(): s=re.sub(rf'\| `{re.escape(k)}` \| \d+ \|',f'| `{k}` | {v} |',s,count=1)
          p.write_text(s)
          PY
          npm run verify:research
          npm run verify:discovery
          npm run verify
          npm run verify:runtime
          git add grammar/research_pending/TransitiveVP.md data/construction-candidate-readiness.json docs/current/PROJECT-STATE.md
          git commit -m "Close AB78 runtime-research alignment metadata"
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/ab78-transitive-runtime-alignment
