# Temporary one-time canonical build for #930; delete before final PR.
name: Temporary inspector recall runtime build

on:
  push:
    branches:
      - agent/learner-inspector-recall
    paths:
      - ".github/workflows/temporary-inspector-recall-build.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'Vazhi/canto-span' && github.ref == 'refs/heads/agent/learner-inspector-recall'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: agent/learner-inspector-recall
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci
      - name: Build canonical runtime
        run: npm run build:runtime
      - name: Verify runtime and reader interaction tests
        run: |
          npm run verify:runtime
          node --test tests/tooling/runtime/learner-inspector.test.js tests/tooling/runtime/reading-controls.test.js
      - name: Upload generated bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: inspector-recall-main-js
          path: main.js
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated bundle only to feature branch
        run: |
          set -euo pipefail
          git add -- main.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged."
            exit 0
          fi
          git -c user.name="canto-span-build" \
              -c user.email="canto-span-build@users.noreply.github.com" \
              commit -m "Regenerate Obsidian runtime for inspector recall (#930)"
          git push origin HEAD:refs/heads/agent/learner-inspector-recall
