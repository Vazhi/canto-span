name: Build Week 16 expert review

on:
  pull_request:
    paths:
      - .github/workflows/build-week16-review.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/week16-ingress-review
          fetch-depth: 0
      - name: Preserve runtime crosswalk and extend candidate builder
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path('data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705')
          old_review = json.loads((package / 'review.json').read_text(encoding='utf-8'))
          records = []
          for row in old_review['records']:
              if row.get('runtimeCrosswalk') is None:
                  continue
              records.append({
                  'id': row['id'],
                  'source_hash': row['sourceHash'],
                  'runtime_crosswalk': row['runtimeCrosswalk'],
                  'source_discrepancies': row.get('sourceDiscrepancies', []),
                  'reviewed_values': row.get('reviewedValues', {}),
                  'legacy_duplicate_candidates': row.get('duplicateOf', []),
              })
          crosswalk = {
              'schema': 'canto-span-pedagogical-runtime-crosswalk-v1',
              'source_id': old_review['sourceId'],
              'source_payload_hash': old_review['sourcePayloadHash'],
              'record_count': len(records),
              'runtime_pull_request': 121,
              'runtime_merge_commit': '252f8e432bfc2b2f37e25514c940d959580a548e',
              'provenance_path': 'docs/research/GLOSSIKA-WEEK16-LEXICON-PROVENANCE.md',
              'evidence_boundary': 'implementation and lexical coverage only; source readings, glosses, segmentation, naturalness, and duplicate identity require separate review',
              'records': records,
          }
          if len(records) != 35:
              raise SystemExit(f'expected 35 runtime crosswalk records, got {len(records)}')
          (package / 'runtime-crosswalk-r1.json').write_text(
              json.dumps(crosswalk, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          builder = Path('tools/build-pedagogical-corpus-review-candidates.py')
          text = builder.read_text(encoding='utf-8')
          text = text.replace(
              '    "package-integrity-r1.json",\n}',
              '    "package-integrity-r1.json",\n    "runtime-crosswalk-r1.json",\n}',
              1,
          )
          text = text.replace(
              '    "crosswalk.json",\n}',
              '    "crosswalk.json",\n    "runtime-crosswalk-r1.json",\n}',
              1,
          )
          anchor = '''    return by_item


def build(root: Path, package_relative: Path, output_relative: Path) -> dict[str, Any]:
'''
          replacement = '''    runtime_crosswalk_path = root / f"data/pedagogical-corpus/glossika/{source_id}/runtime-crosswalk-r1.json"
    if runtime_crosswalk_path.exists():
        runtime_crosswalk = read_json(runtime_crosswalk_path)
        if runtime_crosswalk.get("source_id") == source_id:
            for entry in runtime_crosswalk.get("records", []):
                item_id = entry.get("id")
                if item_id:
                    by_item[item_id].append({
                        "packet": "runtime-crosswalk-r1",
                        "kind": "runtime_crosswalk",
                        "runtime_pull_request": runtime_crosswalk.get("runtime_pull_request"),
                        "runtime_merge_commit": runtime_crosswalk.get("runtime_merge_commit"),
                        "provenance_path": runtime_crosswalk.get("provenance_path"),
                        "runtime_crosswalk": entry.get("runtime_crosswalk"),
                        "source_discrepancies": entry.get("source_discrepancies", []),
                        "reviewed_values": entry.get("reviewed_values", {}),
                    })
    return by_item


def build(root: Path, package_relative: Path, output_relative: Path) -> dict[str, Any]:
'''
          if anchor not in text:
              raise SystemExit('builder runtime-crosswalk insertion point not found')
          builder.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          python3 -m py_compile tools/build-pedagogical-corpus-review-candidates.py
      - name: Build immutable locks and mechanical cross-reference
        run: |
          python3 tools/build-pedagogical-corpus-review-candidates.py \
            --package data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705 \
            --output data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/mechanical-cross-reference-r1.json \
            --write
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package_rel = Path('data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705')
          package = Path('.') / package_rel
          source = json.loads((package / 'source.json').read_text(encoding='utf-8'))

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()

          immutable = []
          for name in ['source.json', 'items.tsv']:
              data = (package / name).read_bytes()
              immutable.append({
                  'path': name,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'git_blob_sha': git_blob_sha(data),
              })
          integrity = {
              'schema': 'canto-span-pedagogical-corpus-package-integrity-v1',
              'source_id': source['source']['sourceId'],
              'source_payload_hash': source['ingress']['sourcePayloadHash'],
              'immutable_files': immutable,
              'policy': 'source.json and items.tsv are immutable accepted source projections; changes require a new reviewed source revision',
          }
          (package / 'package-integrity-r1.json').write_text(
              json.dumps(integrity, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          locks_path = Path('config/pedagogical-corpus-source-locks.json')
          locks = json.loads(locks_path.read_text(encoding='utf-8'))
          record = {
              'package': str(package_rel),
              'source_id': source['source']['sourceId'],
              'source_payload_hash': source['ingress']['sourcePayloadHash'],
              'immutable_files': immutable,
              'accepted_on': '2026-08-02',
              'origin_issue': 133,
              'origin_pull_request': 476,
              'policy': 'source-preserving archive; changes require a new reviewed source revision rather than in-place mutation',
          }
          records = [row for row in locks['records'] if row.get('package') != str(package_rel)]
          records.append(record)
          locks['records'] = sorted(records, key=lambda row: row['package'])
          locks_path.write_text(json.dumps(locks, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Generate expert review and projections
        run: |
          python3 - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          package_rel = Path('data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705')
          package = Path('.') / package_rel
          source = json.loads((package / 'source.json').read_text(encoding='utf-8'))
          old_review = json.loads((package / 'review.json').read_text(encoding='utf-8'))
          old_by_id = {row['id']: row for row in old_review['records']}
          packet = json.loads((package / 'mechanical-cross-reference-r1.json').read_text(encoding='utf-8'))
          packet_by_id = {row['id']: row for row in packet['records']}

          not_claims = [
              'not_grammar_proof',
              'not_productivity_evidence',
              'not_dialect_wide_naturalness',
              'not_parser_acceptance',
              'not_linguistic_status_change',
          ]
          allowed = [
              'exact_duplicate',
              'normalized_duplicate',
              'new_corpus_attestation',
              'lexical_only_attestation',
              'pronunciation_discrepancy',
              'translation_discrepancy',
              'naturalness_review_candidate',
              'unusable',
          ]
          known_differences = {
              '釣魚': ('jyutping', 'Glossika supplies 魚 jyu2, while the reviewed runtime lexical reading remains 魚 jyu4.', 'source_runtime_reading_difference'),
              '畫畫': ('jyutping_and_lexical_category', 'The reviewed runtime distinguishes verbal 畫 waak6 from nominal 畫 waa2 and represents 畫畫 as waak6 waa2.', 'source_runtime_reading_and_category_difference'),
              '公園': ('jyutping', 'The runtime defaults to changed-tone gung1 jyun2 while retaining gung1 jyun4 as a review variant.', 'source_runtime_default_reading_difference'),
              '煮嘢食': ('tokenization', 'The runtime uses a phrase-local food-object token so global 嘢食 availability-question behavior remains unchanged.', 'source_runtime_tokenization_boundary_difference'),
              '下棋': ('jyutping', 'The reviewed runtime retains 下棋 with haa5 rather than importing an unreviewed source reading.', 'source_runtime_reading_difference'),
          }

          def choose_runtime_target(crossref):
              candidates = crossref.get('exact_match_candidates', [])
              ranked = []
              for candidate in candidates:
                  path = candidate.get('path', '')
                  layer = candidate.get('layer')
                  if layer == 'runtime_lexicon':
                      rank = 0
                  elif layer == 'runtime_source' and '/presentation/' not in path:
                      rank = 1
                  elif layer == 'runtime_source':
                      rank = 2
                  else:
                      continue
                  ranked.append((rank, path))
              if ranked:
                  rank, path = sorted(ranked)[0]
                  return {'path': path, 'basis': 'current_runtime_representation_candidate', 'target_type': 'canonical_runtime_representation' if rank < 2 else 'runtime_presentation_representation'}
              return {'path': 'docs/research/GLOSSIKA-WEEK16-LEXICON-PROVENANCE.md', 'basis': 'merged_pr_121_runtime_crosswalk', 'target_type': 'implementation_provenance_fallback'}

          records = []
          for item in source['items']:
              item_id = item['id']
              values = item.get('source') or {}
              surface = values.get('traditional')
              old = old_by_id[item_id]
              crossref = packet_by_id[item_id]
              links = crossref.get('later_research_links', [])
              discrepancies = []
              implementation_targets = []

              if item['itemType'] == 'lexical_entry':
                  terminal = 'lexical_only_attestation'
                  duplicate = 'no_accepted_duplicate'
                  implementation_targets = [choose_runtime_target(crossref)]
                  evidence = 'lexical_attestation_with_reviewed_runtime_crosswalk'
                  note = 'The source form has a merged runtime representation, recorded separately from corpus duplicate identity and source correctness.'
                  if surface in known_differences:
                      field, issue, status = known_differences[surface]
                      discrepancies.append({'field': field, 'issue': issue, 'status': status})
                      evidence = 'lexical_attestation_with_runtime_crosswalk_and_source_difference'
                      note = 'The runtime representation is retained, but the source/runtime reading or tokenization difference remains explicit and no source value is overwritten.'
              elif old.get('ingressClassification') == 'naturalness_register_review_candidate':
                  terminal = 'naturalness_review_candidate'
                  duplicate = 'no_accepted_duplicate'
                  evidence = 'formula_or_register_unresolved_requires_independent_review'
                  note = 'Retained as an unresolved formula/register item for independent corpus or speaker review; the source label is not adopted as a sociolinguistic conclusion.'
              elif item['itemType'] == 'phonics_pair':
                  terminal = 'new_corpus_attestation'
                  duplicate = 'no_accepted_duplicate'
                  evidence = 'unverified_pedagogical_pronunciation_attestation'
                  discrepancies.append({
                      'field': 'phonics_heading_and_pair',
                      'issue': 'The lesson heading /ɔː/ versus /uː/ does not transparently describe every listed IPA pair; this row requires item-level phonological and lexical verification.',
                      'status': 'requires_independent_phonological_and_lexical_verification',
                  })
                  note = 'The phonics row is preserved as pedagogical pronunciation material only and is not adopted as a verified contrast.'
              else:
                  terminal = 'new_corpus_attestation'
                  duplicate = 'no_accepted_duplicate'
                  evidence = 'pedagogical_attestation_only'
                  note = 'Retained as a source attestation; register, negation, discourse, naturalness, productivity, and parser implications remain unadopted.'

              records.append({
                  'id': item_id,
                  'source_hash': item['sourceHash'],
                  'review_status': 'reviewed',
                  'reviewed_on': '2026-08-02',
                  'review_authority': 'project_expert_systematic_review',
                  'expert_duplicate_status': duplicate,
                  'accepted_duplicate_targets': [],
                  'implementation_crosswalk_targets': implementation_targets,
                  'terminal_ingress_classification': terminal,
                  'evidence_use_disposition': evidence,
                  'source_discrepancies': discrepancies,
                  'reviewed_values': {
                      'traditional': None,
                      'jyutping': None,
                      'english': None,
                      'tokenization': None,
                      'lexical_category': None,
                      'phonics_pair': None,
                  },
                  'later_research_links': links,
                  'mechanical_cross_reference_id': item_id,
                  'review_note': note,
                  'not_claims': not_claims,
              })

          terminal_counts = Counter(row['terminal_ingress_classification'] for row in records)
          duplicate_counts = Counter(row['expert_duplicate_status'] for row in records)
          evidence_counts = Counter(row['evidence_use_disposition'] for row in records)
          review = {
              'schema': 'canto-span-pedagogical-corpus-review-v2',
              'source_id': source['source']['sourceId'],
              'source_payload_hash': source['ingress']['sourcePayloadHash'],
              'record_count': len(records),
              'reviewed_on': '2026-08-02',
              'review_authority': 'project_expert_systematic_review',
              'allowed_terminal_classifications': allowed,
              'policy': {
                  'source_layer': 'source.json and items.tsv are immutable accepted source projections.',
                  'mechanical_layer': 'mechanical-cross-reference-r1.json records current candidates and the preserved runtime crosswalk but contains no expert decisions.',
                  'expert_layer': 'This file owns terminal corpus review decisions and keeps runtime representation separate from duplicate identity.',
                  'runtime_crosswalk_boundary': 'PR #121 establishes implementation and lexical coverage only; it does not automatically validate source readings, glosses, segmentation, category, naturalness, or corpus duplicate identity.',
                  'source_claim_boundary': 'Register labels, generic negation prose, and the lesson phonics heading remain source claims requiring independent evidence.',
                  'evidence_boundary': 'Pedagogical attestation does not establish productivity, frequency, construction identity, dialect-wide naturalness, preferred Jyutping, parser correctness, or status.',
              },
              'summary': {
                  'review_status_counts': {'reviewed': len(records), 'unreviewed': 0},
                  'terminal_classification_counts': dict(sorted(terminal_counts.items())),
                  'duplicate_status_counts': dict(sorted(duplicate_counts.items())),
                  'evidence_use_counts': dict(sorted(evidence_counts.items())),
                  'records_with_source_discrepancies': sum(bool(row['source_discrepancies']) for row in records),
                  'records_with_reviewed_replacements': 0,
                  'records_with_runtime_crosswalk': sum(bool(row['implementation_crosswalk_targets']) for row in records),
                  'known_source_alerts': [
                      {'scope': 'lesson-wide', 'type': 'register_labels', 'status': 'not_adopted_without_independent_review'},
                      {'scope': 'grammar_patterns', 'type': 'generic_negation_rule', 'status': 'not_adopted_as_complete_aspect_sensitive_analysis'},
                      {'scope': 'phonics_drill', 'type': 'phonics_heading_and_pairs', 'status': 'requires_item_level_independent_verification'},
                      {'scope': 'runtime_crosswalk', 'type': 'source_runtime_differences', 'status': 'preserved_without_source_replacement'},
                  ],
              },
              'records': records,
          }
          if len(records) != 59 or terminal_counts != Counter({'lexical_only_attestation': 35, 'new_corpus_attestation': 20, 'naturalness_review_candidate': 4}):
              raise SystemExit(f'unexpected Week 16 counts: {len(records)} {dict(terminal_counts)}')
          (package / 'review.json').write_text(json.dumps(review, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          fields = [
              'id', 'ordinal', 'item_type', 'source_display', 'duplicate_status',
              'terminal_classification', 'evidence_use', 'discrepancy_status',
              'implementation_crosswalk_targets', 'review_note'
          ]
          source_by_id = {item['id']: item for item in source['items']}
          with (package / 'expert-review-r1.tsv').open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter='\t', lineterminator='\n')
              writer.writeheader()
              for row in records:
                  item = source_by_id[row['id']]
                  values = item.get('source') or {}
                  display = values.get('traditional') or ' / '.join(str(values.get(key) or '—') for key in ['wordA', 'wordB', 'traditionalA', 'traditionalB'][:2])
                  writer.writerow({
                      'id': row['id'],
                      'ordinal': item['ordinal'],
                      'item_type': item['itemType'],
                      'source_display': display,
                      'duplicate_status': row['expert_duplicate_status'],
                      'terminal_classification': row['terminal_ingress_classification'],
                      'evidence_use': row['evidence_use_disposition'],
                      'discrepancy_status': ';'.join(value['status'] for value in row['source_discrepancies']),
                      'implementation_crosswalk_targets': ';'.join(value['path'] for value in row['implementation_crosswalk_targets']),
                      'review_note': row['review_note'],
                  })
          PY
      - name: Write package documentation
        run: |
          cat > data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/README.md <<'EOF'
          # Glossika Cantonese (HK) A1 Week 16 corpus ingress

          Source ID: `GLOSSIKA-YUEHK-A1-W16-20260705`  
          Source date: `2026-07-05`  
          Ingress issue: `#133`  
          Original source-ingress claim: `#274`  
          Runtime lexical work: `#119` / PR `#121`  
          Completed review claim: `#475`

          This directory preserves the authorized Glossika lesson “Hobbies & Free Time,” its 35-record implementation crosswalk, and its completed corpus review.

          ## Files

          - `source.json` and `items.tsv` — immutable source projections.
          - `package-integrity-r1.json` — local immutable-file bindings.
          - `runtime-crosswalk-r1.json` — preserved PR #121 implementation provenance and source/runtime differences.
          - `mechanical-cross-reference-r1.json` — current candidates and crosswalk links; no expert decisions.
          - `review.json` and `expert-review-r1.tsv` — completed expert review.
          - `research-summary.md` — review result and evidence boundary.

          ## Coverage and status

          - 14 sentences;
          - 4 dialog turns;
          - 35 lexical entries;
          - 6 phonics pairs;
          - 59 total records;
          - 0 unreviewed records;
          - 35 lexical-only attestations with separate runtime crosswalk targets;
          - 20 new sentence/dialog/pronunciation attestations;
          - 4 naturalness/register review candidates;
          - 0 silent source replacements.

          Runtime representation is not corpus duplicate identity and does not validate every source reading, gloss, segmentation, category, or naturalness claim.

          Run:

          ```bash
          npm run verify:pedagogical-corpus-review
          ```
          EOF
          sed -i 's/^          //' data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/README.md

          cat > data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/research-summary.md <<'EOF'
          # Week 16 corpus-ingress review summary

          Source ID: `GLOSSIKA-YUEHK-A1-W16-20260705`  
          Review date: `2026-08-02`  
          Review authority: project expert systematic review

          ## Outcome

          All **59** records are terminally reviewed while the accepted source archive and PR #121 runtime implementation remain unchanged.

          | Terminal class | Count |
          | --- | ---: |
          | Lexical-only attestation | 35 |
          | New corpus/pronunciation attestation | 20 |
          | Naturalness-review candidate | 4 |

          All 35 lexical records retain explicit implementation crosswalk targets. They are not classified as corpus duplicates because a runtime representation does not itself establish source identity or source correctness.

          ## Source/runtime differences

          Five source/runtime differences remain explicit without replacement:

          - `釣魚` — source `jyu2` versus reviewed runtime 魚 `jyu4`;
          - `畫畫` — reviewed verbal/noun distinction `waak6 waa2`;
          - `公園` — runtime default `gung1 jyun2`, with `gung1 jyun4` retained as a variant;
          - `煮嘢食` — phrase-local food-object tokenization preserves global 嘢食 behavior;
          - `下棋` — reviewed runtime reading `haa5`.

          ## Nonlexical review

          Four source formulas/register items remain independent naturalness or sociolinguistic review candidates. The other sentence and dialog records remain pedagogical attestations. The six phonics rows are retained as unverified pronunciation attestations because the source `/ɔː/ versus /uː/` heading does not transparently describe every listed IPA pair.

          The source's register labels and generic negation prose remain source claims, not accepted unrestricted linguistic rules.

          ## Boundary

          No parser behavior, runtime lexicon, construction identity/status, preferred pronunciation, native-panel evidence, survey state, release state, or deployment state changes. Glossika remains lexical and pedagogical attestation only.
          EOF
          sed -i 's/^          //' data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/research-summary.md
      - name: Commit review and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-pedagogical-corpus-review-candidates.py \
            config/pedagogical-corpus-source-locks.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/README.md \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/runtime-crosswalk-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/mechanical-cross-reference-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/package-integrity-r1.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/review.json \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/expert-review-r1.tsv \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/research-summary.md
          git rm -f .github/workflows/build-week16-review.yml \
            data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W16-20260705/.review-claim
          git commit -m "Complete Week 16 record-level ingress review"
          git push origin HEAD:agent/week16-ingress-review
