name: Verify causal-safe R7 retirements

on:
  push:
    branches:
      - agent/common-spoken-core-2000
    paths:
      - .github/workflows/common-spoken-core-causal-retirement-temp.yml
      - tools/lexical-coverage/prune-r7-causal-retirements.py
      - data/lexical-frequency/common-spoken-cantonese-r7-regression-result.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      - name: Baseline
        run: |
          set +e
          npm run test:regression >/tmp/base.log 2>&1
          cp validation/current/regression-suite.json /tmp/base.json
          exit 0

      - name: Apply causal-safe experiment
        run: |
          set -euo pipefail
          python tools/lexical-coverage/prune-r7-causal-retirements.py --write | tee /tmp/causal-prune.log
          git diff --check

      - name: Retired comparison
        run: |
          set +e
          npm run test:regression >/tmp/retired.log 2>&1
          cp validation/current/regression-suite.json /tmp/retired.json
          exit 0

      - name: Persist comparison evidence only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('/tmp/base.json').read_text())
          retired=json.loads(Path('/tmp/retired.json').read_text())
          key=lambda r:(r.get('source',''),r.get('context_source',''))
          b={key(r):r for r in base.get('failures',[])}
          r={key(x):x for x in retired.get('failures',[])}
          payload={
            'schema':'canto-span-r7-causal-retirement-result-v1',
            'baseline_failed':base.get('failed'),
            'retired_failed':retired.get('failed'),
            'recovered_cases':[b[k] for k in sorted(set(b)-set(r))],
            'new_failures':[r[k] for k in sorted(set(r)-set(b))],
            'runtime_change_committed':False,
            'policy':'Only low-value atomic entries with demonstrated recovery are eligible; Cifu ranks 1001..1250 are protected and excluded.'
          }
          Path('data/lexical-frequency/common-spoken-cantonese-r7-causal-retirement-result.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "canto-span-common-core-regression"
          git config user.email "actions@users.noreply.github.com"
          git add data/lexical-frequency/common-spoken-cantonese-r7-causal-retirement-result.json
          git commit -m "Record causal-safe R7 retirement result"
          git push origin HEAD:agent/common-spoken-core-2000
