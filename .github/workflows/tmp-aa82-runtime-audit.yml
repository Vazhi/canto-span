# Finalization rerun after resolving the intake blocker.
name: Temporary AA82 runtime span finalization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/aa82-wh-place-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa82-wh-place-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply audited runtime-span conclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/research/AA82-BIN-DOU-WH-PLACE-BOUNDARIES-R1.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('status: primary_source_synthesis_complete\n', 'status: primary_source_and_runtime_span_synthesis_complete\n'),
              ('reviewed_on: 2026-07-29\n', 'reviewed_on: 2026-07-31\n'),
              (
                  '''The old decision to retain one exact AA82 UUID **may remain viable only if AA82 is kept
strictly as an interrogative construction whose full span and parent structure establish
question force**. If the runtime node is merely an exact-token node named “Question,”
the identity conflates a lexical wh-place expression with one clause type and requires
later decomposition or renaming.
''',
                  '''The completed read-only runtime-span audit shows that the legacy
`LocativeWhQuestion` node is not a token-local `邊度` tag. In its active positives it
spans a complete interrogative clause or fragment, including forms such as
`去咗邊度呀`, `你去咗邊度`, `喺邊度呀`, and bare `邊度呀`. The overt `邊度` token
remains visible as a child. The same audit also shows inconsistent composition: the
non-perfective `你尋日去邊度呀` is represented through `SubjectPredicateClause` and
`MotionGoalVP`, while `你尋日食咗邊度呀` is kept outside the wh-place question wrapper.

AA82 may therefore retain its permanent question-level identity, but only as a narrow
overt-`邊度` interrogative wrapper whose semantic role is supplied by parent structure.
The current runtime boundary remains broader and less consistent than the research
identity, so `unsupported_generalization` remains the correct status and implementation
reconciliation remains separate work.
''',
              ),
              (
                  '''**Do not yet confirm the current question identity unchanged.** First complete a
runtime-span audit:

- if the node spans a full interrogative dependency, retain and narrow the question
  identity with typed role and clause metadata;
- if the node is token-local or fires in embedded/non-question contexts, decompose it
  into a lexical wh-place child and independent clause-level constructions.

No identity mutation is authorized by this findings issue.
''',
                  '''**Retain the existing AA82 UUID and narrow its research interpretation.** The runtime
span audit confirms that active `LocativeWhQuestion` positives are full interrogative
clause or fragment wrappers rather than token-local lexical nodes. AA82 therefore
remains `BinDouWhPlaceQuestion`, with location, goal, source, path, body-locus, and
fragment readings supplied by overt parent structure and discourse context.

This retention is not a status promotion. The runtime wrapper is still inconsistent and
broader than the source-supported identity, so `unsupported_generalization` remains
unchanged. Embedded, negative-wh, and negative-indefinite uses are outside the outer
AA82 question construction even though they may share a lexical `邊度` child. No UUID,
runtime, fixture, or status mutation is authorized by this findings issue.
''',
              ),
              (
                  '''### Required next step before implementation

Perform a line-by-line runtime-span and collision audit to determine whether current
`LocativeWhQuestion` nodes:

- span the whole interrogative structure or only lexical `邊度`;
- fire inside embedded interrogatives;
- fire in `邊度都` or negative-wh structures;
- preserve overt `喺`, `由`, motion predicates, and particles;
- can carry role and clause-type metadata without duplicating existing motion,
  locative, existential, cognition, or question nodes.

Only after that audit should a replacement accepted specification be written.
''',
                  '''### Completed runtime-span audit

The exact read-only repository audit found:

- the runtime lexical record keeps `邊度` as overt `wh_place` material;
- the legacy fallback itself is a narrow overt `喺 + 邊度` rule;
- active regression positives nevertheless contain full-span `LocativeWhQuestion`
  wrappers over perfective motion-goal clauses, overt locative questions, clause-linked
  questions, and bare fragments;
- non-perfective motion-goal questions can instead remain compositionally represented
  through `SubjectPredicateClause` and `MotionGoalVP`;
- semantically incompatible perfective-object strings remain outside the wrapper;
- no evidence was found that the outer wrapper should cover negative-indefinite or
  negative-wh uses.

Issue #312 must therefore replace the legacy full-span wrapper with explicit,
composition-preserving question structure. It must preserve overt `喺`, `由`, motion
predicates, aspect, particles, cognition parents, and the lexical `邊度` child; it must
not infer one semantic role or insert hidden material. The audit resolves identity
retention but does not itself authorize implementation.
''',
              ),
              (
                  '''- Current AA82 question identity unchanged: **not yet confirmed; depends on runtime-span
  audit**.
''',
                  '''- Current AA82 question identity: **retained and narrowed at the research-identity level;
  runtime reconciliation remains required and status stays `unsupported_generalization`**.
''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate final research package
        run: |
          npm run verify:research
          npm run verify:coordination
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-aa82-runtime-audit.yml
          git config user.name 'canto-span-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize AA82 runtime-span disposition'
          git push origin HEAD:agent/aa82-wh-place-boundaries
