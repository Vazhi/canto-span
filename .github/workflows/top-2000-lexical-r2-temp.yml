name: Temporary top-2000 lexical R2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/top-2000-lexical-r2-temp.yml

permissions:
  contents: write

jobs:
  r2:
    if: github.event.pull_request.head.ref == 'agent/top-2000-lexical-coverage-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/top-2000-lexical-coverage-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Download pinned Cifu source
        run: curl -fL --retry 3 https://raw.githubusercontent.com/gwinterstein/Cifu/8d5e4903e419193f903823880a7815712072cc80/Lexicon/Cifu-v1.txt -o /tmp/Cifu-v1.txt

      - name: Apply reviewed R2 lexical additions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          additions = {
            'src/runtime-resources/lexicon/token-lexicon/function-words-and-particles.js': [
              ('即係', 'func', 'zik1 hai6', 'discourse_marker reformulation_marker', 'exactly / that is / i.e.'),
              ('或者', 'func', 'waak6 ze2', 'alternative_connector epistemic_possibility_marker', 'or / maybe / perhaps'),
              ('梗係', 'func', 'gang2 hai6', 'discourse_marker certainty_marker', 'of course'),
              ('冇錯', 'func', 'mou5 co3', 'acknowledgement_formula discourse_marker', 'that is correct / exactly'),
              ('另外', 'how', 'ling6 ngoi6', 'additive_adverb discourse_adverb', 'additionally / besides / separately'),
              ('根本', 'how', 'gan1 bun2', 'emphatic_adverb discourse_adverb', 'fundamentally / simply / at all'),
              ('枉', 'how', 'wong2', 'manner_adverb evaluative_adverb', 'in vain / wrongly'),
            ],
            'src/runtime-resources/lexicon/token-lexicon/places-and-times.js': [
              ('以前', 'when', 'ji5 cin4', 'temporal_adjunct', 'before / formerly / ago'),
              ('之間', 'where', 'zi1 gaan1', 'relational_localizer spatial_nominal', 'between / among'),
              ('方向', 'where', 'fong1 hoeng3', 'direction_np spatial_nominal', 'direction / orientation'),
              ('泳池', 'where', 'wing6 ci4', 'place_or_goal place_np', 'swimming pool'),
              ('位置', 'where', 'wai6 zi3', 'location_np place_or_goal', 'position / place / location'),
              ('路', 'where', 'lou6', 'path_np place_or_goal', 'road / path / way'),
              ('機場', 'where', 'gei1 coeng4', 'place_or_goal place_np', 'airport / airfield'),
              ('迷宮', 'where', 'mai4 gung1', 'place_or_goal place_np', 'maze / labyrinth'),
              ('起點', 'where', 'hei2 dim2', 'source_or_startpoint place_or_goal', 'starting point'),
              ('南', 'where', 'naam4', 'direction_np cardinal_direction', 'south'),
              ('工廠', 'where', 'gung1 cong2', 'place_or_goal place_np', 'factory'),
              ('城', 'where', 'sing4', 'place_or_goal place_np', 'city / town / city walls'),
              ('球場', 'where', 'kau4 coeng4', 'place_or_goal place_np', 'sports ground / court / field'),
              ('宅', 'where', 'zaak6', 'place_or_goal residence_np', 'residence'),
            ],
            'src/runtime-resources/lexicon/token-lexicon/things.js': [
              ('蛇', 'what', 'se4', 'object_np animal_np', 'snake / serpent'),
              ('葡萄', 'what', 'pou4 tou4', 'object_np food_np', 'grape'),
              ('腰', 'what', 'jiu1', 'object_np body_part_np', 'waist / lower back'),
              ('科技', 'what', 'fo1 gei6', 'abstract_np domain_np', 'science and technology'),
              ('社會', 'what', 'se5 wui2', 'abstract_np collective_np', 'society'),
              ('方面', 'what', 'fong1 min6', 'abstract_np aspect_np', 'aspect / respect / field / side'),
              ('煙', 'what', 'jin1', 'object_np substance_np', 'smoke / tobacco / cigarette'),
            ],
            'src/runtime-resources/lexicon/token-lexicon/verbs.js': [
              ('經過', 'doing', 'ging1 gwo3', 'verb motion_path_verb', 'pass through / go through / undergo'),
              ('需要', 'doing', 'seoi1 jiu3', 'verb necessity_predicate', 'need / require'),
              ('搞', 'doing', 'gaau2', 'verb', 'do / make / arrange / handle'),
              ('希望', 'doing', 'hei1 mong6', 'verb desire_verb', 'hope / wish for'),
              ('滑雪', 'doing', 'waat6 syut3', 'verb activity_verb', 'ski / skiing'),
              ('明白', 'doing', 'ming4 baak6', 'verb cognition_verb', 'understand / realize'),
              ('感覺', 'doing', 'gam2 gok3', 'verb perception_verb', 'feel / sense'),
            ],
          }

          added = 0
          for rel, entries in additions.items():
              p = Path(rel)
              text = p.read_text()
              lines = []
              for form, label, jyutping, syntax, gloss in entries:
                  if f'["{form}",' in text:
                      continue
                  note = f'{gloss}; Cifu spoken top-2000 R2 lexical audit.'
                  meta = {'label': label, 'jyutping': jyutping, 'syntax': syntax, 'note': note}
                  lines.append('  [' + json.dumps(form, ensure_ascii=False) + ', ' + json.dumps(meta, ensure_ascii=False, separators=(',', ':')) + '],')
                  added += 1
              if lines:
                  if '\n];' not in text:
                      raise SystemExit(f'unexpected module ending: {rel}')
                  text = text.rsplit('\n];', 1)[0] + '\n\n  // v0.5.227: Cifu spoken top-2000 R2 source-audited lexical coverage.\n' + '\n'.join(lines) + '\n];\n'
                  p.write_text(text)

          if added != 35:
              raise SystemExit(f'expected 35 R2 additions, added {added}')

          manifest = Path('manifest.json')
          obj = json.loads(manifest.read_text())
          obj['description'] = 'v0.5.227 adds 70 source-audited high-frequency Cantonese lexical entries from the Cifu spoken top-2000 audit without broadening grammar.'
          manifest.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n')

          p = Path('src/plugin-entry.js')
          text = p.read_text().replace('adds 35 source-audited high-frequency lexical entries', 'adds 70 source-audited high-frequency lexical entries')
          p.write_text(text)

          p = Path('docs/current/PROJECT-STATE.md')
          text = p.read_text().replace('adds 35 independently supported high-frequency lexical entries', 'adds 70 independently supported high-frequency lexical entries')
          p.write_text(text)
          PY

      - name: Regenerate canonical audit and R2 report
        run: |
          cp docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md /tmp/R1.md
          node tools/lexical-coverage/top-2000-audit.mjs --source=/tmp/Cifu-v1.txt
          cp /tmp/R1.md docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import csv

          # Repair R1 historical baseline if an obsolete finalizer rewrote its pre-addition counts.
          p = Path('docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md')
          text = p.read_text()
          marker = '## Coverage before same-task R1 additions\n\n'
          end = '\n\n## Coverage after same-task R1 additions'
          if marker in text and end in text:
              prefix, rest = text.split(marker, 1)
              _, suffix = rest.split(end, 1)
              baseline = (
                  '- `covered_main`: **439**\n'
                  '- `covered_variant`: **0**\n'
                  '- `handled_structurally`: **154**\n'
                  '- `surface_covered_sense_uncertain`: **24**\n'
                  '- `missing`: **1041**\n'
                  '- `manual_review`: **342**'
              )
              text = prefix + marker + baseline + end + suffix
              p.write_text(text)

          rows = list(csv.DictReader(Path('data/lexical-frequency/cifu-spoken-top-2000.tsv').open(), delimiter='\t'))
          if len(rows) != 2000:
              raise SystemExit(f'expected 2000 audit rows, got {len(rows)}')
          counts = Counter(row['runtime_status'] for row in rows)
          r2 = ['即係','或者','梗係','冇錯','另外','根本','枉','以前','之間','方向','泳池','位置','路','機場','迷宮','起點','南','工廠','城','球場','宅','蛇','葡萄','腰','科技','社會','方面','煙','經過','需要','搞','希望','滑雪','明白','感覺']
          if len(r2) != 35 or len(set(r2)) != 35:
              raise SystemExit('R2 inventory must contain 35 unique forms')

          missing = [row for row in rows if row['runtime_status'] == 'missing'][:250]
          manual = [row for row in rows if row['runtime_status'] == 'manual_review'][:100]
          out = [
              '# Top-2000 spoken Cantonese lexical coverage audit — R2',
              '',
              '## Relation to R1',
              '',
              'R1 established the pinned Cifu `SpokenAdult` top-2,000 baseline and added 35 independently supported lexical entries. R2 adds 35 more ordinary lexemes from the next high-frequency gap slice. `死` was explicitly rejected from R2 after testing showed that lexicalizing it changed the parse of `簽死幾耐啊？`; the audit therefore preserves that form as unresolved rather than accepting a grammar change for coverage.',
              '',
              '## Current coverage after cumulative R1 + R2 additions',
              '',
          ]
          for key in ['covered_main','covered_variant','handled_structurally','surface_covered_sense_uncertain','missing','manual_review']:
              out.append(f'- `{key}`: **{counts.get(key, 0)}**')
          out += ['', '## R2 same-task lexical additions (35)', '']
          out += [f'- `{form}`' for form in r2]
          out += [
              '',
              'Cifu supplies the frequency, Jyutping, definition, and structure backbone. Selected forms were independently checked against Wiktionary during review. Frequency remains lexical-discovery evidence only and does not license construction identity, grammar broadening, or status promotion.',
              '',
              '## Highest-frequency remaining lexical-gap candidates',
              '',
              '| Rank | Form | Count | Jyutping | Cifu definition |',
              '|---:|---|---:|---|---|',
          ]
          for row in missing:
              definition = row['cifu_definition'].replace('|', '\\|')
              out.append(f"| {row['rank']} | {row['word']} | {row['cifu_spoken_adult']} | {row['cifu_jyutping']} | {definition} |")
          out += [
              '',
              '## Highest-frequency manual-review forms',
              '',
              '| Rank | Form | Count | Jyutping | Cifu definition |',
              '|---:|---|---:|---|---|',
          ]
          for row in manual:
              definition = row['cifu_definition'].replace('|', '\\|')
              out.append(f"| {row['rank']} | {row['word']} | {row['cifu_spoken_adult']} | {row['cifu_jyutping']} | {definition} |")
          out += [
              '',
              '## Interpretation',
              '',
              'The remaining `missing` bucket is not a bulk-import queue. It contains particles, variants, classifier-heavy forms, lexicalized phrases, strong polysemy, and items whose runtime role can interact with grammar. Straightforward lexical items are added during the current task; risky items remain explicitly unresolved.',
              '',
          ]
          Path('docs/research/LEXICAL-COVERAGE-TOP-2000-R2.md').write_text('\n'.join(out))
          print(dict(counts))
          PY

      - name: Build and rebaseline only intended R2 tokenization
        run: |
          npm run build:runtime
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('tests/run-regression.js')
          text = p.read_text()
          marker = 'const exclusions = Array.isArray(fixture.current_focused_exclusions) ? fixture.current_focused_exclusions : [];'
          if marker not in text:
              raise SystemExit('regression insertion marker not found')
          block = textwrap.dedent(r'''
          const v05227R2LexicalSnapshotSources = new Set([
            "即係釋然咗少少都係。",
          ]);
          if (process.argv.includes("--update-v05227-r2-lexical")) {
            let updated = 0;
            for (const testCase of fixture.cases) {
              if (!v05227R2LexicalSnapshotSources.has(testCase.source)) continue;
              testCase.expected = JSON.parse(JSON.stringify(signature(api, testCase.source, testCase.context_source || null)));
              testCase.accepted_transition = "v0.5.227_cifu_top2000_r2_lexical_tokenization";
              testCase.transition_reason = "Source-supported 即係 is now one lexical discourse token instead of unknown 即 + copular 係; no construction promotion is accepted.";
              updated += 1;
            }
            fixture.runtime_version = api.runtimeVersion;
            fixture.last_intentional_transition = "v0.5.227_cifu_top2000_r2_lexical_coverage";
            fs.writeFileSync(fixturePath, JSON.stringify(fixture, null, 2) + "\n");
            console.log(JSON.stringify({ runtime_version: api.runtimeVersion, updated_cases: updated, authorized_sources: v05227R2LexicalSnapshotSources.size }, null, 2));
            process.exit(updated === v05227R2LexicalSnapshotSources.size ? 0 : 1);
          }
          ''')
          p.write_text(text.replace(marker, block + '\n' + marker, 1))
          PY
          node tests/run-regression.js --update-v05227-r2-lexical
          git checkout -- tests/run-regression.js

      - name: Verify final R2 runtime state
        run: |
          npm test
          npm run verify:runtime-build
          npm run verify
          npm run verify:runtime
          npm run verify:research
          git diff --check

      - name: Commit verified R2 changes
        run: |
          git config user.name 'Canto Span scoped automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data/lexical-frequency/cifu-spoken-top-2000.tsv \
            docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md \
            docs/research/LEXICAL-COVERAGE-TOP-2000-R2.md \
            src/runtime-resources/lexicon/token-lexicon/function-words-and-particles.js \
            src/runtime-resources/lexicon/token-lexicon/places-and-times.js \
            src/runtime-resources/lexicon/token-lexicon/things.js \
            src/runtime-resources/lexicon/token-lexicon/verbs.js \
            tests/fixtures/regression-snapshots.json \
            src/plugin-entry.js manifest.json docs/current/PROJECT-STATE.md main.js
          git diff --cached --quiet && { echo 'No verified R2 changes to commit'; exit 0; }
          git commit -m 'Fill second high-frequency lexical gap batch'
          git push origin HEAD:agent/top-2000-lexical-coverage-audit
