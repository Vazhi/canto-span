name: temp verify issue 808

on:
  push:
    branches:
      - agent/offline-hkcancor-ud-map

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'pycantonese==5.0.0'
      - name: Verify generated map
        run: |
          python tools/corpus-review/export_hkcancor_ud_map.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/lexical-pos/hkcancor-to-ud-pycantonese-5.0.0.json')
          d=json.loads(p.read_text())
          assert d['unknown_tag_fallback']=='X'
          assert d['entry_count']==len(d['map'])
          assert d['map']['v']=='VERB'
          assert d['map']['vu']=='AUX'
          assert d['map']['q']=='NOUN'
          assert d['map']['u']=='PART'
          assert d['map']['y']=='PART'
          print('entry_count', d['entry_count'])
          PY
          sha256sum data/lexical-pos/hkcancor-to-ud-pycantonese-5.0.0.json
