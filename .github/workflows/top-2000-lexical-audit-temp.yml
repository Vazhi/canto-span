name: Temporary top-2000 lexical audit

on:
  push:
    branches: [agent/top-2000-lexical-coverage-audit]
    paths: [.github/workflows/top-2000-lexical-audit-temp.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/top-2000-lexical-coverage-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download pinned Cifu source
        run: curl -fL --retry 3 https://raw.githubusercontent.com/gwinterstein/Cifu/8d5e4903e419193f903823880a7815712072cc80/Lexicon/Cifu-v1.txt -o /tmp/Cifu-v1.txt
      - name: Add independently supported lexical gaps
        run: |
          cat > /tmp/add-lexicon.cjs <<'NODE'
          const fs=require('fs');
          const additions={
            'src/runtime-resources/lexicon/token-lexicon/places-and-times.js':[
              ['中間',{label:'where',jyutping:'zung1 gaan1',syntax:'place_or_goal spatial_localizer',note:'middle / between; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['下面',{label:'where',jyutping:'haa6 min6',syntax:'place_or_goal spatial_localizer',note:'below / underneath; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['沙漠',{label:'where',jyutping:'saa1 mok6',syntax:'place_or_goal',note:'desert; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['終點',{label:'where',jyutping:'zung1 dim2',syntax:'place_or_goal',note:'endpoint / destination / terminus; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['山',{label:'where',jyutping:'saan1',syntax:'place_or_goal',note:'mountain / hill; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['園',{label:'where',jyutping:'jyun4',syntax:'place_or_goal',note:'garden; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['池',{label:'where',jyutping:'ci4',syntax:'place_or_goal',note:'pond / pool; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['茅屋',{label:'where',jyutping:'maau4 uk1',syntax:'place_or_goal',note:'cottage / hut; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['頭先',{label:'when',jyutping:'tau4 sin1',syntax:'temporal_adjunct',note:'just now / a moment ago; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['右邊',{label:'where',jyutping:'jau6 bin1',syntax:'place_or_goal spatial_localizer',note:'right side; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['一路',{label:'when',jyutping:'jat1 lou6',syntax:'temporal_adjunct',note:'continually / all along; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['一直',{label:'when',jyutping:'jat1 zik6',syntax:'temporal_adjunct',note:'continuously / all along; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['左邊',{label:'where',jyutping:'zo2 bin1',syntax:'place_or_goal spatial_localizer',note:'left side; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['港',{label:'where',jyutping:'gong2',syntax:'place_or_goal',note:'port / harbor; also Hong Kong abbreviation in context; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['湖',{label:'where',jyutping:'wu4',syntax:'place_or_goal',note:'lake; high-frequency lexical coverage from Cifu top-2000 audit.'}]
            ],
            'src/runtime-resources/lexicon/token-lexicon/things.js':[
              ['線',{label:'what',jyutping:'sin3',syntax:'object_np',note:'line / string / wire; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['樹',{label:'what',jyutping:'syu6',syntax:'object_np',note:'tree; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['政府',{label:'what',jyutping:'zing3 fu2',syntax:'organization_np object_np',note:'government; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['塔',{label:'what',jyutping:'taap3',syntax:'object_np',note:'tower / pagoda; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['馬戲',{label:'what',jyutping:'maa5 hei3',syntax:'object_np',note:'circus; high-frequency lexical coverage from Cifu top-2000 audit.'}]
            ],
            'src/runtime-resources/lexicon/token-lexicon/verbs.js':[
              ['知道',{label:'doing',jyutping:'zi1 dou3',syntax:'cognition_verb',note:'know / be aware of; high-frequency lexical coverage from Cifu top-2000 audit.'}],
              ['繼續',{label:'doing',jyutping:'gai3 zuk6',syntax:'verb',note:'continue / proceed; high-frequency lexical coverage from Cifu top-2000 audit.'}]
            ]
          };
          let added=[];
          for(const [file,entries] of Object.entries(additions)){
            let text=fs.readFileSync(file,'utf8');
            const lines=[];
            for(const [form,meta] of entries){
              if(text.includes(`["${form}",`)) continue;
              lines.push(`  [${JSON.stringify(form)}, ${JSON.stringify(meta)}],`); added.push(form);
            }
            if(lines.length){ if(!/\n\];\s*$/.test(text)) throw new Error(`Unexpected module ending: ${file}`); text=text.replace(/\n\];\s*$/,`\n\n  // v0.5.227: source-audited high-frequency lexical coverage.\n${lines.join('\n')}\n];\n`); fs.writeFileSync(file,text); }
          }
          if(added.length!==22) throw new Error(`Expected 22 additions, got ${added.length}: ${added.join(',')}`);
          fs.writeFileSync('/tmp/added.json',JSON.stringify(added,null,2));
          NODE
          node /tmp/add-lexicon.cjs
      - name: Bump runtime to v0.5.227
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['package.json','package-lock.json']){ const j=JSON.parse(fs.readFileSync(f)); j.version='0.5.227'; if(j.packages?.['']) j.packages[''].version='0.5.227'; fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n'); }
          const m=JSON.parse(fs.readFileSync('manifest.json')); m.version='0.5.227'; m.description='v0.5.227 adds source-audited high-frequency Cantonese lexical coverage from the Cifu spoken top-2000 audit without broadening grammar.'; fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n');
          let p=fs.readFileSync('src/plugin-entry.js','utf8'); p=p.replace('CANTO_SPAN_RUNTIME_VERSION = "0.5.226"','CANTO_SPAN_RUNTIME_VERSION = "0.5.227"').replace('// v0.5.226:', '// v0.5.227: adds 22 source-audited high-frequency lexical entries from the Cifu spoken top-2000 audit without changing construction identity, status, or grammar scope.\n// v0.5.226:'); fs.writeFileSync('src/plugin-entry.js',p);
          let s=fs.readFileSync('docs/current/PROJECT-STATE.md','utf8'); s=s.replace('| Runtime | v0.5.226 |','| Runtime | v0.5.227 |').replace('Current consequences include:\n','Current consequences include:\n\n- v0.5.227 adds 22 independently supported high-frequency lexical entries identified by the Cifu spoken top-2000 audit; compositional corpus strings and grammar-sensitive or sense-ambiguous forms remain review buckets rather than being lexicalized merely to improve a coverage percentage, and no construction identity, linguistic status, evidence, survey, corpus, release, or deployment state is changed;\n'); fs.writeFileSync('docs/current/PROJECT-STATE.md',s);
          NODE
      - name: Recompute complete 2000-row audit
        run: |
          cat > /tmp/audit.cjs <<'NODE'
          const fs=require('fs'),path=require('path');
          const raw=fs.readFileSync('/tmp/Cifu-v1.txt','utf8').replace(/^\uFEFF/,''); const ls=raw.split(/\r?\n/).filter(Boolean); const h=ls[0].split('\t'); const ix=Object.fromEntries(h.map((x,i)=>[x,i]));
          const by=new Map(); for(const l of ls.slice(1)){const c=l.split('\t'),w=(c[ix.Word]||'').trim(),n=parseInt(c[ix.SpokenAdult]||'0',10); if(!w||!Number.isFinite(n)||n<=0)continue; const r={word:w,spoken:n,jyutping:(c[ix.JyutPing]||'').trim(),definition:(c[ix.Definition]||'').trim(),structure:(c[ix.Structure]||'').trim()}; if(!by.has(w)||n>by.get(w).spoken)by.set(w,r);}
          const ranked=[...by.values()].sort((a,b)=>b.spoken-a.spoken||a.word.localeCompare(b.word,'zh-Hant')).slice(0,2000).map((r,i)=>({...r,rank:i+1})); if(ranked.length!==2000)throw new Error('not 2000');
          const names=['people-and-address','referents-and-boundaries','things','places-and-times','verbs','statives','function-words-and-particles','degree-and-formulas','study-suite']; const dir=path.resolve('src/runtime-resources/lexicon/token-lexicon'); const direct=new Map(); for(const n of names)for(const [f,m={}] of require(path.join(dir,n))){if(!direct.has(f))direct.set(f,[]);direct.get(f).push({module:n+'.js',...m});}
          const forms=[...direct.keys()].filter(Boolean).sort((a,b)=>b.length-a.length); const segment=(w)=>{const memo=new Map(); function go(i){if(i===w.length)return[];if(memo.has(i))return memo.get(i);for(const f of forms){if(w.startsWith(f,i)){const r=go(i+f.length);if(r)return[f,...r];}} memo.set(i,null);return null;} const r=go(0); return r&&r.length>1?r:null;};
          const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); const rows=ranked.map(r=>{let status='missing',note='',module='',rj='',meta='';const rec=direct.get(r.word);if(rec){module=[...new Set(rec.map(x=>x.module))].join(';');rj=[...new Set(rec.map(x=>x.jyutping).filter(Boolean))].join(';');meta=[...new Set(rec.map(x=>[x.label,x.syntax].filter(Boolean).join(':')))].join(';');status=r.jyutping&&rj&&!(norm(r.jyutping).includes(norm(rj))||norm(rj).includes(norm(r.jyutping)))?'surface_covered_sense_uncertain':'covered_main';}else{const seg=segment(r.word);if((r.jyutping||'').startsWith('*')||r.definition==='NO DEF'){status='manual_review';note='cifu_generated_or_undefined';}else if(seg){status='manual_review';note='composable_from='+seg.join('+');}} return {...r,status,note,module,rj,meta};});
          const esc=v=>String(v??'').replace(/\t/g,' ').replace(/\r?\n/g,' '); const H=['rank','word','cifu_spoken_adult','cifu_jyutping','cifu_definition','cifu_structure','runtime_status','audit_note','runtime_module','runtime_jyutping','runtime_meta']; fs.mkdirSync('data/lexical-frequency',{recursive:true}); fs.writeFileSync('data/lexical-frequency/cifu-spoken-top-2000.tsv',[H.join('\t'),...rows.map(r=>[r.rank,r.word,r.spoken,r.jyutping,r.definition,r.structure,r.status,r.note,r.module,r.rj,r.meta].map(esc).join('\t'))].join('\n')+'\n');
          const counts=rows.reduce((m,r)=>(m[r.status]=(m[r.status]||0)+1,m),{}), missing=rows.filter(r=>r.status==='missing'), manual=rows.filter(r=>r.status==='manual_review'), added=JSON.parse(fs.readFileSync('/tmp/added.json'));
          const table=(arr,n)=>arr.slice(0,n).map(r=>`| ${r.rank} | ${r.word.replace(/\|/g,'\\|')} | ${r.spoken} | ${r.jyutping} | ${r.definition.replace(/\|/g,'\\|')} | ${r.note||''} |`).join('\n');
          const md=`# Top-2000 spoken Cantonese lexical coverage audit — R1\n\n## Method\n\nFrequency source: Cifu v1 pinned at \`8d5e4903e419193f903823880a7815712072cc80\`, ranked by \`SpokenAdult\`. Exactly 2,000 unique positive-frequency forms are retained. Cifu supplies Jyutping and definitions; Wiktionary is an approved secondary lexical-verification source, not the ranking source.\n\nRuntime baseline after same-task gap filling: v0.5.227. Exact token-lexicon matches are direct coverage. Reading mismatches are retained separately. Unmatched Cifu-generated/undefined forms and surfaces fully segmentable into existing runtime tokens are \`manual_review\`, because a corpus token need not be a lexeme. Other unmatched forms remain lexical-gap candidates.\n\n## Coverage counts\n\n${Object.entries(counts).sort().map(([k,v])=>`- \`${k}\`: **${v}**`).join('\n')}\n\n## Same-task lexical additions (${added.length})\n\n${added.map(x=>`- \`${x}\``).join('\n')}\n\nThese additions use only broad existing runtime lexical categories; they do not introduce a construction, promote status, or infer grammar from frequency. Cifu supplies lexical readings/definitions; Wiktionary spot-checks independently corroborate representative additions including 中間, 頭先, 知道, and 繼續.\n\n## Highest-frequency remaining lexical-gap candidates\n\n| Rank | Form | Count | Jyutping | Cifu definition | Audit note |\n|---:|---|---:|---|---|---|\n${table(missing,200)}\n\n## Highest-frequency manual/compositional review forms\n\n| Rank | Form | Count | Jyutping | Cifu definition | Audit note |\n|---:|---|---:|---|---|---|\n${table(manual,100)}\n\n## Interpretation\n\nThe raw surface mismatch is intentionally not converted into a bulk lexicon import. Forms such as classifier phrases, negated/result strings, directional compounds, and speaker-turn fragments can be frequent corpus tokens while remaining compositionally handled. Conversely, clean lexical items are now filled when their category can be represented without inventing a grammar claim. The TSV preserves every one of the 2,000 ranked forms for later review.\n`;
          fs.writeFileSync('docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md',md); console.log({counts,added,topMissing:missing.slice(0,25).map(x=>[x.rank,x.word])});
          NODE
          node /tmp/audit.cjs
      - name: Build and validate runtime
        run: |
          npm run build:runtime
          npm test
          npm run verify:runtime-build
          npm run verify
          npm run verify:runtime
          npm run verify:research
          git diff --check
      - name: Remove temporary workflow and commit final state
        run: |
          rm .github/workflows/top-2000-lexical-audit-temp.yml
          git config user.name 'Canto Span scoped automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Audit and fill high-frequency lexical coverage'
          git push origin HEAD:agent/top-2000-lexical-coverage-audit
