name: Temporary top-2000 lexical audit

on:
  push:
    branches:
      - agent/top-2000-lexical-coverage-audit
    paths:
      - .github/workflows/top-2000-lexical-audit-temp.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/top-2000-lexical-coverage-audit
          fetch-depth: 0

      - name: Download pinned Cifu source
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/gwinterstein/Cifu/8d5e4903e419193f903823880a7815712072cc80/Lexicon/Cifu-v1.txt \
            -o /tmp/Cifu-v1.txt

      - name: Enrich and regenerate audit
        run: |
          cat > /tmp/enrich-top2000.cjs <<'NODE'
          "use strict";
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/Cifu-v1.txt", "utf8").replace(/^\uFEFF/, "");
          const sourceLines = raw.split(/\r?\n/).filter(Boolean);
          const h = sourceLines[0].split("\t");
          const ix = Object.fromEntries(h.map((x,i)=>[x,i]));
          for (const req of ["Word","JyutPing","SpokenAdult","Definition","Structure"]) if (ix[req] == null) throw new Error(`Missing Cifu header ${req}`);
          const meta = new Map();
          for (const line of sourceLines.slice(1)) {
            const c = line.split("\t");
            const word = (c[ix.Word] || "").trim();
            if (!word) continue;
            meta.set(word, {
              jyutping: (c[ix.JyutPing] || "").trim(),
              definition: (c[ix.Definition] || "").trim(),
              structure: (c[ix.Structure] || "").trim(),
            });
          }

          const p = "data/lexical-frequency/cifu-spoken-top-2000.tsv";
          const lines = fs.readFileSync(p,"utf8").trimEnd().split(/\r?\n/);
          const oldH = lines[0].split("\t");
          const oi = Object.fromEntries(oldH.map((x,i)=>[x,i]));
          const normJ = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
          const rows = lines.slice(1).map((line) => {
            const c = line.split("\t");
            const word = c[oi.word];
            const m = meta.get(word) || {jyutping:"",definition:"",structure:""};
            let status = c[oi.runtime_status];
            const runtimeJ = c[oi.runtime_jyutping] || "";
            if ((status === "covered_main" || status === "surface_covered_sense_uncertain") && m.jyutping && runtimeJ) {
              const a = normJ(m.jyutping), b = normJ(runtimeJ);
              status = (a.includes(b) || b.includes(a)) ? "covered_main" : "surface_covered_sense_uncertain";
            }
            return {
              rank: Number(c[oi.rank]), word,
              spoken: Number(c[oi.cifu_spoken_adult]),
              jyutping: m.jyutping,
              definition: m.definition,
              structure: m.structure,
              status,
              runtimeModule: c[oi.runtime_module] || "",
              runtimeJ,
              runtimeMeta: c[oi.runtime_meta] || "",
              structuralPath: c[oi.structural_path] || "",
            };
          });
          if (rows.length !== 2000) throw new Error(`Expected 2000 rows, got ${rows.length}`);
          const esc=(v)=>String(v??"").replace(/\t/g," ").replace(/\r?\n/g," ");
          const outH=["rank","word","cifu_spoken_adult","cifu_jyutping","cifu_definition","cifu_structure","runtime_status","runtime_module","runtime_jyutping","runtime_meta","structural_path"];
          fs.writeFileSync(p,[outH.join("\t"),...rows.map(r=>[r.rank,r.word,r.spoken,r.jyutping,r.definition,r.structure,r.status,r.runtimeModule,r.runtimeJ,r.runtimeMeta,r.structuralPath].map(esc).join("\t"))].join("\n")+"\n");

          const counts=rows.reduce((m,r)=>(m[r.status]=(m[r.status]||0)+1,m),{});
          const missing=rows.filter(r=>r.status==="missing");
          const uncertain=rows.filter(r=>r.status==="surface_covered_sense_uncertain");
          const structural=rows.filter(r=>r.status==="handled_structurally");
          const topMissing=missing.slice(0,200);
          const md = `# Top-2000 spoken Cantonese lexical coverage audit — R1\n\n`+
          `## Method\n\nFrequency source: Cifu v1 pinned at \`8d5e4903e419193f903823880a7815712072cc80\`, ranked by integer \`SpokenAdult\` frequency. The list keeps exactly the 2,000 highest-frequency unique non-empty forms with positive spoken frequency and does not filter forms according to expected parser usefulness. Cifu supplies the ranking, Jyutping, definition field, and structure field. Wiktionary is an approved secondary lexical-verification source; Wiktionary page prominence is not used for frequency ranking.\n\nRuntime baseline: Canto Span v0.5.226 ancestry after merged PR #779. Exact token-lexicon matches are \`covered_main\` unless the supplied Cifu/runtime readings do not correspond cleanly, in which case they are \`surface_covered_sense_uncertain\`. Exact source mentions outside the token lexicon are conservatively \`handled_structurally\`; this is a review flag, not proof of complete lexical support. Other surface forms are \`missing\`. Cifu word segmentation includes multi-token/compositional strings, so \`missing\` is not equivalent to “add this whole string to the lexicon.”\n\n`+
          `## Coverage counts\n\n${Object.entries(counts).sort().map(([k,v])=>`- \`${k}\`: **${v}**`).join("\n")}\n\n`+
          `## Highest-frequency unmatched forms\n\n| Rank | Form | Count | Jyutping | Cifu definition | Cifu structure |\n|---:|---|---:|---|---|---|\n${topMissing.map(r=>`| ${r.rank} | ${esc(r.word).replace(/\|/g,"\\|")} | ${r.spoken} | ${esc(r.jyutping)} | ${esc(r.definition).replace(/\|/g,"\\|")} | ${esc(r.structure).replace(/\|/g,"\\|")} |`).join("\n")}\n\n`+
          `## Review buckets\n\n- Jyutping/sense uncertainty: ${uncertain.length}\n- Structural-source mentions requiring manual confirmation: ${structural.length}\n- Unmatched surface forms: ${missing.length}\n\nThe TSV is the complete 2,000-row audit. Frequency alone does not authorize a lexical sense, grammatical construction, or status change. Genuine lexical gaps are filled only after lexical verification; compositional corpus strings remain compositional rather than being added merely to raise the surface-coverage percentage.\n`;
          fs.writeFileSync("docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md",md);
          console.log(JSON.stringify({counts, topMissing: topMissing.slice(0,40).map(({rank,word,spoken,jyutping,definition,structure})=>({rank,word,spoken,jyutping,definition,structure}))},null,2));
          NODE
          node /tmp/enrich-top2000.cjs

      - name: Commit enriched audit outputs
        run: |
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/lexical-frequency/cifu-spoken-top-2000.tsv docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enrich Cifu top-2000 lexical audit metadata"
          git push origin HEAD:agent/top-2000-lexical-coverage-audit
