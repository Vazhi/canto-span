name: Temporary top-2000 lexical audit

on:
  push:
    branches:
      - agent/top-2000-lexical-coverage-audit
    paths:
      - .github/workflows/top-2000-lexical-audit-temp.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/top-2000-lexical-coverage-audit
          fetch-depth: 0

      - name: Download pinned Cifu source
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/gwinterstein/Cifu/8d5e4903e419193f903823880a7815712072cc80/Lexicon/Cifu-v1.txt \
            -o /tmp/Cifu-v1.txt

      - name: Generate ranked coverage audit
        run: |
          mkdir -p data/lexical-frequency docs/research
          cat > /tmp/top2000-audit.cjs <<'NODE'
          "use strict";
          const fs = require("fs");
          const path = require("path");

          const sourcePath = "/tmp/Cifu-v1.txt";
          const raw = fs.readFileSync(sourcePath, "utf8").replace(/^\uFEFF/, "");
          const lines = raw.split(/\r?\n/).filter(Boolean);
          const headers = lines[0].split("\t");
          const idx = Object.fromEntries(headers.map((h, i) => [h, i]));
          if (idx.Word == null || idx.SpokenAdult == null) {
            throw new Error(`Unexpected Cifu headers: ${headers.join(" | ")}`);
          }
          const jyutpingHeader = ["Jyutping", "jyutping", "Romanization", "Pronunciation"].find((h) => idx[h] != null);

          const byWord = new Map();
          let duplicateRows = 0;
          for (let n = 1; n < lines.length; n++) {
            const cols = lines[n].split("\t");
            const word = (cols[idx.Word] || "").trim();
            const spoken = Number.parseInt(cols[idx.SpokenAdult] || "0", 10);
            if (!word || !Number.isFinite(spoken) || spoken <= 0) continue;
            const jyutping = jyutpingHeader ? (cols[idx[jyutpingHeader]] || "").trim() : "";
            const existing = byWord.get(word);
            if (existing) {
              duplicateRows++;
              if (spoken > existing.spoken) byWord.set(word, { word, spoken, jyutping });
            } else {
              byWord.set(word, { word, spoken, jyutping });
            }
          }
          const ranked = [...byWord.values()]
            .sort((a, b) => b.spoken - a.spoken || a.word.localeCompare(b.word, "zh-Hant"))
            .slice(0, 2000)
            .map((row, i) => ({ ...row, rank: i + 1 }));
          if (ranked.length !== 2000) throw new Error(`Expected 2000 ranked rows, got ${ranked.length}`);

          const moduleNames = [
            "people-and-address",
            "referents-and-boundaries",
            "things",
            "places-and-times",
            "verbs",
            "statives",
            "function-words-and-particles",
            "degree-and-formulas",
            "study-suite",
          ];
          const lexDir = path.resolve("src/runtime-resources/lexicon/token-lexicon");
          const direct = new Map();
          for (const name of moduleNames) {
            const entries = require(path.join(lexDir, name));
            for (const entry of entries) {
              if (!Array.isArray(entry) || typeof entry[0] !== "string") continue;
              const [form, attrs = {}] = entry;
              const rec = { module: `${name}.js`, jyutping: String(attrs.jyutping || ""), label: String(attrs.label || ""), syntax: String(attrs.syntax || ""), note: String(attrs.note || "") };
              if (!direct.has(form)) direct.set(form, []);
              direct.get(form).push(rec);
            }
          }

          function walk(dir, out = []) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p, out);
              else if (ent.isFile() && /\.(?:js|json|md)$/.test(ent.name)) out.push(p);
            }
            return out;
          }
          const structuralFiles = [...walk(path.resolve("src/parser")), ...walk(path.resolve("src/runtime-resources"))];
          const sourceCache = structuralFiles.map((p) => [p, fs.readFileSync(p, "utf8")]);

          const normJ = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
          const rows = ranked.map((r) => {
            const recs = direct.get(r.word) || [];
            let status = "missing";
            let runtimeModule = "";
            let runtimeJyutping = "";
            let runtimeMeta = "";
            let structuralPath = "";
            if (recs.length) {
              runtimeModule = [...new Set(recs.map((x) => x.module))].join(";");
              runtimeJyutping = [...new Set(recs.map((x) => x.jyutping).filter(Boolean))].join(";");
              runtimeMeta = [...new Set(recs.map((x) => [x.label, x.syntax].filter(Boolean).join(":")))].filter(Boolean).join(";");
              if (r.jyutping && runtimeJyutping && !normJ(runtimeJyutping).includes(normJ(r.jyutping)) && !normJ(r.jyutping).includes(normJ(runtimeJyutping))) {
                status = "surface_covered_sense_uncertain";
              } else {
                status = "covered_main";
              }
            } else {
              const dq = JSON.stringify(r.word);
              const sq = `'${r.word.replace(/'/g, "\\'")}'`;
              const hit = sourceCache.find(([p, text]) => !p.includes("token-lexicon") && (text.includes(dq) || text.includes(sq)));
              if (hit) {
                status = "handled_structurally";
                structuralPath = path.relative(process.cwd(), hit[0]);
              }
            }
            return { ...r, status, runtimeModule, runtimeJyutping, runtimeMeta, structuralPath };
          });

          const esc = (v) => String(v ?? "").replace(/\t/g, " ").replace(/\r?\n/g, " ");
          const outHeaders = ["rank","word","cifu_spoken_adult","cifu_jyutping","runtime_status","runtime_module","runtime_jyutping","runtime_meta","structural_path"];
          const tsv = [outHeaders.join("\t"), ...rows.map((r) => [r.rank,r.word,r.spoken,r.jyutping,r.status,r.runtimeModule,r.runtimeJyutping,r.runtimeMeta,r.structuralPath].map(esc).join("\t"))].join("\n") + "\n";
          fs.writeFileSync("data/lexical-frequency/cifu-spoken-top-2000.tsv", tsv);

          const counts = rows.reduce((m, r) => (m[r.status] = (m[r.status] || 0) + 1, m), {});
          const missing = rows.filter((r) => r.status === "missing");
          const uncertain = rows.filter((r) => r.status === "surface_covered_sense_uncertain");
          const structural = rows.filter((r) => r.status === "handled_structurally");
          const topMissing = missing.slice(0, 200);
          const md = `# Top-2000 spoken Cantonese lexical coverage audit — R1\n\n` +
            `## Method\n\n` +
            `Frequency source: Cifu v1 pinned at \`8d5e4903e419193f903823880a7815712072cc80\`, ranked by integer \`SpokenAdult\` frequency. The audit keeps the 2,000 highest-frequency unique non-empty forms with positive spoken frequency; it does not filter by script or anticipated parser usefulness. Cifu is used for ranking and its supplied Jyutping where present. Wiktionary is a permitted secondary lexical-verification source for later gap filling; frequency rank is not taken from Wiktionary.\n\n` +
            `Runtime baseline: the branch's current Canto Span \`main\` ancestry. Exact token-lexicon form matches are \`covered_main\` unless a non-empty Cifu/runtime Jyutping mismatch requires \`surface_covered_sense_uncertain\`. A non-lexicon form quoted elsewhere in parser/runtime sources is conservatively marked \`handled_structurally\`; this is a review flag, not proof that every lexical sense is supported. All other forms are \`missing\`.\n\n` +
            `Cifu headers: ${headers.map((h) => `\`${h}\``).join(", ")}\n\n` +
            `Duplicate source rows collapsed by surface form: ${duplicateRows}.\n\n` +
            `## Coverage counts\n\n` +
            Object.entries(counts).sort().map(([k,v]) => `- \`${k}\`: **${v}**`).join("\n") + `\n\n` +
            `## Highest-frequency direct lexical gaps\n\n` +
            `| Rank | Form | Cifu spoken count | Cifu Jyutping |\n|---:|---|---:|---|\n` +
            topMissing.map((r) => `| ${r.rank} | ${r.word.replace(/\|/g,"\\|")} | ${r.spoken} | ${esc(r.jyutping)} |`).join("\n") + `\n\n` +
            `## Review buckets\n\n- Jyutping/sense uncertainty: ${uncertain.length}\n- Structural-source mentions requiring manual confirmation: ${structural.length}\n- Direct lexical gaps: ${missing.length}\n\n` +
            `The TSV is the complete 2,000-row audit. Frequency alone does not authorize a lexical sense, grammatical construction, or status change. Clear lexical gaps must be independently verified before runtime insertion.\n`;
          fs.writeFileSync("docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md", md);

          console.log(JSON.stringify({ headers, ranked: rows.length, counts, duplicateRows, topMissing: topMissing.slice(0, 30).map(({rank,word,spoken,jyutping}) => ({rank,word,spoken,jyutping})) }, null, 2));
          NODE
          node /tmp/top2000-audit.cjs

      - name: Commit audit outputs to scoped branch
        run: |
          git config user.name "Canto Span scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/lexical-frequency/cifu-spoken-top-2000.tsv docs/research/LEXICAL-COVERAGE-TOP-2000-R1.md
          if git diff --cached --quiet; then
            echo "No audit output changes"
            exit 0
          fi
          git commit -m "Generate Cifu spoken top-2000 lexical audit"
          git push origin HEAD:agent/top-2000-lexical-coverage-audit
