name: CS-WORK-0272 Week 15 research validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/glossika-week15-research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Verify deterministic lexical coverage matrix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sourcePath = 'data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628/source.json';
          const source = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const tokenPairs = require('./src/runtime-resources/lexicon/token-lexicon');
          const productivePairs = require('./src/runtime-resources/lexicon/productive-vo');
          const formulas = require('./src/runtime-resources/lexicon/formulas');
          const compositional = require('./src/runtime-resources/lexicon/compositional-lexical-phrases');
          const tokenMap = new Map(tokenPairs);
          const productiveMap = new Map(productivePairs);
          const formulaSet = new Set(formulas);
          const compositionalSet = new Set(compositional);
          const lexiconRoot = 'src/runtime-resources/lexicon';
          const files = [];
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, {withFileTypes:true})) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.js')) files.push(full);
            }
          }
          walk(lexiconRoot);
          const fileText = Object.fromEntries(files.map(file => [file, fs.readFileSync(file,'utf8')]));
          const entries = source.items.filter(item => item.itemType === 'lexical_entry').map(item => {
            const form = item.source.traditional;
            const exactRuntimeOwners = [];
            if (tokenMap.has(form)) exactRuntimeOwners.push('src/runtime-resources/lexicon/token-lexicon');
            if (productiveMap.has(form)) exactRuntimeOwners.push('src/runtime-resources/lexicon/productive-vo.js');
            if (formulaSet.has(form)) exactRuntimeOwners.push('src/runtime-resources/lexicon/formulas.js');
            if (compositionalSet.has(form)) exactRuntimeOwners.push('src/runtime-resources/lexicon/compositional-lexical-phrases.js');
            const rawCanonicalMentions = files.filter(file => fileText[file].includes(JSON.stringify(form)));
            const compositionalNumeral = /^([一二三四五六七八九]十|一百)萬$/.test(form) || form === '十萬';
            const disposition = exactRuntimeOwners.length
              ? 'already_covered_exact'
              : compositionalNumeral
                ? 'compositional_numeral_no_opaque_entry'
                : 'lexical_ingress_candidate';
            return {
              sourceItemId:item.id,
              ordinal:item.ordinal,
              traditional:form,
              sourceJyutping:item.source.jyutping,
              sourceEnglish:item.source.english,
              exactRuntimeOwners,
              rawCanonicalMentions,
              compositionalNumeral,
              disposition,
              recommendation: disposition === 'lexical_ingress_candidate'
                ? 'review_for_smallest_canonical_lexicon_owner'
                : disposition === 'compositional_numeral_no_opaque_entry'
                  ? 'retain_compositional_analysis_do_not_add_opaque_whole_form'
                  : 'no_duplicate_ingress'
            };
          });
          const counts = entries.reduce((out,entry) => { out[entry.disposition]=(out[entry.disposition]||0)+1; return out; },{});
          const output = {
            schema:'canto-span-glossika-lexical-ingress-candidates-v1',
            packetId:'GLOSSIKA-YUEHK-A1-W15-20260628-LEXICAL-INGRESS-R1',
            sourceId:source.source.sourceId,
            generatedFrom:{sourcePath,canonicalLexiconRoot:lexiconRoot,exactOwnersScanned:['token-lexicon','productive-vo','formulas','compositional-lexical-phrases']},
            policy:{glossikaWeight:'pedagogical_and_lexical_attestation_only',exactCoverageRule:'An exact canonical runtime entry blocks duplicate ingress.',numeralRule:'Multiples of ten or one hundred plus 萬 remain compositional; do not add ten opaque whole-form entries.',implementationAuthorized:false},
            counts,
            entries
          };
          const rendered = JSON.stringify(output,null,2)+'\n';
          const committed = fs.readFileSync('data/research-ledgers/glossika-week15-lexical-ingress.json','utf8');
          if (rendered !== committed) throw new Error('Week 15 lexical ingress matrix is stale');
          NODE
      - name: Validate research packet structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = require('./data/pedagogical-corpus/glossika/GLOSSIKA-YUEHK-A1-W15-20260628/source.json');
          const claims = require('./data/research-ledgers/glossika-week15-claim-source.json');
          const lexical = require('./data/research-ledgers/glossika-week15-lexical-ingress.json');
          const followup = require('./data/research-ledgers/glossika-week15-followup-candidates.json');
          if (source.items.length !== 65) throw new Error('Expected 65 source records');
          if (source.ingress.sourcePayloadHash !== 'sha256:0e57454b530e1a50bfc4a4cf9cedada7fcf87f194f290251dc2f3e4f9aaa65e8') throw new Error('Unexpected source payload hash');
          if (lexical.entries.length !== 39) throw new Error('Expected 39 lexical entries');
          if (lexical.counts.lexical_ingress_candidate !== 20) throw new Error('Expected 20 lexical candidates');
          if (lexical.counts.already_covered_exact !== 10) throw new Error('Expected 10 exact existing entries');
          if (lexical.counts.compositional_numeral_no_opaque_entry !== 9) throw new Error('Expected 9 compositional numerals');
          if (claims.claims.length !== 12) throw new Error('Expected 12 bounded claims');
          if (followup.candidates.length !== 11) throw new Error('Expected 11 follow-up candidates');
          const note = fs.readFileSync('docs/research/GLOSSIKA-YUEHK-A1-W15-20260628-RESEARCH.md','utf8');
          const required = ['20 lexical-review candidates','Modern final `咩 me1`','行兩分鐘就到','點行呀','No runtime'];
          const lower = note.toLowerCase();
          for (const phrase of required) {
            if (!lower.includes(phrase.toLowerCase())) throw new Error(`Research note missing ${phrase}`);
          }
          console.log({sourceRecords:source.items.length,claims:claims.claims.length,lexical:lexical.counts,followups:followup.candidates.length});
          NODE
          git diff --check
      - name: Run repository verification
        run: |
          npm run verify:research
          npm run verify
