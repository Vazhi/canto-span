name: Full diagnostic verification

on:
  push:
    paths:
      - "config/verification-profiles.json"
      - "tools/verify-current-state.js"
      - "tests/tooling/verification/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/full-diagnostic-verification.yml"
  pull_request:
    paths:
      - "config/verification-profiles.json"
      - "tools/verify-current-state.js"
      - "tests/tooling/verification/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/full-diagnostic-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aa56-positive-participant-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Temporary AA56 generated bundle commit
        run: |
          npm run build:runtime
          if ! git diff --quiet -- main.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.js
            git commit -m "Regenerate runtime bundle for AA56"
            git pull --rebase origin agent/aa56-positive-participant-runtime
            git push origin HEAD:agent/aa56-positive-participant-runtime
          fi
      - name: Temporary AA56 regression snapshot commit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const fixturePath = 'tests/fixtures/regression-snapshots.json';
          const fixture = JSON.parse(fs.readFileSync(fixturePath, 'utf8'));
          const sources = [
            '冇人喺度。',
            '冇學生喺學校。',
            '有個人喺門口。',
            '有個學生喺學校。',
          ];
          fixture.current_focused_candidate = 'v0.5.218-aa56-positive-participant-runtime';
          fixture.current_focused_exclusions = sources.map((source) => ({ source }));
          fs.writeFileSync(fixturePath, JSON.stringify(fixture, null, 2) + '\n');
          NODE
          node tests/run-regression.js --absorb-current-focused
          node <<'NODE'
          const fs = require('node:fs');
          const fixturePath = 'tests/fixtures/regression-snapshots.json';
          const fixture = JSON.parse(fs.readFileSync(fixturePath, 'utf8'));
          const sources = new Set([
            '冇人喺度。',
            '冇學生喺學校。',
            '有個人喺門口。',
            '有個學生喺學校。',
          ]);
          for (const testCase of fixture.cases || []) {
            if (!sources.has(testCase.source)) continue;
            testCase.accepted_transition = 'v0.5.218_aa56_positive_participant_runtime_profile';
            testCase.transition_reason = 'AA56 is now implemented as positive-only JauMarkedIndefiniteNPPredication; negative 冇 + predicate cases are no longer emitted as ExistentialPresentationalClause, and positive locative-coda cases retain the compatibility label with positive participant-introduction trace metadata.';
          }
          fixture.runtime_version = '0.5.218';
          fixture.last_intentional_transition = 'v0.5.218_aa56_positive_participant_runtime_profile';
          fs.writeFileSync(fixturePath, JSON.stringify(fixture, null, 2) + '\n');
          NODE
          if ! git diff --quiet -- tests/fixtures/regression-snapshots.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/fixtures/regression-snapshots.json
            git commit -m "Refresh AA56 regression snapshots"
            git pull --rebase origin agent/aa56-positive-participant-runtime
            git push origin HEAD:agent/aa56-positive-participant-runtime
          fi
      - name: Test verification orchestration
        run: npm run test:verification-orchestration
      - name: Run full diagnostic sweep
        continue-on-error: true
        run: npm run verify:all -- --keep-going --output /tmp/full-verification.json
      - name: Validate diagnostic orchestration and non-release profiles
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('config/verification-profiles.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('/tmp/full-verification.json', 'utf8'));
          const expectedProfiles = manifest.profile_requests.all;
          const expectedIds = expectedProfiles.flatMap(
            (profileName) => manifest.profiles[profileName].map((item) => item.id)
          );
          const actualProfiles = report.included_profiles || [];
          const actualIds = (report.results || []).map((item) => item.id);

          if (JSON.stringify(actualProfiles) !== JSON.stringify(expectedProfiles)) {
            throw new Error(`Unexpected included profiles: ${JSON.stringify(actualProfiles)}`);
          }
          if (report.registered_command_count !== expectedIds.length) {
            throw new Error(
              `Registered command count mismatch: ${report.registered_command_count} != ${expectedIds.length}`
            );
          }
          if (report.configured_command_count !== expectedIds.length) {
            throw new Error(
              `Configured command count mismatch: ${report.configured_command_count} != ${expectedIds.length}`
            );
          }
          if (report.executed_command_count !== expectedIds.length) {
            throw new Error(
              `Executed command count mismatch: ${report.executed_command_count} != ${expectedIds.length}`
            );
          }
          if (JSON.stringify(actualIds) !== JSON.stringify(expectedIds)) {
            throw new Error(
              `Verification commands were not executed exactly once in canonical order: ${JSON.stringify(actualIds)}`
            );
          }
          const integrity = report.execution_integrity || {};
          if ((integrity.duplicate_executions || []).length || (integrity.missing_executions || []).length) {
            throw new Error(`Execution integrity failure: ${JSON.stringify(integrity)}`);
          }

          const nonReleaseFailures = (report.results || []).filter(
            (item) => item.profile !== 'release' && item.status !== 'PASS'
          );
          if (nonReleaseFailures.length) {
            throw new Error(`Non-release diagnostic failures: ${JSON.stringify(nonReleaseFailures)}`);
          }
          const releaseFailures = (report.results || []).filter(
            (item) => item.profile === 'release' && item.status !== 'PASS'
          );
          console.log(JSON.stringify({
            included_profiles: actualProfiles,
            command_count: actualIds.length,
            non_release_failures: 0,
            release_failures: releaseFailures.map((item) => item.id),
          }, null, 2));
          NODE
