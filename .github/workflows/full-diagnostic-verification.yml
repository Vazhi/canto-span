name: Full diagnostic verification

on:
  push:
    paths:
      - "config/verification-profiles.json"
      - "tools/verify-current-state.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/full-diagnostic-verification.yml"
  pull_request:
    paths:
      - "config/verification-profiles.json"
      - "tools/verify-current-state.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/full-diagnostic-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Run full diagnostic verification
        run: npm run verify:all -- --keep-going
