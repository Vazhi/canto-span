name: Audit functional top-2000 lexical coverage

on:
  push:
    branches:
      - agent/cifu-r1751-2000-runtime-reconcile

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit functional top-2000 lexical coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Fetch live ranked source
        run: curl -L --fail --retry 3 'https://docs.google.com/spreadsheets/d/1ArxEFo46PTrDyDDhWyu3wB0epxqTyd8WBaprnwTEPm4/export?format=csv&gid=1428902047' -o /tmp/canto-frequency.csv
      - name: Run functional lexical audit
        run: node tools/tmp-top2000-functional-lexical-audit.js /tmp/canto-frequency.csv
      - name: Remove one-time audit helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-top2000-functional-audit.yml
          git rm tools/tmp-top2000-functional-lexical-audit.js
          git commit -m 'Remove functional top-2000 lexical audit helpers'
          git push origin HEAD:agent/cifu-r1751-2000-runtime-reconcile
